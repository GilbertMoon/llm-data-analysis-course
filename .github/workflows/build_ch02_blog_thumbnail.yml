name: Build Chapter02 Blog Thumbnail

on:
  push:
    paths:
      - '.github/ch02_thumbnail_trigger.txt'

permissions:
  contents: write

jobs:
  build-thumbnail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip pillow

      - name: Render 1536x1024 PNG
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import subprocess

          W,H=1536,1024
          bg='#06182f'; panel='#0b2548'; panel2='#0d315d'; white='#f6fbff'; soft='#b7cce8'; cyan='#2ed7f5'; blue='#3e8fff'; green='#65d6a6'; violet='#776cff'; orange='#ffb44a'; border='#2b6eb7'
          reg=subprocess.check_output("fc-match -f '%{file}\\n' 'Noto Sans CJK KR' | head -1",shell=True,text=True).strip()
          bold=subprocess.check_output("fc-match -f '%{file}\\n' 'Noto Sans CJK KR:style=Bold' | head -1",shell=True,text=True).strip()
          im=Image.new('RGB',(W,H),bg); d=ImageDraw.Draw(im)
          def f(n,b=False): return ImageFont.truetype(bold if b else reg,n)
          def rr(box,r=20,fill=panel,outline=border,w=2): d.rounded_rectangle(box,radius=r,fill=fill,outline=outline,width=w)
          def tx(x,y,s,n,fill=white,b=False,anchor=None): d.text((x,y),s,font=f(n,b),fill=fill,anchor=anchor)

          rr((52,55,220,192),24,'#0b3b8f','#4da7ff',3); tx(136,124,'02',82,white,True,'mm')
          tx(55,250,'VS Code에서 시작하는',60,white,True)
          tx(55,335,'데이터 분석 환경',74,cyan,True)
          tx(55,445,'Python · .venv · Jupyter를 하나로 연결하기',30,soft)
          d.rounded_rectangle((55,505,600,513),radius=4,fill=blue)

          items=[('1','프로젝트 루트에서 시작'),('2','프로젝트 전용 .venv 사용'),('3','패키지 설치 환경과 Notebook 커널 일치'),('4','실제 데이터 경로와 실행 위치 검증')]
          y=585
          for num,msg in items:
              d.ellipse((55,y-23,101,y+23),fill='#124ca8'); tx(78,y,num,20,white,True,'mm'); tx(125,y,msg,27,soft,False,'lm'); y+=72
          rr((55,860,600,958),18,'#06324f',cyan,2)
          tx(82,892,'핵심: 설치보다 중요한 것은',29,white,True)
          tx(82,930,'“같은 Python을 쓰는지” 확인하는 것',28,cyan,True)

          rr((640,55,1485,958),26,'#071f41','#2e76c8',2); tx(680,92,'개발 환경 연결 흐름',32,white,True)
          steps=[('01','GitHub','저장소 준비'),('02','VS Code','프로젝트 열기'),('03','Python','버전 확인'),('04','.venv','가상환경'),('05','pip','패키지 설치')]
          xs=[700,855,1010,1165,1320]
          for i,(no,label,sub) in enumerate(steps):
              x=xs[i]; rr((x,145,x+130,275),18,panel2,'#4d86c7',2); tx(x+65,170,no,18,soft,True,'ma'); tx(x+65,210,label,26,white,True,'ma'); tx(x+65,245,sub,18,soft,False,'ma')
              if i<len(steps)-1:
                  d.line((x+132,210,xs[i+1]-10,210),fill='#84b9ec',width=4); d.polygon([(xs[i+1]-10,210),(xs[i+1]-24,201),(xs[i+1]-24,219)],fill='#84b9ec')

          rr((680,340,1438,555),22,'#0b2a52','#427cc3',2); tx(710,372,'Jupyter Notebook 연결',30,white,True)
          rr((715,420,910,520),12,'#102e54','#67b7ff',2); d.rectangle((745,442,880,493),fill='#07182c'); tx(812,468,'sys.executable',20,cyan,True,'mm'); tx(812,503,'Path.cwd()',18,soft,False,'mm')
          cards=[('.venv Python',990,405,1150,472,green),('Notebook 커널',1210,405,1385,472,violet),('DATA_DIR 확인',990,490,1150,545,orange),('CSV 로딩',1210,490,1385,545,cyan)]
          for label,x1,y1,x2,y2,col in cards:
              rr((x1,y1,x2,y2),14,'#102b50',col,2); tx((x1+x2)//2,(y1+y2)//2,label,20,white,True,'mm')
          d.line((915,470,980,438),fill=green,width=4); d.polygon([(980,438),(966,433),(971,448)],fill=green)
          d.line((1155,438,1200,438),fill=soft,width=4); d.polygon([(1200,438),(1187,430),(1187,446)],fill=soft)
          d.line((1155,517,1200,517),fill=soft,width=4); d.polygon([(1200,517),(1187,509),(1187,525)],fill=soft)

          rr((680,605,1438,885),22,'#092846','#2fd0c2',2); tx(710,635,'정상 완료 검증',30,green,True)
          checks=[('Python','sys.executable 경로에 .venv 포함'),('Kernel','Notebook이 같은 .venv 사용'),('Data','DATA_DIR.exists() = True'),('Run','customers.head() 정상 출력'),('Security','.env는 Git 추적 대상 아님')]
          y=695
          for k,v in checks:
              d.ellipse((715,y-10,735,y+10),fill=green); tx(760,y,k,22,white,True,'lm'); tx(900,y,v,21,soft,False,'lm'); y+=43
          rr((690,904,1428,940),12,'#0e345d','#0e345d',1); tx(1059,922,'패키지 설치 Python = VS Code 인터프리터 = Notebook 커널',21,white,True,'mm')

          out=Path('book/assets/images/ch02/ch02_blog_thumbnail.png')
          out.parent.mkdir(parents=True,exist_ok=True)
          im.save(out,'PNG',optimize=True)
          print(out, out.stat().st_size)
          PY

      - name: Commit rendered thumbnail
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add book/assets/images/ch02/ch02_blog_thumbnail.png
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add chapter02 blog thumbnail'
          git push
