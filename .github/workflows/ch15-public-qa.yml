name: Chapter15 Public QA

# Final-project release QA after Chapter10 and public Chapter08 contract alignment.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ch15-public-qa.yml'
      - 'src/final_project.py'
      - 'src/classification.py'
      - 'src/midterm_project.py'
      - 'src/preprocessing.py'
      - 'src/external_data_collection.py'
      - 'scripts/run_final_project.py'
      - 'scripts/validate_ch15_public_release.py'
      - 'notebooks/ch15_final_project.ipynb'
      - 'practice/chapter15/**'
      - 'data/raw/**'

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Chapter15 QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib scikit-learn requests beautifulsoup4 python-dotenv

      - name: Run Chapter15 public release QA
        run: |
          python scripts/validate_ch15_public_release.py

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chapter15-public-qa-${{ runner.os }}
          path: tmp/ch15_public_qa/qa_report.json
          if-no-files-found: warn
