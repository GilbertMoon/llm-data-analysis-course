name: Titanic Public QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/titanic-public-qa.yml'
      - 'notebooks/titanic_ai_analysis.ipynb'
      - 'practice/titanic_ai_analysis/**'
      - 'data/titanic/**'
      - 'scripts/prepare_titanic_data.py'
      - 'scripts/titanic_modeling_smoke_test.py'
      - 'scripts/validate_titanic_public_release.py'
      - 'scripts/check_titanic_streamlit.py'
      - 'scripts/test_titanic_streamlit_ui.py'
      - 'src/titanic_app/**'
      - 'requirements.txt'

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run end-to-end Titanic public release QA
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/validate_titanic_public_release.py

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: titanic-public-qa-${{ runner.os }}
          path: |
            tmp/titanic_public_qa/qa_report.json
            tmp/titanic_public_qa/streamlit.log
          if-no-files-found: warn
