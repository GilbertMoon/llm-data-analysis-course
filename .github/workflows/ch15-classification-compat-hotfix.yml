name: Chapter15 Classification Compat Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch15-classification-compat-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch classification compatibility
        run: |
          python scripts/_ch15_patch_classification_compat.py
          python -m py_compile src/classification.py src/final_project.py

      - name: Commit compatibility patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/classification.py
          git commit -m "fix(ch15): align classification compatibility contract"
          git push origin HEAD:main
