name: Chapter15 Midterm Compat Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch15-midterm-compat-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch Chapter15 to Public Chapter08 contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/final_project.py')
          text = path.read_text(encoding='utf-8')

          old_import = '''from src.midterm_project import (
              build_analysis_tables,
              build_key_duplicate_checks,
              summarize_datasets,
          )'''
          new_import = '''from src.midterm_project import (
              build_analysis_tables,
              build_key_duplicate_checks,
              build_project_validation as build_midterm_project_validation,
              summarize_datasets,
          )'''
          if text.count(old_import) != 1:
              raise SystemExit(f'import target count={text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          old_value = '        "core_validation": tables["project_validation"],'
          new_value = '''        "core_validation": build_midterm_project_validation(
              key_duplicate_checks,
              relationship_checks,
              tables,
          ),'''
          if text.count(old_value) != 1:
              raise SystemExit(f'core validation target count={text.count(old_value)}')
          text = text.replace(old_value, new_value, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile src/final_project.py src/midterm_project.py

      - name: Commit compatibility fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/final_project.py
          git commit -m "fix(ch15): use public midterm validation contract"
          git push origin HEAD:main
