name: Chapter15 QA Helper Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ch15-qa-helper-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix QA read_csv helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate_ch15_public_release.py')
          text = path.read_text(encoding='utf-8')
          old = '''def read_csv(path: Path) -> pd.DataFrame:
              return pd.read_csv(path)'''
          new = '''def read_csv(path: Path, **kwargs: object) -> pd.DataFrame:
              return pd.read_csv(path, **kwargs)'''
          if text.count(old) != 1:
              raise SystemExit(f'read_csv target count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile scripts/validate_ch15_public_release.py

      - name: Commit QA helper fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_ch15_public_release.py
          git commit -m "fix(ch15): allow QA read_csv keyword arguments"
          git push origin HEAD:main
