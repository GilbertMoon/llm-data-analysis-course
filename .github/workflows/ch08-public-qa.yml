name: Chapter08 Public QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ch08-public-qa.yml'
      - 'src/midterm_project.py'
      - 'scripts/run_midterm_project.py'
      - 'scripts/validate_ch08_public_release.py'
      - 'notebooks/ch08_midterm_project.ipynb'
      - 'practice/chapter08/**'
      - 'data/raw/**'
      - 'src/data_loader.py'
      - 'src/preprocessing.py'
      - 'src/visualization.py'
      - 'src/eda.py'
      - 'requirements.txt'

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Chapter08 QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==3.0.5 numpy==2.5.3 matplotlib==3.11.1

      - name: Run Chapter08 public release QA
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/validate_ch08_public_release.py

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chapter08-public-qa-${{ runner.os }}
          path: tmp/ch08_public_qa/qa_report.json
          if-no-files-found: warn
