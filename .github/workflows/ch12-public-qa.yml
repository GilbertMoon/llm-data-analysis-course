name: Chapter12 Public QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ch12-public-qa.yml'
      - 'src/llm_code_validation.py'
      - 'src/llm_code_validation_policy.py'
      - 'src/data_loader.py'
      - 'src/preprocessing.py'
      - 'scripts/preprocess_data.py'
      - 'scripts/run_llm_code_validation.py'
      - 'scripts/validate_ch12_public_release.py'
      - 'notebooks/ch12_report_generation.ipynb'
      - 'practice/chapter12/**'
      - 'data/raw/**'
      - 'requirements.txt'

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Chapter12 QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas

      - name: Run Chapter12 public release QA
        run: |
          python scripts/validate_ch12_public_release.py

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chapter12-public-qa-${{ runner.os }}
          path: tmp/ch12_public_qa/qa_report.json
          if-no-files-found: warn
