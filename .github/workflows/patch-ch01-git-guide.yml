name: Patch Chapter 1 Git guide

on:
  push:
    branches:
      - agent/add-ch01-git-guide

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-ch01-git-guide

      - name: Insert Git and GitHub guide
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          chapter = Path('book/chapters/ch01_ai_data_analysis_intro.md')
          text = chapter.read_text(encoding='utf-8')
          marker = '## 10. 실습을 시작하는 기본 흐름'
          heading = '### Git과 GitHub 사전 학습 안내'

          if heading not in text:
              insertion = '''### Git과 GitHub 사전 학습 안내

이 책의 실습 파일과 변경 이력을 안정적으로 관리하려면 Git과 GitHub의 기본 개념을 함께 익혀 두는 것이 좋습니다.

Git과 GitHub의 차이, Git 설치, 저장소 생성, Clone, Add, Commit, Push, Pull 등 기본적인 설치 및 사용 방법은 다음 가이드를 참고합니다.

- [Git·GitHub 개념, 설치 및 기본 사용 가이드](https://blog.naver.com/dev-dog/223840788612)

이 책에서는 Git과 GitHub 자체를 자세히 설명하기보다, 준비된 저장소를 내려받고 실습 코드와 분석 결과의 변경 이력을 관리하는 용도로 활용합니다.

단, `.env`, API 키, 비밀번호, 개인정보, 회사 내부 데이터와 대용량 원본 데이터는 Git 저장소에 커밋하지 않도록 주의해야 합니다.

'''
              if marker not in text:
                  raise SystemExit(f'삽입 위치를 찾지 못했습니다: {marker}')
              text = text.replace(marker, insertion + marker, 1)
              chapter.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/patch-ch01-git-guide.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit updated chapter
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book/chapters/ch01_ai_data_analysis_intro.md .github/workflows/patch-ch01-git-guide.yml
          git commit -m "Add Git and GitHub learning guide to chapter 1"
          git push origin HEAD:agent/add-ch01-git-guide
