name: Materialize Chapter07 Visualization CSV

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-ch07-visualization.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-visualization-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandas
        run: python -m pip install pandas

      - name: Build visualization.csv
        run: python scripts/prepare_ch07_visualization_csv.py

      - name: Verify visualization.csv
        run: |
          test -s data/processed/visualization.csv
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path("data/processed/visualization.csv")
          df = pd.read_csv(path)
          required = {
              "order_item_id", "order_id", "customer_id", "product_id",
              "order_date", "order_month", "order_dayofweek",
              "payment_method", "order_status", "gender", "age", "city",
              "signup_date", "product_name", "category", "price",
              "quantity", "unit_price", "line_total", "order_match",
              "product_match", "customer_match", "merge_valid",
          }
          missing = required - set(df.columns)
          if missing:
              raise SystemExit(f"missing columns: {sorted(missing)}")
          if df["order_item_id"].duplicated().any():
              raise SystemExit("duplicate order_item_id found")
          print("shape:", df.shape)
          print("merge_valid counts:")
          print(df["merge_valid"].value_counts(dropna=False).to_string())
          PY

      - name: Commit visualization.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/visualization.csv
          if git diff --cached --quiet; then
            echo "visualization.csv is already current."
            exit 0
          fi
          git commit -m "data: add Chapter07 visualization dataset"
          git push
