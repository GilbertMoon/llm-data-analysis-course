name: Chapter15 Syntax Hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ch15-syntax-hotfix.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix Chapter15 bracket typo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/final_project.py")
          text = path.read_text(encoding="utf-8")
          bad = '''            "total_completed_amount",
        ]
    )
    both_day_types = set(comparison["day_type"]) == {"일반일", "공휴일"}'''
          good = '''            "total_completed_amount",
        ]
    ]
    both_day_types = set(comparison["day_type"]) == {"일반일", "공휴일"}'''
          if text.count(bad) != 1:
              raise SystemExit(f"expected exactly one target block, found {text.count(bad)}")
          path.write_text(text.replace(bad, good, 1), encoding="utf-8")
          PY
          python -m py_compile src/final_project.py

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/final_project.py
          git commit -m "fix(ch15): correct external comparison bracket"
          git push origin HEAD:main
