name: Chapter15 Syntax Hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ch15-syntax-hotfix.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix Chapter15 bracket typo
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('src/final_project.py'); t=p.read_text(encoding='utf-8'); old='            \\\"total_completed_amount\\\",\\n        ]\\n    )\\n    both_day_types'; new='            \\\"total_completed_amount\\\",\\n        ]\\n    ]\\n    both_day_types'; c=t.count(old); assert c == 1, f'expected exactly one target block, found {c}'; p.write_text(t.replace(old, new, 1), encoding='utf-8')"
          python -m py_compile src/final_project.py

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/final_project.py
          git commit -m "fix(ch15): correct external comparison bracket"
          git push origin HEAD:main
