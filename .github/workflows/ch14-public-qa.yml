name: Chapter14 Public QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ch14-public-qa.yml'
      - 'src/automation_pipeline.py'
      - 'scripts/run_ch14_pipeline.py'
      - 'scripts/ch14_*.py'
      - 'scripts/validate_ch14_public_release.py'
      - 'notebooks/ch14_airflow_pipeline.ipynb'
      - 'practice/chapter14/**'
      - 'automation/airflow/**'
      - 'dags/ch14_local_analysis_pipeline.py'
      - 'data/raw/**'

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Chapter14 QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib

      - name: Run Chapter14 public release QA
        run: |
          python scripts/validate_ch14_public_release.py

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chapter14-public-qa-${{ runner.os }}
          path: tmp/ch14_public_qa/qa_report.json
          if-no-files-found: warn
