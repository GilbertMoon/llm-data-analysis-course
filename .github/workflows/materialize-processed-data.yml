name: Materialize Processed Course Data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-processed-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-processed-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install preprocessing dependency
        run: python -m pip install pandas

      - name: Generate Chapter 05 processed datasets
        run: python scripts/preprocess_data.py

      - name: Verify generated files
        run: |
          test -s data/processed/customers_clean.csv
          test -s data/processed/products_clean.csv
          test -s data/processed/orders_clean.csv
          test -s data/processed/order_items_clean.csv
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          for name in ["customers", "products", "orders", "order_items"]:
              path = Path("data/processed") / f"{name}_clean.csv"
              df = pd.read_csv(path)
              print(name, df.shape, df.columns.tolist())
          PY

      - name: Commit generated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/customers_clean.csv
          git add -f data/processed/products_clean.csv
          git add -f data/processed/orders_clean.csv
          git add -f data/processed/order_items_clean.csv
          if git diff --cached --quiet; then
            echo "Processed datasets are already current."
            exit 0
          fi
          git commit -m "data: add processed datasets for Chapter07+"
          git push
