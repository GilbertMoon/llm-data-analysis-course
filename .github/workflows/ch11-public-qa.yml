name: Chapter11 Public QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ch11-public-qa.yml'
      - 'src/llm_prompt_analysis.py'
      - 'src/data_loader.py'
      - 'src/preprocessing.py'
      - 'scripts/preprocess_data.py'
      - 'scripts/run_llm_prompt_analysis.py'
      - 'scripts/validate_ch11_public_release.py'
      - 'notebooks/ch11_llm_prompt_analysis.ipynb'
      - 'practice/chapter11/**'
      - 'practice/chapter05/data/raw/**'
      - 'requirements.txt'

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Chapter11 QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas

      - name: Run Chapter11 public release QA
        run: |
          python scripts/validate_ch11_public_release.py

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chapter11-public-qa-${{ runner.os }}
          path: tmp/ch11_public_qa/qa_report.json
          if-no-files-found: warn
