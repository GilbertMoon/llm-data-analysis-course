name: Chapter09 Public QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ch09-public-qa.yml'
      - 'src/regression.py'
      - 'src/data_loader.py'
      - 'src/preprocessing.py'
      - 'scripts/prepare_ch09_data.py'
      - 'scripts/run_regression_analysis.py'
      - 'scripts/validate_ch09_public_release.py'
      - 'notebooks/ch09_regression_analysis.ipynb'
      - 'practice/chapter09/**'
      - 'data/raw/**'
      - 'requirements.txt'

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Chapter09 QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy matplotlib scikit-learn

      - name: Run Chapter09 public release QA
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/validate_ch09_public_release.py

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chapter09-public-qa-${{ runner.os }}
          path: tmp/ch09_public_qa/qa_report.json
          if-no-files-found: warn
