name: Chapter13 Public QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ch13-public-qa.yml'
      - 'src/external_data_collection.py'
      - 'scripts/run_external_data_collection.py'
      - 'scripts/validate_ch13_public_release.py'
      - 'notebooks/ch13_external_data_collection.ipynb'
      - 'practice/chapter13/**'
      - 'requirements.txt'

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Chapter13 QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests beautifulsoup4 python-dotenv

      - name: Run Chapter13 public release QA
        run: |
          python scripts/validate_ch13_public_release.py

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chapter13-public-qa-${{ runner.os }}
          path: tmp/ch13_public_qa/qa_report.json
          if-no-files-found: warn
