<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Airflow Dags List Screen Guide</title>
  <desc id="desc">Apache Airflow Dags list screen after login, showing ch14_local_analysis_pipeline and sales_analysis_practice DAGs.</desc>
  <defs>
    <style>
      .font { font-family: "Pretendard", "Noto Sans KR", "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "Cascadia Mono", "Consolas", monospace; }
      .title { font-size: 28px; font-weight: 700; fill: #0f172a; }
      .nav { font-size: 18px; font-weight: 700; fill: #1e293b; }
      .body { font-size: 16px; fill: #334155; }
      .small { font-size: 14px; fill: #475569; }
      .tiny { font-size: 12px; fill: #64748b; }
      .link { fill: #0066ff; font-weight: 700; }
      .chip-text { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .muted { fill: #64748b; }
      .label { font-size: 14px; font-weight: 700; fill: #1e293b; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>

  <!-- Browser bar -->
  <rect x="0" y="0" width="1600" height="56" fill="#ffffff"/>
  <circle cx="22" cy="28" r="8" fill="#e2e8f0"/>
  <circle cx="50" cy="28" r="8" fill="#e2e8f0"/>
  <circle cx="78" cy="28" r="8" fill="#e2e8f0"/>
  <rect x="116" y="12" width="1440" height="34" rx="17" fill="#f1f5f9" stroke="#dbe3ef"/>
  <text x="144" y="34" class="font small">localhost:8080/dags</text>

  <!-- Sidebar -->
  <rect x="0" y="56" width="78" height="844" fill="#e7f0fb"/>
  <g transform="translate(13 78)">
    <path d="M0,0 L30,14 L16,30 Z" fill="#e53935"/>
    <path d="M30,14 L48,0 L31,30 Z" fill="#00a0df"/>
    <path d="M16,30 L30,14 L48,48 Z" fill="#1fb655"/>
    <path d="M16,30 L0,48 L30,48 Z" fill="#2f7fe7"/>
  </g>
  <rect x="0" y="250" width="78" height="64" fill="#2f5c9a"/>
  <g class="font tiny" text-anchor="middle">
    <text x="39" y="185" fill="#1e293b">홈</text>
    <text x="39" y="292" fill="#ffffff" font-weight="700">Dags</text>
    <text x="39" y="386" fill="#334155">예셋</text>
    <text x="39" y="468" fill="#334155">탐색</text>
    <text x="39" y="548" fill="#334155">관리자</text>
  </g>

  <!-- Header tabs -->
  <rect x="78" y="56" width="1522" height="64" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="118" y="102" class="font nav">Dags</text>
  <text x="213" y="102" class="font nav" fill="#334155">Dag 실행들</text>
  <text x="360" y="102" class="font nav" fill="#334155">태스크 인스턴스</text>
  <line x1="118" y1="117" x2="169" y2="117" stroke="#2563eb" stroke-width="4"/>

  <!-- Search -->
  <rect x="78" y="120" width="1522" height="72" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="116" y="162" class="font body" fill="#64748b">⌕  Dag 검색</text>

  <!-- Filter chips -->
  <g transform="translate(94 214)">
    <rect x="0" y="0" width="74" height="42" rx="4" fill="#426aa3"/>
    <text x="37" y="27" class="font chip-text" text-anchor="middle" fill="#ffffff">모두</text>

    <rect x="84" y="0" width="106" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="112" cy="21" r="15" fill="#e11d48"/><text x="112" y="26" class="font small" text-anchor="middle" fill="#ffffff">×</text>
    <text x="142" y="27" class="font chip-text">실패</text>

    <rect x="190" y="0" width="124" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="218" cy="21" r="15" fill="#64748b"/><text x="218" y="26" class="font small" text-anchor="middle" fill="#ffffff">≡</text>
    <text x="248" y="27" class="font chip-text">대기 중</text>

    <rect x="314" y="0" width="120" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="342" cy="21" r="15" fill="#0891b2"/><text x="342" y="26" class="font small" text-anchor="middle" fill="#ffffff">∿</text>
    <text x="372" y="27" class="font chip-text">실행 중</text>

    <rect x="434" y="0" width="104" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="462" cy="21" r="15" fill="#15803d"/><text x="462" y="26" class="font small" text-anchor="middle" fill="#ffffff">✓</text>
    <text x="492" y="27" class="font chip-text">성공</text>
  </g>

  <rect x="892" y="214" width="184" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="928" cy="235" r="15" fill="#dc2626"/>
  <text x="928" y="240" class="font small" text-anchor="middle" fill="#ffffff">⚭</text>
  <text x="958" y="241" class="font chip-text">필수 작업들</text>

  <g transform="translate(1258 214)">
    <rect x="0" y="0" width="78" height="42" rx="4" fill="#426aa3"/>
    <text x="39" y="27" class="font chip-text" text-anchor="middle" fill="#ffffff">모두</text>
    <rect x="78" y="0" width="78" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="117" y="27" class="font chip-text" text-anchor="middle">활성</text>
    <rect x="156" y="0" width="138" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="225" y="27" class="font chip-text" text-anchor="middle">일시 중지됨</text>
  </g>

  <text x="94" y="322" class="font title" style="font-size:24px;">2 Dags</text>

  <!-- View buttons -->
  <rect x="94" y="354" width="52" height="42" rx="4" fill="#426aa3"/>
  <text x="120" y="382" class="font small" text-anchor="middle" fill="#ffffff">▦</text>
  <rect x="146" y="354" width="52" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="172" y="382" class="font small" text-anchor="middle" fill="#64748b">☰</text>

  <!-- DAG card 1 -->
  <g filter="url(#shadow)">
    <rect x="94" y="418" width="1420" height="176" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="94" y="418" width="1420" height="64" rx="8" fill="#edf2f7"/>
  </g>
  <text x="114" y="458" class="font link" style="font-size:20px;">ch14_local_analysis_pipeline</text>
  <text x="408" y="458" class="font small">◇</text>
  <text x="438" y="458" class="font small" fill="#0066ff">airflow, chapter14, data-analysis, docker</text>
  <text x="114" y="530" class="font label">스케줄</text>
  <text x="758" y="530" class="font label">최근 실행</text>
  <text x="1396" y="530" class="font label">다음 실행</text>

  <!-- DAG card 2 -->
  <g filter="url(#shadow)">
    <rect x="94" y="608" width="1420" height="176" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="94" y="608" width="1420" height="64" rx="8" fill="#edf2f7"/>
  </g>
  <text x="114" y="648" class="font link" style="font-size:20px;">sales_analysis_practice</text>
  <text x="362" y="648" class="font small">◇</text>
  <text x="392" y="648" class="font small" fill="#0066ff">practice, sales-analysis</text>
  <text x="114" y="720" class="font label">스케줄</text>
  <text x="758" y="720" class="font label">최근 실행</text>
  <text x="1396" y="720" class="font label">다음 실행</text>

  <!-- Callouts -->
  <g filter="url(#shadow)">
    <rect x="940" y="292" width="480" height="88" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="990" y="496" width="470" height="86" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  </g>
  <path d="M1040 380 C950 410, 810 420, 415 450" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="966" y="326" class="font title" style="font-size:20px;" fill="#1d4ed8">1. 실습 DAG 확인</text>
  <text x="966" y="352" class="font body">`ch14_local_analysis_pipeline`을 클릭해 상세 화면으로 이동합니다.</text>

  <path d="M1050 582 C940 650, 780 670, 365 648" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="1016" y="530" class="font title" style="font-size:20px;" fill="#1d4ed8">2. 비교용 DAG</text>
  <text x="1016" y="556" class="font body">다른 DAG와 헷갈리지 않도록 14장 실습 DAG 이름을 확인합니다.</text>

  <text x="94" y="842" class="font tiny">강의 포인트: Dags 화면에서 `ch14_local_analysis_pipeline` DAG를 찾고, 상세 화면에서 토글 활성화 후 수동 실행합니다.</text>
</svg>
