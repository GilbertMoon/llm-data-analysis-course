<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title desc">
  <title id="title">Airflow DAG 목록 화면에서 실습 DAG 찾기</title>
  <desc id="desc">Airflow Dags 목록에서 ch14_local_analysis_pipeline DAG를 찾고 활성화 토글을 켠 뒤 DAG 이름을 클릭해 상세 화면으로 이동하는 절차를 설명하는 교육용 화면</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "NanumSquare","Noto Sans KR","Malgun Gothic",sans-serif; }
      .mono { font-family: "D2Coding","Cascadia Mono","Consolas",monospace; }
      .title { font-size: 44px; font-weight: 800; fill: #0f2d4d; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #475569; }
      .nav { font-size: 17px; font-weight: 750; fill: #1e293b; }
      .body { font-size: 16px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 500; fill: #475569; }
      .tiny { font-size: 12px; font-weight: 500; fill: #64748b; }
      .label { font-size: 15px; font-weight: 750; fill: #334155; }
      .dagName { font-size: 22px; font-weight: 800; fill: #0066ff; }
      .callTitle { font-size: 21px; font-weight: 800; fill: #1d4ed8; }
      .callBody { font-size: 15px; font-weight: 500; fill: #334155; }
      .stepNum { font-size: 15px; font-weight: 800; fill: #2563eb; }
      .note { font-size: 19px; font-weight: 750; fill: #1e3a8a; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect x="40" y="22" width="1520" height="12" rx="6" fill="#2563eb"/>
  <text x="74" y="92" class="title">Airflow DAG 목록에서 실습 DAG 찾기</text>
  <text x="74" y="128" class="subtitle">DAG 이름을 확인하고 활성화한 뒤 상세 화면으로 이동합니다.</text>

  <rect x="74" y="154" width="1452" height="646" rx="18" fill="#ffffff" stroke="#dbe3ef"/>
  <rect x="74" y="154" width="1452" height="46" rx="18" fill="#ffffff"/>
  <circle cx="100" cy="177" r="7" fill="#e2e8f0"/>
  <circle cx="124" cy="177" r="7" fill="#e2e8f0"/>
  <circle cx="148" cy="177" r="7" fill="#e2e8f0"/>
  <rect x="180" y="164" width="1280" height="26" rx="13" fill="#f1f5f9" stroke="#dbe3ef"/>
  <text x="204" y="182" class="mono tiny">localhost:8080/dags</text>

  <rect x="74" y="200" width="78" height="600" fill="#e7f0fb"/>
  <g transform="translate(91 221)">
    <path d="M0,0 L28,13 L15,28 Z" fill="#e53935"/>
    <path d="M28,13 L45,0 L29,28 Z" fill="#00a0df"/>
    <path d="M15,28 L28,13 L45,45 Z" fill="#1fb655"/>
    <path d="M15,28 L0,45 L28,45 Z" fill="#2f7fe7"/>
  </g>
  <rect x="74" y="322" width="78" height="62" fill="#2f5c9a"/>
  <g text-anchor="middle">
    <text x="113" y="302" class="tiny">홈</text>
    <text x="113" y="360" class="tiny" fill="#ffffff" font-weight="800">Dags</text>
    <text x="113" y="435" class="tiny">에셋</text>
    <text x="113" y="510" class="tiny">탐색</text>
    <text x="113" y="585" class="tiny">관리자</text>
  </g>

  <rect x="152" y="200" width="1374" height="58" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="186" y="236" class="nav">Dags</text>
  <text x="274" y="236" class="nav">Dag 실행들</text>
  <text x="410" y="236" class="nav">태스크 인스턴스</text>
  <line x1="184" y1="254" x2="232" y2="254" stroke="#2563eb" stroke-width="4"/>

  <rect x="152" y="258" width="1374" height="72" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="184" y="275" width="620" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="204" y="300" class="small">⌕  DAG 검색</text>
  <rect x="830" y="275" width="86" height="38" rx="8" fill="#426aa3"/>
  <text x="873" y="300" text-anchor="middle" class="small" fill="#ffffff" font-weight="800">모두</text>
  <rect x="922" y="275" width="90" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="967" y="300" text-anchor="middle" class="small">활성</text>
  <rect x="1018" y="275" width="120" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1078" y="300" text-anchor="middle" class="small">일시 중지</text>

  <text x="184" y="370" class="nav">2 Dags</text>

  <g filter="url(#shadow)">
    <rect x="184" y="392" width="900" height="180" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="184" y="392" width="900" height="62" rx="16" fill="#eff6ff"/>
  </g>
  <circle cx="214" cy="423" r="15" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="214" y="429" text-anchor="middle" class="stepNum">1</text>
  <text x="246" y="431" class="dagName">ch14_local_analysis_pipeline</text>
  <rect x="761" y="410" width="106" height="28" rx="14" fill="#e0f2fe"/>
  <text x="814" y="429" text-anchor="middle" class="tiny" fill="#0369a1" font-weight="800">chapter14</text>

  <text x="210" y="490" class="label">설명</text>
  <text x="300" y="490" class="body">온라인 쇼핑몰 분석 파이프라인</text>
  <text x="210" y="526" class="label">최근 실행</text>
  <text x="300" y="526" class="small">아직 실행 기록 없음</text>

  <text x="860" y="486" class="label">DAG 활성화</text>
  <rect x="960" y="465" width="82" height="40" rx="20" fill="#16a34a"/>
  <circle cx="1021" cy="485" r="15" fill="#ffffff"/>
  <text x="1001" y="531" text-anchor="middle" class="tiny" fill="#166534">ON</text>

  <rect x="860" y="518" width="182" height="38" rx="9" fill="#2563eb"/>
  <text x="951" y="543" text-anchor="middle" class="small" fill="#ffffff" font-weight="800">DAG 상세 화면 열기</text>

  <g filter="url(#shadow)">
    <rect x="184" y="594" width="900" height="120" rx="16" fill="#ffffff" stroke="#dbe3ef"/>
    <rect x="184" y="594" width="900" height="52" rx="16" fill="#f1f5f9"/>
  </g>
  <text x="210" y="628" class="nav" fill="#64748b">sales_analysis_practice</text>
  <text x="210" y="682" class="small">비교용 예시 DAG · 이번 장의 실습 대상이 아님</text>
  <rect x="962" y="618" width="80" height="36" rx="18" fill="#cbd5e1"/>
  <circle cx="980" cy="636" r="13" fill="#ffffff"/>
  <text x="1002" y="685" text-anchor="middle" class="tiny">OFF</text>

  <g filter="url(#shadow)">
    <rect x="1130" y="350" width="350" height="108" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="1130" y="482" width="350" height="108" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="1130" y="614" width="350" height="108" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  </g>

  <circle cx="1160" cy="379" r="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1160" y="385" text-anchor="middle" class="stepNum">1</text>
  <text x="1190" y="382" class="callTitle">DAG 이름 확인</text>
  <text x="1154" y="414" class="callBody">`ch14_local_analysis_pipeline`인지</text>
  <text x="1154" y="438" class="callBody">정확히 확인합니다.</text>

  <circle cx="1160" cy="511" r="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1160" y="517" text-anchor="middle" class="stepNum">2</text>
  <text x="1190" y="514" class="callTitle">활성화 토글 ON</text>
  <text x="1154" y="546" class="callBody">일시 중지 상태라면 토글을 켜서</text>
  <text x="1154" y="570" class="callBody">DAG를 활성화합니다.</text>

  <circle cx="1160" cy="643" r="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1160" y="649" text-anchor="middle" class="stepNum">3</text>
  <text x="1190" y="646" class="callTitle">상세 화면 이동</text>
  <text x="1154" y="678" class="callBody">DAG 이름 또는 상세 버튼을 눌러</text>
  <text x="1154" y="702" class="callBody">수동 실행 화면으로 이동합니다.</text>

  <path d="M1130 404 C1080 404 980 420 650 425" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowBlue)"/>
  <path d="M1130 536 C1090 536 1060 520 1015 490" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowBlue)"/>
  <path d="M1130 668 C1070 668 1020 620 955 551" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowBlue)"/>

  <rect x="220" y="824" width="1160" height="48" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="800" y="855" text-anchor="middle" class="note">실습 DAG 확인 → 활성화 → 상세 화면 이동 → 수동 실행 순서로 진행합니다.</text>
</svg>