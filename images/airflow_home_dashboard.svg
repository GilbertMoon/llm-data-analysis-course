<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title desc">
  <title id="title">Airflow 로그인 후 홈 대시보드 안내</title>
  <desc id="desc">Airflow 로그인 후 처음 열리는 홈 대시보드에서 DAG 현황, 시스템 상태, 조회 기간, 실행 기록을 확인하는 방법을 설명하는 교육용 화면</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "NanumSquare","Noto Sans KR","Malgun Gothic",sans-serif; }
      .mono { font-family: "D2Coding","Cascadia Mono","Consolas",monospace; }
      .title { font-size: 46px; font-weight: 800; fill: #0f2d4d; }
      .subtitle { font-size: 22px; font-weight: 500; fill: #475569; }
      .browserText { font-size: 15px; fill: #475569; }
      .welcome { font-size: 34px; font-weight: 800; fill: #0f172a; }
      .section { font-size: 17px; font-weight: 800; fill: #334155; }
      .statTitle { font-size: 17px; font-weight: 750; fill: #0f172a; }
      .body { font-size: 16px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 500; fill: #475569; }
      .tiny { font-size: 12px; font-weight: 500; fill: #64748b; }
      .callTitle { font-size: 21px; font-weight: 800; fill: #1d4ed8; }
      .callBody { font-size: 16px; font-weight: 500; fill: #334155; }
      .badge { font-size: 14px; font-weight: 800; }
      .note { font-size: 20px; font-weight: 750; fill: #1e3a8a; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect x="40" y="22" width="1520" height="12" rx="6" fill="#2563eb"/>

  <text x="74" y="92" class="title">Airflow 로그인 후 처음 열리는 화면</text>
  <text x="74" y="130" class="subtitle">홈 대시보드에서 전체 상태를 확인한 뒤, 실제 실습은 왼쪽 Dags 메뉴에서 진행합니다.</text>

  <g transform="translate(62 164)">
    <rect x="0" y="0" width="1038" height="620" rx="22" fill="#ffffff" stroke="#dbe3ef" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1038" height="48" rx="22" fill="#ffffff"/>
    <circle cx="22" cy="24" r="7" fill="#e2e8f0"/>
    <rect x="50" y="11" width="760" height="26" rx="13" fill="#f1f5f9" stroke="#dbe3ef"/>
    <text x="70" y="29" class="browserText">localhost:8080</text>
    <circle cx="1002" cy="24" r="8" fill="#cbd5e1"/>

    <rect x="0" y="48" width="66" height="572" fill="#ffffff" stroke="#e5e7eb"/>
    <g transform="translate(15 68)">
      <path d="M0,0 L22,11 L11,22 Z" fill="#e53935"/>
      <path d="M22,11 L34,0 L21,21 Z" fill="#00a0df"/>
      <path d="M11,22 L22,11 L34,34 Z" fill="#1fb655"/>
      <path d="M11,22 L0,34 L22,34 Z" fill="#2f7fe7"/>
    </g>
    <rect x="9" y="118" width="48" height="52" rx="9" fill="#2f5c9a"/>
    <g class="small" text-anchor="middle">
      <text x="33" y="151" fill="#ffffff" font-weight="800">Dags</text>
      <text x="33" y="210" fill="#64748b">에셋</text>
      <text x="33" y="265" fill="#64748b">탐색</text>
      <text x="33" y="320" fill="#64748b">관리자</text>
    </g>

    <text x="88" y="92" class="welcome">환영합니다</text>
    <text x="88" y="126" class="section">통계</text>

    <g filter="url(#shadow)">
      <rect x="88" y="140" width="190" height="58" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="294" y="140" width="205" height="58" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="515" y="140" width="184" height="58" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    </g>
    <circle cx="112" cy="169" r="14" fill="#e11d48"/>
    <text x="112" y="174" text-anchor="middle" class="badge" fill="#ffffff">0</text>
    <text x="138" y="175" class="statTitle">실패한 Dags</text>

    <circle cx="320" cy="169" r="14" fill="#0891b2"/>
    <text x="320" y="174" text-anchor="middle" class="badge" fill="#ffffff">0</text>
    <text x="346" y="175" class="statTitle">실행 중인 Dags</text>

    <circle cx="541" cy="169" r="14" fill="#2563eb"/>
    <text x="541" y="174" text-anchor="middle" class="badge" fill="#ffffff">1</text>
    <text x="567" y="175" class="statTitle">활성 Dags</text>

    <text x="88" y="246" class="section">시스템 상태</text>
    <g class="badge">
      <rect x="88" y="260" width="132" height="30" rx="15" fill="#15803d"/>
      <text x="154" y="281" text-anchor="middle" fill="#ffffff">메타데이터 DB</text>
      <rect x="228" y="260" width="92" height="30" rx="15" fill="#15803d"/>
      <text x="274" y="281" text-anchor="middle" fill="#ffffff">스케줄러</text>
      <rect x="328" y="260" width="92" height="30" rx="15" fill="#15803d"/>
      <text x="374" y="281" text-anchor="middle" fill="#ffffff">트리거러</text>
      <rect x="428" y="260" width="118" height="30" rx="15" fill="#15803d"/>
      <text x="487" y="281" text-anchor="middle" fill="#ffffff">Dag 프로세서</text>
    </g>

    <text x="570" y="246" class="section">풀 슬롯</text>
    <rect x="570" y="260" width="404" height="30" rx="10" fill="#16a34a"/>
    <text x="772" y="281" text-anchor="middle" class="badge" fill="#ffffff">정상 · 128 slots</text>

    <text x="88" y="340" class="section">조회 기간</text>
    <rect x="88" y="354" width="164" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="108" y="379" class="body">지난 24시간</text>
    <path d="M231 370 L239 370 L235 376 Z" fill="#64748b"/>
    <text x="274" y="379" class="body">현재 시점을 기준으로 대시보드 통계를 조회합니다.</text>

    <text x="88" y="438" class="section">실행 기록</text>
    <g filter="url(#shadow)">
      <rect x="88" y="452" width="628" height="136" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="732" y="452" width="242" height="136" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    </g>
    <text x="112" y="484" class="statTitle">Dag 실행들</text>
    <g class="small">
      <rect x="112" y="500" width="90" height="25" rx="12" fill="#475569"/>
      <text x="157" y="518" text-anchor="middle" fill="#ffffff" font-weight="800">0 대기 중</text>
      <rect x="214" y="500" width="90" height="25" rx="12" fill="#0891b2"/>
      <text x="259" y="518" text-anchor="middle" fill="#ffffff" font-weight="800">0 실행 중</text>
      <rect x="316" y="500" width="90" height="25" rx="12" fill="#16a34a"/>
      <text x="361" y="518" text-anchor="middle" fill="#ffffff" font-weight="800">1 성공</text>
      <rect x="418" y="500" width="90" height="25" rx="12" fill="#ef4444"/>
      <text x="463" y="518" text-anchor="middle" fill="#ffffff" font-weight="800">0 실패</text>
    </g>
    <rect x="112" y="544" width="574" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="112" y="544" width="574" height="10" rx="5" fill="#22c55e"/>
    <text x="686" y="566" text-anchor="end" class="small">최근 실행 1건 성공</text>

    <text x="756" y="484" class="statTitle">에셋 이벤트</text>
    <rect x="756" y="502" width="44" height="25" rx="12" fill="#426aa3"/>
    <text x="778" y="520" text-anchor="middle" class="badge" fill="#ffffff">0</text>
    <text x="756" y="558" class="small">등록된 이벤트가 없습니다.</text>

    <text x="88" y="610" class="tiny">교육용 단순화 화면 · 실제 Airflow 버전과 설정에 따라 일부 문구와 배치가 다를 수 있습니다.</text>
  </g>

  <g transform="translate(1130 164)">
    <rect x="0" y="0" width="406" height="620" rx="22" fill="#ffffff" stroke="#dbe3ef" stroke-width="2" filter="url(#shadow)"/>
    <text x="28" y="46" class="section" font-size="22">처음 확인할 4가지</text>

    <g transform="translate(24 72)">
      <rect width="358" height="108" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
      <circle cx="32" cy="30" r="18" fill="#2563eb"/>
      <text x="32" y="36" text-anchor="middle" class="badge" fill="#ffffff">1</text>
      <text x="62" y="34" class="callTitle">DAG 현황 요약</text>
      <text x="24" y="68" class="callBody">실패·실행 중·활성 DAG 수를</text>
      <text x="24" y="92" class="callBody">먼저 확인합니다.</text>
    </g>

    <g transform="translate(24 194)">
      <rect width="358" height="108" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
      <circle cx="32" cy="30" r="18" fill="#059669"/>
      <text x="32" y="36" text-anchor="middle" class="badge" fill="#ffffff">2</text>
      <text x="62" y="34" class="callTitle" fill="#047857">시스템 상태</text>
      <text x="24" y="68" class="callBody">메타데이터 DB·스케줄러 등</text>
      <text x="24" y="92" class="callBody">핵심 구성요소가 초록색인지 봅니다.</text>
    </g>

    <g transform="translate(24 316)">
      <rect width="358" height="108" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
      <circle cx="32" cy="30" r="18" fill="#ea580c"/>
      <text x="32" y="36" text-anchor="middle" class="badge" fill="#ffffff">3</text>
      <text x="62" y="34" class="callTitle" fill="#c2410c">조회 기간</text>
      <text x="24" y="68" class="callBody">지난 24시간 등 원하는 기간으로</text>
      <text x="24" y="92" class="callBody">통계 범위를 조정합니다.</text>
    </g>

    <g transform="translate(24 438)">
      <rect width="358" height="132" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/>
      <circle cx="32" cy="30" r="18" fill="#7c3aed"/>
      <text x="32" y="36" text-anchor="middle" class="badge" fill="#ffffff">4</text>
      <text x="62" y="34" class="callTitle" fill="#6d28d9">실행 기록</text>
      <text x="24" y="68" class="callBody">DAG 실행 결과와 성공·실패 상태를</text>
      <text x="24" y="92" class="callBody">확인하고, 상세 작업은</text>
      <text x="24" y="116" class="callBody">왼쪽 Dags 메뉴에서 진행합니다.</text>
    </g>
  </g>

  <path d="M1060 332 C1100 320 1105 280 1130 280" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowBlue)"/>
  <path d="M1060 446 C1098 446 1105 404 1130 404" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M1060 552 C1098 552 1105 526 1130 526" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M1060 684 C1098 684 1105 664 1130 664" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 8"/>

  <rect x="238" y="818" width="1124" height="54" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="800" y="853" text-anchor="middle" class="note">홈 화면은 전체 상태를 빠르게 확인하는 요약 화면이며, 실제 실습은 Dags 메뉴에서 진행합니다.</text>
</svg>