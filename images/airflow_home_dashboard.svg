<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Airflow 로그인 후 홈 대시보드 화면</title>
  <desc id="desc">Apache Airflow 로그인 후 처음 열리는 홈 대시보드를 설명용으로 단순화한 SVG 화면입니다.</desc>
  <defs>
    <style>
      .font { font-family: "Pretendard", "Noto Sans KR", "Segoe UI", Arial, sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .text { font-size: 16px; fill: #334155; }
      .small { font-size: 13px; fill: #475569; }
      .tiny { font-size: 11px; fill: #64748b; }
      .bold { font-weight: 700; }
      .card-title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .mono { font-family: "Cascadia Mono", Consolas, monospace; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f6f8fb"/>

  <!-- Browser top -->
  <rect x="0" y="0" width="1600" height="56" fill="#ffffff"/>
  <rect x="58" y="14" width="1140" height="28" rx="14" fill="#f1f5f9" stroke="#dbe2ea"/>
  <text x="84" y="32" class="font small">localhost:8080</text>
  <circle cx="24" cy="28" r="8" fill="#e2e8f0"/>
  <circle cx="1545" cy="28" r="10" fill="#cbd5e1"/>

  <!-- Sidebar -->
  <rect x="0" y="56" width="62" height="844" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="0" y="124" width="40" height="56" rx="8" fill="#2f5c9a"/>
  <g transform="translate(8 85)">
    <path d="M0,0 L20,10 L10,20 Z" fill="#e53935"/>
    <path d="M20,10 L30,0 L19,19 Z" fill="#00a0df"/>
    <path d="M10,20 L20,10 L30,30 Z" fill="#1fb655"/>
    <path d="M10,20 L0,30 L20,30 Z" fill="#2f7fe7"/>
  </g>
  <g class="font tiny" fill="#64748b">
    <text x="10" y="153">⌂</text>
    <text x="10" y="214">Dags</text>
    <text x="10" y="271">예셋</text>
    <text x="10" y="328">탐색</text>
    <text x="10" y="385">관리자</text>
    <text x="10" y="810">사용자</text>
  </g>

  <!-- Main area -->
  <text x="84" y="98" class="font title" style="font-size:36px;">환영합니다</text>

  <!-- Section heading -->
  <text x="84" y="145" class="font small bold">통계</text>

  <!-- Stats cards -->
  <g filter="url(#shadow)">
    <rect x="84" y="160" width="150" height="44" rx="10" fill="#ffffff" stroke="#dde5ee"/>
    <rect x="254" y="160" width="170" height="44" rx="10" fill="#ffffff" stroke="#dde5ee"/>
    <rect x="444" y="160" width="160" height="44" rx="10" fill="#ffffff" stroke="#dde5ee"/>
  </g>
  <g class="font">
    <circle cx="103" cy="182" r="13" fill="#e11d48"/><text x="97" y="187" fill="#fff" class="small bold">0</text>
    <text x="125" y="188" class="text bold">실패한 Dags</text>
    <text x="218" y="188" class="small">›</text>

    <circle cx="273" cy="182" r="13" fill="#0891b2"/><text x="267" y="187" fill="#fff" class="small bold">0</text>
    <text x="295" y="188" class="text bold">실행 중인 Dags</text>
    <text x="405" y="188" class="small">›</text>

    <circle cx="463" cy="182" r="13" fill="#2563eb"/><text x="457" y="187" fill="#fff" class="small bold">0</text>
    <text x="485" y="188" class="text bold">활성 Dags</text>
    <text x="579" y="188" class="small">›</text>
  </g>

  <!-- Favorites -->
  <text x="84" y="244" class="font small bold">10개의 즐겨찾기 Dags</text>
  <text x="84" y="268" class="font small">아직 즐겨찾기가 없습니다. 목록에서 Dag 옆의 별 아이콘을 클릭하면 즐겨찾기에 추가할 수 있습니다.</text>

  <!-- Status section -->
  <text x="84" y="320" class="font small bold">상태</text>
  <g class="font small bold">
    <rect x="84" y="334" width="110" height="28" rx="14" fill="#148a08"/><text x="97" y="353" fill="#ffffff">메타데이터베이스</text>
    <rect x="200" y="334" width="72" height="28" rx="14" fill="#148a08"/><text x="213" y="353" fill="#ffffff">스케줄러</text>
    <rect x="278" y="334" width="72" height="28" rx="14" fill="#148a08"/><text x="291" y="353" fill="#ffffff">트리거러</text>
    <rect x="356" y="334" width="98" height="28" rx="14" fill="#148a08"/><text x="369" y="353" fill="#ffffff">Dag 프로세서</text>
  </g>
  <text x="495" y="320" class="font small bold">풀 슬롯</text>
  <rect x="495" y="334" width="1040" height="28" rx="8" fill="#0f8a0a"/>
  <text x="1016" y="353" class="font small bold" fill="#ffffff">✓ 128</text>
  <text x="1520" y="320" class="font tiny">풀 관리</text>

  <!-- Period / date range -->
  <rect x="84" y="388" width="170" height="38" rx="8" fill="#ffffff" stroke="#dbe2ea"/>
  <text x="102" y="412" class="font text">지난 24 시간</text>
  <text x="231" y="412" class="font small">⌄</text>
  <text x="270" y="412" class="font text">2026-07-08 15:33:05 - 2026-07-09 15:33:05</text>

  <!-- Records section -->
  <text x="84" y="484" class="font small bold">기록</text>

  <!-- Left panel -->
  <g filter="url(#shadow)">
    <rect x="84" y="498" width="1030" height="265" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="1120" y="498" width="420" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="84" y="776" width="1030" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  </g>

  <text x="104" y="535" class="font card-title">Dag 실행들</text>
  <g class="font text">
    <rect x="98" y="551" width="54" height="24" rx="12" fill="#4b5563"/><text x="109" y="568" fill="#ffffff" class="small bold">0 대기 중</text>
    <rect x="98" y="603" width="54" height="24" rx="12" fill="#06b6d4"/><text x="109" y="620" fill="#ffffff" class="small bold">0 실행 중</text>
    <rect x="98" y="655" width="54" height="24" rx="12" fill="#16a34a"/><text x="114" y="672" fill="#ffffff" class="small bold">0 성공</text>
    <rect x="98" y="707" width="54" height="24" rx="12" fill="#ef4444"/><text x="114" y="724" fill="#ffffff" class="small bold">0 실패</text>
  </g>
  <g fill="#d5dbe4">
    <rect x="98" y="585" width="980" height="6" rx="3"/>
    <rect x="98" y="637" width="980" height="6" rx="3"/>
    <rect x="98" y="689" width="980" height="6" rx="3"/>
    <rect x="98" y="741" width="980" height="6" rx="3"/>
  </g>
  <g class="font small">
    <text x="1064" y="572">0%</text>
    <text x="1064" y="624">0%</text>
    <text x="1064" y="676">0%</text>
    <text x="1064" y="728">0%</text>
  </g>

  <rect x="1140" y="514" width="34" height="24" rx="12" fill="#426aa3"/>
  <text x="1150" y="531" class="font small bold" fill="#ffffff">0</text>
  <text x="1186" y="530" class="font card-title">에셋 이벤트들</text>
  <rect x="1460" y="513" width="64" height="24" rx="6" fill="#f8fafc" stroke="#dbe2ea"/>
  <text x="1479" y="530" class="font tiny">최신순</text>
  <text x="1148" y="565" class="font text">에셋 이벤트를 찾을 수 없습니다.</text>

  <text x="104" y="812" class="font card-title">태스크 인스턴스</text>

  <!-- Callouts -->
  <g filter="url(#shadow)">
    <rect x="1220" y="120" width="290" height="88" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="1230" y="240" width="280" height="108" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="1215" y="390" width="300" height="110" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="1222" y="534" width="292" height="120" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
  </g>

  <path d="M1210 165 C1140 165, 1020 168, 600 180" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="1240" y="149" class="font card-title" fill="#1d4ed8">1. DAG 현황 요약</text>
  <text x="1240" y="173" class="font small">실패, 실행 중, 활성 DAG 수를</text>
  <text x="1240" y="193" class="font small">한눈에 확인할 수 있습니다.</text>

  <path d="M1230 286 C1110 290, 980 300, 460 348" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="1250" y="268" class="font card-title" fill="#1d4ed8">2. 시스템 상태</text>
  <text x="1250" y="292" class="font small">메타데이터 DB, 스케줄러,</text>
  <text x="1250" y="312" class="font small">트리거러, DAG 프로세서가</text>
  <text x="1250" y="332" class="font small">정상인지 확인합니다.</text>

  <path d="M1215 436 C1120 440, 1020 428, 766 406" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="1235" y="418" class="font card-title" fill="#1d4ed8">3. 시간 범위 / 조회 기간</text>
  <text x="1235" y="442" class="font small">지난 24시간 같은 기준으로</text>
  <text x="1235" y="462" class="font small">대시보드 통계를 바꿔 볼 수</text>
  <text x="1235" y="482" class="font small">있습니다.</text>

  <path d="M1222 592 C1140 592, 1120 592, 1112 592" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="1242" y="564" class="font card-title" fill="#1d4ed8">4. 실행 기록과 에셋 이벤트</text>
  <text x="1242" y="588" class="font small">DAG 실행 결과, 대기/실행/성공/실패</text>
  <text x="1242" y="608" class="font small">분포, 에셋 이벤트, 태스크 인스턴스</text>
  <text x="1242" y="628" class="font small">영역을 볼 수 있습니다.</text>

  <text x="84" y="882" class="font tiny">설명용 SVG: Airflow 로그인 후 열리는 홈 대시보드 화면의 주요 영역을 단순화해 표현했습니다.</text>
</svg>
