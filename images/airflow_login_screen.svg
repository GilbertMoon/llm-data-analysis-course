<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="title desc">
  <title id="title">Airflow 로그인과 환경변수 확인 가이드</title>
  <desc id="desc">환경 파일에 설정한 사용자 이름과 비밀번호로 로그인하고, 실패하면 Docker Compose 설정과 로그를 확인하는 절차</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14"
                    flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "NanumSquare","Noto Sans KR","Malgun Gothic",sans-serif; }
      .mono { font-family: "D2Coding","Cascadia Mono","Consolas",monospace; }
      .title { font-size: 46px; font-weight: 800; fill: #0f2d4d; }
      .subtitle { font-size: 22px; font-weight: 500; fill: #475569; }
      .section { font-size: 25px; font-weight: 800; fill: #0f172a; }
      .body { font-size: 19px; font-weight: 500; fill: #334155; }
      .small { font-size: 16px; font-weight: 500; fill: #475569; }
      .code { font-size: 17px; font-weight: 650; fill: #0f172a; }
      .badge { font-size: 15px; font-weight: 800; }
      .terminal { font-family: "D2Coding","Cascadia Mono","Consolas",monospace;
                  font-size: 15px; font-weight: 650; fill: #a7f3d0; }
      .buttonText { font-size: 19px; font-weight: 800; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect x="40" y="22" width="1520" height="12" rx="6" fill="#2563eb"/>

  <text x="74" y="92" class="title">Airflow 로그인 화면이 나타났을 때</text>
  <text x="74" y="130" class="subtitle">저장소의 고정 비밀번호가 아니라, 본인이 .env에 설정한 값을 입력합니다.</text>

  <rect x="74" y="160" width="1452" height="42" rx="21"
        fill="#eef2f7" stroke="#d7e0eb"/>
  <text x="102" y="188" class="mono small"
        fill="#334155">http://localhost:${AIRFLOW_UI_PORT:-8080}</text>

  <g>
    <rect x="74" y="245" width="390" height="260" rx="20"
          fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="96" y="265" width="148" height="30" rx="15"
          fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="170" y="286" text-anchor="middle" class="badge"
          fill="#2563eb">1. .env 확인</text>
    <text x="98" y="330" class="section">로그인 값 확인</text>
    <text x="98" y="369" class="body">Username</text>
    <text x="98" y="399" class="mono code"
          fill="#2563eb">_AIRFLOW_WWW_USER_USERNAME</text>
    <text x="98" y="438" class="body">Password</text>
    <text x="98" y="468" class="mono code"
          fill="#2563eb">_AIRFLOW_WWW_USER_PASSWORD</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="228" width="500" height="430" rx="16"
          fill="#ffffff" stroke="#e2e8f0"/>
  </g>

  <g transform="translate(558 264)">
    <path d="M0,0 L39,18 L20,37 Z" fill="#017CEE"/>
    <path d="M39,18 L58,0 L37,37 Z" fill="#00AD46"/>
    <path d="M20,37 L39,18 L58,58 Z" fill="#F2B705"/>
    <path d="M20,37 L0,58 L39,58 Z" fill="#E43921"/>
    <circle cx="29" cy="29" r="8" fill="#ffffff"/>
  </g>

  <text x="634" y="303" class="section">Sign into Airflow</text>
  <text x="558" y="345" class="small">Enter the values configured in your .env file.</text>

  <text x="558" y="392" class="body" font-weight="700">Username</text>
  <rect x="558" y="408" width="424" height="54" rx="7"
        fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="578" y="444" class="mono body" fill="#2563eb">airflow</text>

  <text x="558" y="502" class="body" font-weight="700">Password</text>
  <rect x="558" y="518" width="424" height="54" rx="7"
        fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="578" y="554" class="mono body" fill="#2563eb">••••••••••••</text>

  <rect x="558" y="594" width="424" height="50" rx="7" fill="#64748b"/>
  <text x="770" y="627" text-anchor="middle" class="buttonText">Sign in</text>

  <g>
    <rect x="1070" y="228" width="456" height="430" rx="20"
          fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="1094" y="248" width="154" height="30" rx="15"
          fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="1171" y="269" text-anchor="middle" class="badge"
          fill="#6d28d9">2. 실패 시 점검</text>

    <text x="1094" y="316" class="section">설정과 로그 확인</text>
    <text x="1094" y="350" class="small">계정을 추측하지 말고 현재 구성을 확인합니다.</text>

    <rect x="1094" y="373" width="408" height="184" rx="14" fill="#0f172a"/>
    <text x="1116" y="405" class="terminal">docker compose config</text>
    <text x="1116" y="442" class="terminal">docker compose logs --tail 100</text>
    <text x="1116" y="469" class="terminal">  airflow-init</text>
    <text x="1116" y="506" class="terminal">docker compose logs --tail 100</text>
    <text x="1116" y="533" class="terminal">  airflow-api-server</text>

    <text x="1094" y="596" class="body">환경값을 바꾼 뒤 기존 DB가 남아 있으면</text>
    <text x="1094" y="626" class="small">학습 기록 삭제 가능 여부를 확인한 후 볼륨을 초기화합니다.</text>
  </g>

  <path d="M464 365 H504" fill="none" stroke="#2563eb"
        stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <path d="M1020 436 H1054" fill="none" stroke="#2563eb"
        stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <rect x="188" y="716" width="1224" height="84" rx="20"
        fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="800" y="748" text-anchor="middle" class="section"
        font-size="22">로그인 확인 흐름</text>
  <text x="800" y="779" text-anchor="middle" class="body"
        fill="#1e3a8a">.env 값 확인 → 로그인 → 실패 시 Compose 설정과 로그 확인</text>

  <rect x="274" y="824" width="1052" height="44" rx="18"
        fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="800" y="853" text-anchor="middle" class="body"
        font-weight="750" fill="#1e3a8a">
    실제 .env는 Git에 커밋하지 않으며, 기본 예시 비밀번호를 운영 환경에 재사용하지 않습니다.
  </text>
</svg>
