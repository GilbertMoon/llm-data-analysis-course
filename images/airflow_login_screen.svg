<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title desc">
  <title id="title">Airflow 로그인 계정 확인 가이드</title>
  <desc id="desc">수업용 계정 airflow와 airflow를 먼저 시도하고, 로그인에 실패하면 Simple Auth Manager가 생성한 비밀번호 파일을 확인해 admin 계정으로 로그인하는 절차를 설명하는 화면</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "NanumSquare","Noto Sans KR","Malgun Gothic",sans-serif; }
      .mono { font-family: "D2Coding","Cascadia Mono","Consolas",monospace; }
      .title { font-size: 46px; font-weight: 800; fill: #0f2d4d; }
      .subtitle { font-size: 22px; font-weight: 500; fill: #475569; }
      .section { font-size: 25px; font-weight: 800; fill: #0f172a; }
      .body { font-size: 19px; font-weight: 500; fill: #334155; }
      .small { font-size: 16px; font-weight: 500; fill: #475569; }
      .code { font-size: 17px; font-weight: 650; fill: #0f172a; }
      .step { font-size: 22px; font-weight: 800; fill: #1d4ed8; }
      .badge { font-size: 15px; font-weight: 800; }
      .terminal { font-family: "D2Coding","Cascadia Mono","Consolas",monospace; font-size: 16px; font-weight: 650; fill: #a7f3d0; }
      .terminalInfo { font-family: "D2Coding","Cascadia Mono","Consolas",monospace; font-size: 16px; font-weight: 650; fill: #93c5fd; }
      .buttonText { font-size: 19px; font-weight: 800; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect x="40" y="22" width="1520" height="12" rx="6" fill="#2563eb"/>

  <text x="74" y="92" class="title">Airflow 로그인 화면이 나타났을 때</text>
  <text x="74" y="130" class="subtitle">기본 계정을 먼저 시도하고, 실패하면 생성된 관리자 비밀번호를 확인합니다.</text>

  <rect x="74" y="160" width="1452" height="42" rx="21" fill="#eef2f7" stroke="#d7e0eb"/>
  <text x="102" y="188" class="mono small" fill="#334155">localhost:8080/auth/login?next=%2F</text>

  <g>
    <rect x="74" y="245" width="360" height="220" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="96" y="265" width="116" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="154" y="286" text-anchor="middle" class="badge" fill="#2563eb">1. 먼저 시도</text>
    <text x="98" y="330" class="section">수업용 계정 입력</text>
    <text x="98" y="369" class="body">Username</text>
    <text x="230" y="369" class="mono code" fill="#2563eb">airflow</text>
    <text x="98" y="408" class="body">Password</text>
    <text x="230" y="408" class="mono code" fill="#2563eb">airflow</text>
    <rect x="98" y="427" width="310" height="24" rx="12" fill="#eff6ff"/>
    <text x="253" y="444" text-anchor="middle" class="small" fill="#1e40af">먼저 시도하는 계정</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="492" y="228" width="500" height="430" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  </g>

  <g transform="translate(530 264)">
    <path d="M0,0 L39,18 L20,37 Z" fill="#017CEE"/>
    <path d="M39,18 L58,0 L37,37 Z" fill="#00AD46"/>
    <path d="M20,37 L39,18 L58,58 Z" fill="#F2B705"/>
    <path d="M20,37 L0,58 L39,58 Z" fill="#E43921"/>
    <circle cx="29" cy="29" r="8" fill="#ffffff"/>
  </g>

  <text x="606" y="303" class="section">Sign into Airflow</text>
  <text x="530" y="345" class="small">Enter your username and password below:</text>

  <text x="530" y="392" class="body" font-weight="700" fill="#111827">Username</text>
  <rect x="530" y="408" width="424" height="54" rx="7" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="550" y="444" class="mono body" fill="#2563eb">airflow</text>

  <text x="530" y="502" class="body" font-weight="700" fill="#111827">Password</text>
  <rect x="530" y="518" width="424" height="54" rx="7" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="550" y="554" class="mono body" fill="#2563eb">airflow</text>

  <rect x="530" y="594" width="424" height="50" rx="7" fill="#64748b"/>
  <text x="742" y="627" text-anchor="middle" class="buttonText">Sign in</text>

  <g>
    <rect x="1050" y="228" width="476" height="430" rx="20" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="1074" y="248" width="138" height="30" rx="15" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="1143" y="269" text-anchor="middle" class="badge" fill="#6d28d9">2. 실패한 경우</text>

    <text x="1074" y="316" class="section">생성 비밀번호 확인</text>
    <text x="1074" y="350" class="small">Simple Auth Manager의 비밀번호 파일을 확인합니다.</text>

    <rect x="1074" y="373" width="428" height="154" rx="14" fill="#0f172a"/>
    <text x="1096" y="405" class="terminal">docker exec -it</text>
    <text x="1096" y="432" class="terminal">llm-course-airflow-api-server</text>
    <text x="1096" y="459" class="terminal">cat /opt/airflow/</text>
    <text x="1096" y="486" class="terminal">simple_auth_manager_passwords.json.generated</text>
    <text x="1096" y="512" class="terminalInfo">{"admin": "generated_password"}</text>

    <text x="1074" y="566" class="body">Username</text>
    <text x="1222" y="566" class="mono code" fill="#7c3aed">admin</text>
    <text x="1074" y="605" class="body">Password</text>
    <text x="1222" y="605" class="body" font-weight="700" fill="#7c3aed">생성된 비밀번호</text>

    <rect x="1074" y="620" width="428" height="24" rx="12" fill="#f5f3ff"/>
    <text x="1288" y="637" text-anchor="middle" class="small" fill="#5b21b6">401 Unauthorized · Invalid credentials 대응</text>
  </g>

  <path d="M434 355 H476" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowBlue)"/>
  <path d="M992 436 H1034" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowBlue)"/>

  <rect x="188" y="716" width="1224" height="84" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="800" y="748" text-anchor="middle" class="section" font-size="22">로그인 확인 흐름</text>
  <text x="800" y="779" text-anchor="middle" class="body" fill="#1e3a8a">airflow / airflow 먼저 시도 → 실패 시 생성 비밀번호 확인 → admin 계정으로 로그인</text>

  <rect x="274" y="824" width="1052" height="44" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="800" y="853" text-anchor="middle" class="body" font-weight="750" fill="#1e3a8a">
    강의 포인트: 기본 계정이 항상 생성되는 것은 아니므로, 로그인 실패 시 실제 생성 계정을 확인합니다.
  </text>
</svg>
