  </g>
  <text x="210" y="426" class="label">최근 실행</text>
  <text x="210" y="462" class="mono body" fill="#0066ff">2026-07-09 22:41:53</text>
  <circle cx="512" cy="454" r="22" fill="#16a34a"/>
  <path d="M501 454 l8 8 l16 -19" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="552" y="430" width="180" height="48" rx="12" fill="#ecfdf5" stroke="#86efac"/>
  <text x="642" y="460" text-anchor="middle" class="successText">DAG 실행 성공</text>

  <text x="184" y="566" class="nav">Task 상태</text>
  <g transform="translate(184 586)">
    <g>
      <rect x="0" y="0" width="132" height="88" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
      <circle cx="28" cy="28" r="14" fill="#16a34a"/>
      <path d="M22 28 l5 5 l9 -11" stroke="#fff" stroke-width="3" fill="none"/>
      <text x="66" y="30" class="taskText" text-anchor="middle">입력 확인</text>
      <text x="66" y="58" class="small" text-anchor="middle">SUCCESS</text>
    </g>
    <g transform="translate(146 0)">
      <rect x="0" y="0" width="132" height="88" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
      <circle cx="28" cy="28" r="14" fill="#16a34a"/>
      <path d="M22 28 l5 5 l9 -11" stroke="#fff" stroke-width="3" fill="none"/>
      <text x="66" y="30" class="taskText" text-anchor="middle">전처리</text>
      <text x="66" y="58" class="small" text-anchor="middle">SUCCESS</text>
    </g>
    <g transform="translate(292 0)">
      <rect x="0" y="0" width="132" height="88" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
      <circle cx="28" cy="28" r="14" fill="#16a34a"/>
      <path d="M22 28 l5 5 l9 -11" stroke="#fff" stroke-width="3" fill="none"/>
      <text x="66" y="30" class="taskText" text-anchor="middle">분석</text>
      <text x="66" y="58" class="small" text-anchor="middle">SUCCESS</text>
    </g>
    <g transform="translate(438 0)">
      <rect x="0" y="0" width="132" height="88" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
      <circle cx="28" cy="28" r="14" fill="#16a34a"/>
      <path d="M22 28 l5 5 l9 -11" stroke="#fff" stroke-width="3" fill="none"/>
      <text x="66" y="30" class="taskText" text-anchor="middle">시각화</text>
      <text x="66" y="58" class="small" text-anchor="middle">SUCCESS</text>
    </g>
    <g transform="translate(584 0)">
      <rect x="0" y="0" width="132" height="88" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
      <circle cx="28" cy="28" r="14" fill="#16a34a"/>
      <path d="M22 28 l5 5 l9 -11" stroke="#fff" stroke-width="3" fill="none"/>
      <text x="66" y="30" class="taskText" text-anchor="middle">보고서</text>
      <text x="66" y="58" class="small" text-anchor="middle">SUCCESS</text>
    </g>
    <g transform="translate(730 0)">
      <rect x="0" y="0" width="132" height="88" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
      <circle cx="28" cy="28" r="14" fill="#16a34a"/>
      <path d="M22 28 l5 5 l9 -11" stroke="#fff" stroke-width="3" fill="none"/>
      <text x="66" y="30" class="taskText" text-anchor="middle">결과 검증</text>
      <text x="66" y="58" class="small" text-anchor="middle">SUCCESS</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="1130" y="286" width="350" height="118" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="1130" y="430" width="350" height="118" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="1130" y="574" width="350" height="118" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  </g>

  <circle cx="1160" cy="318" r="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1160" y="324" text-anchor="middle" class="stepNum">1</text>
  <text x="1190" y="321" class="callTitle">최근 실행 성공 확인</text>
  <text x="1154" y="353" class="callBody">최근 실행 시간 옆의 초록색 체크와</text>
  <text x="1154" y="377" class="callBody">성공 배지를 확인합니다.</text>

  <circle cx="1160" cy="462" r="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1160" y="468" text-anchor="middle" class="stepNum">2</text>
  <text x="1190" y="465" class="callTitle">모든 Task 성공 확인</text>
  <text x="1154" y="497" class="callBody">입력 확인부터 결과 검증까지</text>
  <text x="1154" y="521" class="callBody">여섯 개 Task가 모두 초록색인지 봅니다.</text>

  <circle cx="1160" cy="606" r="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1160" y="612" text-anchor="middle" class="stepNum">3</text>
  <text x="1190" y="609" class="callTitle">검증 로그 최종 확인</text>
  <text x="1154" y="641" class="callBody">reports/ch14_airflow_validation_log.csv의</text>
  <text x="1154" y="665" class="callBody">모든 status가 ok인지 확인합니다.</text>

  <path d="M1130 345 C1060 345 880 410 730 454" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowBlue)"/>
  <path d="M1130 489 C1040 489 960 560 900 613" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowBlue)"/>
  <path d="M1130 633 C1070 633 1040 680 1005 700" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowBlue)"/>

  <rect x="220" y="808" width="1160" height="52" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="800" y="841" text-anchor="middle" class="note">초록색 표시만 보지 말고, 최근 실행·Task 전체·검증 로그를 함께 확인합니다.</text>
</svg>