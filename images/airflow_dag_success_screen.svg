    <text x="113" y="510" class="tiny">탐색</text>
    <text x="113" y="585" class="tiny">관리자</text>
  </g>

  <rect x="152" y="200" width="1374" height="58" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="186" y="236" class="nav">Dags</text>
  <text x="274" y="236" class="nav">Dag 실행들</text>
  <text x="410" y="236" class="nav">태스크 인스턴스</text>
  <line x1="184" y1="254" x2="232" y2="254" stroke="#2563eb" stroke-width="4"/>

  <rect x="184" y="286" width="900" height="80" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="210" y="326" class="dagName">ch14_local_analysis_pipeline</text>
  <text x="210" y="350" class="small">온라인 쇼핑몰 데이터 분석 파이프라인</text>
  <rect x="942" y="306" width="106" height="34" rx="17" fill="#dcfce7" stroke="#86efac"/>
  <text x="995" y="328" text-anchor="middle" class="successText">활성화 ON</text>

  <g filter="url(#shadow)">
