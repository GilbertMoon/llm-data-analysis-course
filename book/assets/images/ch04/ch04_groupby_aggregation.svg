<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 34px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.sub{font:500 18px Arial,'Noto Sans KR',sans-serif;fill:#334155}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18;ry:18}.group1{fill:#dbeafe}.group2{fill:#dcfce7}.group3{fill:#fef3c7}.head{font:700 24px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.txt{font:500 18px Arial,'Noto Sans KR',sans-serif;fill:#334155}.mono{font:600 17px Consolas,'Courier New',monospace;fill:#1e293b}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="600" y="58" text-anchor="middle" class="title">groupby를 이용한 그룹별 집계 개념도</text>
  <text x="600" y="90" text-anchor="middle" class="sub">기준 컬럼으로 데이터를 묶고, 합계·평균·개수를 계산한다.</text>
  <rect x="80" y="150" width="300" height="420" class="box"/><text x="230" y="190" text-anchor="middle" class="head">원본 데이터</text>
  <rect x="120" y="230" width="220" height="44" class="group1"/><text x="230" y="258" text-anchor="middle" class="mono">전자기기  120000</text>
  <rect x="120" y="286" width="220" height="44" class="group2"/><text x="230" y="314" text-anchor="middle" class="mono">생활용품  45000</text>
  <rect x="120" y="342" width="220" height="44" class="group1"/><text x="230" y="370" text-anchor="middle" class="mono">전자기기  85000</text>
  <rect x="120" y="398" width="220" height="44" class="group3"/><text x="230" y="426" text-anchor="middle" class="mono">식품      22000</text>
  <rect x="120" y="454" width="220" height="44" class="group2"/><text x="230" y="482" text-anchor="middle" class="mono">생활용품  51000</text>
  <rect x="460" y="250" width="280" height="200" class="box"/><text x="600" y="305" text-anchor="middle" class="head">groupby("category")</text><text x="600" y="350" text-anchor="middle" class="txt">카테고리별로 묶기</text><text x="600" y="390" text-anchor="middle" class="txt">sum · mean · count</text>
  <rect x="820" y="150" width="300" height="420" class="box"/><text x="970" y="190" text-anchor="middle" class="head">집계 결과</text>
  <rect x="860" y="250" width="220" height="50" class="group1"/><text x="970" y="282" text-anchor="middle" class="mono">전자기기 205000</text>
  <rect x="860" y="320" width="220" height="50" class="group2"/><text x="970" y="352" text-anchor="middle" class="mono">생활용품 96000</text>
  <rect x="860" y="390" width="220" height="50" class="group3"/><text x="970" y="422" text-anchor="middle" class="mono">식품 22000</text>
  <path class="arrow" d="M380 350H455"/><path class="arrow" d="M740 350H815"/>
</svg>