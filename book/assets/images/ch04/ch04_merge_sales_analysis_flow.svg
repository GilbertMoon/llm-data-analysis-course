<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 34px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.sub{font:500 18px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#334155}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18;ry:18}.accent{fill:#dbeafe;stroke:#93c5fd;stroke-width:2;rx:18;ry:18}.result{fill:#dcfce7;stroke:#86efac;stroke-width:2;rx:18;ry:18}.head{font:700 23px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.txt{font:500 17px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#334155}.mono{font:600 16px 'Malgun Gothic','맑은 고딕',Consolas,'Courier New',monospace;fill:#1e293b}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="600" y="58" text-anchor="middle" class="title">merge 기반 매출 분석 흐름도</text>
  <text x="600" y="90" text-anchor="middle" class="sub">여러 CSV 파일을 공통 키로 연결해 카테고리별·월별 매출 분석으로 확장한다.</text>
  <rect x="80" y="150" width="250" height="120" class="box"/><text x="205" y="195" text-anchor="middle" class="head">order_items</text><text x="205" y="230" text-anchor="middle" class="mono">order_id · product_id</text><text x="205" y="255" text-anchor="middle" class="mono">quantity · unit_price</text>
  <rect x="80" y="410" width="250" height="120" class="box"/><text x="205" y="455" text-anchor="middle" class="head">products</text><text x="205" y="490" text-anchor="middle" class="mono">product_id</text><text x="205" y="515" text-anchor="middle" class="mono">category · price</text>
  <rect x="465" y="280" width="270" height="140" class="accent"/><text x="600" y="330" text-anchor="middle" class="head">merge</text><text x="600" y="365" text-anchor="middle" class="txt">product_id 기준 연결</text><text x="600" y="392" text-anchor="middle" class="mono">how="left"</text>
  <rect x="870" y="150" width="250" height="120" class="result"/><text x="995" y="195" text-anchor="middle" class="head">category_sales</text><text x="995" y="230" text-anchor="middle" class="txt">카테고리별 매출</text>
  <rect x="870" y="410" width="250" height="120" class="result"/><text x="995" y="455" text-anchor="middle" class="head">monthly_sales</text><text x="995" y="490" text-anchor="middle" class="txt">월별 매출 추이</text>
  <rect x="465" y="520" width="270" height="90" class="box"/><text x="600" y="555" text-anchor="middle" class="head">검증</text><text x="600" y="585" text-anchor="middle" class="txt">행 수 · 누락값 · 중복 키 확인</text>
  <path class="arrow" d="M330 210C400 225 430 270 462 310"/><path class="arrow" d="M330 470C400 455 430 410 462 375"/><path class="arrow" d="M735 330C800 285 830 230 865 210"/><path class="arrow" d="M735 390C800 425 830 455 865 470"/><path class="arrow" d="M600 420V515"/>
</svg>