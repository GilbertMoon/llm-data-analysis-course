<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 34px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.sub{font:500 18px Arial,'Noto Sans KR',sans-serif;fill:#334155}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18;ry:18}.accent{fill:#dbeafe;stroke:#93c5fd;stroke-width:2;rx:18;ry:18}.head{font:700 25px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.txt{font:500 19px Arial,'Noto Sans KR',sans-serif;fill:#334155}.formula{font:700 30px Consolas,'Courier New',monospace;fill:#1d4ed8}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="600" y="58" text-anchor="middle" class="title">파생 컬럼 line_total 생성 개념도</text>
  <text x="600" y="90" text-anchor="middle" class="sub">기존 컬럼을 계산해 분석에 필요한 새로운 컬럼을 만든다.</text>
  <rect x="100" y="220" width="240" height="150" class="box"/><text x="220" y="275" text-anchor="middle" class="head">quantity</text><text x="220" y="320" text-anchor="middle" class="txt">상품 수량</text>
  <rect x="480" y="220" width="240" height="150" class="box"/><text x="600" y="275" text-anchor="middle" class="head">unit_price</text><text x="600" y="320" text-anchor="middle" class="txt">상품 단가</text>
  <rect x="860" y="220" width="240" height="150" class="accent"/><text x="980" y="275" text-anchor="middle" class="head">line_total</text><text x="980" y="320" text-anchor="middle" class="txt">주문 상세 금액</text>
  <text x="410" y="305" text-anchor="middle" class="formula">×</text>
  <path d="M340 295H470" class="arrow"/><path d="M720 295H850" class="arrow"/>
  <rect x="250" y="470" width="700" height="86" class="box"/><text x="600" y="522" text-anchor="middle" class="formula">line_total = quantity × unit_price</text>
</svg>