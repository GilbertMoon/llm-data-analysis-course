<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 34px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.sub{font:500 18px Arial,'Noto Sans KR',sans-serif;fill:#334155}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18;ry:18}.head{font:700 24px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.txt{font:500 17px Arial,'Noto Sans KR',sans-serif;fill:#334155}.cell{fill:#e2e8f0;stroke:#cbd5e1}.sel{fill:#bfdbfe}.filter{fill:#bbf7d0}.sort{fill:#fde68a}</style></defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="600" y="58" text-anchor="middle" class="title">컬럼 선택 · 행 필터링 · 정렬 개념도</text>
  <text x="600" y="90" text-anchor="middle" class="sub">pandas 기본 조작은 서로 다른 질문에 답하기 위한 도구다.</text>
  <rect x="70" y="150" width="310" height="440" class="panel"/><text x="225" y="195" text-anchor="middle" class="head">컬럼 선택</text><text x="225" y="225" text-anchor="middle" class="txt">필요한 열만 본다</text>
  <rect x="445" y="150" width="310" height="440" class="panel"/><text x="600" y="195" text-anchor="middle" class="head">행 필터링</text><text x="600" y="225" text-anchor="middle" class="txt">조건에 맞는 행만 남긴다</text>
  <rect x="820" y="150" width="310" height="440" class="panel"/><text x="975" y="195" text-anchor="middle" class="head">정렬</text><text x="975" y="225" text-anchor="middle" class="txt">중요 값 순서로 본다</text>
  <g transform="translate(105,260)"><rect class="cell" width="70" height="42"/><rect class="sel" x="70" width="70" height="42"/><rect class="sel" x="140" width="70" height="42"/><rect class="cell" x="210" width="70" height="42"/><rect class="cell" y="42" width="70" height="42"/><rect class="sel" x="70" y="42" width="70" height="42"/><rect class="sel" x="140" y="42" width="70" height="42"/><rect class="cell" x="210" y="42" width="70" height="42"/><rect class="cell" y="84" width="70" height="42"/><rect class="sel" x="70" y="84" width="70" height="42"/><rect class="sel" x="140" y="84" width="70" height="42"/><rect class="cell" x="210" y="84" width="70" height="42"/></g>
  <g transform="translate(480,260)"><rect class="cell" width="70" height="42"/><rect class="cell" x="70" width="70" height="42"/><rect class="cell" x="140" width="70" height="42"/><rect class="filter" y="42" width="70" height="42"/><rect class="filter" x="70" y="42" width="70" height="42"/><rect class="filter" x="140" y="42" width="70" height="42"/><rect class="cell" y="84" width="70" height="42"/><rect class="cell" x="70" y="84" width="70" height="42"/><rect class="cell" x="140" y="84" width="70" height="42"/></g>
  <g transform="translate(855,260)"><rect class="sort" width="70" height="42"/><rect class="sort" x="70" width="70" height="42"/><rect class="sort" x="140" width="70" height="42"/><rect class="cell" y="42" width="70" height="42"/><rect class="cell" x="70" y="42" width="70" height="42"/><rect class="cell" x="140" y="42" width="70" height="42"/><rect class="cell" y="84" width="70" height="42"/><rect class="cell" x="70" y="84" width="70" height="42"/><rect class="cell" x="140" y="84" width="70" height="42"/></g>
  <text x="225" y="505" text-anchor="middle" class="txt">customers[["city", "age"]]</text><text x="600" y="505" text-anchor="middle" class="txt">customers[customers["age"] &gt;= 30]</text><text x="975" y="505" text-anchor="middle" class="txt">sort_values("price")</text>
