  <text x="225" y="435" text-anchor="middle" class="code">df[["city", "age"]]</text><text x="600" y="435" text-anchor="middle" class="code">df.loc[df["age"] &gt;= 30]</text><text x="975" y="435" text-anchor="middle" class="code">df.sort_values("price")</text>
