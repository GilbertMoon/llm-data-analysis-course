<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 34px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.sub{font:500 18px Arial,'Noto Sans KR',sans-serif;fill:#334155}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18;ry:18}.head{font:700 24px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.txt{font:500 17px Arial,'Noto Sans KR',sans-serif;fill:#334155}.code{font:700 16px Consolas,'Courier New',monospace;fill:#1d4ed8}.cell{fill:#e2e8f0;stroke:#cbd5e1}.sel{fill:#bfdbfe}.filter{fill:#bbf7d0}.sort{fill:#fde68a}</style></defs>
  <rect class="bg" width="1200" height="560"/>
