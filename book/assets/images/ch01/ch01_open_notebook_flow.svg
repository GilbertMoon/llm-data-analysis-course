<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">VS Code에서 1장 Notebook을 열고 실행하는 흐름</title>
  <desc id="desc">프로젝트 폴더를 열고 notebooks 폴더에서 ch01_ai_data_analysis_intro.ipynb 파일을 열어 첫 번째 셀을 실행하는 순서를 단계별로 설명하는 그림</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: 'Malgun Gothic','맑은 고딕','Pretendard','Noto Sans KR',sans-serif; }
      .bg { fill:#f8fafc; }
      .title { font-size:38px; font-weight:900; fill:#ffffff; }
      .subtitle { font-size:18px; font-weight:600; fill:#dbeafe; }
      .stepCard { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; rx:24; filter:url(#shadow); }
      .stepNo { fill:#2563eb; }
      .stepNoText { font-size:20px; font-weight:900; fill:#ffffff; }
      .stepTitle { font-size:24px; font-weight:900; fill:#0f172a; }
      .stepText { font-size:18px; font-weight:600; fill:#334155; }
      .stepSub { font-size:16px; font-weight:600; fill:#64748b; }
      .ui { fill:#0f172a; stroke:#334155; stroke-width:2; rx:18; }
      .panel { fill:#111827; stroke:#1f2937; stroke-width:2; rx:16; }
      .panel2 { fill:#ffffff; stroke:#93c5fd; stroke-width:2; rx:14; }
      .accent { fill:#eff6ff; stroke:#93c5fd; stroke-width:2; rx:12; }
      .badge { fill:#dbeafe; stroke:#60a5fa; stroke-width:1.5; rx:10; }
      .tiny { font-size:14px; font-weight:700; fill:#475569; }
      .mid { font-size:16px; font-weight:700; fill:#0f172a; }
      .small { font-size:15px; font-weight:600; fill:#334155; }
      .code { font-family:'Malgun Gothic','맑은 고딕','Consolas','D2Coding',monospace; font-size:16px; font-weight:700; fill:#0f172a; }
      .arrowPath { fill:none; stroke:#2563eb; stroke-width:4; marker-end:url(#arrow); }
      .note { fill:#ecfeff; stroke:#67e8f9; stroke-width:2; rx:18; }
      .noteText { font-size:18px; font-weight:800; fill:#155e75; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="920" rx="28"/>
  <rect x="50" y="40" width="1500" height="100" fill="url(#header)" rx="26"/>
  <text x="90" y="98" class="title">VS Code에서 1장 Notebook을 열고 실행하는 흐름</text>
  <text x="90" y="128" class="subtitle">Explorer에서 파일을 열고, 커널을 선택한 뒤, 첫 번째 셀을 실행해 정상 동작을 확인합니다.</text>

  <rect x="70" y="190" width="690" height="270" class="stepCard"/>
  <circle cx="120" cy="240" r="26" class="stepNo"/><text x="120" y="247" text-anchor="middle" class="stepNoText">1</text>
  <text x="165" y="248" class="stepTitle">프로젝트 폴더와 Notebook 파일 열기</text>
  <text x="100" y="290" class="stepText">Explorer에서 <tspan font-weight="900">notebooks</tspan> 폴더를 열고</text>
  <text x="100" y="318" class="stepText"><tspan font-weight="900">ch01_ai_data_analysis_intro.ipynb</tspan> 파일을 클릭합니다.</text>
  <rect x="420" y="255" width="280" height="150" class="panel"/>
  <text x="445" y="285" class="tiny" fill="#e5e7eb">EXPLORER</text>
  <rect x="445" y="302" width="220" height="28" class="badge"/>
  <text x="457" y="321" class="small">notebooks/</text>
  <rect x="462" y="338" width="205" height="36" fill="#1d4ed8" rx="10"/>
  <text x="475" y="361" class="small" fill="#ffffff">ch01_ai_data_analysis_intro.ipynb</text>
  <text x="100" y="372" class="stepSub">파일이 열리면 상단 탭에 Notebook 이름이 보입니다.</text>

  <rect x="840" y="190" width="690" height="270" class="stepCard"/>
  <circle cx="890" cy="240" r="26" class="stepNo"/><text x="890" y="247" text-anchor="middle" class="stepNoText">2</text>
  <text x="935" y="248" class="stepTitle">첫 실행 시 커널을 선택합니다</text>
  <text x="870" y="290" class="stepText">오른쪽 위 <tspan font-weight="900">Select Kernel</tspan> 또는 첫 셀 실행 시 나타나는</text>
  <text x="870" y="318" class="stepText">목록에서 <tspan font-weight="900">Python Environments...</tspan> → <tspan font-weight="900">.venv</tspan>를 선택합니다.</text>
  <rect x="1160" y="248" width="300" height="150" class="panel2"/>
  <text x="1188" y="284" class="mid">Select Kernel</text>
  <rect x="1186" y="304" width="246" height="34" fill="#dbeafe" rx="8"/>
  <text x="1198" y="327" class="small">Python Environments...</text>
  <rect x="1186" y="345" width="246" height="34" fill="#eff6ff" rx="8"/>
  <text x="1198" y="368" class="small">.venv (Python 3.11.x)</text>
  <text x="870" y="372" class="stepSub">터미널에 (.venv)가 보여도 Notebook 커널은 별도로 선택해야 합니다.</text>

  <rect x="70" y="500" width="690" height="270" class="stepCard"/>
  <circle cx="120" cy="550" r="26" class="stepNo"/><text x="120" y="557" text-anchor="middle" class="stepNoText">3</text>
  <text x="165" y="558" class="stepTitle">첫 번째 셀을 실행합니다</text>
  <text x="100" y="598" class="stepText">Notebook의 첫 코드 셀은 import와 기본 경로 설정입니다.</text>
  <rect x="92" y="618" width="640" height="120" class="accent"/>
  <text x="112" y="648" class="code">from pathlib import Path</text>
  <text x="112" y="676" class="code">import pandas as pd</text>
  <text x="112" y="704" class="code">DATA_DIR = Path('../data/raw')</text>
  <text x="525" y="704" class="code">sns.set_theme(style='whitegrid')</text>
  <text x="100" y="760" class="stepSub">셀 왼쪽의 실행 버튼(▶) 또는 Shift+Enter로 실행합니다.</text>

  <rect x="840" y="500" width="690" height="270" class="stepCard"/>
  <circle cx="890" cy="550" r="26" class="stepNo"/><text x="890" y="557" text-anchor="middle" class="stepNoText">4</text>
  <text x="935" y="558" class="stepTitle">성공 메시지와 다음 단계 확인</text>
  <text x="870" y="598" class="stepText">초록 체크 표시가 보이면 정상 실행입니다.</text>
  <text x="870" y="626" class="stepText">처음에는 <tspan font-weight="900">Matplotlib is building the font cache</tspan></text>
  <text x="870" y="654" class="stepText">메시지가 잠깐 보일 수 있는데 오류가 아니라 정상 동작입니다.</text>
  <rect x="1160" y="606" width="310" height="96" class="panel2"/>
  <text x="1185" y="638" class="small">✓ 30.8s</text>
  <text x="1185" y="666" class="small">Matplotlib is building the font cache;</text>
  <text x="1185" y="690" class="small">this may take a moment.</text>

  <path d="M 760 325 C 805 325, 805 325, 840 325" class="arrowPath"/>
  <path d="M 1185 460 C 1185 480, 1185 490, 1185 500" class="arrowPath"/>
  <path d="M 760 635 C 805 635, 805 635, 840 635" class="arrowPath"/>

  <rect x="240" y="815" width="1120" height="56" class="note"/>
  <text x="800" y="850" text-anchor="middle" class="noteText">핵심: Explorer에서 Notebook을 열고 → .venv 커널을 선택하고 → 첫 셀을 실행해 초록 체크를 확인합니다.</text>
</svg>