<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">Notebook 커널 선택 가이드</title>
  <desc id="desc">VS Code의 Select Kernel 화면에서 Python Environments를 선택하고 프로젝트의 .venv 환경을 고르는 방법과 피해야 할 선택지를 설명하는 그림</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      text { font-family:'Malgun Gothic','맑은 고딕','Pretendard','Noto Sans KR',sans-serif; }
      .bg { fill:#f8fafc; }
      .title { font-size:38px; font-weight:900; fill:#ffffff; }
      .subtitle { font-size:18px; font-weight:600; fill:#dbeafe; }
      .panel { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; rx:22; filter:url(#shadow); }
      .panelDark { fill:#0f172a; stroke:#1e293b; stroke-width:2; rx:22; }
      .main { font-size:28px; font-weight:900; fill:#0f172a; }
      .text { font-size:18px; font-weight:600; fill:#334155; }
      .good { fill:#ecfdf5; stroke:#86efac; stroke-width:2; rx:16; }
      .bad { fill:#fef2f2; stroke:#fca5a5; stroke-width:2; rx:16; }
      .goodText { font-size:18px; font-weight:800; fill:#166534; }
      .badText { font-size:18px; font-weight:800; fill:#991b1b; }
      .option { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.5; rx:12; }
      .selected { fill:#dbeafe; stroke:#60a5fa; stroke-width:2; rx:12; }
      .ok { fill:#2563eb; }
      .okText { font-size:18px; font-weight:800; fill:#ffffff; }
      .small { font-size:16px; font-weight:700; fill:#475569; }
      .caption { font-size:16px; font-weight:700; fill:#64748b; }
      .mono { font-family:'Malgun Gothic','맑은 고딕','Consolas','D2Coding',monospace; font-size:17px; font-weight:700; fill:#0f172a; }
      .note { fill:#fff7ed; stroke:#fdba74; stroke-width:2; rx:16; }
      .noteText { font-size:18px; font-weight:800; fill:#9a3412; }
    </style>
  </defs>
  <rect class="bg" width="1500" height="860" rx="28"/>
  <rect x="50" y="40" width="1400" height="100" fill="url(#header)" rx="26"/>
  <text x="90" y="98" class="title">Notebook 커널 선택 가이드</text>
  <text x="90" y="128" class="subtitle">초보자가 가장 많이 헷갈리는 부분은 터미널 가상환경과 Notebook 커널이 서로 다를 수 있다는 점입니다.</text>

  <rect x="70" y="185" width="760" height="560" class="panel"/>
  <text x="110" y="235" class="main">1) Select Kernel 화면에서 이렇게 선택합니다</text>
  <rect x="110" y="270" width="680" height="390" class="panelDark"/>
  <text x="140" y="315" class="small" fill="#e2e8f0">Select Kernel</text>
  <rect x="138" y="338" width="624" height="42" fill="#111827" stroke="#334155" stroke-width="1.5" rx="8"/>
  <text x="155" y="366" class="small" fill="#94a3b8">Type to choose a kernel source</text>
  <rect x="138" y="400" width="624" height="48" class="selected"/>
  <text x="160" y="431" class="text">Python Environments...</text>
  <rect x="138" y="456" width="624" height="48" class="option"/>
  <text x="160" y="487" class="text">Existing Jupyter Server...</text>
  <text x="140" y="540" class="caption" fill="#cbd5e1">Python Environments를 누른 뒤 아래 목록에서 프로젝트의 .venv를 선택</text>
  <rect x="138" y="570" width="624" height="52" class="selected"/>
  <text x="160" y="603" class="text">.venv (3.11.x) (Python 3.11.x)</text>
  <text x="160" y="630" class="caption" fill="#cbd5e1">경로 예시: .venv\Scripts\python.exe</text>

  <rect x="880" y="185" width="550" height="270" class="good"/>
  <text x="920" y="235" class="goodText">선택해야 하는 것</text>
  <rect x="920" y="265" width="430" height="56" fill="#ffffff" stroke="#86efac" stroke-width="2" rx="12"/>
  <text x="945" y="300" class="mono">.venv\Scripts\python.exe</text>
  <text x="920" y="350" class="text">이 환경은 현재 프로젝트용 가상환경입니다.</text>
  <text x="920" y="378" class="text">requirements.txt로 설치한 패키지를 그대로 사용합니다.</text>
  <rect x="920" y="405" width="130" height="34" class="ok" rx="10"/>
  <text x="985" y="428" text-anchor="middle" class="okText">권장 선택</text>

  <rect x="880" y="475" width="550" height="270" class="bad"/>
  <text x="920" y="525" class="badText">지금은 선택하지 않는 것이 좋은 것</text>
  <text x="920" y="570" class="text">- base (Anaconda)</text>
  <text x="920" y="600" class="text">- Python 3.x Global Env</text>
  <text x="920" y="630" class="text">- Existing Jupyter Server...</text>
  <text x="920" y="675" class="text">이 환경들은 다른 프로젝트용이거나 외부 서버용일 수 있어</text>
  <text x="920" y="703" class="text">패키지 불일치, 경로 혼동, ModuleNotFoundError가 발생할 수 있습니다.</text>

  <rect x="140" y="775" width="1220" height="48" class="note"/>
  <text x="750" y="807" text-anchor="middle" class="noteText">터미널에 (.venv)가 보이는 것만으로 충분하지 않습니다. Notebook 오른쪽 위 커널도 반드시 .venv로 맞춰야 합니다.</text>
</svg>