<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Airflow 파이프라인 모니터링과 재시도 흐름</title>
  <desc id="desc">Airflow에서 파이프라인 실행 상태를 모니터링하고 실패 Task 로그 확인, 원인 수정, 재실행, 결과 검증까지 이어지는 흐름</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#ffedd5}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.task{stroke-width:2.5;filter:url(#shadow)}.success{fill:#ecfdf5;stroke:#22c55e}.fail{fill:#fff7ed;stroke:#f97316}.wait{fill:#f1f5f9;stroke:#94a3b8}.main{font-size:22px;font-weight:900;fill:#0f172a}.item{font-size:17px;font-weight:700;fill:#334155}.status{font-size:15px;font-weight:900}.green{fill:#166534}.orange{fill:#9a3412}.gray{fill:#64748b}.arr{fill:none;stroke:#ea580c;stroke-width:4;stroke-dasharray:8 8;marker-end:url(#arrow)}.log{fill:#0f172a;stroke:#334155;stroke-width:2;filter:url(#shadow)}.code{font-family:'D2Coding','Consolas',monospace;font-size:16px;font-weight:650;fill:#e2e8f0}.note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1600" height="700" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">Airflow 파이프라인 모니터링과 재시도 흐름</text>
  <text class="sub" x="86" y="118">실패 지점을 확인하고 필요한 Task만 다시 실행할 수 있다는 점이 Airflow의 장점입니다</text>

  <g transform="translate(85 165)">
    <rect class="panel" width="900" height="390" rx="28"/>
    <text class="main" x="34" y="52">Airflow UI 실행 상태</text>
    <g transform="translate(45 95)"><rect class="task success" width="245" height="70" rx="18"/><text class="item" x="24" y="30">check_input_files</text><text class="status green" x="24" y="53">success</text></g>
    <g transform="translate(325 95)"><rect class="task success" width="245" height="70" rx="18"/><text class="item" x="24" y="30">run_preprocessing</text><text class="status green" x="24" y="53">success</text></g>
    <g transform="translate(605 95)"><rect class="task fail" width="245" height="70" rx="18"/><text class="item" x="24" y="30">run_analysis</text><text class="status orange" x="24" y="53">failed</text></g>
    <g transform="translate(45 205)"><rect class="task wait" width="245" height="70" rx="18"/><text class="item" x="24" y="30">visualizations</text><text class="status gray" x="24" y="53">upstream failed</text></g>
    <g transform="translate(325 205)"><rect class="task wait" width="245" height="70" rx="18"/><text class="item" x="24" y="30">generate_report</text><text class="status gray" x="24" y="53">waiting</text></g>
    <g transform="translate(605 205)"><rect class="task wait" width="245" height="70" rx="18"/><text class="item" x="24" y="30">validate_outputs</text><text class="status gray" x="24" y="53">waiting</text></g>
    <text class="item" x="45" y="335">1. DAG 실행 시작 → 2. Task별 상태 확인 → 3. 실패 Task 선택</text>
  </g>

  <g transform="translate(1060 190)">
    <rect class="log" width="420" height="215" rx="24"/>
    <text class="code" x="28" y="50">[ERROR] run_analysis failed</text>
    <text class="code" x="28" y="90">File not found:</text>
    <text class="code" x="28" y="125">reports/ch14_daily_sales.csv</text>
    <text class="code" x="28" y="165">Check input and rerun task</text>
  </g>
  <g transform="translate(1050 450)">
    <rect class="panel" width="440" height="110" rx="24"/>
    <text class="main" x="30" y="42">수정 후 재실행</text>
    <text class="item" x="30" y="78">로그 확인 → 원인 수정 → 실패 Task 재실행</text>
  </g>
  <path class="arr" d="M1260 450 C1260 390 1220 370 1190 405"/>

  <rect class="note" x="330" y="625" width="940" height="38" rx="14"/>
  <text class="noteText" x="800" y="651" text-anchor="middle">모니터링의 핵심은 전체를 다시 실행하기보다 실패 지점을 정확히 찾는 것입니다</text>
</svg>