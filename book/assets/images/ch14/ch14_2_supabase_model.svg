<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="1400" height="800" fill="#ffffff"/>
<style>
.t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#16324f}
.title{font-size:40px;font-weight:700}
.sub{font-size:22px;font-weight:600}
.h{font-size:23px;font-weight:700}
.b{font-size:18px;font-weight:500}
.s{font-size:15px;font-weight:500}
.box{fill:#f7fbff;stroke:#7eb3df;stroke-width:2}
.box2{fill:#f2fbf8;stroke:#6fc2a7;stroke-width:2}
.box3{fill:#f8f4ff;stroke:#aa91df;stroke-width:2}
.note{fill:#fff8df;stroke:#e7c75c;stroke-width:2}
.arrow{stroke:#2f78b7;stroke-width:5;fill:none;marker-end:url(#a)}
.arrow2{stroke:#2a9d78;stroke-width:5;fill:none;marker-end:url(#b)}
</style>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f78b7"/></marker>
<marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d78"/></marker>
</defs>
<text x="70" y="72" class="t title">Supabase 데이터 모델</text>
<rect x="70" y="98" width="1260" height="58" rx="20" fill="#eaf5ff"/>
<text x="700" y="136" text-anchor="middle" class="t sub">수집 원천과 역할을 분리해 저장하고 지역을 공통 기준으로 연결합니다</text>
<rect x="90" y="220" width="240" height="160" rx="22" class="box3"/>
<text x="210" y="260" text-anchor="middle" class="t h">regions</text><text x="120" y="302" class="t s">region_code</text><text x="120" y="330" class="t s">region_name</text><text x="120" y="358" class="t s">center_lat / lng</text>

<rect x="430" y="190" width="270" height="190" rx="22" class="box2"/>
<text x="565" y="232" text-anchor="middle" class="t h">tourism_demand</text><text x="455" y="272" class="t s">reference_date</text><text x="455" y="300" class="t s">region_code</text><text x="455" y="328" class="t s">stay_strength</text><text x="455" y="356" class="t s">consumption_strength</text>

<rect x="430" y="430" width="270" height="190" rx="22" class="box"/>
<text x="565" y="472" text-anchor="middle" class="t h">local_places</text><text x="455" y="512" class="t s">place_id · region_code</text><text x="455" y="540" class="t s">category · name</text><text x="455" y="568" class="t s">address · latitude · longitude</text><text x="455" y="596" class="t s">updated_at</text>

<rect x="790" y="190" width="260" height="170" rx="22" class="box"/>
<text x="920" y="232" text-anchor="middle" class="t h">naver_trend</text><text x="815" y="272" class="t s">reference_date</text><text x="815" y="300" class="t s">keyword</text><text x="815" y="328" class="t s">ratio</text>

<rect x="790" y="430" width="260" height="190" rx="22" class="box3"/>
<text x="920" y="472" text-anchor="middle" class="t h">ai_region_analysis</text><text x="815" y="512" class="t s">analysis_date</text><text x="815" y="540" class="t s">region_code</text><text x="815" y="568" class="t s">summary · limitations</text><text x="815" y="596" class="t s">provider · model</text>

<rect x="1125" y="305" width="210" height="190" rx="22" class="box2"/>
<text x="1230" y="347" text-anchor="middle" class="t h">collection_runs</text><text x="1150" y="387" class="t s">run_id · source</text><text x="1150" y="415" class="t s">status</text><text x="1150" y="443" class="t s">row_count</text><text x="1150" y="471" class="t s">started_at · finished_at</text>

<path d="M330 285 L430 285" class="arrow"/><path d="M330 325 L430 515" class="arrow"/><path d="M330 345 L790 525" class="arrow"/>
<rect x="285" y="670" width="830" height="62" rx="22" class="note"/><text x="700" y="709" text-anchor="middle" class="t b">Supabase를 처음부터 운영 DB로 사용하고 CSV는 Seed 또는 보조 파일로만 사용합니다.</text></svg>