<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840">
<rect width="1400" height="840" fill="#fff"/>
<style>.t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#16324f}.title{font-size:40px;font-weight:700}.sub{font-size:21px;font-weight:600}.h{font-size:22px;font-weight:700}.s{font-size:14px;font-weight:500}.b1{fill:#f7fbff;stroke:#7eb3df;stroke-width:2}.b2{fill:#f2fbf8;stroke:#6fc2a7;stroke-width:2}.b3{fill:#f8f4ff;stroke:#aa91df;stroke-width:2}.note{fill:#fff8df;stroke:#e7c75c;stroke-width:2}.a{stroke:#2f78b7;stroke-width:4;fill:none;marker-end:url(#m)}.ag{stroke:#2a9d78;stroke-width:4;fill:none;marker-end:url(#g)}</style>
<defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2f78b7"/></marker><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2a9d78"/></marker></defs>
<text x="70" y="70" class="t title">Supabase 데이터 모델 · Raw와 정제 데이터 분리</text>
<rect x="70" y="96" width="1260" height="58" rx="18" fill="#eaf5ff"/><text x="700" y="133" text-anchor="middle" class="t sub">Raw 4개를 한 행에 저장하고 Trigger가 3개 정제 테이블로 나눠 처리합니다</text>

<rect x="50" y="190" width="350" height="330" rx="24" class="b3"/><text x="225" y="232" text-anchor="middle" class="t h">raw_api_data</text><text x="80" y="275" class="t s">id · run_id · source</text><text x="80" y="305" class="t s">naver_trend_raw</text><text x="80" y="335" class="t s">tourism_demand_raw</text><text x="80" y="365" class="t s">tourism_consumption_raw</text><text x="80" y="395" class="t s">naver_local_raw</text><text x="80" y="438" class="t s">process_status</text><text x="80" y="468" class="t s">processed_at · error_message</text>

<path d="M400 275 L490 245" class="ag"/><path d="M400 365 L490 405" class="ag"/><path d="M400 455 L490 585" class="ag"/>
<rect x="490" y="170" width="300" height="175" rx="22" class="b1"/><text x="640" y="212" text-anchor="middle" class="t h">naver_trend</text><text x="520" y="252" class="t s">raw_id → raw_api_data.id</text><text x="520" y="282" class="t s">reference_date · keyword</text><text x="520" y="312" class="t s">ratio · collected_at</text>
<rect x="490" y="375" width="300" height="190" rx="22" class="b2"/><text x="640" y="417" text-anchor="middle" class="t h">tourism_demand</text><text x="520" y="457" class="t s">raw_id → raw_api_data.id</text><text x="520" y="487" class="t s">reference_date · region_code</text><text x="520" y="517" class="t s">stay_strength · consumption_strength</text>
<rect x="490" y="595" width="300" height="190" rx="22" class="b1"/><text x="640" y="637" text-anchor="middle" class="t h">local_places</text><text x="520" y="677" class="t s">raw_id → raw_api_data.id</text><text x="520" y="707" class="t s">name · category · address</text><text x="520" y="737" class="t s">longitude · latitude · source_link</text>

<rect x="900" y="210" width="250" height="180" rx="22" class="b3"/><text x="1025" y="252" text-anchor="middle" class="t h">ai_region_analysis</text><text x="930" y="295" class="t s">정제 데이터만 입력</text><text x="930" y="325" class="t s">summary · limitations</text><text x="930" y="355" class="t s">provider · model</text>
<rect x="900" y="450" width="250" height="180" rx="22" class="b2"/><text x="1025" y="492" text-anchor="middle" class="t h">regions</text><text x="930" y="535" class="t s">region_code</text><text x="930" y="565" class="t s">region_name</text><text x="930" y="595" class="t s">center_lat / center_lng</text>

<rect x="1200" y="315" width="155" height="190" rx="22" class="b2"/><text x="1277" y="357" text-anchor="middle" class="t h">Trigger</text><text x="1220" y="400" class="t s">AFTER INSERT</text><text x="1220" y="430" class="t s">3 Functions</text><text x="1220" y="460" class="t s">PROCESSED</text><text x="1220" y="485" class="t s">or ERROR</text>

<rect x="275" y="790" width="850" height="40" rx="18" class="note"/><text x="700" y="817" text-anchor="middle" class="t s">raw_id를 남기면 Dashboard에 보이는 값과 장소가 어떤 API 원본에서 생성됐는지 역추적할 수 있습니다.</text>
</svg>