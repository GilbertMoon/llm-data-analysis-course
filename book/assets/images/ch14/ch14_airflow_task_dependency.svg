<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Airflow Task 의존성과 재시도 흐름</title>
  <desc id="desc">여섯 개의 Airflow Task가 의존성 순서대로 실행되고, run_analysis 실패를 예로 로그 확인, 원인 수정, 재시도와 파이프라인 중단 흐름을 설명하는 개념도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/>
    </marker>
    <style>
      text{font-family:'NanumSquare','NanumGothic','Noto Sans CJK KR','Malgun Gothic',sans-serif}
      .bg{fill:#f8fafc}
      .title{font-size:46px;font-weight:800;fill:#0f2d4d}
      .subtitle{font-size:22px;font-weight:500;fill:#475569}
      .section{font-size:18px;font-weight:800;fill:#334155}
      .guide{fill:#eef2ff;stroke:#c4b5fd;stroke-width:2}
      .guideTitle{font-size:21px;font-weight:800;fill:#4c1d95}
      .pill{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .pillText{font-size:15px;font-weight:750;fill:#334155}
      .card{fill:#fff;stroke-width:2.2}
      .blue{stroke:#93c5fd}.green{stroke:#86efac}.amber{stroke:#fcd34d}.purple{stroke:#d8b4fe}.rose{stroke:#fda4af}.cyan{stroke:#67e8f9}
      .num{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.2}
      .numText{font-size:14px;font-weight:800;fill:#2563eb}
      .statusOk{fill:#ecfdf5;stroke:#86efac;stroke-width:1.4}
      .task{font-family:'NanumGothicCoding','Noto Sans Mono CJK KR','D2Coding','Consolas',monospace;font-size:16px;font-weight:800;fill:#0f172a}
      .taskSmall{font-family:'NanumGothicCoding','Noto Sans Mono CJK KR','D2Coding','Consolas',monospace;font-size:14.5px;font-weight:800;fill:#0f172a}
      .desc{font-size:15px;font-weight:550;fill:#475569}
      .order{font-size:13px;font-weight:750;fill:#64748b}
      .flow{fill:none;stroke:#64748b;stroke-width:3.5;marker-end:url(#arrow)}
      .flowGreen{fill:none;stroke:#059669;stroke-width:3.2;marker-end:url(#arrowGreen)}
      .flowOrange{fill:none;stroke:#ea580c;stroke-width:3.2;marker-end:url(#arrowOrange)}
      .flowRed{fill:none;stroke:#dc2626;stroke-width:3.2;marker-end:url(#arrowRed)}
      .retryBox{fill:#fff;stroke:#fdba74;stroke-width:2.2}
      .retryTitle{font-size:22px;font-weight:850;fill:#9a3412}
      .retryDesc{font-size:15px;font-weight:550;fill:#64748b}
      .step{fill:#fff7ed;stroke:#fdba74;stroke-width:1.5}
      .stepNum{font-size:13px;font-weight:850;fill:#c2410c}
      .stepText{font-size:15px;font-weight:750;fill:#7c2d12}
      .stopBox{fill:#fef2f2;stroke:#fca5a5;stroke-width:2}
      .stopTitle{font-size:20px;font-weight:850;fill:#b91c1c}
      .stopDesc{font-size:14px;font-weight:600;fill:#7f1d1d}
      .label{font-size:14px;font-weight:750}
      .note{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}
      .noteText{font-size:21px;font-weight:750;fill:#1e3a8a}
      .divider{stroke:#e2e8f0;stroke-width:1.4}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect x="40" y="22" width="1520" height="12" rx="6" fill="#2563eb"/>
  <text class="title" x="74" y="91">Airflow Task 의존성과 재시도 흐름</text>
  <text class="subtitle" x="74" y="128">성공한 Task만 다음 단계로 진행하고, 실패한 Task는 로그를 확인한 뒤 필요한 단계만 다시 실행합니다.</text>

  <text class="section" x="74" y="166">Airflow 실행 원칙</text>
  <rect class="guide" x="74" y="180" width="1452" height="62" rx="17"/>
  <text class="guideTitle" x="104" y="219">Task 상태</text>
  <rect class="pill" x="270" y="194" width="250" height="34" rx="17"/>
  <text class="pillText" x="395" y="216" text-anchor="middle">SUCCESS → 다음 Task 실행</text>
  <rect class="pill" x="545" y="194" width="250" height="34" rx="17"/>
  <text class="pillText" x="670" y="216" text-anchor="middle">FAILED → 로그 확인</text>
  <rect class="pill" x="820" y="194" width="270" height="34" rx="17"/>
  <text class="pillText" x="955" y="216" text-anchor="middle">UP_FOR_RETRY → 재시도</text>
  <rect class="pill" x="1115" y="194" width="375" height="34" rx="17"/>
  <text class="pillText" x="1302" y="216" text-anchor="middle">재시도 실패 → Pipeline Stop</text>

  <text class="section" x="74" y="278">Task 의존성 흐름</text>

  <path class="flow" d="M280 380 H310"/>
  <path class="flow" d="M530 380 H560"/>
  <path class="flow" d="M780 380 H810"/>
  <path class="flow" d="M1030 380 H1060"/>
  <path class="flow" d="M1280 380 H1310"/>

  <g transform="translate(60 300)">
    <rect class="card blue" width="220" height="160" rx="20"/>
    <rect class="num" x="14" y="14" width="38" height="26" rx="13"/><text class="numText" x="33" y="32" text-anchor="middle">01</text>
    <circle class="statusOk" cx="188" cy="27" r="14"/><polyline points="181,27 186,32 195,22" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="taskSmall" x="110" y="73" text-anchor="middle">check_input_files</text>
    <line class="divider" x1="18" y1="94" x2="202" y2="94"/>
    <text class="desc" x="110" y="121" text-anchor="middle">원본 CSV 확인</text>
    <text class="order" x="110" y="145" text-anchor="middle">입력 존재 시 다음 단계</text>
  </g>

  <g transform="translate(310 300)">
    <rect class="card green" width="220" height="160" rx="20"/>
    <rect class="num" x="14" y="14" width="38" height="26" rx="13"/><text class="numText" x="33" y="32" text-anchor="middle">02</text>
    <circle class="statusOk" cx="188" cy="27" r="14"/><polyline points="181,27 186,32 195,22" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="taskSmall" x="110" y="73" text-anchor="middle">run_preprocessing</text>
    <line class="divider" x1="18" y1="94" x2="202" y2="94"/>
    <text class="desc" x="110" y="121" text-anchor="middle">전처리 파일 생성</text>
    <text class="order" x="110" y="145" text-anchor="middle">성공 후 분석 실행</text>
  </g>

  <g transform="translate(560 300)">
    <rect class="card amber" width="220" height="160" rx="20"/>
    <rect class="num" x="14" y="14" width="38" height="26" rx="13"/><text class="numText" x="33" y="32" text-anchor="middle">03</text>
    <circle cx="188" cy="27" r="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/><text x="188" y="33" text-anchor="middle" font-size="17" font-weight="900" fill="#c2410c">!</text>
    <text class="task" x="110" y="73" text-anchor="middle">run_analysis</text>
    <line class="divider" x1="18" y1="94" x2="202" y2="94"/>
    <text class="desc" x="110" y="121" text-anchor="middle">매출 지표 계산</text>
    <text class="order" x="110" y="145" text-anchor="middle">실패 예시 Task</text>
  </g>

  <g transform="translate(810 300)">
    <rect class="card purple" width="220" height="160" rx="20"/>
    <rect class="num" x="14" y="14" width="38" height="26" rx="13"/><text class="numText" x="33" y="32" text-anchor="middle">04</text>
    <circle class="statusOk" cx="188" cy="27" r="14"/><polyline points="181,27 186,32 195,22" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="taskSmall" x="110" y="65" text-anchor="middle">generate_</text>
    <text class="taskSmall" x="110" y="83" text-anchor="middle">visualizations</text>
    <line class="divider" x1="18" y1="100" x2="202" y2="100"/>
    <text class="desc" x="110" y="126" text-anchor="middle">그래프 생성</text>
    <text class="order" x="110" y="148" text-anchor="middle">상위 Task 성공 후 실행</text>
  </g>

  <g transform="translate(1060 300)">
    <rect class="card rose" width="220" height="160" rx="20"/>
    <rect class="num" x="14" y="14" width="38" height="26" rx="13"/><text class="numText" x="33" y="32" text-anchor="middle">05</text>
    <circle class="statusOk" cx="188" cy="27" r="14"/><polyline points="181,27 186,32 195,22" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="taskSmall" x="110" y="73" text-anchor="middle">generate_report</text>
    <line class="divider" x1="18" y1="94" x2="202" y2="94"/>
    <text class="desc" x="110" y="121" text-anchor="middle">Markdown 보고서 생성</text>
    <text class="order" x="110" y="145" text-anchor="middle">그래프 완료 후 실행</text>
  </g>

  <g transform="translate(1310 300)">
    <rect class="card cyan" width="220" height="160" rx="20"/>
    <rect class="num" x="14" y="14" width="38" height="26" rx="13"/><text class="numText" x="33" y="32" text-anchor="middle">06</text>
    <circle class="statusOk" cx="188" cy="27" r="14"/><polyline points="181,27 186,32 195,22" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="taskSmall" x="110" y="73" text-anchor="middle">validate_outputs</text>
    <line class="divider" x1="18" y1="94" x2="202" y2="94"/>
    <text class="desc" x="110" y="121" text-anchor="middle">결과 파일 검증</text>
    <text class="order" x="110" y="145" text-anchor="middle">검증 완료 시 DAG 성공</text>
  </g>

  <path class="flowOrange" d="M670 460 V505"/>
  <text class="label" x="690" y="493" fill="#c2410c">실패 감지</text>

  <g transform="translate(395 520)">
    <rect class="retryBox" width="730" height="170" rx="22"/>
    <text class="retryTitle" x="28" y="38">실패 지점 처리 예시 · run_analysis</text>
    <text class="retryDesc" x="28" y="65">이후 Task는 실행하지 않고 실패한 단계의 원인을 확인합니다.</text>

    <rect class="step" x="26" y="88" width="145" height="48" rx="15"/>
    <text class="stepNum" x="42" y="108">01</text><text class="stepText" x="98" y="119" text-anchor="middle">실패 감지</text>
    <path class="flowOrange" d="M176 112 H205"/>
    <rect class="step" x="210" y="88" width="145" height="48" rx="15"/>
    <text class="stepNum" x="226" y="108">02</text><text class="stepText" x="282" y="119" text-anchor="middle">로그 확인</text>
    <path class="flowOrange" d="M360 112 H389"/>
    <rect class="step" x="394" y="88" width="145" height="48" rx="15"/>
    <text class="stepNum" x="410" y="108">03</text><text class="stepText" x="466" y="119" text-anchor="middle">원인 수정</text>
    <path class="flowOrange" d="M544 112 H573"/>
    <rect class="step" x="578" y="88" width="126" height="48" rx="15"/>
    <text class="stepNum" x="594" y="108">04</text><text class="stepText" x="647" y="119" text-anchor="middle">재시도</text>
  </g>

  <path class="flowGreen" d="M1099 632 H1150 V488 H920 V460"/>
  <text class="label" x="978" y="478" fill="#047857">재시도 성공 → 다음 Task</text>

  <g transform="translate(1185 548)">
    <rect class="stopBox" width="305" height="118" rx="20"/>
    <text class="stopTitle" x="152" y="38" text-anchor="middle">재시도 실패</text>
    <text class="stopDesc" x="152" y="66" text-anchor="middle">Pipeline Stop</text>
    <text class="stopDesc" x="152" y="92" text-anchor="middle">후속 Task 실행 차단</text>
  </g>
  <path class="flowRed" d="M1125 650 H1170"/>

  <rect class="note" x="220" y="785" width="1160" height="64" rx="20"/>
  <text class="noteText" x="800" y="825" text-anchor="middle">Task 의존성은 실행 순서를 보장하고, 실패한 단계 이후의 잘못된 실행을 차단합니다.</text>
</svg>