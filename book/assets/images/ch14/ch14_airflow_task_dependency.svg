<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="650" viewBox="0 0 1700 650" role="img" aria-labelledby="title desc">
  <title id="title">Airflow Task 의존성과 재시도 흐름</title>
  <desc id="desc">Airflow Task들이 순서대로 실행되고 실패 시 재시도되며 검증 완료로 이어지는 흐름</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <style>
      .bg{fill:#fffaf5}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:40px;font-weight:800;fill:#fff}.sub{font-size:19px;font-weight:600;fill:#ffedd5}
      .task{fill:#fff;stroke:#a78bfa;stroke-width:2.5;filter:url(#shadow)}.ok{fill:#ecfdf5;stroke:#22c55e;stroke-width:2}.warn{fill:#fff7ed;stroke:#fdba74;stroke-width:2.5;filter:url(#shadow)}.main{font-size:19px;font-weight:850;fill:#0f172a}.desc{font-size:14px;font-weight:650;fill:#64748b}.arr{fill:none;stroke:#7c3aed;stroke-width:4;marker-end:url(#arrow)}.retry{fill:none;stroke:#ea580c;stroke-width:4;stroke-dasharray:8 8;marker-end:url(#arrow)}.check{font-size:20px;font-weight:900;fill:#16a34a}.warnText{font-size:18px;font-weight:900;fill:#9a3412}.note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1700" height="650" rx="34"/>
  <rect class="h" x="55" y="38" width="1590" height="96" rx="28"/>
  <text class="title" x="92" y="96">Airflow Task 의존성과 재시도 흐름</text>
  <text class="sub" x="92" y="124">Task 의존성을 명확히 설정하면 실패 이후 작업이 잘못 실행되는 것을 막을 수 있습니다</text>

  <g transform="translate(75 225)"><rect class="task" width="235" height="95" rx="22"/><circle class="ok" cx="35" cy="35" r="17"/><text class="check" x="35" y="42" text-anchor="middle">✓</text><text class="main" x="68" y="42">check_input_files</text><text class="desc" x="24" y="72">입력 CSV 확인</text></g>
  <path class="arr" d="M320 272H375"/>
  <g transform="translate(390 225)"><rect class="task" width="235" height="95" rx="22"/><circle class="ok" cx="35" cy="35" r="17"/><text class="check" x="35" y="42" text-anchor="middle">✓</text><text class="main" x="68" y="42">run_preprocessing</text><text class="desc" x="24" y="72">전처리 스크립트</text></g>
  <path class="arr" d="M635 272H690"/>
  <g transform="translate(705 225)"><rect class="task" width="235" height="95" rx="22"/><circle class="ok" cx="35" cy="35" r="17"/><text class="check" x="35" y="42" text-anchor="middle">✓</text><text class="main" x="68" y="42">run_analysis</text><text class="desc" x="24" y="72">지표 계산</text></g>
  <path class="arr" d="M950 272H1005"/>
  <g transform="translate(1020 225)"><rect class="task" width="235" height="95" rx="22"/><circle class="ok" cx="35" cy="35" r="17"/><text class="check" x="35" y="42" text-anchor="middle">✓</text><text class="main" x="68" y="42">visualizations</text><text class="desc" x="24" y="72">그래프 생성</text></g>
  <path class="arr" d="M1265 272H1320"/>
  <g transform="translate(1335 225)"><rect class="task" width="235" height="95" rx="22"/><circle class="ok" cx="35" cy="35" r="17"/><text class="check" x="35" y="42" text-anchor="middle">✓</text><text class="main" x="68" y="42">generate_report</text><text class="desc" x="24" y="72">보고서 생성</text></g>

  <path class="arr" d="M1450 320 C1450 385 1320 398 1260 410"/>
  <g transform="translate(1040 435)"><rect class="task" width="260" height="95" rx="22"/><circle class="ok" cx="35" cy="35" r="17"/><text class="check" x="35" y="42" text-anchor="middle">✓</text><text class="main" x="68" y="42">validate_outputs</text><text class="desc" x="24" y="72">결과 파일 검증 완료</text></g>

  <g transform="translate(640 420)"><rect class="warn" width="300" height="95" rx="22"/><text class="warnText" x="32" y="40">실패 발생 시</text><text class="desc" x="32" y="72">retry → log 확인 → 수정</text></g>
  <path class="retry" d="M790 420 C740 360 770 330 820 320"/>
  <path class="retry" d="M790 515 C720 560 600 530 540 500"/>

  <rect class="note" x="365" y="585" width="970" height="38" rx="14"/>
  <text class="noteText" x="850" y="611" text-anchor="middle">성공하면 다음 Task로 진행하고, 실패하면 로그를 보고 필요한 단계만 다시 실행합니다</text>
</svg>