<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Airflow 기반 데이터 분석 파이프라인 전체 흐름도</title>
  <desc id="desc">원본 CSV 확인, 전처리, 분석, 시각화, 보고서 생성, 결과 검증을 Airflow DAG가 순서대로 실행하고 상태와 로그를 관리한 뒤 필요 시 외부로 전달하는 전체 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/>
    </marker>
    <style>
      text{font-family:'NanumSquare','NanumGothic','Noto Sans CJK KR','Malgun Gothic',sans-serif}
      .bg{fill:#f8fafc}
      .title{font-size:46px;font-weight:800;fill:#0f2d4d}
      .subtitle{font-size:22px;font-weight:500;fill:#475569}
      .section{font-size:17px;font-weight:800;fill:#334155}
      .airband{fill:#eef2ff;stroke:#c4b5fd;stroke-width:2}
      .airtitle{font-size:22px;font-weight:800;fill:#4c1d95}
      .pill{fill:#fff;stroke:#c4b5fd;stroke-width:1.5}
      .pillText{font-size:16px;font-weight:700;fill:#5b21b6}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .cardBlue{stroke:#93c5fd}.cardGreen{stroke:#86efac}.cardAmber{stroke:#fcd34d}.cardPurple{stroke:#d8b4fe}.cardRose{stroke:#fda4af}.cardCyan{stroke:#67e8f9}
      .num{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.2}
      .numText{font-size:14px;font-weight:800;fill:#2563eb}
      .cardTitle{font-size:21px;font-weight:800;fill:#0f172a}
      .task{font-family:'NanumGothicCoding','Noto Sans Mono CJK KR','D2Coding','Consolas',monospace;font-size:13px;font-weight:700;fill:#334155}
      .desc{font-size:15px;font-weight:500;fill:#475569}
      .out{font-size:14px;font-weight:700;fill:#0f2d4d}
      .badge{font-size:13px;font-weight:800}
      .arrow{fill:none;stroke:#64748b;stroke-width:3.5;marker-end:url(#arrow)}
      .arrowBlue{fill:none;stroke:#2563eb;stroke-width:3.5;marker-end:url(#arrowBlue)}
      .arrowOrange{fill:none;stroke:#ea580c;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrowOrange)}
      .divider{stroke:#e2e8f0;stroke-width:1.5}
      .ops{fill:#fff;stroke:#bfdbfe;stroke-width:2}
      .opsTitle{font-size:22px;font-weight:800;fill:#0f2d4d}
      .opsDesc{font-size:15px;font-weight:500;fill:#475569}
      .note{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}
      .noteText{font-size:21px;font-weight:750;fill:#1e3a8a}
      .small{font-size:13px;font-weight:600;fill:#64748b}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect x="40" y="22" width="1520" height="12" rx="6" fill="#2563eb"/>
  <text class="title" x="74" y="91">Airflow 기반 데이터 분석 파이프라인 전체 흐름</text>
  <text class="subtitle" x="74" y="128">분석 코드는 Task로 나누고, Airflow는 실행 순서·상태·실패 처리를 관리합니다.</text>

  <text class="section" x="74" y="166">Airflow DAG 운영 관리</text>
  <rect class="airband" x="74" y="180" width="1452" height="70" rx="18"/>
  <text class="airtitle" x="104" y="224">Airflow DAG</text>
  <rect class="pill" x="290" y="196" width="205" height="38" rx="19"/>
  <text class="pillText" x="392" y="220" text-anchor="middle">스케줄 실행</text>
  <rect class="pill" x="520" y="196" width="225" height="38" rx="19"/>
  <text class="pillText" x="632" y="220" text-anchor="middle">Task 의존성 관리</text>
  <rect class="pill" x="770" y="196" width="205" height="38" rx="19"/>
  <text class="pillText" x="872" y="220" text-anchor="middle">실패 감지·재시도</text>
  <rect class="pill" x="1000" y="196" width="205" height="38" rx="19"/>
  <text class="pillText" x="1102" y="220" text-anchor="middle">실행 로그 확인</text>
  <rect class="pill" x="1230" y="196" width="260" height="38" rx="19"/>
  <text class="pillText" x="1360" y="220" text-anchor="middle">성공·실패 상태 모니터링</text>

  <text class="section" x="74" y="290">분석 Task 흐름</text>

  <path class="arrow" d="M300 405 H325"/>
  <path class="arrow" d="M550 405 H575"/>
  <path class="arrow" d="M800 405 H825"/>
  <path class="arrow" d="M1050 405 H1075"/>
  <path class="arrow" d="M1300 405 H1325"/>

  <g transform="translate(74 310)">
    <rect class="card cardBlue" width="226" height="190" rx="20"/>
    <rect class="num" x="14" y="14" width="38" height="26" rx="13"/><text class="numText" x="33" y="32" text-anchor="middle">01</text>
    <g transform="translate(18 54)" stroke="#2563eb" stroke-width="2" fill="none">
      <rect x="0" y="0" width="44" height="52" rx="5"/><path d="M29 0v13h15"/><line x1="9" y1="23" x2="35" y2="23"/><line x1="9" y1="32" x2="35" y2="32"/><line x1="9" y1="41" x2="28" y2="41"/>
    </g>
    <text class="cardTitle" x="76" y="72">원본 CSV 확인</text>
    <text class="task" x="76" y="95">check_input_files</text>
    <line class="divider" x1="18" y1="116" x2="208" y2="116"/>
    <text class="desc" x="18" y="142">원본 파일 4개 존재 확인</text>
    <text class="out" x="18" y="168">data/raw/*.csv</text>
  </g>

  <g transform="translate(324 310)">
    <rect class="card cardGreen" width="226" height="190" rx="20"/>
    <rect class="num" x="14" y="14" width="38" height="26" rx="13"/><text class="numText" x="33" y="32" text-anchor="middle">02</text>
    <g transform="translate(18 55)" stroke="#059669" stroke-width="2" fill="none">
      <path d="M2 3h42L29 21v23l-12 6V21z"/><line x1="10" y1="11" x2="36" y2="11"/>
    </g>
    <text class="cardTitle" x="76" y="72">데이터 전처리</text>
    <text class="task" x="76" y="95">run_preprocessing</text>
    <line class="divider" x1="18" y1="116" x2="208" y2="116"/>
    <text class="desc" x="18" y="142">결측치·타입·중복 처리</text>
    <text class="out" x="18" y="168">processed/*_clean.csv</text>
  </g>

  <g transform="translate(574 310)">
    <rect class="card cardAmber" width="226" height="190" rx="20"/>
    <rect class="num" x="14" y="14" width="38" height="26" rx="13"/><text class="numText" x="33" y="32" text-anchor="middle">03</text>
    <g transform="translate(18 55)" stroke="#d97706" stroke-width="2" fill="none">
      <rect x="0" y="0" width="48" height="48" rx="5"/><line x1="0" y1="15" x2="48" y2="15"/><line x1="16" y1="15" x2="16" y2="48"/><line x1="32" y1="15" x2="32" y2="48"/><line x1="0" y1="31" x2="48" y2="31"/>
    </g>
    <text class="cardTitle" x="76" y="72">매출 지표 분석</text>
    <text class="task" x="76" y="95">run_analysis</text>
    <line class="divider" x1="18" y1="116" x2="208" y2="116"/>
    <text class="desc" x="18" y="142">일자별·카테고리별 집계</text>
    <text class="out" x="18" y="168">reports/*.csv</text>
  </g>

  <g transform="translate(824 310)">
    <rect class="card cardPurple" width="226" height="190" rx="20"/>
    <rect class="num" x="14" y="14" width="38" height="26" rx="13"/><text class="numText" x="33" y="32" text-anchor="middle">04</text>
    <g transform="translate(18 55)" stroke="#7c3aed" stroke-width="2" fill="none">
      <line x1="2" y1="48" x2="50" y2="48"/><line x1="2" y1="48" x2="2" y2="2"/><polyline points="8,39 19,28 29,33 40,16 49,22"/><circle cx="19" cy="28" r="2.5" fill="#7c3aed"/><circle cx="40" cy="16" r="2.5" fill="#7c3aed"/>
    </g>
    <text class="cardTitle" x="76" y="68">시각화 생성</text>
    <text class="task" x="76" y="89">generate_</text>
    <text class="task" x="76" y="104">visualizations</text>
    <line class="divider" x1="18" y1="122" x2="208" y2="122"/>
    <text class="desc" x="18" y="147">일자별 매출 그래프 생성</text>
    <text class="out" x="18" y="172">reports/figures/*.png</text>
  </g>

  <g transform="translate(1074 310)">
    <rect class="card cardRose" width="226" height="190" rx="20"/>
    <rect class="num" x="14" y="14" width="38" height="26" rx="13"/><text class="numText" x="33" y="32" text-anchor="middle">05</text>
    <g transform="translate(18 54)" stroke="#e11d48" stroke-width="2" fill="none">
      <rect x="0" y="0" width="44" height="52" rx="5"/><path d="M29 0v13h15"/><line x1="8" y1="24" x2="35" y2="24"/><line x1="8" y1="33" x2="35" y2="33"/><line x1="8" y1="42" x2="30" y2="42"/>
    </g>
    <text class="cardTitle" x="76" y="72">보고서 생성</text>
    <text class="task" x="76" y="95">generate_report</text>
    <line class="divider" x1="18" y1="116" x2="208" y2="116"/>
    <text class="desc" x="18" y="142">표·그래프·해석 자동 정리</text>
    <text class="out" x="18" y="168">ch14_airflow_report.md</text>
  </g>

  <g transform="translate(1324 310)">
    <rect class="card cardCyan" width="202" height="190" rx="20"/>
    <rect class="num" x="14" y="14" width="38" height="26" rx="13"/><text class="numText" x="33" y="32" text-anchor="middle">06</text>
    <g transform="translate(18 55)" stroke="#0891b2" stroke-width="2" fill="none">
      <rect x="0" y="0" width="44" height="48" rx="5"/><polyline points="8,15 14,21 25,9"/><line x1="29" y1="15" x2="38" y2="15"/><polyline points="8,32 14,38 25,26"/><line x1="29" y1="32" x2="38" y2="32"/>
    </g>
    <text class="cardTitle" x="72" y="72">결과 검증</text>
    <text class="task" x="72" y="95">validate_outputs</text>
    <line class="divider" x1="18" y1="116" x2="184" y2="116"/>
    <text class="desc" x="18" y="142">파일 존재·크기 확인</text>
    <text class="out" x="18" y="168">validation log</text>
  </g>

  <path class="arrowBlue" d="M1425 500 V550 H1125 V575"/>
  <text class="small" x="1270" y="540">검증 완료 후 운영 확인</text>

  <g transform="translate(850 575)">
    <rect class="ops" width="550" height="145" rx="22"/>
    <rect class="num" x="20" y="18" width="38" height="26" rx="13"/><text class="numText" x="39" y="36" text-anchor="middle">07</text>
    <text class="opsTitle" x="76" y="40">실행 상태·로그 확인</text>
    <text class="opsDesc" x="76" y="66">성공·실패 Task를 추적하고 실패 지점만 재실행합니다.</text>
    <rect x="24" y="88" width="145" height="34" rx="17" fill="#ecfdf5" stroke="#86efac"/>
    <text class="badge" x="96" y="110" text-anchor="middle" fill="#166534">SUCCESS</text>
    <rect x="184" y="88" width="145" height="34" rx="17" fill="#fff7ed" stroke="#fdba74"/>
    <text class="badge" x="256" y="110" text-anchor="middle" fill="#c2410c">RETRY</text>
    <rect x="344" y="88" width="180" height="34" rx="17" fill="#fef2f2" stroke="#fca5a5"/>
    <text class="badge" x="434" y="110" text-anchor="middle" fill="#b91c1c">FAILED · LOG</text>
  </g>

  <path class="arrow" d="M1405 648 H1430"/>
  <g transform="translate(1435 575)">
    <rect class="ops" width="91" height="145" rx="22"/>
    <rect class="num" x="12" y="18" width="38" height="26" rx="13"/><text class="numText" x="31" y="36" text-anchor="middle">08</text>
    <g transform="translate(20 58)" stroke="#2563eb" stroke-width="2" fill="none">
      <path d="M0 8h42v30H0z"/><polyline points="0,8 21,24 42,8"/>
    </g>
    <text class="small" x="45" y="112" text-anchor="middle">Make</text>
    <text class="small" x="45" y="130" text-anchor="middle">발송</text>
  </g>

  <path class="arrowOrange" d="M650 500 V650 H820"/>
  <text x="670" y="625" font-family="NanumSquare,NanumGothic,sans-serif" font-size="15" font-weight="700" fill="#c2410c">실패 시 로그 확인 후 해당 Task 재시도</text>

  <rect class="note" x="250" y="772" width="1100" height="66" rx="20"/>
  <text class="noteText" x="800" y="813" text-anchor="middle">반복 분석은 Task로 나누고, Airflow가 순서·상태·실패 지점을 관리하게 합니다.</text>
</svg>
