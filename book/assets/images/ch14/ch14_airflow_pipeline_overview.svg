<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="660" viewBox="0 0 1700 660" role="img" aria-labelledby="title desc">
  <title id="title">Airflow 기반 데이터 분석 파이프라인 전체 흐름도</title>
  <desc id="desc">온라인 쇼핑몰 데이터 분석 과정이 Airflow DAG로 자동 실행되는 전체 흐름</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:40px;font-weight:800;fill:#fff}.sub{font-size:19px;font-weight:600;fill:#e0e7ff}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.air{stroke:#c4b5fd}.ok{stroke:#86efac}.send{stroke:#93c5fd}.num{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.nt{font-size:16px;font-weight:900;fill:#2563eb}.main{font-size:19px;font-weight:850;fill:#0f172a}.desc{font-size:14px;font-weight:650;fill:#64748b}.arr{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#arrow)}.note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1700" height="660" rx="34"/>
  <rect class="h" x="55" y="38" width="1590" height="96" rx="28"/>
  <text class="title" x="92" y="96">Airflow 기반 데이터 분석 파이프라인</text>
  <text class="sub" x="92" y="124">Airflow는 분석 작업의 순서, 실행 상태, 실패 여부를 관리하는 파이프라인 도구입니다</text>

  <g transform="translate(70 185)"><rect class="node air" width="220" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">1</text><text class="main" x="62" y="42">원본 CSV 확인</text><text class="desc" x="24" y="74">입력 파일 존재 확인</text></g>
  <path class="arr" d="M300 235H345"/>
  <g transform="translate(360 185)"><rect class="node air" width="220" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">2</text><text class="main" x="62" y="42">데이터 전처리</text><text class="desc" x="24" y="74">clean CSV 생성</text></g>
  <path class="arr" d="M590 235H635"/>
  <g transform="translate(650 185)"><rect class="node air" width="220" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">3</text><text class="main" x="62" y="42">pandas 분석</text><text class="desc" x="24" y="74">매출 지표 계산</text></g>
  <path class="arr" d="M880 235H925"/>
  <g transform="translate(940 185)"><rect class="node air" width="220" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">4</text><text class="main" x="62" y="42">시각화 생성</text><text class="desc" x="24" y="74">그래프 이미지 저장</text></g>
  <path class="arr" d="M1170 235H1215"/>
  <g transform="translate(1230 185)"><rect class="node air" width="240" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">5</text><text class="main" x="62" y="42">Markdown 보고서</text><text class="desc" x="24" y="74">자동 보고서 생성</text></g>

  <path class="arr" d="M1350 285 C1350 350 1250 365 1200 375"/>
  <g transform="translate(1075 420)"><rect class="node ok" width="240" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">6</text><text class="main" x="62" y="42">결과 파일 검증</text><text class="desc" x="24" y="74">존재 여부와 크기 확인</text></g>
  <path class="arr" d="M1065 470H1010"/>
  <g transform="translate(745 420)"><rect class="node ok" width="240" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">7</text><text class="main" x="62" y="42">실행 로그 확인</text><text class="desc" x="24" y="74">성공·실패 Task 추적</text></g>
  <path class="arr" d="M735 470H680"/>
  <g transform="translate(415 420)"><rect class="node send" width="240" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">8</text><text class="main" x="62" y="42">Make 발송</text><text class="desc" x="24" y="74">필요 시 외부 전달</text></g>

  <rect class="note" x="350" y="585" width="1000" height="42" rx="14"/>
  <text class="noteText" x="850" y="613" text-anchor="middle">반복되는 분석은 Task 단위로 나누고 Airflow가 순서와 상태를 관리하게 합니다</text>
</svg>