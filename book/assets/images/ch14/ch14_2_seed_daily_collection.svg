<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="1400" height="800" fill="#fff"/>
<style>.t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#16324f}.title{font-size:40px;font-weight:700}.sub{font-size:22px;font-weight:600}.h{font-size:23px;font-weight:700}.b{font-size:18px;font-weight:600}.s{font-size:15px;font-weight:500}.b1{fill:#f7fbff;stroke:#7eb3df;stroke-width:2}.b2{fill:#f2fbf8;stroke:#6fc2a7;stroke-width:2}.b3{fill:#f8f4ff;stroke:#aa91df;stroke-width:2}.note{fill:#fff8df;stroke:#e7c75c;stroke-width:2}.a{stroke:#2f78b7;stroke-width:5;fill:none;marker-end:url(#m)}.ag{stroke:#2a9d78;stroke-width:5;fill:none;marker-end:url(#g)}</style>
<defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2f78b7"/></marker><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2a9d78"/></marker></defs>
<text x="70" y="72" class="t title">Seed와 일일 Batch를 분리하는 이유</text>
<rect x="70" y="98" width="1260" height="58" rx="20" fill="#eaf5ff"/><text x="700" y="136" text-anchor="middle" class="t sub">초기 화면용 데이터는 Seed, 매일 갱신은 Raw 저장 + DB Trigger로 처리합니다</text>

<rect x="110" y="225" width="500" height="360" rx="28" class="b1"/><text x="360" y="278" text-anchor="middle" class="t h">최초 1회 · Seed</text>
<rect x="180" y="330" width="360" height="90" rx="20" fill="#eaf5ff"/><text x="360" y="366" text-anchor="middle" class="t b">과거 관광 데이터 + 지도 장소 데이터</text><text x="360" y="397" text-anchor="middle" class="t s">Python + pandas로 검증 후 CSV</text>
<path d="M360 420 L360 475" class="a"/><rect x="230" y="475" width="260" height="78" rx="20" class="b3"/><text x="360" y="522" text-anchor="middle" class="t h">Supabase Import</text>

<rect x="790" y="225" width="500" height="360" rx="28" class="b2"/><text x="1040" y="278" text-anchor="middle" class="t h">운영 · 매일 1회</text>
<rect x="850" y="330" width="380" height="90" rx="20" fill="#eaf8f3"/><text x="1040" y="365" text-anchor="middle" class="t b">Make: HTTP 3개 + INSERT 1회</text><text x="1040" y="397" text-anchor="middle" class="t s">원본 문자열을 raw_api_data에 그대로 저장</text>
<path d="M1040 420 L1040 475" class="ag"/><rect x="880" y="475" width="320" height="78" rx="20" class="b3"/><text x="1040" y="507" text-anchor="middle" class="t h">Trigger + DB Functions</text><text x="1040" y="535" text-anchor="middle" class="t s">정제 · 결합 · Upsert</text>

<rect x="280" y="650" width="840" height="65" rx="22" class="note"/><text x="700" y="690" text-anchor="middle" class="t b">Make를 단순하게 유지하고, 반복 가능한 데이터 처리 로직은 Supabase에 둡니다.</text>
</svg>