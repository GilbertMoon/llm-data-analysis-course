<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="1400" height="800" fill="#ffffff"/>
<style>
.t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#16324f}
.title{font-size:40px;font-weight:700}
.sub{font-size:22px;font-weight:600}
.h{font-size:23px;font-weight:700}
.b{font-size:18px;font-weight:500}
.s{font-size:15px;font-weight:500}
.box{fill:#f7fbff;stroke:#7eb3df;stroke-width:2}
.box2{fill:#f2fbf8;stroke:#6fc2a7;stroke-width:2}
.box3{fill:#f8f4ff;stroke:#aa91df;stroke-width:2}
.note{fill:#fff8df;stroke:#e7c75c;stroke-width:2}
.arrow{stroke:#2f78b7;stroke-width:5;fill:none;marker-end:url(#a)}
.arrow2{stroke:#2a9d78;stroke-width:5;fill:none;marker-end:url(#b)}
</style>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f78b7"/></marker>
<marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d78"/></marker>
</defs>
<text x="70" y="72" class="t title">Seed 데이터와 매일 1회 수집</text>
<rect x="70" y="98" width="1260" height="58" rx="20" fill="#eaf5ff"/>
<text x="700" y="136" text-anchor="middle" class="t sub">초기 화면 개발용 데이터와 운영 중 갱신 데이터를 분리합니다</text>
<rect x="120" y="230" width="500" height="360" rx="28" class="box"/>
<text x="370" y="282" text-anchor="middle" class="t h">최초 1회 · Seed 적재</text>
<rect x="190" y="335" width="360" height="85" rx="20" fill="#eaf5ff"/><text x="370" y="370" text-anchor="middle" class="t b">과거 관광 데이터 + 초기 장소 데이터</text><text x="370" y="400" text-anchor="middle" class="t s">CSV 또는 준비된 Seed 파일</text>
<path d="M370 420 L370 475" class="arrow"/>
<rect x="250" y="475" width="240" height="75" rx="20" class="box3"/><text x="370" y="521" text-anchor="middle" class="t h">Supabase Import</text>

<rect x="780" y="230" width="500" height="360" rx="28" class="box2"/>
<text x="1030" y="282" text-anchor="middle" class="t h">운영 · 매일 1회 갱신</text>
<rect x="860" y="335" width="340" height="85" rx="20" fill="#eaf8f3"/><text x="1030" y="370" text-anchor="middle" class="t b">Make Scheduler</text><text x="1030" y="400" text-anchor="middle" class="t s">NAVER + 공공데이터 API</text>
<path d="M1030 420 L1030 475" class="arrow2"/>
<rect x="910" y="475" width="240" height="75" rx="20" class="box3"/><text x="1030" y="508" text-anchor="middle" class="t h">Supabase Upsert</text><text x="1030" y="535" text-anchor="middle" class="t s">새 데이터만 갱신</text>

<rect x="300" y="645" width="800" height="65" rx="22" class="note"/><text x="700" y="684" text-anchor="middle" class="t b">Seed = 초기 상태 만들기 · Make = 이후 데이터를 유지하고 갱신하기</text></svg>