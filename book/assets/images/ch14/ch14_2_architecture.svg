<text x="470" y="312" text-anchor="middle" class="t h">Make · 매일 1회</text><text x="470" y="347" text-anchor="middle" class="t s">HTTP 1 → HTTP 2 → HTTP 3</text><text x="470" y="377" text-anchor="middle" class="t s">→ Supabase Create a Row</text><text x="470" y="415" text-anchor="middle" class="t b">전처리하지 않음</text><text x="470" y="445" text-anchor="middle" class="t s">Iterator · Router · AI · pandas 없음</text>

<path d="M585 375 L655 375" class="ag"/>
<rect x="655" y="255" width="250" height="240" rx="24" class="b3"/>
<text x="780" y="300" text-anchor="middle" class="t h">raw_api_data</text><text x="780" y="334" text-anchor="middle" class="t s">naver_trend_raw</text><text x="780" y="362" text-anchor="middle" class="t s">tourism_demand_raw</text><text x="780" y="390" text-anchor="middle" class="t s">tourism_consumption_raw</text><text x="780" y="432" text-anchor="middle" class="t b">AFTER INSERT Trigger</text><text x="780" y="462" text-anchor="middle" class="t s">원본 보존 후 서버단 자동 처리</text>

<path d="M905 375 L975 375" class="ag"/>
<rect x="975" y="245" width="260" height="255" rx="24" class="b2"/>
<text x="1105" y="288" text-anchor="middle" class="t h">PostgreSQL Functions</text><text x="1105" y="325" text-anchor="middle" class="t s">NAVER JSON → naver_trend</text><text x="1105" y="355" text-anchor="middle" class="t s">체류 26 + 소비 26 결합</text><text x="1105" y="385" text-anchor="middle" class="t s">→ tourism_demand 26</text><text x="1105" y="425" text-anchor="middle" class="t b">검증 · Upsert · 상태 기록</text><text x="1105" y="458" text-anchor="middle" class="t s">PROCESSED / ERROR</text>

<path d="M1105 500 L1105 565" class="a"/>
