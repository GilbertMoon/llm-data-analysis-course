<path d="M1245 617 L1310 617" class="a"/><rect x="1310" y="575" width="80" height="85" rx="20" class="b2"/><text x="1350" y="612" text-anchor="middle" class="t b">Vercel</text><text x="1350" y="638" text-anchor="middle" class="t s">배포</text>

<rect x="70" y="690" width="800" height="72" rx="20" class="note"/><text x="470" y="720" text-anchor="middle" class="t b">지도 장소 데이터(local_places)는 초기 Seed 또는 별도 보강 수집으로 분리</text><text x="470" y="747" text-anchor="middle" class="t s">NAVER Local의 반복 검색을 핵심 일일 Batch에 섞지 않아 Make 복잡도를 낮춥니다.</text>
