<defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2f78b7"/></marker><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2a9d78"/></marker></defs>
<text x="70" y="68" class="t title">Chapter 14-2 최종 아키텍처</text>
<rect x="70" y="92" width="1260" height="58" rx="18" fill="#eaf5ff"/>
<text x="700" y="129" text-anchor="middle" class="t sub">Make는 수집과 Raw 저장만, 정리·결합·Upsert는 Supabase Trigger와 PostgreSQL Function이 담당합니다</text>

<rect x="55" y="210" width="220" height="90" rx="20" class="b1"/><text x="165" y="248" text-anchor="middle" class="t h">NAVER Trend</text><text x="165" y="278" text-anchor="middle" class="t s">검색 관심도</text>
