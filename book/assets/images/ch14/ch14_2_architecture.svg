<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840">
<rect width="1400" height="840" fill="#ffffff"/>
<style>
.t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#16324f}.title{font-size:38px;font-weight:700}.sub{font-size:20px;font-weight:600}.h{font-size:21px;font-weight:700}.b{font-size:17px;font-weight:600}.s{font-size:14px;font-weight:500}
.b1{fill:#f7fbff;stroke:#7eb3df;stroke-width:2}.b2{fill:#f2fbf8;stroke:#6fc2a7;stroke-width:2}.b3{fill:#f8f4ff;stroke:#aa91df;stroke-width:2}.note{fill:#fff8df;stroke:#e7c75c;stroke-width:2}
.a{stroke:#2f78b7;stroke-width:4;fill:none;marker-end:url(#m)}.ag{stroke:#2a9d78;stroke-width:4;fill:none;marker-end:url(#g)}
</style>
<defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2f78b7"/></marker><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2a9d78"/></marker></defs>
<text x="70" y="68" class="t title">Chapter 14-2 최종 아키텍처</text>
<rect x="70" y="92" width="1260" height="58" rx="18" fill="#eaf5ff"/>
<text x="700" y="129" text-anchor="middle" class="t sub">Make는 HTTP 4개와 Raw INSERT 1회만, 정리·결합·Upsert는 Supabase Trigger가 담당합니다</text>

<rect x="45" y="190" width="225" height="82" rx="20" class="b1"/><text x="157" y="225" text-anchor="middle" class="t h">HTTP 1 · NAVER Trend</text><text x="157" y="252" text-anchor="middle" class="t s">검색 관심도</text>
<rect x="45" y="292" width="225" height="82" rx="20" class="b1"/><text x="157" y="327" text-anchor="middle" class="t h">HTTP 2 · 체류강도</text><text x="157" y="354" text-anchor="middle" class="t s">관광공사</text>
<rect x="45" y="394" width="225" height="82" rx="20" class="b1"/><text x="157" y="429" text-anchor="middle" class="t h">HTTP 3 · 소비강도</text><text x="157" y="456" text-anchor="middle" class="t s">관광공사</text>
<rect x="45" y="496" width="225" height="82" rx="20" class="b1"/><text x="157" y="531" text-anchor="middle" class="t h">HTTP 4 · NAVER Local</text><text x="157" y="558" text-anchor="middle" class="t s">대표 장소 1~5건</text>

<path d="M270 231 L360 320" class="a"/><path d="M270 333 L360 350" class="a"/><path d="M270 435 L360 380" class="a"/><path d="M270 537 L360 410" class="a"/>
<rect x="360" y="255" width="230" height="210" rx="24" class="b2"/>
<text x="475" y="300" text-anchor="middle" class="t h">Make · 매일 1회</text><text x="475" y="337" text-anchor="middle" class="t s">HTTP 1 → 2 → 3 → 4</text><text x="475" y="367" text-anchor="middle" class="t s">→ Supabase Create a Row</text><text x="475" y="405" text-anchor="middle" class="t b">전처리하지 않음</text><text x="475" y="435" text-anchor="middle" class="t s">Iterator · Router · AI · pandas 없음</text>

<path d="M590 360 L665 360" class="ag"/>
<rect x="665" y="225" width="270" height="270" rx="24" class="b3"/>
<text x="800" y="270" text-anchor="middle" class="t h">raw_api_data</text><text x="800" y="306" text-anchor="middle" class="t s">naver_trend_raw</text><text x="800" y="334" text-anchor="middle" class="t s">tourism_demand_raw</text><text x="800" y="362" text-anchor="middle" class="t s">tourism_consumption_raw</text><text x="800" y="390" text-anchor="middle" class="t s">naver_local_raw</text><text x="800" y="432" text-anchor="middle" class="t b">AFTER INSERT Trigger</text><text x="800" y="462" text-anchor="middle" class="t s">원본 보존 후 서버단 자동 처리</text>

<path d="M935 360 L1000 360" class="ag"/>
<rect x="1000" y="205" width="300" height="310" rx="24" class="b2"/>
<text x="1150" y="250" text-anchor="middle" class="t h">PostgreSQL Functions</text><text x="1150" y="292" text-anchor="middle" class="t s">NAVER Trend → naver_trend</text><text x="1150" y="322" text-anchor="middle" class="t s">체류 + 소비 → tourism_demand</text><text x="1150" y="352" text-anchor="middle" class="t s">NAVER Local → local_places</text><text x="1150" y="395" text-anchor="middle" class="t b">검증 · Upsert · 상태 기록</text><text x="1150" y="427" text-anchor="middle" class="t s">PROCESSED / ERROR</text><text x="1150" y="466" text-anchor="middle" class="t s">raw_id로 원본 추적</text>

<path d="M1150 515 L1150 585" class="a"/>
<rect x="930" y="585" width="440" height="105" rx="22" class="b1"/><text x="1150" y="625" text-anchor="middle" class="t h">Next.js Dashboard</text><text x="1150" y="657" text-anchor="middle" class="t s">KPI · NAVER Trend · NAVER Maps Marker · AI 요약</text>

<rect x="190" y="690" width="650" height="78" rx="22" class="note"/><text x="515" y="722" text-anchor="middle" class="t b">Dashboard는 외부 API를 직접 호출하지 않습니다</text><text x="515" y="750" text-anchor="middle" class="t s">항상 Supabase의 검증된 정제 테이블만 조회합니다.</text>
<rect x="930" y="720" width="440" height="70" rx="22" class="b2"/><text x="1150" y="748" text-anchor="middle" class="t b">GitHub → Vercel</text><text x="1150" y="774" text-anchor="middle" class="t s">로컬 검증 후 Preview → Production</text>
