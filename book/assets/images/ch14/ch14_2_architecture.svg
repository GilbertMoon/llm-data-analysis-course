<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="1400" height="800" fill="#ffffff"/>
<style>
.t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#16324f}
.title{font-size:40px;font-weight:700}
.sub{font-size:22px;font-weight:600}
.h{font-size:23px;font-weight:700}
.b{font-size:18px;font-weight:500}
.s{font-size:15px;font-weight:500}
.box{fill:#f7fbff;stroke:#7eb3df;stroke-width:2}
.box2{fill:#f2fbf8;stroke:#6fc2a7;stroke-width:2}
.box3{fill:#f8f4ff;stroke:#aa91df;stroke-width:2}
.note{fill:#fff8df;stroke:#e7c75c;stroke-width:2}
.arrow{stroke:#2f78b7;stroke-width:5;fill:none;marker-end:url(#a)}
.arrow2{stroke:#2a9d78;stroke-width:5;fill:none;marker-end:url(#b)}
</style>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f78b7"/></marker>
<marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d78"/></marker>
</defs>
<text x="70" y="72" class="t title">Chapter 14-2 전체 아키텍처</text>
<rect x="70" y="98" width="1260" height="58" rx="20" fill="#eaf5ff"/>
<text x="700" y="136" text-anchor="middle" class="t sub">수집은 Make, 저장은 Supabase, 서비스는 Next.js와 Vercel로 역할을 분리합니다</text>
<rect x="70" y="215" width="220" height="105" rx="22" class="box"/><text x="180" y="257" text-anchor="middle" class="t h">NAVER Trend</text><text x="180" y="292" text-anchor="middle" class="t s">검색 관심도</text>
<rect x="70" y="350" width="220" height="105" rx="22" class="box"/><text x="180" y="392" text-anchor="middle" class="t h">관광공사 API</text><text x="180" y="427" text-anchor="middle" class="t s">체류·소비 강도</text>
<rect x="70" y="485" width="220" height="105" rx="22" class="box"/><text x="180" y="527" text-anchor="middle" class="t h">NAVER Local</text><text x="180" y="562" text-anchor="middle" class="t s">관광지·맛집·카페·숙박</text>
<path d="M290 267 L395 345" class="arrow"/><path d="M290 402 L395 402" class="arrow"/><path d="M290 537 L395 455" class="arrow"/>
<rect x="395" y="325" width="190" height="150" rx="26" class="box2"/><text x="490" y="375" text-anchor="middle" class="t h">Make</text><text x="490" y="412" text-anchor="middle" class="t b">매일 1회 수집</text><text x="490" y="443" text-anchor="middle" class="t s">검증 · Upsert</text>
<path d="M585 400 L675 400" class="arrow2"/>
<rect x="675" y="310" width="210" height="180" rx="26" class="box3"/><text x="780" y="360" text-anchor="middle" class="t h">Supabase</text><text x="780" y="397" text-anchor="middle" class="t b">PostgreSQL</text><text x="780" y="430" text-anchor="middle" class="t s">Seed + 일일 누적</text><text x="780" y="460" text-anchor="middle" class="t s">Single Source of Truth</text>
<path d="M885 400 L965 400" class="arrow"/>
<rect x="965" y="265" width="180" height="110" rx="22" class="box2"/><text x="1055" y="307" text-anchor="middle" class="t h">AI API</text><text x="1055" y="342" text-anchor="middle" class="t s">지역 요약·해석</text>
<path d="M1055 375 L1055 425" class="arrow2"/>
<rect x="965" y="425" width="180" height="110" rx="22" class="box"/><text x="1055" y="467" text-anchor="middle" class="t h">Next.js</text><text x="1055" y="502" text-anchor="middle" class="t s">지도 Dashboard</text>
<path d="M1145 480 L1215 480" class="arrow"/>
<rect x="1215" y="425" width="120" height="110" rx="22" class="box2"/><text x="1275" y="468" text-anchor="middle" class="t h">Vercel</text><text x="1275" y="503" text-anchor="middle" class="t s">운영 배포</text>
<rect x="360" y="650" width="690" height="68" rx="22" class="note"/><text x="705" y="691" text-anchor="middle" class="t b">Dashboard는 외부 API를 직접 호출하지 않고 Supabase만 조회합니다.</text></svg>