<rect x="55" y="450" width="220" height="90" rx="20" class="b1"/><text x="165" y="488" text-anchor="middle" class="t h">관광공사 소비강도</text><text x="165" y="518" text-anchor="middle" class="t s">areaTarExpDsList</text>

<path d="M275 255 L355 330" class="a"/><path d="M275 375 L355 375" class="a"/><path d="M275 495 L355 420" class="a"/>
