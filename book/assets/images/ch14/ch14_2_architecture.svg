<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#fff"/>
<style>
.t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#16324f}.title{font-size:38px;font-weight:700}.sub{font-size:20px;font-weight:600}.h{font-size:21px;font-weight:700}.b{font-size:17px;font-weight:600}.s{font-size:14px;font-weight:500}
.b1{fill:#f7fbff;stroke:#7eb3df;stroke-width:2}.b2{fill:#f2fbf8;stroke:#6fc2a7;stroke-width:2}.b3{fill:#f8f4ff;stroke:#aa91df;stroke-width:2}.note{fill:#fff8df;stroke:#e7c75c;stroke-width:2}
