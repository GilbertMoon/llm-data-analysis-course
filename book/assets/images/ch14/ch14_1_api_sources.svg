<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <rect width="1400" height="780" fill="#ffffff"/>
  <style>
    .t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#0f2747}
    .title{font-size:42px;font-weight:700}
    .sub{font-size:24px;font-weight:600}
    .h{font-size:24px;font-weight:700}
    .b{font-size:19px;font-weight:500}
    .s{font-size:16px;font-weight:500}
    .box{fill:#f7fbff;stroke:#8abce8;stroke-width:2}
    .box2{fill:#f2fbf8;stroke:#72c7af;stroke-width:2}
    .note{fill:#fff8df;stroke:#e7c75c;stroke-width:2}
    .arrow{stroke:#2f78b7;stroke-width:5;fill:none;marker-end:url(#a)}
  </style>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f78b7"/>
    </marker>
  </defs>
  <text x="70" y="75" class="t title">두 API를 한 보고서에서 다루는 방법</text>
  <rect x="70" y="100" width="1260" height="58" rx="20" fill="#eaf5ff"/>
  <text x="700" y="138" text-anchor="middle" class="t sub">서로 다른 분석 단위를 억지로 행 단위 merge하지 않습니다</text>
  <rect x="90" y="220" width="430" height="250" rx="26" class="box"/>
  <text x="305" y="275" text-anchor="middle" class="t h">NAVER Search Trend</text>
  <text x="305" y="320" text-anchor="middle" class="t b">여행 · 축제 · 캠핑 · 맛집</text>
  <text x="305" y="365" text-anchor="middle" class="t b">기간별 상대 검색 관심도</text>
  <rect x="145" y="395" width="320" height="48" rx="18" fill="#eaf5ff"/>
  <text x="305" y="426" text-anchor="middle" class="t s">ratio = 상대지수 · 실제 검색 건수 아님</text>

  <rect x="880" y="220" width="430" height="250" rx="26" class="box2"/>
  <text x="1095" y="275" text-anchor="middle" class="t h">한국관광공사 관광 수요 강도</text>
  <text x="1095" y="320" text-anchor="middle" class="t b">지역별 관광 체류 강도</text>
  <text x="1095" y="365" text-anchor="middle" class="t b">지역별 관광 소비 강도</text>
  <rect x="935" y="395" width="320" height="48" rx="18" fill="#eaf8f3"/>
  <text x="1095" y="426" text-anchor="middle" class="t s">지역 차원이 있는 별도 데이터</text>

  <path d="M520 345 L650 345" class="arrow"/>
  <path d="M880 345 L750 345" class="arrow"/>
  <rect x="610" y="275" width="180" height="140" rx="24" fill="#f6f2ff" stroke="#aa91df" stroke-width="2"/>
  <text x="700" y="325" text-anchor="middle" class="t h">Python</text>
  <text x="700" y="360" text-anchor="middle" class="t s">각각 분석</text>
  <text x="700" y="388" text-anchor="middle" class="t s">기준일 확인</text>

  <path d="M700 415 L700 500" class="arrow"/>
  <rect x="430" y="500" width="540" height="105" rx="24" class="box"/>
  <text x="700" y="545" text-anchor="middle" class="t h">하나의 PDF 보고서에서 함께 해석</text>
  <text x="700" y="577" text-anchor="middle" class="t s">검색 관심도 관점 + 지역 관광 수요 관점</text>

  <rect x="340" y="645" width="720" height="62" rx="22" class="note"/>
  <text x="700" y="684" text-anchor="middle" class="t b">공통 기간과 동일한 분석 단위가 확인될 때만 추가 비교합니다.</text></svg>