<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="1400" height="800" fill="#ffffff"/>
<style>
.t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#16324f}
.title{font-size:40px;font-weight:700}
.sub{font-size:22px;font-weight:600}
.h{font-size:23px;font-weight:700}
.b{font-size:18px;font-weight:500}
.s{font-size:15px;font-weight:500}
.box{fill:#f7fbff;stroke:#7eb3df;stroke-width:2}
.box2{fill:#f2fbf8;stroke:#6fc2a7;stroke-width:2}
.box3{fill:#f8f4ff;stroke:#aa91df;stroke-width:2}
.note{fill:#fff8df;stroke:#e7c75c;stroke-width:2}
.arrow{stroke:#2f78b7;stroke-width:5;fill:none;marker-end:url(#a)}
.arrow2{stroke:#2a9d78;stroke-width:5;fill:none;marker-end:url(#b)}
</style>
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f78b7"/></marker>
<marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d78"/></marker>
</defs>
<text x="70" y="72" class="t title">Make 매일 수집 Pipeline</text>
<rect x="70" y="98" width="1260" height="58" rx="20" fill="#eaf5ff"/>
<text x="700" y="136" text-anchor="middle" class="t sub">매일 1회 수집하고 검증된 결과만 Supabase에 Upsert합니다</text>
<rect x="80" y="260" width="170" height="105" rx="20" class="box2"/><text x="165" y="302" text-anchor="middle" class="t h">Scheduler</text><text x="165" y="337" text-anchor="middle" class="t s">매일 1회</text>
<path d="M250 312 L310 312" class="arrow2"/>
<rect x="310" y="220" width="200" height="185" rx="22" class="box"/><text x="410" y="260" text-anchor="middle" class="t h">HTTP APIs</text><text x="410" y="300" text-anchor="middle" class="t s">NAVER Trend</text><text x="410" y="330" text-anchor="middle" class="t s">관광공사</text><text x="410" y="360" text-anchor="middle" class="t s">NAVER Local</text>
<path d="M510 312 L570 312" class="arrow"/>
<rect x="570" y="245" width="190" height="135" rx="22" class="box"/><text x="665" y="288" text-anchor="middle" class="t h">검증</text><text x="665" y="325" text-anchor="middle" class="t s">필수 값 · 빈 응답</text><text x="665" y="352" text-anchor="middle" class="t s">기준일 · 상태코드</text>
<path d="M760 312 L820 312" class="arrow2"/>
<rect x="820" y="245" width="190" height="135" rx="22" class="box3"/><text x="915" y="288" text-anchor="middle" class="t h">Supabase</text><text x="915" y="325" text-anchor="middle" class="t s">Insert / Upsert</text><text x="915" y="352" text-anchor="middle" class="t s">중복 방지</text>
<path d="M1010 312 L1070 312" class="arrow"/>
<rect x="1070" y="220" width="240" height="185" rx="22" class="box2"/><text x="1190" y="260" text-anchor="middle" class="t h">AI API</text><text x="1190" y="300" text-anchor="middle" class="t s">검증된 값만 전달</text><text x="1190" y="330" text-anchor="middle" class="t s">지역별 요약·한계 생성</text><text x="1190" y="360" text-anchor="middle" class="t s">Supabase에 결과 저장</text>
<path d="M1190 405 L1190 470 L700 470 L700 525" class="arrow2"/>
<rect x="515" y="525" width="370" height="110" rx="22" class="box2"/><text x="700" y="567" text-anchor="middle" class="t h">collection_runs 기록</text><text x="700" y="602" text-anchor="middle" class="t s">SUCCESS / FAIL · row_count · 실행 시각</text>
<rect x="330" y="680" width="740" height="60" rx="22" class="note"/><text x="700" y="718" text-anchor="middle" class="t b">실패한 응답을 저장하거나 AI 단계로 넘기지 않는 것이 핵심입니다.</text></svg>