<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">Airflow DAG와 Task 구조</title>
  <desc id="desc">Airflow의 핵심 개념인 DAG, Task, Operator, Dependency, Schedule을 시각화한 구조도</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Malgun Gothic','맑은 고딕','Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif}.title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#ede9fe}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.task{fill:#fff;stroke:#a78bfa;stroke-width:2.5;filter:url(#shadow)}.main{font-size:22px;font-weight:850;fill:#0f172a}.label{font-size:15px;font-weight:750;fill:#7c3aed}.desc{font-size:17px;font-weight:650;fill:#475569}.arr{fill:none;stroke:#7c3aed;stroke-width:4;marker-end:url(#arrow)}.note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#166534}.tag{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.5}.tagText{font-size:17px;font-weight:850;fill:#1d4ed8}
    </style>
  </defs>
  <rect class="bg" width="1600" height="650" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">Airflow DAG와 Task 구조</text>
  <text class="sub" x="86" y="118">DAG는 전체 흐름이고, Task는 DAG 안에서 실행되는 개별 작업입니다</text>

  <g transform="translate(90 175)">
    <rect class="panel" width="940" height="355" rx="28"/>
    <text x="38" y="50" font-size="29" font-weight="900" fill="#0f172a">DAG: ch14_local_analysis_pipeline</text>
    <g transform="translate(70 115)"><rect class="task" width="190" height="86" rx="20"/><text class="main" x="95" y="37" text-anchor="middle">check_input</text><text class="label" x="95" y="64" text-anchor="middle">PythonOperator</text></g>
    <path class="arr" d="M270 158H335"/>
    <g transform="translate(350 115)"><rect class="task" width="190" height="86" rx="20"/><text class="main" x="95" y="37" text-anchor="middle">preprocess</text><text class="label" x="95" y="64" text-anchor="middle">BashOperator</text></g>
    <path class="arr" d="M550 158H615"/>
    <g transform="translate(630 115)"><rect class="task" width="190" height="86" rx="20"/><text class="main" x="95" y="37" text-anchor="middle">analysis</text><text class="label" x="95" y="64" text-anchor="middle">BashOperator</text></g>
    <path class="arr" d="M725 205 C725 250 610 262 560 265"/>
    <g transform="translate(470 260)"><rect class="task" width="190" height="86" rx="20"/><text class="main" x="95" y="37" text-anchor="middle">visualize</text><text class="label" x="95" y="64" text-anchor="middle">BashOperator</text></g>
    <path class="arr" d="M460 303H395"/>
    <g transform="translate(190 260)"><rect class="task" width="190" height="86" rx="20"/><text class="main" x="95" y="37" text-anchor="middle">report</text><text class="label" x="95" y="64" text-anchor="middle">BashOperator</text></g>
    <path class="arr" d="M180 303H145"/>
    <g transform="translate(20 260)"><rect class="task" width="150" height="86" rx="20"/><text class="main" x="75" y="37" text-anchor="middle">validate</text><text class="label" x="75" y="64" text-anchor="middle">Python</text></g>
  </g>

  <g transform="translate(1090 205)">
    <rect class="panel" width="390" height="285" rx="24"/>
    <text x="32" y="50" font-size="27" font-weight="900" fill="#0f172a">핵심 개념</text>
    <rect class="tag" x="32" y="78" width="326" height="38" rx="14"/><text class="tagText" x="52" y="103">DAG: 전체 작업 흐름</text>
    <rect class="tag" x="32" y="128" width="326" height="38" rx="14"/><text class="tagText" x="52" y="153">Task: 개별 실행 단위</text>
    <rect class="tag" x="32" y="178" width="326" height="38" rx="14"/><text class="tagText" x="52" y="203">Operator: 실행 방식</text>
    <rect class="tag" x="32" y="228" width="326" height="38" rx="14"/><text class="tagText" x="52" y="253">Schedule: 수동 또는 정기 실행</text>
  </g>
  <rect class="note" x="350" y="585" width="900" height="38" rx="14"/>
  <text class="noteText" x="800" y="611" text-anchor="middle">의존성 화살표가 실행 순서와 실패 전파 범위를 결정합니다</text>
</svg>