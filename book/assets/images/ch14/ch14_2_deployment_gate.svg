<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="1400" height="800" fill="#ffffff"/>
<style>.t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#16324f}.title{font-size:40px;font-weight:700}.sub{font-size:22px;font-weight:600}.h{font-size:22px;font-weight:700}.b{font-size:17px;font-weight:600}.s{font-size:14px;font-weight:500}.box{fill:#f7fbff;stroke:#7eb3df;stroke-width:2}.box2{fill:#f2fbf8;stroke:#6fc2a7;stroke-width:2}.box3{fill:#f8f4ff;stroke:#aa91df;stroke-width:2}.note{fill:#fff8df;stroke:#e7c75c;stroke-width:2}.a{stroke:#2f78b7;stroke-width:4;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2f78b7"/></marker></defs>
<text x="70" y="72" class="t title">개발·배포 Gate</text>
<rect x="70" y="98" width="1260" height="58" rx="20" fill="#eaf5ff"/><text x="700" y="136" text-anchor="middle" class="t sub">수집·Trigger·Dashboard를 순서대로 검증한 뒤 Vercel Production으로 이동합니다</text>

<rect x="45" y="270" width="155" height="110" rx="20" class="box3"/><text x="122" y="310" text-anchor="middle" class="t h">Seed</text><text x="122" y="340" text-anchor="middle" class="t s">초기 데이터 PASS</text>
<path d="M200 325 L245 325" class="a"/>
<rect x="245" y="270" width="180" height="110" rx="20" class="box2"/><text x="335" y="308" text-anchor="middle" class="t h">Make HTTP 4</text><text x="335" y="338" text-anchor="middle" class="t s">Raw INSERT PASS</text>
<path d="M425 325 L470 325" class="a"/>
<rect x="470" y="250" width="190" height="150" rx="20" class="box"/><text x="565" y="290" text-anchor="middle" class="t h">DB Trigger</text><text x="565" y="323" text-anchor="middle" class="t s">Trend PASS</text><text x="565" y="350" text-anchor="middle" class="t s">관광수요 PASS</text><text x="565" y="377" text-anchor="middle" class="t s">Local PASS</text>
<path d="M660 325 L705 325" class="a"/>
<rect x="705" y="270" width="185" height="110" rx="20" class="box"/><text x="797" y="308" text-anchor="middle" class="t h">Local Dashboard</text><text x="797" y="338" text-anchor="middle" class="t s">지도·KPI·차트 PASS</text>
<path d="M890 325 L935 325" class="a"/>
<rect x="935" y="270" width="140" height="110" rx="20" class="box2"/><text x="1005" y="308" text-anchor="middle" class="t h">GitHub</text><text x="1005" y="338" text-anchor="middle" class="t s">Push</text>
<path d="M1075 325 L1120 325" class="a"/>
<rect x="1120" y="245" width="225" height="160" rx="22" class="box3"/><text x="1232" y="285" text-anchor="middle" class="t h">Vercel</text><text x="1232" y="320" text-anchor="middle" class="t s">Preview PASS</text><text x="1232" y="350" text-anchor="middle" class="t s">Production Deploy</text><text x="1232" y="380" text-anchor="middle" class="t s">운영 URL 확인</text>

<rect x="255" y="510" width="890" height="125" rx="26" fill="#f7fbff" stroke="#b4d3ef" stroke-width="2"/>
<text x="700" y="550" text-anchor="middle" class="t h">배포 전 데이터 확인</text>
<text x="405" y="592" text-anchor="middle" class="t b">PROCESSED / error NULL</text><text x="700" y="592" text-anchor="middle" class="t b">관광수요 26건</text><text x="995" y="592" text-anchor="middle" class="t b">대표 장소 1~5건</text>

<rect x="330" y="680" width="740" height="60" rx="22" class="note"/><text x="700" y="718" text-anchor="middle" class="t b">로컬에서 확인하지 않은 상태로 바로 Production에 배포하지 않습니다.</text>
</svg>