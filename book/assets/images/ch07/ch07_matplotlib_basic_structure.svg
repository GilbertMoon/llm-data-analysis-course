<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">matplotlib Figure와 Axes 기본 구조</title>
  <desc id="desc">Figure와 Axes를 명시적으로 만들고 제목, 축, 데이터, 저장과 출력을 관리하는 구조</desc>
  <defs>
    <linearGradient id="topLine" x1="0" x2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <filter id="softShadow" x="-14%" y="-14%" width="128%" height="128%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <style>
      .bg{fill:#f8fafc}.top{fill:url(#topLine)} text{font-family:'Malgun Gothic','맑은 고딕','Pretendard','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif}.mono{font-family:'D2Coding','JetBrains Mono','Consolas',monospace}
      .title{font-size:48px;font-weight:850;fill:#0f172a}.subtitle{font-size:24px;font-weight:600;fill:#334155}.card{fill:#fff;stroke:#bfdbfe;stroke-width:2.5;filter:url(#softShadow)}
      .section{font-size:29px;font-weight:850;fill:#0f172a}.sectionSub{font-size:19px;font-weight:700;fill:#64748b}.plotTitle{font-size:26px;font-weight:850;fill:#1d4ed8}.axisName{font-size:22px;font-weight:850;fill:#0f172a}.tick{font-size:18px;font-weight:700;fill:#475569}
      .grid{stroke:#e2e8f0;stroke-width:2}.axis{stroke:#0f172a;stroke-width:4;stroke-linecap:round}.bar1{fill:#2563eb}.bar2{fill:#0f9f7f}.bar3{fill:#f59e0b}.bar4{fill:#7c3aed}.badge{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.badgeText{font-size:17px;font-weight:850;fill:#1d4ed8}
      .codePanel{fill:#0f172a}.code{font-size:18px;font-weight:650;fill:#e2e8f0}.fn{fill:#93c5fd}.str{fill:#86efac}.step{font-size:18px;font-weight:850;fill:#93c5fd}.divider{stroke:#334155;stroke-width:2}.footerBox{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}.footer{font-size:22px;font-weight:750;fill:#1d4ed8}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/><rect class="top" x="70" y="54" width="1460" height="10" rx="5"/>
  <text class="title" x="800" y="126" text-anchor="middle">matplotlib Figure와 Axes 기본 구조</text>
  <text class="subtitle" x="800" y="168" text-anchor="middle">이 장에서는 Figure와 Axes를 명시적으로 만들어 그래프 요소를 관리합니다.</text>

  <g transform="translate(70 205)"><rect class="card" width="875" height="585" rx="26"/>
    <text class="section" x="42" y="54">그래프 구조</text><text class="sectionSub" x="42" y="84">Figure 안의 Axes에 제목·축·데이터를 배치합니다.</text>
    <text class="plotTitle" x="500" y="135" text-anchor="middle">카테고리별 완료 주문 금액</text>
    <rect x="182" y="170" width="620" height="310" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <line class="grid" x1="200" y1="220" x2="780" y2="220"/><line class="grid" x1="200" y1="290" x2="780" y2="290"/><line class="grid" x1="200" y1="360" x2="780" y2="360"/><line class="axis" x1="200" y1="440" x2="780" y2="440"/><line class="axis" x1="200" y1="190" x2="200" y2="440"/>
    <rect class="bar1" x="260" y="310" width="75" height="130" rx="7"/><rect class="bar2" x="390" y="250" width="75" height="190" rx="7"/><rect class="bar3" x="520" y="340" width="75" height="100" rx="7"/><rect class="bar4" x="650" y="220" width="75" height="220" rx="7"/>
    <text class="tick" x="297" y="472" text-anchor="middle">A</text><text class="tick" x="427" y="472" text-anchor="middle">B</text><text class="tick" x="557" y="472" text-anchor="middle">C</text><text class="tick" x="687" y="472" text-anchor="middle">D</text>
    <text class="axisName" x="500" y="525" text-anchor="middle">카테고리</text><text class="axisName" x="105" y="315" transform="rotate(-90 105 315)" text-anchor="middle">완료 주문 금액</text>
    <rect class="badge" x="220" y="548" width="150" height="34" rx="14"/><text class="badgeText" x="295" y="571" text-anchor="middle">Figure = 전체 그림</text>
    <rect class="badge" x="390" y="548" width="180" height="34" rx="14"/><text class="badgeText" x="480" y="571" text-anchor="middle">Axes = 실제 그래프 영역</text>
  </g>

  <g transform="translate(990 205)"><rect class="card" width="540" height="585" rx="26"/><text class="section" x="34" y="54">코드 흐름</text><text class="sectionSub" x="34" y="84">Figure/Axes 방식으로 작성하고 저장 후 표시합니다.</text>
    <rect class="codePanel" x="28" y="112" width="484" height="448" rx="20"/>
    <text class="step" x="54" y="150">1. Figure와 Axes 준비</text>
    <text class="code mono" x="54" y="184"><tspan class="fn">fig, ax = plt.subplots</tspan>(figsize=(10, 5))</text>
    <line class="divider" x1="54" y1="208" x2="486" y2="208"/>
    <text class="step" x="54" y="244">2. Axes에 데이터와 설명 추가</text>
    <text class="code mono" x="54" y="280"><tspan class="fn">ax.bar</tspan>(x_data, y_data)</text>
    <text class="code mono" x="54" y="316"><tspan class="fn">ax.set_title</tspan>(<tspan class="str">"그래프 제목"</tspan>)</text>
    <text class="code mono" x="54" y="352"><tspan class="fn">ax.set_xlabel</tspan>(<tspan class="str">"x축"</tspan>)</text>
    <text class="code mono" x="54" y="388"><tspan class="fn">ax.set_ylabel</tspan>(<tspan class="str">"y축"</tspan>)</text>
    <text class="code mono" x="54" y="424"><tspan class="fn">ax.set_ylim</tspan>(bottom=0)</text>
    <line class="divider" x1="54" y1="448" x2="486" y2="448"/>
    <text class="step" x="54" y="484">3. 정리 → 저장 → 표시</text>
    <text class="code mono" x="54" y="520"><tspan class="fn">fig.tight_layout</tspan>()</text>
    <text class="code mono" x="54" y="548"><tspan class="fn">fig.savefig</tspan>(<tspan class="str">"graph.png"</tspan>, dpi=150)</text>
    <text class="code mono" x="330" y="548"><tspan class="fn">plt.show</tspan>()</text>
  </g>

  <rect class="footerBox" x="260" y="818" width="1080" height="54" rx="18"/><text class="footer" x="800" y="852" text-anchor="middle">Figure는 전체 그림, Axes는 실제 그래프 영역입니다. 저장은 일반적으로 show()보다 먼저 수행합니다.</text>
</svg>
