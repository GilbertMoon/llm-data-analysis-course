<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">matplotlib 기본 그래프 구조</title>
  <desc id="desc">matplotlib 그래프 구성 요소와 이를 만드는 코드 흐름의 대응 관계</desc>
  <defs>
    <linearGradient id="topLine" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softShadow" x="-14%" y="-14%" width="128%" height="128%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .bg{fill:#f8fafc}
      .top{fill:url(#topLine)}
      text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
      .title{font-size:48px;font-weight:850;fill:#0f172a}
      .subtitle{font-size:24px;font-weight:600;fill:#334155}
      .card{fill:#fff;stroke:#bfdbfe;stroke-width:2.5;filter:url(#softShadow)}
      .section{font-size:29px;font-weight:850;fill:#0f172a}
      .sectionSub{font-size:19px;font-weight:700;fill:#64748b}
      .plotTitle{font-size:26px;font-weight:850;fill:#1d4ed8}
      .axisName{font-size:22px;font-weight:850;fill:#0f172a}
      .tick{font-size:19px;font-weight:750;fill:#475569}
      .grid{stroke:#e2e8f0;stroke-width:2}
      .axis{stroke:#0f172a;stroke-width:4;stroke-linecap:round}
      .tickMark{stroke:#64748b;stroke-width:3;stroke-linecap:round}
      .barBlue{fill:#2563eb}
      .barGreen{fill:#0f9f7f}
      .barOrange{fill:#f59e0b}
      .barPink{fill:#e11d48}
      .badge{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}
      .badgeText{font-size:18px;font-weight:850;fill:#1d4ed8}
      .codePanel{fill:#0f172a;stroke:#1e293b;stroke-width:2}
      .code{font-family:'D2Coding','JetBrains Mono','Consolas',monospace;font-size:19px;font-weight:650;fill:#e2e8f0}
      .codeSmall{font-family:'D2Coding','JetBrains Mono','Consolas',monospace;font-size:17px;font-weight:650;fill:#cbd5e1}
      .fn{fill:#93c5fd}
      .str{fill:#86efac}
      .role{font-size:16px;font-weight:800;fill:#bfdbfe}
      .step{font-size:18px;font-weight:850;fill:#93c5fd}
      .divider{stroke:#334155;stroke-width:2}
      .optional{fill:#172554;stroke:#60a5fa;stroke-width:1.5}
      .optionalText{font-size:17px;font-weight:800;fill:#dbeafe}
      .footerBox{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}
      .footer{font-size:22px;font-weight:750;fill:#1d4ed8}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect class="top" x="70" y="54" width="1460" height="10" rx="5"/>
  <text class="title" x="800" y="126" text-anchor="middle">matplotlib 기본 그래프 구조</text>
  <text class="subtitle" x="800" y="168" text-anchor="middle">그래프를 구성하는 요소와 이를 생성하는 코드의 관계를 확인합니다.</text>

  <g transform="translate(70 205)">
    <rect class="card" width="875" height="585" rx="26"/>
    <text class="section" x="42" y="54">그래프 구조</text>
    <text class="sectionSub" x="42" y="84">제목·축·눈금·데이터 막대를 한 화면에서 확인합니다.</text>

    <text class="plotTitle" x="492" y="133" text-anchor="middle">그래프 제목</text>
    <circle class="badge" cx="365" cy="123" r="18"/>
    <text class="badgeText" x="365" y="130" text-anchor="middle">1</text>

    <line class="grid" x1="185" y1="208" x2="800" y2="208"/>
    <line class="grid" x1="185" y1="278" x2="800" y2="278"/>
    <line class="grid" x1="185" y1="348" x2="800" y2="348"/>
    <line class="grid" x1="185" y1="418" x2="800" y2="418"/>
    <line class="axis" x1="185" y1="450" x2="800" y2="450"/>
    <line class="axis" x1="185" y1="170" x2="185" y2="450"/>

    <line class="tickMark" x1="178" y1="208" x2="185" y2="208"/>
    <line class="tickMark" x1="178" y1="278" x2="185" y2="278"/>
    <line class="tickMark" x1="178" y1="348" x2="185" y2="348"/>
    <line class="tickMark" x1="178" y1="418" x2="185" y2="418"/>
    <text class="tick" x="160" y="214" text-anchor="end">80</text>
    <text class="tick" x="160" y="284" text-anchor="end">60</text>
    <text class="tick" x="160" y="354" text-anchor="end">40</text>
    <text class="tick" x="160" y="424" text-anchor="end">20</text>

    <rect class="barBlue" x="260" y="300" width="76" height="150" rx="8"/>
    <rect class="barGreen" x="395" y="240" width="76" height="210" rx="8"/>
    <rect class="barOrange" x="530" y="330" width="76" height="120" rx="8"/>
    <rect class="barPink" x="665" y="205" width="76" height="245" rx="8"/>
    <circle class="badge" cx="770" cy="236" r="18"/>
    <text class="badgeText" x="770" y="243" text-anchor="middle">4</text>

    <text class="tick" x="298" y="483" text-anchor="middle">A</text>
    <text class="tick" x="433" y="483" text-anchor="middle">B</text>
    <text class="tick" x="568" y="483" text-anchor="middle">C</text>
    <text class="tick" x="703" y="483" text-anchor="middle">D</text>
    <text class="axisName" x="492" y="532" text-anchor="middle">x축 이름</text>
    <circle class="badge" cx="382" cy="525" r="18"/>
    <text class="badgeText" x="382" y="532" text-anchor="middle">2</text>

    <text class="axisName" x="82" y="317" transform="rotate(-90 82 317)" text-anchor="middle">y축 이름</text>
    <circle class="badge" cx="82" cy="178" r="18"/>
    <text class="badgeText" x="82" y="185" text-anchor="middle">3</text>
  </g>

  <g transform="translate(990 205)">
    <rect class="card" width="540" height="585" rx="26"/>
    <text class="section" x="34" y="54">코드 흐름</text>
    <text class="sectionSub" x="34" y="84">각 코드가 그래프의 어느 요소를 만드는지 연결합니다.</text>

    <rect class="codePanel" x="28" y="112" width="484" height="466" rx="20"/>
    <text class="step" x="56" y="150">그래프 준비</text>
    <text class="code" x="56" y="184"><tspan class="fn">plt.figure</tspan>(figsize=(10, 5))</text>
    <text class="role" x="386" y="184">크기 설정</text>

    <line class="divider" x1="56" y1="210" x2="484" y2="210"/>
    <text class="step" x="56" y="244">데이터와 설명 추가</text>

    <circle class="badge" cx="67" cy="282" r="17"/>
    <text class="badgeText" x="67" y="288" text-anchor="middle">4</text>
    <text class="code" x="96" y="289"><tspan class="fn">plt.bar</tspan>(x_data, y_data)</text>
    <text class="role" x="369" y="289">데이터 막대</text>

    <circle class="badge" cx="67" cy="326" r="17"/>
    <text class="badgeText" x="67" y="332" text-anchor="middle">1</text>
    <text class="code" x="96" y="333"><tspan class="fn">plt.title</tspan>(<tspan class="str">"그래프 제목"</tspan>)</text>
    <text class="role" x="369" y="333">제목</text>

    <circle class="badge" cx="67" cy="370" r="17"/>
    <text class="badgeText" x="67" y="376" text-anchor="middle">2</text>
    <text class="code" x="96" y="377"><tspan class="fn">plt.xlabel</tspan>(<tspan class="str">"x축 이름"</tspan>)</text>
    <text class="role" x="369" y="377">x축 이름</text>

    <circle class="badge" cx="67" cy="414" r="17"/>
    <text class="badgeText" x="67" y="420" text-anchor="middle">3</text>
    <text class="code" x="96" y="421"><tspan class="fn">plt.ylabel</tspan>(<tspan class="str">"y축 이름"</tspan>)</text>
    <text class="role" x="369" y="421">y축 이름</text>

    <text class="code" x="96" y="465"><tspan class="fn">plt.xticks</tspan>(rotation=45)</text>
    <text class="role" x="369" y="465">눈금 회전</text>

    <line class="divider" x1="56" y1="490" x2="484" y2="490"/>
    <text class="step" x="56" y="520">정리 및 출력</text>
    <text class="codeSmall" x="56" y="544"><tspan class="fn">plt.tight_layout</tspan>()</text>
    <text class="codeSmall" x="236" y="544"><tspan class="fn">plt.show</tspan>()</text>

    <rect class="optional" x="258" y="552" width="226" height="28" rx="10"/>
    <text class="optionalText" x="274" y="572">선택: <tspan style="font-family:'D2Coding','JetBrains Mono','Consolas',monospace">plt.savefig()</tspan></text>
  </g>

  <rect class="footerBox" x="318" y="818" width="964" height="54" rx="18"/>
  <text class="footer" x="800" y="852" text-anchor="middle">그래프는 제목, 축, 레이블, 데이터 표현과 출력 설정을 함께 관리해야 합니다.</text>
</svg>
