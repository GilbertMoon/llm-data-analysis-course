<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">데이터 시각화 전체 흐름도</title>
  <desc id="desc">분석 질문에서 데이터 범위 확인, 집계 검증, 그래프 선택, 작성, 교차 검증, 해석과 보고서 연결까지의 흐름</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Malgun Gothic','맑은 고딕','Pretendard','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif}
      .title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#e0e7ff}
      .node{fill:#fff;stroke:#bfdbfe;stroke-width:2;filter:url(#shadow)}.num{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.nt{font-size:17px;font-weight:900;fill:#2563eb}
      .main{font-size:22px;font-weight:800;fill:#0f172a}.desc{font-size:15px;font-weight:650;fill:#64748b}.hint{font-size:14px;font-weight:800;fill:#1d4ed8}.arr{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#arrow)}
      .note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1600" height="650" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">데이터 시각화 전체 흐름</text>
  <text class="sub" x="86" y="118">그래프를 그리기 전에 질문·범위·집계값을 먼저 검증합니다</text>

  <g transform="translate(55 180)"><rect class="node" width="220" height="118" rx="22"/><circle class="num" cx="34" cy="34" r="18"/><text class="nt" x="34" y="40" text-anchor="middle">1</text><text class="main" x="64" y="40">분석 질문</text><text class="desc" x="24" y="72">무엇을 확인할까?</text><text class="hint" x="24" y="100">question</text></g>
  <path class="arr" d="M285 239H330"/>
  <g transform="translate(345 180)"><rect class="node" width="220" height="118" rx="22"/><circle class="num" cx="34" cy="34" r="18"/><text class="nt" x="34" y="40" text-anchor="middle">2</text><text class="main" x="64" y="40">범위 확인</text><text class="desc" x="24" y="72">completed 등 포함 기준</text><text class="hint" x="24" y="100">scope</text></g>
  <path class="arr" d="M575 239H620"/>
  <g transform="translate(635 180)"><rect class="node" width="220" height="118" rx="22"/><circle class="num" cx="34" cy="34" r="18"/><text class="nt" x="34" y="40" text-anchor="middle">3</text><text class="main" x="64" y="40">집계 검증</text><text class="desc" x="24" y="72">source total과 비교</text><text class="hint" x="24" y="100">validate</text></g>
  <path class="arr" d="M865 239H910"/>
  <g transform="translate(925 180)"><rect class="node" width="220" height="118" rx="22"/><circle class="num" cx="34" cy="34" r="18"/><text class="nt" x="34" y="40" text-anchor="middle">4</text><text class="main" x="64" y="40">그래프 선택</text><text class="desc" x="24" y="72">비교·추세·분포·관계</text><text class="hint" x="24" y="100">chart type</text></g>
  <path class="arr" d="M1155 239H1200"/>
  <g transform="translate(1215 180)"><rect class="node" width="220" height="118" rx="22"/><circle class="num" cx="34" cy="34" r="18"/><text class="nt" x="34" y="40" text-anchor="middle">5</text><text class="main" x="64" y="40">그래프 작성</text><text class="desc" x="24" y="72">제목·축·단위 정리</text><text class="hint" x="24" y="100">matplotlib</text></g>

  <path class="arr" d="M1325 308 C1325 350 1240 360 1190 360"/>
  <g transform="translate(1215 390)"><rect class="node" width="220" height="118" rx="22"/><circle class="num" cx="34" cy="34" r="18"/><text class="nt" x="34" y="40" text-anchor="middle">6</text><text class="main" x="64" y="40">교차 검증</text><text class="desc" x="24" y="72">표의 값과 그래프 비교</text><text class="hint" x="24" y="100">table ↔ chart</text></g>
  <path class="arr" d="M1205 449H1160"/>
  <g transform="translate(925 390)"><rect class="node" width="220" height="118" rx="22"/><circle class="num" cx="34" cy="34" r="18"/><text class="nt" x="34" y="40" text-anchor="middle">7</text><text class="main" x="64" y="40">해석·한계</text><text class="desc" x="24" y="72">관찰과 가설 구분</text><text class="hint" x="24" y="100">interpret</text></g>
  <path class="arr" d="M915 449H870"/>
  <g transform="translate(635 390)"><rect class="node" width="220" height="118" rx="22"/><circle class="num" cx="34" cy="34" r="18"/><text class="nt" x="34" y="40" text-anchor="middle">8</text><text class="main" x="64" y="40">저장·보고서</text><text class="desc" x="24" y="72">Evidence와 범위 기록</text><text class="hint" x="24" y="100">savefig · Markdown</text></g>

  <rect class="note" x="375" y="555" width="850" height="50" rx="16"/>
  <text class="noteText" x="800" y="587" text-anchor="middle">핵심: 검증된 숫자를 질문에 맞는 그래프로 표현하고, 보이는 사실과 원인 추정을 구분합니다</text>
</svg>
