<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">데이터 시각화 전체 흐름도</title>
  <desc id="desc">분석 질문에서 그래프 선택, 데이터 준비, 시각화, 해석, 보고서 연결까지의 전체 흐름</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
      .title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#e0e7ff}
      .node{fill:#fff;stroke:#bfdbfe;stroke-width:2;filter:url(#shadow)}.num{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.nt{font-size:17px;font-weight:900;fill:#2563eb}
      .main{font-size:24px;font-weight:800;fill:#0f172a}.desc{font-size:16px;font-weight:650;fill:#64748b}.arr{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#arrow)}
      .note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1600" height="600" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">데이터 시각화 전체 흐름</text>
  <text class="sub" x="86" y="118">그래프는 데이터를 꾸미는 도구가 아니라, 질문에 답하기 위한 분석 도구입니다</text>

  <g transform="translate(85 180)"><rect class="node" width="245" height="105" rx="22"/><circle class="num" cx="36" cy="36" r="18"/><text class="nt" x="36" y="42" text-anchor="middle">1</text><text class="main" x="68" y="44">분석 질문</text><text class="desc" x="26" y="78">무엇을 보려는가?</text></g>
  <path class="arr" d="M340 232H405"/>
  <g transform="translate(420 180)"><rect class="node" width="245" height="105" rx="22"/><circle class="num" cx="36" cy="36" r="18"/><text class="nt" x="36" y="42" text-anchor="middle">2</text><text class="main" x="68" y="44">그래프 선택</text><text class="desc" x="26" y="78">비교·추세·분포·관계</text></g>
  <path class="arr" d="M675 232H740"/>
  <g transform="translate(755 180)"><rect class="node" width="245" height="105" rx="22"/><circle class="num" cx="36" cy="36" r="18"/><text class="nt" x="36" y="42" text-anchor="middle">3</text><text class="main" x="68" y="44">데이터 준비</text><text class="desc" x="26" y="78">집계표와 축 데이터 정리</text></g>
  <path class="arr" d="M1010 232H1075"/>
  <g transform="translate(1090 180)"><rect class="node" width="245" height="105" rx="22"/><circle class="num" cx="36" cy="36" r="18"/><text class="nt" x="36" y="42" text-anchor="middle">4</text><text class="main" x="68" y="44">그래프 작성</text><text class="desc" x="26" y="78">제목·축·레이블 정리</text></g>

  <path class="arr" d="M1212 285 C1212 342 1110 350 1075 350"/>
  <g transform="translate(1090 380)"><rect class="node" width="245" height="105" rx="22"/><circle class="num" cx="36" cy="36" r="18"/><text class="nt" x="36" y="42" text-anchor="middle">5</text><text class="main" x="68" y="44">그래프 해석</text><text class="desc" x="26" y="78">관찰과 가설 구분</text></g>
  <path class="arr" d="M1080 432H1015"/>
  <g transform="translate(755 380)"><rect class="node" width="245" height="105" rx="22"/><circle class="num" cx="36" cy="36" r="18"/><text class="nt" x="36" y="42" text-anchor="middle">6</text><text class="main" x="68" y="44">파일 저장</text><text class="desc" x="26" y="78">보고서용 이미지 생성</text></g>
  <path class="arr" d="M745 432H680"/>
  <g transform="translate(420 380)"><rect class="node" width="245" height="105" rx="22"/><circle class="num" cx="36" cy="36" r="18"/><text class="nt" x="36" y="42" text-anchor="middle">7</text><text class="main" x="68" y="44">보고서 연결</text><text class="desc" x="26" y="78">목적·해석·주의사항 정리</text></g>

  <rect class="note" x="515" y="520" width="570" height="42" rx="14"/>
  <text class="noteText" x="800" y="548" text-anchor="middle">핵심: 그래프는 원인을 단정하지 않고 패턴을 보여준다</text>
</svg>