<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">시각화 결과를 보고서와 발표 자료로 연결하는 흐름</title>
  <desc id="desc">그래프 파일을 해석 메모, 요약 보고서, 발표 자료로 재구성하는 네 단계 흐름</desc>
  <defs>
    <linearGradient id="topLine" x1="0" x2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="softShadow" x="-14%" y="-14%" width="128%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <marker id="arrowHead" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#64748b"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .top{fill:url(#topLine)}
      text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
      .title{font-size:46px;font-weight:850;fill:#0f172a}
      .subtitle{font-size:24px;font-weight:600;fill:#334155}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#softShadow)}
      .stepBadge{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}
      .stepText{font-size:19px;font-weight:850;fill:#1d4ed8}
      .cardTitle{font-size:28px;font-weight:850;fill:#0f172a}
      .action{font-size:21px;font-weight:800;fill:#334155}
      .pill{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.8}
      .pillText{font-size:18px;font-weight:850;fill:#1d4ed8}
      .arrow{fill:none;stroke:#64748b;stroke-width:5;stroke-linecap:round;marker-end:url(#arrowHead)}
      .arrowLabel{font-size:17px;font-weight:850;fill:#475569}
      .iconLineBlue{stroke:#2563eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .iconLineGreen{stroke:#0f9f7f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .iconLineSlate{stroke:#334155;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .iconLineOrange{stroke:#f59e0b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .blueFill{fill:#2563eb}
      .greenFill{fill:#0f9f7f}
      .slateFill{fill:#334155}
      .orangeFill{fill:#f59e0b}
      .mutedFill{fill:#eff6ff}
      .footerBox{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}
      .footer{font-size:22px;font-weight:750;fill:#1d4ed8}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect class="top" x="70" y="54" width="1460" height="10" rx="5"/>
  <text class="title" x="800" y="126" text-anchor="middle">시각화 결과를 보고서와 발표 자료로 연결하는 흐름</text>
  <text class="subtitle" x="800" y="168" text-anchor="middle">그래프를 저장한 뒤 해석하고, 보고서와 발표 자료로 재구성합니다.</text>

  <g transform="translate(55 242)">
    <rect class="card" width="300" height="390" rx="26"/>
    <rect class="stepBadge" x="26" y="26" width="58" height="34" rx="12"/>
    <text class="stepText" x="55" y="49" text-anchor="middle">01</text>
    <g transform="translate(86 86)">
      <path class="iconLineBlue" d="M18 5H118L142 29V134H18Z"/>
      <path class="iconLineBlue" d="M118 5V31H142"/>
      <line class="iconLineBlue" x1="42" y1="107" x2="116" y2="107"/>
      <rect class="blueFill" x="45" y="72" width="12" height="35" rx="2"/>
      <rect class="blueFill" x="67" y="51" width="12" height="56" rx="2"/>
      <rect class="blueFill" x="89" y="84" width="12" height="23" rx="2"/>
      <rect class="blueFill" x="111" y="63" width="12" height="44" rx="2"/>
      <path class="iconLineBlue" d="M80 128v28m-14-14 14 14 14-14"/>
    </g>
    <text class="cardTitle" x="150" y="264" text-anchor="middle">그래프 파일</text>
    <text class="action" x="150" y="303" text-anchor="middle">그래프 저장</text>
    <rect class="pill" x="104" y="330" width="92" height="38" rx="14"/>
    <text class="pillText" x="150" y="355" text-anchor="middle">PNG</text>
  </g>

  <path class="arrow" d="M375 438H443"/>
  <text class="arrowLabel" x="410" y="415" text-anchor="middle">해석</text>

  <g transform="translate(465 242)">
    <rect class="card" width="300" height="390" rx="26"/>
    <rect class="stepBadge" x="26" y="26" width="58" height="34" rx="12"/>
    <text class="stepText" x="55" y="49" text-anchor="middle">02</text>
    <g transform="translate(86 86)">
      <rect class="mutedFill" x="18" y="7" width="128" height="146" rx="16" stroke="#0f9f7f" stroke-width="4"/>
      <path class="iconLineGreen" d="M48 48l9 9 19-22"/>
      <line class="iconLineGreen" x1="90" y1="50" x2="124" y2="50"/>
      <path class="iconLineGreen" d="M48 84l9 9 19-22"/>
      <line class="iconLineGreen" x1="90" y1="86" x2="124" y2="86"/>
      <circle class="greenFill" cx="56" cy="122" r="6"/>
      <line class="iconLineGreen" x1="90" y1="122" x2="124" y2="122"/>
    </g>
    <text class="cardTitle" x="150" y="264" text-anchor="middle">해석 메모</text>
    <text class="action" x="150" y="303" text-anchor="middle">관찰과 가설 구분</text>
    <rect class="pill" x="90" y="330" width="120" height="38" rx="14"/>
    <text class="pillText" x="150" y="355" text-anchor="middle">해석 노트</text>
  </g>

  <path class="arrow" d="M785 438H853"/>
  <text class="arrowLabel" x="820" y="415" text-anchor="middle">정리</text>

  <g transform="translate(875 242)">
    <rect class="card" width="300" height="390" rx="26"/>
    <rect class="stepBadge" x="26" y="26" width="58" height="34" rx="12"/>
    <text class="stepText" x="55" y="49" text-anchor="middle">03</text>
    <g transform="translate(86 86)">
      <rect x="20" y="8" width="126" height="146" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
      <rect class="slateFill" x="42" y="35" width="78" height="11" rx="3"/>
      <line class="iconLineSlate" x1="42" y1="72" x2="124" y2="72"/>
      <line class="iconLineSlate" x1="42" y1="96" x2="112" y2="96"/>
      <line class="iconLineSlate" x1="42" y1="120" x2="124" y2="120"/>
      <rect x="97" y="103" width="27" height="17" rx="3" fill="#dbeafe" stroke="#334155" stroke-width="3"/>
    </g>
    <text class="cardTitle" x="150" y="264" text-anchor="middle">요약 보고서</text>
    <text class="action" x="150" y="303" text-anchor="middle">핵심 결과 정리</text>
    <rect class="pill" x="88" y="330" width="124" height="38" rx="14"/>
    <text class="pillText" x="150" y="355" text-anchor="middle">Markdown</text>
  </g>

  <path class="arrow" d="M1195 438H1263"/>
  <text class="arrowLabel" x="1230" y="415" text-anchor="middle">선별</text>

  <g transform="translate(1285 242)">
    <rect class="card" width="300" height="390" rx="26"/>
    <rect class="stepBadge" x="26" y="26" width="58" height="34" rx="12"/>
    <text class="stepText" x="55" y="49" text-anchor="middle">04</text>
    <g transform="translate(86 86)">
      <rect x="14" y="18" width="136" height="94" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="4"/>
      <line class="iconLineOrange" x1="38" y1="45" x2="108" y2="45"/>
      <polyline class="iconLineOrange" points="42,88 64,74 84,80 112,60"/>
      <circle class="orangeFill" cx="42" cy="88" r="5"/>
      <circle class="orangeFill" cx="64" cy="74" r="5"/>
      <circle class="orangeFill" cx="84" cy="80" r="5"/>
      <circle class="orangeFill" cx="112" cy="60" r="5"/>
      <line class="iconLineOrange" x1="82" y1="112" x2="82" y2="145"/>
      <line class="iconLineOrange" x1="48" y1="145" x2="116" y2="145"/>
    </g>
    <text class="cardTitle" x="150" y="264" text-anchor="middle">발표 자료</text>
    <text class="action" x="150" y="303" text-anchor="middle">핵심 그래프 선별</text>
    <rect class="pill" x="98" y="330" width="104" height="38" rx="14"/>
    <text class="pillText" x="150" y="355" text-anchor="middle">슬라이드</text>
  </g>

  <rect class="footerBox" x="285" y="700" width="1030" height="56" rx="19"/>
  <text class="footer" x="800" y="736" text-anchor="middle">그래프는 저장에서 끝나지 않고, 해석과 요약을 거쳐 의사결정 자료가 됩니다.</text>
</svg>
