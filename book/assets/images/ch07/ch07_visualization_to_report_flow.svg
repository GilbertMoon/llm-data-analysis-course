<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">시각화 결과를 Evidence와 보고서로 연결하는 흐름</title>
  <desc id="desc">검증된 그래프를 범위 메모, 해석, Evidence, 보고서와 발표 자료로 연결하는 흐름</desc>
  <defs>
    <linearGradient id="topLine" x1="0" x2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#0f766e"/></linearGradient>
    <filter id="softShadow" x="-14%" y="-14%" width="128%" height="128%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.07"/></filter>
    <marker id="arrowHead" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.top{fill:url(#topLine)} text{font-family:'Malgun Gothic','맑은 고딕','Pretendard','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif}
      .title{font-size:46px;font-weight:850;fill:#0f172a}.subtitle{font-size:24px;font-weight:600;fill:#334155}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#softShadow)}.stepBadge{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}.stepText{font-size:19px;font-weight:850;fill:#1d4ed8}.cardTitle{font-size:27px;font-weight:850;fill:#0f172a}.action{font-size:19px;font-weight:800;fill:#334155}.small{font-size:16px;font-weight:750;fill:#0f766e}.pill{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.8}.pillText{font-size:17px;font-weight:850;fill:#1d4ed8}.arrow{fill:none;stroke:#64748b;stroke-width:5;stroke-linecap:round;marker-end:url(#arrowHead)}.arrowLabel{font-size:17px;font-weight:850;fill:#475569}.blue{fill:#2563eb}.green{fill:#0f9f7f}.slate{fill:#334155}.orange{fill:#f59e0b}.footerBox{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}.footer{font-size:21px;font-weight:750;fill:#1d4ed8}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/><rect class="top" x="70" y="54" width="1460" height="10" rx="5"/>
  <text class="title" x="800" y="126" text-anchor="middle">시각화 결과를 Evidence와 보고서로 연결하는 흐름</text>
  <text class="subtitle" x="800" y="168" text-anchor="middle">그래프 파일만 남기지 않고 질문·범위·관찰·한계까지 함께 기록합니다.</text>

  <g transform="translate(55 242)"><rect class="card" width="300" height="390" rx="26"/><rect class="stepBadge" x="26" y="26" width="58" height="34" rx="12"/><text class="stepText" x="55" y="49" text-anchor="middle">01</text>
    <rect x="78" y="92" width="144" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><line x1="100" y1="184" x2="200" y2="184" stroke="#2563eb" stroke-width="4"/><rect class="blue" x="105" y="140" width="18" height="44"/><rect class="blue" x="135" y="118" width="18" height="66"/><rect class="blue" x="165" y="151" width="18" height="33"/>
    <text class="cardTitle" x="150" y="264" text-anchor="middle">검증된 그래프</text><text class="action" x="150" y="300" text-anchor="middle">집계표와 수치 교차 확인</text><text class="small" x="150" y="328" text-anchor="middle">question · scope · source total</text><rect class="pill" x="103" y="346" width="94" height="36" rx="13"/><text class="pillText" x="150" y="370" text-anchor="middle">PNG</text>
  </g>

  <path class="arrow" d="M375 438H443"/><text class="arrowLabel" x="410" y="415" text-anchor="middle">기록</text>

  <g transform="translate(465 242)"><rect class="card" width="300" height="390" rx="26"/><rect class="stepBadge" x="26" y="26" width="58" height="34" rx="12"/><text class="stepText" x="55" y="49" text-anchor="middle">02</text>
    <rect x="78" y="92" width="144" height="120" rx="16" fill="#ecfdf5" stroke="#0f9f7f" stroke-width="4"/><circle class="green" cx="108" cy="125" r="7"/><line x1="128" y1="125" x2="195" y2="125" stroke="#0f9f7f" stroke-width="4"/><circle class="green" cx="108" cy="155" r="7"/><line x1="128" y1="155" x2="195" y2="155" stroke="#0f9f7f" stroke-width="4"/><circle class="green" cx="108" cy="185" r="7"/><line x1="128" y1="185" x2="195" y2="185" stroke="#0f9f7f" stroke-width="4"/>
    <text class="cardTitle" x="150" y="264" text-anchor="middle">해석·범위 메모</text><text class="action" x="150" y="300" text-anchor="middle">관찰·가설·한계 구분</text><text class="small" x="150" y="328" text-anchor="middle">무엇을 포함했고 무엇을 모르는가?</text><rect class="pill" x="87" y="346" width="126" height="36" rx="13"/><text class="pillText" x="150" y="370" text-anchor="middle">해석 노트</text>
  </g>

  <path class="arrow" d="M785 438H853"/><text class="arrowLabel" x="820" y="415" text-anchor="middle">증거화</text>

  <g transform="translate(875 242)"><rect class="card" width="300" height="390" rx="26"/><rect class="stepBadge" x="26" y="26" width="58" height="34" rx="12"/><text class="stepText" x="55" y="49" text-anchor="middle">03</text>
    <rect x="82" y="92" width="136" height="120" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="4"/><rect class="slate" x="102" y="118" width="96" height="10" rx="3"/><line x1="102" y1="150" x2="198" y2="150" stroke="#334155" stroke-width="4"/><line x1="102" y1="176" x2="182" y2="176" stroke="#334155" stroke-width="4"/>
    <text class="cardTitle" x="150" y="264" text-anchor="middle">Evidence</text><text class="action" x="150" y="300" text-anchor="middle">그래프 + 근거 + 설명</text><text class="small" x="150" y="328" text-anchor="middle">Notebook / images / 실행 결과</text><rect class="pill" x="86" y="346" width="128" height="36" rx="13"/><text class="pillText" x="150" y="370" text-anchor="middle">재현 가능</text>
  </g>

  <path class="arrow" d="M1195 438H1263"/><text class="arrowLabel" x="1230" y="415" text-anchor="middle">요약</text>

  <g transform="translate(1285 242)"><rect class="card" width="300" height="390" rx="26"/><rect class="stepBadge" x="26" y="26" width="58" height="34" rx="12"/><text class="stepText" x="55" y="49" text-anchor="middle">04</text>
    <rect x="80" y="92" width="140" height="120" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="4"/><line x1="103" y1="122" x2="197" y2="122" stroke="#f59e0b" stroke-width="4"/><polyline points="104,182 130,163 154,170 193,140" fill="none" stroke="#f59e0b" stroke-width="5"/>
    <text class="cardTitle" x="150" y="264" text-anchor="middle">보고서·발표</text><text class="action" x="150" y="300" text-anchor="middle">핵심 그래프와 판단 선별</text><text class="small" x="150" y="328" text-anchor="middle">질문·범위·주의사항 함께 제시</text><rect class="pill" x="74" y="346" width="152" height="36" rx="13"/><text class="pillText" x="150" y="370" text-anchor="middle">Markdown · Slide</text>
  </g>

  <rect class="footerBox" x="235" y="700" width="1130" height="56" rx="19"/><text class="footer" x="800" y="736" text-anchor="middle">그래프는 저장에서 끝나지 않습니다. 검증 근거와 해석 한계를 함께 남겨야 의사결정 자료가 됩니다.</text>
</svg>
