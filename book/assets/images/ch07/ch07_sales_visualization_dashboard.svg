<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">온라인 쇼핑몰 주요 시각화 예시 대시보드</title>
  <desc id="desc">Chapter 7의 여섯 가지 대표 시각화를 completed 범위, 상품 마스터, 전체 주문 범위로 구분해 보여 주는 교육용 대시보드</desc>
  <defs>
    <linearGradient id="topLine" x1="0" x2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <filter id="softShadow" x="-14%" y="-14%" width="128%" height="128%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.07"/></filter>
    <style>
      .bg{fill:#f8fafc}.top{fill:url(#topLine)} text{font-family:'Malgun Gothic','맑은 고딕','Pretendard','Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo',sans-serif}
      .title{font-size:46px;font-weight:850;fill:#0f172a}.subtitle{font-size:23px;font-weight:600;fill:#334155}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#softShadow)}.cardTitle{font-size:23px;font-weight:850;fill:#0f172a}.badge{fill:#eff6ff}.badgeText{font-size:16px;font-weight:850;fill:#1d4ed8}.scope{font-size:15px;font-weight:800;fill:#0f766e}.axis{stroke:#64748b;stroke-width:2.5;stroke-linecap:round}.grid{stroke:#e2e8f0;stroke-width:1.5}.tick{font-size:15px;font-weight:700;fill:#475569}.axisLabel{font-size:16px;font-weight:800;fill:#334155}.b1{fill:#2563eb}.b2{fill:#60a5fa}.green{fill:#0f9f7f}.line{fill:none;stroke:#0f9f7f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.hist{fill:#f59e0b}.point{fill:#e11d48;opacity:.9}.navy{fill:#334155}.purple{fill:#7c3aed}.footerBox{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}.footer{font-size:21px;font-weight:750;fill:#1d4ed8}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/><rect class="top" x="70" y="54" width="1460" height="10" rx="5"/>
  <text class="title" x="800" y="124" text-anchor="middle">온라인 쇼핑몰 주요 시각화 예시</text>
  <text class="subtitle" x="800" y="165" text-anchor="middle">그래프마다 질문과 데이터 범위가 다릅니다. 금액성 그래프는 completed 주문 기준을 사용합니다.</text>

  <g transform="translate(70 205)"><rect class="card" width="455" height="255" rx="22"/><text class="cardTitle" x="28" y="42">카테고리별 완료 주문 금액</text><rect class="badge" x="360" y="20" width="66" height="30" rx="10"/><text class="badgeText" x="393" y="41" text-anchor="middle">비교</text><text class="scope" x="28" y="70">범위: completed 주문 상세</text>
    <line class="axis" x1="72" y1="198" x2="410" y2="198"/><line class="axis" x1="72" y1="92" x2="72" y2="198"/><line class="grid" x1="72" y1="132" x2="410" y2="132"/><line class="grid" x1="72" y1="165" x2="410" y2="165"/><rect class="b1" x="106" y="128" width="42" height="70" rx="5"/><rect class="b1" x="184" y="103" width="42" height="95" rx="5"/><rect class="b1" x="262" y="145" width="42" height="53" rx="5"/><rect class="b1" x="340" y="118" width="42" height="80" rx="5"/><text class="tick" x="127" y="226" text-anchor="middle">A</text><text class="tick" x="205" y="226" text-anchor="middle">B</text><text class="tick" x="283" y="226" text-anchor="middle">C</text><text class="tick" x="361" y="226" text-anchor="middle">D</text><text class="axisLabel" x="38" y="150" transform="rotate(-90 38 150)" text-anchor="middle">금액</text>
  </g>

  <g transform="translate(572 205)"><rect class="card" width="455" height="255" rx="22"/><text class="cardTitle" x="28" y="42">월별 완료 주문 금액</text><rect class="badge" x="360" y="20" width="66" height="30" rx="10"/><text class="badgeText" x="393" y="41" text-anchor="middle">추세</text><text class="scope" x="28" y="70">범위: completed + 유효 주문일</text>
    <line class="axis" x1="70" y1="198" x2="414" y2="198"/><line class="axis" x1="70" y1="92" x2="70" y2="198"/><polyline class="line" points="92,176 150,154 208,162 266,124 324,108 382,136"/><circle class="green" cx="92" cy="176" r="6"/><circle class="green" cx="150" cy="154" r="6"/><circle class="green" cx="208" cy="162" r="6"/><circle class="green" cx="266" cy="124" r="6"/><circle class="green" cx="324" cy="108" r="6"/><circle class="green" cx="382" cy="136" r="6"/><text class="tick" x="92" y="226" text-anchor="middle">1월</text><text class="tick" x="208" y="226" text-anchor="middle">3월</text><text class="tick" x="324" y="226" text-anchor="middle">5월</text>
  </g>

  <g transform="translate(1074 205)"><rect class="card" width="455" height="255" rx="22"/><text class="cardTitle" x="28" y="42">상품 가격 분포</text><rect class="badge" x="360" y="20" width="66" height="30" rx="10"/><text class="badgeText" x="393" y="41" text-anchor="middle">분포</text><text class="scope" x="28" y="70">범위: 전체 상품 마스터</text>
    <line class="axis" x1="74" y1="198" x2="410" y2="198"/><line class="axis" x1="74" y1="92" x2="74" y2="198"/><rect class="hist" x="100" y="168" width="34" height="30"/><rect class="hist" x="135" y="140" width="34" height="58"/><rect class="hist" x="170" y="112" width="34" height="86"/><rect class="hist" x="205" y="98" width="34" height="100"/><rect class="hist" x="240" y="116" width="34" height="82"/><rect class="hist" x="275" y="145" width="34" height="53"/><rect class="hist" x="310" y="171" width="34" height="27"/><text class="tick" x="116" y="226" text-anchor="middle">낮음</text><text class="tick" x="222" y="226" text-anchor="middle">중간</text><text class="tick" x="328" y="226" text-anchor="middle">높음</text>
  </g>

  <g transform="translate(70 500)"><rect class="card" width="455" height="255" rx="22"/><text class="cardTitle" x="28" y="42">가격 × 완료 주문 판매 수량</text><rect class="badge" x="360" y="20" width="66" height="30" rx="10"/><text class="badgeText" x="393" y="41" text-anchor="middle">관계</text><text class="scope" x="28" y="70">범위: completed 상품 집계</text>
    <line class="axis" x1="76" y1="198" x2="410" y2="198"/><line class="axis" x1="76" y1="92" x2="76" y2="198"/><circle class="point" cx="112" cy="172" r="7"/><circle class="point" cx="152" cy="146" r="7"/><circle class="point" cx="188" cy="158" r="7"/><circle class="point" cx="224" cy="126" r="7"/><circle class="point" cx="266" cy="138" r="7"/><circle class="point" cx="304" cy="106" r="7"/><circle class="point" cx="342" cy="130" r="7"/><circle class="point" cx="378" cy="98" r="7"/><text class="axisLabel" x="243" y="229" text-anchor="middle">상품 가격</text><text class="axisLabel" x="38" y="150" transform="rotate(-90 38 150)" text-anchor="middle">완료 주문 판매 수량</text>
  </g>

  <g transform="translate(572 500)"><rect class="card" width="455" height="255" rx="22"/><text class="cardTitle" x="28" y="42">완료 주문 금액 상위 익명 고객</text><rect class="badge" x="360" y="20" width="66" height="30" rx="10"/><text class="badgeText" x="393" y="41" text-anchor="middle">순위</text><text class="scope" x="28" y="70">범위: completed 고객 집계</text>
    <line class="axis" x1="132" y1="92" x2="132" y2="216"/><line class="axis" x1="132" y1="216" x2="400" y2="216"/><rect class="navy" x="156" y="92" width="214" height="24" rx="6"/><rect class="navy" x="156" y="126" width="178" height="24" rx="6"/><rect class="navy" x="156" y="160" width="138" height="24" rx="6"/><rect class="navy" x="156" y="194" width="94" height="18" rx="6"/><text class="tick" x="105" y="109" text-anchor="end">고객 01</text><text class="tick" x="105" y="143" text-anchor="end">고객 02</text><text class="tick" x="105" y="177" text-anchor="end">고객 03</text><text class="tick" x="105" y="209" text-anchor="end">고객 04</text>
  </g>

  <g transform="translate(1074 500)"><rect class="card" width="455" height="255" rx="22"/><text class="cardTitle" x="28" y="42">주문 상태별 주문 수</text><rect class="badge" x="360" y="20" width="66" height="30" rx="10"/><text class="badgeText" x="393" y="41" text-anchor="middle">비교</text><text class="scope" x="28" y="70">범위: 전체 orders</text>
    <line class="axis" x1="82" y1="198" x2="410" y2="198"/><line class="axis" x1="82" y1="92" x2="82" y2="198"/><rect class="purple" x="120" y="108" width="54" height="90" rx="5"/><rect class="purple" x="230" y="140" width="54" height="58" rx="5"/><rect class="purple" x="340" y="160" width="54" height="38" rx="5"/><text class="tick" x="147" y="226" text-anchor="middle">completed</text><text class="tick" x="257" y="226" text-anchor="middle">cancelled</text><text class="tick" x="367" y="226" text-anchor="middle">refunded</text>
  </g>

  <rect class="footerBox" x="215" y="812" width="1170" height="54" rx="18"/><text class="footer" x="800" y="846" text-anchor="middle">같은 데이터라도 질문에 따라 범위가 달라집니다. 그래프를 보기 전에 집계표와 source total을 먼저 확인합니다.</text>
</svg>
