<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="820" viewBox="0 0 1700 820" role="img" aria-labelledby="title desc">
  <title id="title">온라인 쇼핑몰 주요 시각화 예시 대시보드</title>
  <desc id="desc">카테고리별 매출, 월별 매출, 가격 분포, 가격과 판매 수량 관계를 한 화면에 요약한 대시보드</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
      .title{font-size:40px;font-weight:800;fill:#fff}.sub{font-size:19px;font-weight:600;fill:#dcfce7}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}
      .ct{font-size:23px;font-weight:800;fill:#0f172a}.axis{stroke:#334155;stroke-width:2}.grid{stroke:#e2e8f0;stroke-width:1}.bar{fill:#bfdbfe;stroke:#60a5fa;stroke-width:1.5}.line{fill:none;stroke:#2563eb;stroke-width:4}.dot{fill:#2563eb}.tick{font-size:13px;font-weight:600;fill:#64748b}.small{font-size:15px;font-weight:650;fill:#475569}.point{fill:#c4b5fd;stroke:#7c3aed;stroke-width:1.5;opacity:.8}.note{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.nt{font-size:17px;font-weight:800;fill:#1d4ed8}
    </style>
  </defs>
  <rect class="bg" width="1700" height="820" rx="34"/>
  <rect class="h" x="55" y="38" width="1590" height="95" rx="28"/>
  <text class="title" x="92" y="96">온라인 쇼핑몰 주요 시각화 예시</text>
  <text class="sub" x="92" y="123">비교, 추세, 분포, 관계를 한 화면에서 요약해 보고서나 발표 자료로 연결합니다</text>

  <g transform="translate(80 170)">
    <rect class="card" width="740" height="270" rx="24"/>
    <text class="ct" x="28" y="44">카테고리별 매출</text>
    <line class="axis" x1="70" y1="220" x2="680" y2="220"/><line class="axis" x1="70" y1="75" x2="70" y2="220"/>
    <line class="grid" x1="70" y1="105" x2="680" y2="105"/><line class="grid" x1="70" y1="150" x2="680" y2="150"/><line class="grid" x1="70" y1="195" x2="680" y2="195"/>
    <rect class="bar" x="120" y="105" width="70" height="115" rx="6"/><rect class="bar" x="245" y="135" width="70" height="85" rx="6"/><rect class="bar" x="370" y="160" width="70" height="60" rx="6"/><rect class="bar" x="495" y="180" width="70" height="40" rx="6"/>
    <text class="tick" x="155" y="244" text-anchor="middle">전자기기</text><text class="tick" x="280" y="244" text-anchor="middle">생활용품</text><text class="tick" x="405" y="244" text-anchor="middle">패션</text><text class="tick" x="530" y="244" text-anchor="middle">식품</text>
  </g>

  <g transform="translate(880 170)">
    <rect class="card" width="740" height="270" rx="24"/>
    <text class="ct" x="28" y="44">월별 매출 추이</text>
    <line class="axis" x1="70" y1="220" x2="680" y2="220"/><line class="axis" x1="70" y1="75" x2="70" y2="220"/>
    <line class="grid" x1="70" y1="105" x2="680" y2="105"/><line class="grid" x1="70" y1="150" x2="680" y2="150"/><line class="grid" x1="70" y1="195" x2="680" y2="195"/>
    <path class="line" d="M105 190 L205 170 L305 178 L405 130 L505 112 L605 145"/>
    <circle class="dot" cx="105" cy="190" r="6"/><circle class="dot" cx="205" cy="170" r="6"/><circle class="dot" cx="305" cy="178" r="6"/><circle class="dot" cx="405" cy="130" r="6"/><circle class="dot" cx="505" cy="112" r="6"/><circle class="dot" cx="605" cy="145" r="6"/>
    <text class="tick" x="105" y="244" text-anchor="middle">1월</text><text class="tick" x="205" y="244" text-anchor="middle">2월</text><text class="tick" x="305" y="244" text-anchor="middle">3월</text><text class="tick" x="405" y="244" text-anchor="middle">4월</text><text class="tick" x="505" y="244" text-anchor="middle">5월</text><text class="tick" x="605" y="244" text-anchor="middle">6월</text>
  </g>

  <g transform="translate(80 485)">
    <rect class="card" width="740" height="260" rx="24"/>
    <text class="ct" x="28" y="44">상품 가격 분포</text>
    <line class="axis" x1="70" y1="210" x2="680" y2="210"/><line class="axis" x1="70" y1="75" x2="70" y2="210"/>
    <rect class="bar" x="115" y="170" width="55" height="40" rx="5"/><rect class="bar" x="180" y="125" width="55" height="85" rx="5"/><rect class="bar" x="245" y="95" width="55" height="115" rx="5"/><rect class="bar" x="310" y="110" width="55" height="100" rx="5"/><rect class="bar" x="375" y="145" width="55" height="65" rx="5"/><rect class="bar" x="440" y="172" width="55" height="38" rx="5"/><rect class="bar" x="505" y="188" width="55" height="22" rx="5"/>
    <text class="tick" x="300" y="238" text-anchor="middle">상품 가격 구간</text><text class="small" x="28" y="75">가격대별 상품 수</text>
  </g>

  <g transform="translate(880 485)">
    <rect class="card" width="740" height="260" rx="24"/>
    <text class="ct" x="28" y="44">상품 가격과 판매 수량 관계</text>
    <line class="axis" x1="70" y1="210" x2="680" y2="210"/><line class="axis" x1="70" y1="75" x2="70" y2="210"/>
    <circle class="point" cx="135" cy="115" r="7"/><circle class="point" cx="180" cy="140" r="7"/><circle class="point" cx="225" cy="122" r="7"/><circle class="point" cx="280" cy="155" r="7"/><circle class="point" cx="350" cy="170" r="7"/><circle class="point" cx="430" cy="150" r="7"/><circle class="point" cx="500" cy="185" r="7"/><circle class="point" cx="585" cy="195" r="7"/>
    <text class="tick" x="370" y="238" text-anchor="middle">상품 가격</text><text class="small" x="28" y="75">총 판매 수량</text>
  </g>

  <rect class="note" x="455" y="770" width="790" height="34" rx="13"/>
  <text class="nt" x="850" y="793" text-anchor="middle">대시보드는 핵심 패턴을 빠르게 보여주지만, 원인 해석은 추가 분석이 필요합니다</text>
</svg>