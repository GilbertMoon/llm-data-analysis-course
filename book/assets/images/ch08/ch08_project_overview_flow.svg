<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">중간 실습 프로젝트 전체 흐름도</title>
  <desc id="desc">원본 CSV 불러오기부터 데이터 점검, 전처리, 분석, 시각화, 해석, 보고서 작성과 최종 제출까지 이어지는 분석 프로젝트 전체 흐름</desc>
  <defs>
    <linearGradient id="topLine" x1="0" x2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="softShadow" x="-14%" y="-14%" width="128%" height="128%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#64748b"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .top{fill:url(#topLine)}
      text{font-family:'Malgun Gothic','맑은 고딕','Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif}
      .title{font-size:48px;font-weight:850;fill:#0f172a}
      .subtitle{font-size:24px;font-weight:600;fill:#334155}
      .sectionBg1{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}
      .sectionBg2{fill:#f5f3ff;stroke:#ddd6fe;stroke-width:2}
      .sectionBg3{fill:#ecfdf5;stroke:#bbf7d0;stroke-width:2}
      .sectionTitle{font-size:25px;font-weight:850;fill:#0f172a}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#softShadow)}
      .num{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.7}
      .numText{font-size:18px;font-weight:900;fill:#1d4ed8}
      .cardTitle{font-size:23px;font-weight:850;fill:#0f172a}
      .desc{font-size:17px;font-weight:700;fill:#475569}
      .pill{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .pillText{font-size:15px;font-weight:850;fill:#1d4ed8}
      .arrow{fill:none;stroke:#64748b;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .iconBlue{stroke:#2563eb;fill:none;stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round}
      .iconGreen{stroke:#0f9f7f;fill:none;stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round}
      .iconOrange{stroke:#f59e0b;fill:none;stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round}
      .iconPurple{stroke:#7c3aed;fill:none;stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round}
      .iconNavy{stroke:#334155;fill:none;stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round}
      .fillBlue{fill:#2563eb}.fillGreen{fill:#0f9f7f}.fillOrange{fill:#f59e0b}.fillPurple{fill:#7c3aed}.fillNavy{fill:#334155}
      .footerBox{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}
      .summary{font-size:23px;font-weight:850;fill:#1d4ed8}
      .footer{font-size:21px;font-weight:750;fill:#0f172a}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect class="top" x="70" y="54" width="1460" height="10" rx="5"/>
  <text class="title" x="800" y="126" text-anchor="middle">중간 실습 프로젝트 전체 흐름도</text>
  <text class="subtitle" x="800" y="168" text-anchor="middle">원본 데이터에서 최종 제출물까지 분석 전 과정을 하나의 흐름으로 연결합니다.</text>

  <g transform="translate(70 205)">
    <rect class="sectionBg1" width="1460" height="160" rx="24"/>
    <text class="sectionTitle" x="34" y="46">1단계 · 데이터 준비</text>

    <g transform="translate(250 18)">
      <rect class="card" width="350" height="124" rx="20"/>
      <rect class="num" x="18" y="18" width="46" height="28" rx="10"/>
      <text class="numText" x="41" y="38" text-anchor="middle">01</text>
      <g transform="translate(28 55)">
        <path class="iconBlue" d="M10 4h42l14 14v54H10z"/>
        <path class="iconBlue" d="M52 4v16h14"/>
        <text x="38" y="43" text-anchor="middle" font-size="16" font-weight="900" fill="#2563eb">CSV</text>
        <path class="iconBlue" d="M24 84h42M18 18h-8v54h8"/>
      </g>
      <text class="cardTitle" x="112" y="48">원본 CSV 불러오기</text>
      <text class="desc" x="112" y="78">customers, products, orders 등</text>
      <rect class="pill" x="112" y="92" width="62" height="24" rx="9"/>
      <text class="pillText" x="143" y="109" text-anchor="middle">CSV</text>
    </g>
    <path class="arrow" d="M615 80H680"/>

    <g transform="translate(700 18)">
      <rect class="card" width="350" height="124" rx="20"/>
      <rect class="num" x="18" y="18" width="46" height="28" rx="10"/>
      <text class="numText" x="41" y="38" text-anchor="middle">02</text>
      <g transform="translate(28 55)">
        <rect x="8" y="10" width="58" height="48" rx="6" class="iconGreen"/>
        <path class="iconGreen" d="M8 26h58M27 10v48M46 10v48"/>
        <circle cx="58" cy="58" r="18" class="iconGreen"/>
        <path class="iconGreen" d="M70 70l14 14"/>
      </g>
      <text class="cardTitle" x="112" y="48">데이터 구조 점검</text>
      <text class="desc" x="112" y="78">파일·컬럼·타입 확인</text>
      <rect class="pill" x="112" y="92" width="92" height="24" rx="9"/>
      <text class="pillText" x="158" y="109" text-anchor="middle">구조 확인</text>
    </g>
    <path class="arrow" d="M1065 80H1130"/>

    <g transform="translate(1150 18)">
      <rect class="card" width="350" height="124" rx="20"/>
      <rect class="num" x="18" y="18" width="46" height="28" rx="10"/>
      <text class="numText" x="41" y="38" text-anchor="middle">03</text>
      <g transform="translate(28 55)">
        <path class="iconOrange" d="M10 10h74L55 43v34l-16 10V43z"/>
        <path class="iconOrange" d="M18 82h56M24 96h44"/>
      </g>
      <text class="cardTitle" x="112" y="48">데이터 전처리</text>
      <text class="desc" x="112" y="78">결측치·중복·타입 정리</text>
      <rect class="pill" x="112" y="92" width="78" height="24" rx="9"/>
      <text class="pillText" x="151" y="109" text-anchor="middle">CLEAN</text>
    </g>
  </g>

  <path class="arrow" d="M1395 365V390H320V402"/>

  <g transform="translate(70 395)">
    <rect class="sectionBg2" width="1460" height="160" rx="24"/>
    <text class="sectionTitle" x="34" y="46">2단계 · 분석 수행</text>

    <g transform="translate(250 18)">
      <rect class="card" width="350" height="124" rx="20"/>
      <rect class="num" x="18" y="18" width="46" height="28" rx="10"/>
      <text class="numText" x="41" y="38" text-anchor="middle">04</text>
      <g transform="translate(28 55)">
        <path class="iconPurple" d="M12 10h68q12 0 12 12v30q0 12-12 12H46L24 82V64H12q-12 0-12-12V22q0-12 12-12z"/>
        <text x="46" y="49" text-anchor="middle" font-size="42" font-weight="900" fill="#7c3aed">?</text>
      </g>
      <text class="cardTitle" x="112" y="48">분석 질문 설계</text>
      <text class="desc" x="112" y="78">답할 수 있는 질문 정의</text>
      <rect class="pill" x="112" y="92" width="100" height="24" rx="9"/>
      <text class="pillText" x="162" y="109" text-anchor="middle">분석 질문</text>
    </g>
    <path class="arrow" d="M615 80H680"/>

    <g transform="translate(700 18)">
      <rect class="card" width="350" height="124" rx="20"/>
      <rect class="num" x="18" y="18" width="46" height="28" rx="10"/>
      <text class="numText" x="41" y="38" text-anchor="middle">05</text>
      <g transform="translate(28 55)">
        <rect x="8" y="16" width="72" height="54" rx="6" class="iconNavy"/>
        <path class="iconNavy" d="M8 34h72M32 16v54M56 16v54"/>
        <text x="102" y="55" text-anchor="middle" font-size="40" font-weight="900" fill="#334155">Σ</text>
      </g>
      <text class="cardTitle" x="112" y="48">pandas 집계 분석</text>
      <text class="desc" x="112" y="78">주요 지표 계산</text>
      <rect class="pill" x="112" y="92" width="82" height="24" rx="9"/>
      <text class="pillText" x="153" y="109" text-anchor="middle">groupby</text>
    </g>
    <path class="arrow" d="M1065 80H1130"/>

    <g transform="translate(1150 18)">
      <rect class="card" width="350" height="124" rx="20"/>
      <rect class="num" x="18" y="18" width="46" height="28" rx="10"/>
      <text class="numText" x="41" y="38" text-anchor="middle">06</text>
      <g transform="translate(28 55)">
        <path class="iconGreen" d="M8 78h86M8 78V12"/>
        <rect class="fillGreen" x="22" y="43" width="12" height="35" rx="2"/>
        <rect class="fillGreen" x="43" y="28" width="12" height="50" rx="2"/>
        <rect class="fillGreen" x="64" y="50" width="12" height="28" rx="2"/>
        <polyline class="iconGreen" points="18,62 38,48 58,54 82,30"/>
      </g>
      <text class="cardTitle" x="112" y="48">데이터 시각화</text>
      <text class="desc" x="112" y="78">그래프로 결과 표현</text>
      <rect class="pill" x="112" y="92" width="62" height="24" rx="9"/>
      <text class="pillText" x="143" y="109" text-anchor="middle">PNG</text>
    </g>
  </g>

  <path class="arrow" d="M1395 555V580H320V592"/>

  <g transform="translate(70 585)">
    <rect class="sectionBg3" width="1460" height="160" rx="24"/>
    <text class="sectionTitle" x="34" y="46">3단계 · 결과 전달</text>

    <g transform="translate(250 18)">
      <rect class="card" width="350" height="124" rx="20"/>
      <rect class="num" x="18" y="18" width="46" height="28" rx="10"/>
      <text class="numText" x="41" y="38" text-anchor="middle">07</text>
      <g transform="translate(28 55)">
        <rect x="10" y="18" width="58" height="46" rx="6" class="iconOrange"/>
        <path class="iconOrange" d="M24 52l13-14 12 8 15-20"/>
        <circle cx="66" cy="62" r="20" class="iconOrange"/>
        <path class="iconOrange" d="M80 76l15 15"/>
      </g>
      <text class="cardTitle" x="112" y="48">결과 해석</text>
      <text class="desc" x="112" y="78">관찰·가설·한계 구분</text>
      <rect class="pill" x="112" y="92" width="82" height="24" rx="9"/>
      <text class="pillText" x="153" y="109" text-anchor="middle">INSIGHT</text>
    </g>
    <path class="arrow" d="M615 80H680"/>

    <g transform="translate(700 18)">
      <rect class="card" width="350" height="124" rx="20"/>
      <rect class="num" x="18" y="18" width="46" height="28" rx="10"/>
      <text class="numText" x="41" y="38" text-anchor="middle">08</text>
      <g transform="translate(28 55)">
        <rect x="16" y="6" width="76" height="84" rx="8" class="iconNavy"/>
        <text x="54" y="36" text-anchor="middle" font-size="22" font-weight="900" fill="#334155">#</text>
        <path class="iconNavy" d="M34 50h40M34 64h44M34 78h32"/>
      </g>
      <text class="cardTitle" x="112" y="48">Markdown 보고서</text>
      <text class="desc" x="112" y="78">분석 목적과 결과 정리</text>
      <rect class="pill" x="112" y="92" width="86" height="24" rx="9"/>
      <text class="pillText" x="155" y="109" text-anchor="middle">Markdown</text>
    </g>
    <path class="arrow" d="M1065 80H1130"/>

    <g transform="translate(1150 18)">
      <rect class="card" width="350" height="124" rx="20"/>
      <rect class="num" x="18" y="18" width="46" height="28" rx="10"/>
      <text class="numText" x="41" y="38" text-anchor="middle">09</text>
      <g transform="translate(28 55)">
        <path class="iconBlue" d="M8 28h34l10 12h56v48H8z"/>
        <path class="iconBlue" d="M46 70l15 15 30-36"/>
        <path class="iconBlue" d="M80 30V8m-13 13L80 8l13 13"/>
      </g>
      <text class="cardTitle" x="112" y="48">최종 제출</text>
      <text class="desc" x="112" y="78">코드·결과·보고서 패키지</text>
      <rect class="pill" x="112" y="92" width="100" height="24" rx="9"/>
      <text class="pillText" x="162" y="109" text-anchor="middle">제출 패키지</text>
    </g>
  </g>

  <rect class="footerBox" x="300" y="780" width="1000" height="78" rx="20"/>
  <text class="summary" x="800" y="814" text-anchor="middle">데이터 확인 → 전처리 → 분석 → 시각화 → 보고서</text>
  <text class="footer" x="800" y="844" text-anchor="middle">중간 프로젝트는 데이터 분석 전 과정을 하나의 재현 가능한 흐름으로 완성하는 실습입니다.</text>
</svg>
