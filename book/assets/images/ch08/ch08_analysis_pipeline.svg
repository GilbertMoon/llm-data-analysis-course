<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">중간 프로젝트 분석 파이프라인</title>
  <desc id="desc">입력 데이터, 처리 과정, 산출물로 구성된 재현 가능한 분석 파이프라인</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#ccfbf1}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.panelHead{fill:#eff6ff;stroke:#bfdbfe}.pt{font-size:29px;font-weight:800;fill:#0f172a}.item{font-size:20px;font-weight:650;fill:#334155}.tag{font-size:17px;font-weight:800;fill:#2563eb}.arr{fill:none;stroke:#2563eb;stroke-width:5;marker-end:url(#arrow)}.note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1600" height="620" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">중간 프로젝트 분석 파이프라인</text>
  <text class="sub" x="86" y="118">재현 가능한 분석은 입력 데이터, 처리 과정, 산출물이 명확해야 합니다</text>

  <g transform="translate(95 180)">
    <rect class="panel" width="360" height="300" rx="24"/>
    <rect class="panelHead" width="360" height="70" rx="24"/>
    <text class="pt" x="28" y="45">Input</text><text class="tag" x="28" y="100">원본 CSV</text>
    <text class="item" x="28" y="140">• customers.csv</text>
    <text class="item" x="28" y="180">• products.csv</text>
    <text class="item" x="28" y="220">• orders.csv</text>
    <text class="item" x="28" y="260">• order_items.csv</text>
  </g>
  <path class="arr" d="M475 330H565"/>
  <g transform="translate(585 160)">
    <rect class="panel" width="430" height="340" rx="24"/>
    <rect class="panelHead" width="430" height="70" rx="24"/>
    <text class="pt" x="28" y="45">Process</text><text class="tag" x="28" y="100">분석 처리 흐름</text>
    <text class="item" x="28" y="138">1. 데이터 점검</text>
    <text class="item" x="28" y="172">2. 전처리</text>
    <text class="item" x="28" y="206">3. 병합</text>
    <text class="item" x="28" y="240">4. 집계</text>
    <text class="item" x="28" y="274">5. 시각화</text>
    <text class="item" x="28" y="308">6. 해석</text>
  </g>
  <path class="arr" d="M1035 330H1125"/>
  <g transform="translate(1145 180)">
    <rect class="panel" width="360" height="300" rx="24"/>
    <rect class="panelHead" width="360" height="70" rx="24"/>
    <text class="pt" x="28" y="45">Output</text><text class="tag" x="28" y="100">결과 산출물</text>
    <text class="item" x="28" y="140">• clean CSV</text>
    <text class="item" x="28" y="180">• 분석 결과 CSV</text>
    <text class="item" x="28" y="220">• 그래프 이미지</text>
    <text class="item" x="28" y="260">• Markdown 보고서</text>
  </g>

  <rect class="note" x="370" y="535" width="860" height="42" rx="14"/>
  <text class="noteText" x="800" y="563" text-anchor="middle">입력, 처리 과정, 산출물이 명확해야 같은 결과를 다시 만들 수 있습니다</text>
</svg>