<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">중간 프로젝트 분석 파이프라인</title>
  <desc id="desc">customers, products, orders, order_items 원본 CSV가 데이터 점검, 전처리, 병합, 집계, 시각화와 해석 과정을 거쳐 CSV 결과, 그래프, Markdown 보고서와 Notebook으로 저장되는 분석 파이프라인</desc>
  <defs>
    <linearGradient id="topLine" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softShadow" x="-14%" y="-14%" width="128%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#64748b"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .top{fill:url(#topLine)}
      text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}
      .mono{font-family:'D2Coding','JetBrains Mono','Consolas',monospace}
      .title{font-size:48px;font-weight:850;fill:#0f172a}
      .subtitle{font-size:24px;font-weight:600;fill:#334155}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#softShadow)}
      .headInput{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}
      .headProcess{fill:#eef2ff;stroke:#c7d2fe;stroke-width:2}
      .headOutput{fill:#ecfdf5;stroke:#bbf7d0;stroke-width:2}
      .num{fill:#fff;stroke:#93c5fd;stroke-width:2}
      .numText{font-size:18px;font-weight:900;fill:#1d4ed8}
      .en{font-size:24px;font-weight:900;fill:#1d4ed8}
      .ko{font-size:31px;font-weight:850;fill:#0f172a}
      .panelDesc{font-size:18px;font-weight:700;fill:#475569}
      .row{fill:#fff;stroke:#dbeafe;stroke-width:1.7}
      .rowProcess{fill:#fff;stroke:#ddd6fe;stroke-width:1.7}
      .rowOutput{fill:#fff;stroke:#bbf7d0;stroke-width:1.7}
      .badge{font-size:14px;font-weight:900;fill:#1d4ed8}
      .badgeBox{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.4}
      .outBadge{font-size:13px;font-weight:900;fill:#047857}
      .outBadgeBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.4}
      .fileText{font-size:19px;font-weight:750;fill:#334155}
      .stepTitle{font-size:20px;font-weight:850;fill:#0f172a}
      .stepDesc{font-size:15px;font-weight:700;fill:#64748b}
      .summary{font-size:17px;font-weight:850;fill:#475569}
      .arrow{fill:none;stroke:#64748b;stroke-width:6;stroke-linecap:round;marker-end:url(#arrow)}
      .arrowLabel{font-size:18px;font-weight:850;fill:#475569}
      .iconBlue{stroke:#2563eb;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .iconPurple{stroke:#4f46e5;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .iconGreen{stroke:#0f9f7f;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .fillBlue{fill:#2563eb}.fillPurple{fill:#4f46e5}.fillGreen{fill:#0f9f7f}
      .footerBox{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}
      .footer{font-size:22px;font-weight:750;fill:#1d4ed8}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect class="top" x="70" y="54" width="1460" height="10" rx="5"/>
  <text class="title" x="800" y="126" text-anchor="middle">중간 프로젝트 분석 파이프라인</text>
  <text class="subtitle" x="800" y="168" text-anchor="middle">입력 데이터가 처리 과정을 거쳐 재현 가능한 산출물로 이어집니다.</text>

  <g transform="translate(70 220)">
    <rect class="panel" width="405" height="520" rx="26"/>
    <rect class="headInput" x="24" y="24" width="357" height="142" rx="20"/>
    <rect class="num" x="44" y="45" width="48" height="32" rx="11"/>
    <text class="numText" x="68" y="67" text-anchor="middle">01</text>
    <g transform="translate(248 46) scale(0.72)">
      <path class="iconBlue" d="M16 12h62l20 20v78H16z"/>
      <path class="iconBlue" d="M78 12v22h20"/>
      <path class="iconBlue" d="M34 54h44M34 72h44M34 90h34"/>
      <rect x="78" y="86" width="52" height="28" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text class="mono" x="104" y="105" text-anchor="middle" font-size="16" font-weight="900" fill="#2563eb">CSV</text>
    </g>
    <text class="en" x="44" y="108">INPUT</text>
    <text class="ko" x="44" y="142">입력 데이터</text>
    <text class="panelDesc" x="44" y="196">분석에 사용할 원본 CSV 파일</text>

    <g transform="translate(44 224)">
      <rect class="row" width="318" height="46" rx="13"/>
      <rect class="badgeBox" x="14" y="11" width="48" height="24" rx="8"/>
      <text class="badge mono" x="38" y="28" text-anchor="middle">CSV</text>
      <text class="fileText mono" x="78" y="30">customers.csv</text>
    </g>
    <g transform="translate(44 282)">
      <rect class="row" width="318" height="46" rx="13"/>
      <rect class="badgeBox" x="14" y="11" width="48" height="24" rx="8"/>
      <text class="badge mono" x="38" y="28" text-anchor="middle">CSV</text>
      <text class="fileText mono" x="78" y="30">products.csv</text>
    </g>
    <g transform="translate(44 340)">
      <rect class="row" width="318" height="46" rx="13"/>
      <rect class="badgeBox" x="14" y="11" width="48" height="24" rx="8"/>
      <text class="badge mono" x="38" y="28" text-anchor="middle">CSV</text>
      <text class="fileText mono" x="78" y="30">orders.csv</text>
    </g>
    <g transform="translate(44 398)">
      <rect class="row" width="318" height="46" rx="13"/>
      <rect class="badgeBox" x="14" y="11" width="48" height="24" rx="8"/>
      <text class="badge mono" x="38" y="28" text-anchor="middle">CSV</text>
      <text class="fileText mono" x="78" y="30">order_items.csv</text>
    </g>
    <text class="summary" x="203" y="488" text-anchor="middle">원본 파일 4개</text>
  </g>

  <path class="arrow" d="M505 480H573"/>
  <text class="arrowLabel" x="539" y="445" text-anchor="middle">분석 실행</text>

  <g transform="translate(595 220)">
    <rect class="panel" width="455" height="520" rx="26"/>
    <rect class="headProcess" x="24" y="24" width="407" height="142" rx="20"/>
    <rect class="num" x="44" y="45" width="48" height="32" rx="11"/>
    <text class="numText" x="68" y="67" text-anchor="middle">02</text>
    <g transform="translate(266 48) scale(0.72)">
      <rect x="14" y="14" width="74" height="62" rx="10" class="iconPurple"/>
      <path class="iconPurple" d="M14 34h74M38 14v62M64 14v62"/>
      <circle cx="110" cy="78" r="24" class="iconPurple"/>
      <path class="iconPurple" d="M126 94l20 20"/>
      <text x="50" y="112" text-anchor="middle" font-size="30" font-weight="900" fill="#4f46e5">Σ</text>
    </g>
    <text class="en" x="44" y="108" fill="#4f46e5">PROCESS</text>
    <text class="ko" x="44" y="142">처리 과정</text>
    <text class="panelDesc" x="44" y="196">입력 데이터를 분석 결과로 변환하는 단계</text>

    <g transform="translate(44 220)">
      <rect class="rowProcess" width="367" height="43" rx="13"/>
      <rect class="num" x="12" y="8" width="42" height="27" rx="9"/>
      <text class="numText" x="33" y="28" text-anchor="middle">01</text>
      <text class="stepTitle" x="68" y="27">데이터 점검</text>
      <text class="stepDesc" x="212" y="27">파일·컬럼·타입 확인</text>
    </g>
    <g transform="translate(44 270)">
      <rect class="rowProcess" width="367" height="43" rx="13"/>
      <rect class="num" x="12" y="8" width="42" height="27" rx="9"/>
      <text class="numText" x="33" y="28" text-anchor="middle">02</text>
      <text class="stepTitle" x="68" y="27">전처리</text>
      <text class="stepDesc" x="212" y="27">결측치·중복·타입 정리</text>
    </g>
    <g transform="translate(44 320)">
      <rect class="rowProcess" width="367" height="43" rx="13"/>
      <rect class="num" x="12" y="8" width="42" height="27" rx="9"/>
      <text class="numText" x="33" y="28" text-anchor="middle">03</text>
      <text class="stepTitle" x="68" y="27">병합</text>
      <text class="stepDesc" x="212" y="27">분석용 데이터 연결</text>
    </g>
    <g transform="translate(44 370)">
      <rect class="rowProcess" width="367" height="43" rx="13"/>
      <rect class="num" x="12" y="8" width="42" height="27" rx="9"/>
      <text class="numText" x="33" y="28" text-anchor="middle">04</text>
      <text class="stepTitle" x="68" y="27">집계</text>
      <text class="stepDesc" x="212" y="27">주요 지표 계산</text>
    </g>
    <g transform="translate(44 420)">
      <rect class="rowProcess" width="367" height="43" rx="13"/>
      <rect class="num" x="12" y="8" width="42" height="27" rx="9"/>
      <text class="numText" x="33" y="28" text-anchor="middle">05</text>
      <text class="stepTitle" x="68" y="27">시각화</text>
      <text class="stepDesc" x="212" y="27">그래프로 결과 표현</text>
    </g>
    <g transform="translate(44 470)">
      <rect class="rowProcess" width="367" height="43" rx="13"/>
      <rect class="num" x="12" y="8" width="42" height="27" rx="9"/>
      <text class="numText" x="33" y="28" text-anchor="middle">06</text>
      <text class="stepTitle" x="68" y="27">해석</text>
      <text class="stepDesc" x="212" y="27">관찰·가설·한계 구분</text>
    </g>
  </g>

  <path class="arrow" d="M1080 480H1148"/>
  <text class="arrowLabel" x="1114" y="445" text-anchor="middle">결과 저장</text>

  <g transform="translate(1170 220)">
    <rect class="panel" width="360" height="520" rx="26"/>
    <rect class="headOutput" x="24" y="24" width="312" height="142" rx="20"/>
    <rect class="num" x="44" y="45" width="48" height="32" rx="11"/>
    <text class="numText" x="68" y="67" text-anchor="middle">03</text>
    <g transform="translate(218 50) scale(0.72)">
      <path class="iconGreen" d="M8 42h42l12 14h84v70H8z"/>
      <path class="iconGreen" d="M58 96l18 18 38-48"/>
      <path class="iconGreen" d="M106 36V12m-13 13 13-13 13 13"/>
    </g>
    <text class="en" x="44" y="108" fill="#047857">OUTPUT</text>
    <text class="ko" x="44" y="142">결과 산출물</text>
    <text class="panelDesc" x="44" y="196">저장되는 재현 가능한 결과</text>

    <g transform="translate(44 218)">
      <rect class="rowOutput" width="272" height="44" rx="13"/>
      <rect class="outBadgeBox" x="14" y="10" width="48" height="24" rx="8"/>
      <text class="outBadge mono" x="38" y="27" text-anchor="middle">CSV</text>
      <text class="fileText" x="78" y="29">clean CSV</text>
    </g>
    <g transform="translate(44 270)">
      <rect class="rowOutput" width="272" height="44" rx="13"/>
      <rect class="outBadgeBox" x="14" y="10" width="48" height="24" rx="8"/>
      <text class="outBadge mono" x="38" y="27" text-anchor="middle">CSV</text>
      <text class="fileText" x="78" y="29">분석 결과 CSV</text>
    </g>
    <g transform="translate(44 322)">
      <rect class="rowOutput" width="272" height="44" rx="13"/>
      <rect class="outBadgeBox" x="14" y="10" width="48" height="24" rx="8"/>
      <text class="outBadge mono" x="38" y="27" text-anchor="middle">PNG</text>
      <text class="fileText" x="78" y="29">그래프 PNG</text>
    </g>
    <g transform="translate(44 374)">
      <rect class="rowOutput" width="272" height="44" rx="13"/>
      <rect class="outBadgeBox" x="14" y="10" width="48" height="24" rx="8"/>
      <text class="outBadge mono" x="38" y="27" text-anchor="middle">MD</text>
      <text class="fileText" x="78" y="29">Markdown 보고서</text>
    </g>
    <g transform="translate(44 426)">
      <rect class="rowOutput" width="272" height="44" rx="13"/>
      <rect class="outBadgeBox" x="14" y="10" width="58" height="24" rx="8"/>
      <text class="outBadge mono" x="43" y="27" text-anchor="middle">IPYNB</text>
      <text class="fileText" x="86" y="29">Notebook</text>
    </g>
    <text class="summary" x="180" y="500" text-anchor="middle">결과 산출물 5개</text>
  </g>

  <rect class="footerBox" x="300" y="792" width="1000" height="56" rx="19"/>
  <text class="footer" x="800" y="828" text-anchor="middle">재현 가능한 분석은 입력 데이터, 처리 기준, 산출물이 명확해야 합니다.</text>
</svg>
