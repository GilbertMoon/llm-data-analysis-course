<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">중간 프로젝트 분석 질문 맵</title>
  <desc id="desc">온라인 쇼핑몰 중간 프로젝트를 중심으로 다섯 가지 분석 질문과 주요 지표를 연결한 교육용 도식이다. 모든 연결선은 박스의 외곽 테두리에서 시작하고 끝난다.</desc>
  <defs>
    <style>
      .title { font: 700 32px 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #1f3b63; }
      .box-title { font: 700 16px 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #243b5a; }
      .box-sub { font: 400 12px 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #445b78; }
      .center-title { font: 700 17px 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #1f3b63; }
      .footer { font: 600 14px 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #38516f; }
      .box { fill: #ffffff; stroke: #9dc3ff; stroke-width: 2; }
      .footer-box { fill: #eef5ff; stroke: #b7cff7; stroke-width: 2; }
      .connector { stroke: #8fa4bf; stroke-width: 5; stroke-linecap: round; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f3f5f7"/>
  <rect x="0" y="0" width="1600" height="18" fill="#2a5fda"/>

  <text class="title" x="80" y="88">중간 프로젝트 분석 질문 맵</text>

  <g id="connectors">
    <line class="connector" x1="620" y1="396" x2="540" y2="240"/>
    <line class="connector" x1="980" y1="396" x2="1060" y2="240"/>
    <line class="connector" x1="620" y1="432" x2="540" y2="610"/>
    <line class="connector" x1="980" y1="432" x2="1060" y2="610"/>
    <line class="connector" x1="800" y1="470" x2="800" y2="620"/>
  </g>

  <g id="left-top">
    <rect class="box" x="180" y="190" rx="24" ry="24" width="360" height="100"/>
    <text class="box-title" x="360" y="223" text-anchor="middle">카테고리별 매출은?</text>
    <text class="box-sub" x="360" y="264" text-anchor="middle">total_sales / sales_ratio</text>
  </g>

  <g id="right-top">
    <rect class="box" x="1060" y="190" rx="24" ry="24" width="360" height="100"/>
    <text class="box-title" x="1240" y="223" text-anchor="middle">월별 매출 흐름은?</text>
    <text class="box-sub" x="1240" y="264" text-anchor="middle">order_month / order_count</text>
  </g>

  <g id="center-box">
    <rect class="box" x="620" y="350" rx="28" ry="28" width="360" height="120"/>
    <text class="center-title" x="800" y="406" text-anchor="middle">온라인 쇼핑몰 중간 프로젝트</text>
  </g>

  <g id="left-bottom">
    <rect class="box" x="180" y="560" rx="24" ry="24" width="360" height="100"/>
    <text class="box-title" x="360" y="593" text-anchor="middle">구매 금액 상위 고객은?</text>
    <text class="box-sub" x="360" y="634" text-anchor="middle">total_sales / avg_order_value</text>
  </g>

  <g id="bottom-center">
    <rect class="box" x="620" y="620" rx="24" ry="24" width="360" height="100"/>
    <text class="box-title" x="800" y="653" text-anchor="middle">가격과 판매 수량 관계는?</text>
    <text class="box-sub" x="800" y="694" text-anchor="middle">price / total_quantity</text>
  </g>

  <g id="right-bottom">
    <rect class="box" x="1060" y="560" rx="24" ry="24" width="360" height="100"/>
    <text class="box-title" x="1240" y="593" text-anchor="middle">주문 상태 분포는?</text>
    <text class="box-sub" x="1240" y="634" text-anchor="middle">order_status / order_count</text>
  </g>

  <g id="footer">
    <rect class="footer-box" x="120" y="790" rx="18" ry="18" width="1360" height="56"/>
    <text class="footer" x="800" y="825" text-anchor="middle">분석 질문은 계산할 지표와 결과 형태를 함께 정해야 합니다.</text>
  </g>
</svg>
