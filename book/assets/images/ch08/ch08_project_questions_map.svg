<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">중간 프로젝트 분석 질문 맵</title>
  <desc id="desc">온라인 쇼핑몰 중간 프로젝트의 분석 질문과 계산 지표를 연결한 맵</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#ede9fe}
      .hub{fill:#fff;stroke:#a78bfa;stroke-width:3;filter:url(#shadow)}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.line{stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 8}.main{font-size:25px;font-weight:900;fill:#0f172a}.q{font-size:21px;font-weight:800;fill:#1d4ed8}.m{font-size:17px;font-weight:650;fill:#475569}.note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1600" height="720" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">중간 프로젝트 분석 질문 맵</text>
  <text class="sub" x="86" y="118">분석 질문은 계산 가능한 지표와 연결되어야 합니다</text>

  <circle class="hub" cx="800" cy="380" r="105"/>
  <text class="main" x="800" y="362" text-anchor="middle">온라인 쇼핑몰</text>
  <text class="main" x="800" y="394" text-anchor="middle">중간 프로젝트</text>
  <text class="m" x="800" y="428" text-anchor="middle">질문 → 지표 → 해석</text>

  <line class="line" x1="718" y1="320" x2="400" y2="210"/><line class="line" x1="800" y1="275" x2="800" y2="200"/><line class="line" x1="882" y1="320" x2="1200" y2="210"/><line class="line" x1="710" y1="442" x2="410" y2="555"/><line class="line" x1="890" y1="442" x2="1190" y2="555"/>

  <g transform="translate(155 165)"><rect class="card" width="390" height="130" rx="24"/><text class="q" x="28" y="44">카테고리별 매출은?</text><text class="m" x="28" y="80">지표: total_sales</text><text class="m" x="28" y="108">지표: sales_ratio</text></g>
  <g transform="translate(605 155)"><rect class="card" width="390" height="130" rx="24"/><text class="q" x="28" y="44">월별 매출 흐름은?</text><text class="m" x="28" y="80">지표: order_month</text><text class="m" x="28" y="108">지표: order_count</text></g>
  <g transform="translate(1055 165)"><rect class="card" width="390" height="130" rx="24"/><text class="q" x="28" y="44">구매 금액 상위 고객은?</text><text class="m" x="28" y="80">지표: total_sales</text><text class="m" x="28" y="108">지표: avg_order_value</text></g>
  <g transform="translate(155 515)"><rect class="card" width="390" height="130" rx="24"/><text class="q" x="28" y="44">주문 상태 분포는?</text><text class="m" x="28" y="80">지표: order_status</text><text class="m" x="28" y="108">지표: order_count</text></g>
  <g transform="translate(1055 515)"><rect class="card" width="390" height="130" rx="24"/><text class="q" x="28" y="44">가격과 판매 수량 관계는?</text><text class="m" x="28" y="80">지표: price</text><text class="m" x="28" y="108">지표: total_quantity</text></g>

  <rect class="note" x="510" y="655" width="580" height="38" rx="14"/>
  <text class="noteText" x="800" y="681" text-anchor="middle">현재 데이터로 답할 수 있는 질문부터 프로젝트를 설계합니다</text>
</svg>