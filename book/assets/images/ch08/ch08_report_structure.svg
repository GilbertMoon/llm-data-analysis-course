<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">중간 프로젝트 보고서 구조</title>
  <desc id="desc">중간 프로젝트 보고서의 주요 섹션과 포함 내용을 문서 구조로 표현</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#e2e8f0}
      .doc{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.sec{fill:#f8fafc;stroke:#dbeafe;stroke-width:2}.num{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.nt{font-size:15px;font-weight:900;fill:#2563eb}.st{font-size:20px;font-weight:800;fill:#0f172a}.desc{font-size:15px;font-weight:650;fill:#64748b}.side{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.sideText{font-size:19px;font-weight:800;fill:#166534}.note{fill:#fff7ed;stroke:#fdba74;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#9a3412}
    </style>
  </defs>
  <rect class="bg" width="1600" height="640" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">중간 프로젝트 보고서 구조</text>
  <text class="sub" x="86" y="118">보고서는 코드 설명서가 아니라 목적, 결과, 해석, 한계를 정리한 문서입니다</text>

  <g transform="translate(120 165)">
    <rect class="doc" width="880" height="405" rx="28"/>
    <text x="42" y="52" font-size="28" font-weight="900" fill="#0f172a">Chapter 8 중간 프로젝트 보고서</text>
    <g transform="translate(42 85)"><rect class="sec" width="380" height="60" rx="16"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="36" text-anchor="middle">1</text><text class="st" x="58" y="27">분석 목적</text><text class="desc" x="58" y="49">무엇을 알고 싶은지 설명</text></g>
    <g transform="translate(458 85)"><rect class="sec" width="380" height="60" rx="16"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="36" text-anchor="middle">2</text><text class="st" x="58" y="27">데이터 개요</text><text class="desc" x="58" y="49">파일과 주요 컬럼 정리</text></g>
    <g transform="translate(42 165)"><rect class="sec" width="380" height="60" rx="16"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="36" text-anchor="middle">3</text><text class="st" x="58" y="27">전처리 내용</text><text class="desc" x="58" y="49">처리 기준과 전후 비교</text></g>
    <g transform="translate(458 165)"><rect class="sec" width="380" height="60" rx="16"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="36" text-anchor="middle">4</text><text class="st" x="58" y="27">분석 질문</text><text class="desc" x="58" y="49">현재 데이터로 답할 질문</text></g>
    <g transform="translate(42 245)"><rect class="sec" width="380" height="60" rx="16"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="36" text-anchor="middle">5</text><text class="st" x="58" y="27">주요 분석 결과</text><text class="desc" x="58" y="49">집계표와 그래프 중심</text></g>
    <g transform="translate(458 245)"><rect class="sec" width="380" height="60" rx="16"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="36" text-anchor="middle">6</text><text class="st" x="58" y="27">그래프와 해석</text><text class="desc" x="58" y="49">관찰과 추가 질문</text></g>
    <g transform="translate(42 325)"><rect class="sec" width="380" height="60" rx="16"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="36" text-anchor="middle">7</text><text class="st" x="58" y="27">한계점</text><text class="desc" x="58" y="49">현재 데이터로 알 수 없는 것</text></g>
    <g transform="translate(458 325)"><rect class="sec" width="380" height="60" rx="16"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="36" text-anchor="middle">8</text><text class="st" x="58" y="27">다음 단계</text><text class="desc" x="58" y="49">추가 분석과 개선 방향</text></g>
  </g>

  <g transform="translate(1080 210)">
    <rect class="side" width="360" height="260" rx="24"/>
    <text class="sideText" x="40" y="58">보고서에 함께 넣을 것</text>
    <text class="sideText" x="40" y="105">• 표</text>
    <text class="sideText" x="40" y="145">• 그래프</text>
    <text class="sideText" x="40" y="185">• 해석 메모</text>
    <text class="sideText" x="40" y="225">• 체크리스트</text>
  </g>
  <rect class="note" x="345" y="590" width="910" height="36" rx="14"/>
  <text class="noteText" x="800" y="614" text-anchor="middle">좋은 보고서는 분석 목적, 결과, 해석, 한계가 함께 정리되어야 합니다</text>
</svg>