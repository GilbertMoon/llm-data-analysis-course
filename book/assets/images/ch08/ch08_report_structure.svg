<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">중간 프로젝트 보고서 구조</title>
  <desc id="desc">분석 목적, 데이터 개요, 전처리, 분석 질문, 주요 결과, 결과 해석, 한계와 다음 단계로 구성된 중간 프로젝트 보고서 구조와 표, 그래프, 해석, 체크리스트의 역할</desc>
  <defs>
    <linearGradient id="topLine" x1="0" x2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softShadow" x="-14%" y="-14%" width="128%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <style>
      .bg{fill:#f8fafc}
      .top{fill:url(#topLine)}
      text{font-family:'Malgun Gothic','맑은 고딕','Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif}
      .title{font-size:48px;font-weight:850;fill:#0f172a}
      .subtitle{font-size:24px;font-weight:600;fill:#334155}
      .doc,.side{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#softShadow)}
      .docHead{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}
      .docTitle{font-size:30px;font-weight:900;fill:#0f172a}
      .docMeta{font-size:17px;font-weight:850;fill:#1d4ed8}
      .group{font-size:17px;font-weight:900;fill:#475569}
      .sec{fill:#f8fafc;stroke:#bfdbfe;stroke-width:1.8}
      .secResult{fill:#f0fdfa;stroke:#99f6e4;stroke-width:1.8}
      .secReview{fill:#fff7ed;stroke:#fed7aa;stroke-width:1.8}
      .num{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.6}
      .nt{font-size:16px;font-weight:900;fill:#2563eb}
      .st{font-size:22px;font-weight:850;fill:#0f172a}
      .sd{font-size:16px;font-weight:700;fill:#475569}
      .sideTitle{font-size:27px;font-weight:900;fill:#0f172a}
      .sideDesc{font-size:17px;font-weight:700;fill:#475569}
      .elem{fill:#fff;stroke:#cbd5e1;stroke-width:1.8}
      .elemName{font-size:22px;font-weight:850;fill:#0f172a}
      .elemDesc{font-size:16px;font-weight:700;fill:#475569}
      .rel{font-size:14px;font-weight:850;fill:#1d4ed8}
      .relBox{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.2}
      .iconTeal{stroke:#0f9f7f;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
      .iconBlue{stroke:#2563eb;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
      .iconOrange{stroke:#f59e0b;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
      .iconGreen{stroke:#16a34a;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
      .fillBlue{fill:#2563eb}.fillTeal{fill:#0f9f7f}.fillOrange{fill:#f59e0b}
      .footerBox{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}
      .flow{font-size:22px;font-weight:850;fill:#1d4ed8}
      .footer{font-size:21px;font-weight:750;fill:#0f172a}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect class="top" x="70" y="54" width="1460" height="10" rx="5"/>
  <text class="title" x="800" y="126" text-anchor="middle">중간 프로젝트 보고서 구조</text>
  <text class="subtitle" x="800" y="168" text-anchor="middle">분석 목적부터 결과, 해석, 한계와 다음 단계까지 체계적으로 정리합니다.</text>

  <g transform="translate(70 215)">
    <rect class="doc" width="990" height="560" rx="28"/>
    <rect class="docHead" x="30" y="28" width="930" height="74" rx="20"/>
    <text class="docTitle" x="58" y="73">Chapter 8 중간 프로젝트 보고서</text>
    <text class="docMeta" x="720" y="73">보고서 기본 구성 · 8개 섹션</text>

    <text class="group" x="46" y="132">분석 설계</text>
    <g transform="translate(46 148)">
      <rect class="sec" width="430" height="70" rx="16"/>
      <rect class="num" x="18" y="18" width="42" height="28" rx="10"/>
      <text class="nt" x="39" y="38" text-anchor="middle">01</text>
      <text class="st" x="76" y="31">분석 목적</text>
      <text class="sd" x="76" y="56">무엇을 알고 싶은지 설명</text>
    </g>
    <g transform="translate(514 148)">
      <rect class="sec" width="430" height="70" rx="16"/>
      <rect class="num" x="18" y="18" width="42" height="28" rx="10"/>
      <text class="nt" x="39" y="38" text-anchor="middle">02</text>
      <text class="st" x="76" y="31">데이터 개요</text>
      <text class="sd" x="76" y="56">사용한 파일과 주요 컬럼</text>
    </g>
    <g transform="translate(46 232)">
      <rect class="sec" width="430" height="70" rx="16"/>
      <rect class="num" x="18" y="18" width="42" height="28" rx="10"/>
      <text class="nt" x="39" y="38" text-anchor="middle">03</text>
      <text class="st" x="76" y="31">전처리 내용</text>
      <text class="sd" x="76" y="56">결측치·중복·타입 처리 기준</text>
    </g>
    <g transform="translate(514 232)">
      <rect class="sec" width="430" height="70" rx="16"/>
      <rect class="num" x="18" y="18" width="42" height="28" rx="10"/>
      <text class="nt" x="39" y="38" text-anchor="middle">04</text>
      <text class="st" x="76" y="31">분석 질문</text>
      <text class="sd" x="76" y="56">현재 데이터로 답할 질문</text>
    </g>

    <text class="group" x="46" y="342">결과와 해석</text>
    <g transform="translate(46 358)">
      <rect class="secResult" width="430" height="70" rx="16"/>
      <rect class="num" x="18" y="18" width="42" height="28" rx="10"/>
      <text class="nt" x="39" y="38" text-anchor="middle">05</text>
      <text class="st" x="76" y="31">주요 분석 결과</text>
      <text class="sd" x="76" y="56">집계표와 그래프로 결과 제시</text>
    </g>
    <g transform="translate(514 358)">
      <rect class="secResult" width="430" height="70" rx="16"/>
      <rect class="num" x="18" y="18" width="42" height="28" rx="10"/>
      <text class="nt" x="39" y="38" text-anchor="middle">06</text>
      <text class="st" x="76" y="31">결과 해석</text>
      <text class="sd" x="76" y="56">관찰 내용과 추가 확인 사항</text>
    </g>

    <text class="group" x="46" y="468">검토와 확장</text>
    <g transform="translate(46 484)">
      <rect class="secReview" width="430" height="70" rx="16"/>
      <rect class="num" x="18" y="18" width="42" height="28" rx="10"/>
      <text class="nt" x="39" y="38" text-anchor="middle">07</text>
      <text class="st" x="76" y="31">한계점</text>
      <text class="sd" x="76" y="56">현재 데이터로 알 수 없는 것</text>
    </g>
    <g transform="translate(514 484)">
      <rect class="secReview" width="430" height="70" rx="16"/>
      <rect class="num" x="18" y="18" width="42" height="28" rx="10"/>
      <text class="nt" x="39" y="38" text-anchor="middle">08</text>
      <text class="st" x="76" y="31">다음 단계</text>
      <text class="sd" x="76" y="56">추가 분석과 개선 방향</text>
    </g>
  </g>

  <g transform="translate(1100 215)">
    <rect class="side" width="430" height="560" rx="28"/>
    <text class="sideTitle" x="34" y="58">보고서에 포함할 핵심 요소</text>
    <text class="sideDesc" x="34" y="88">분석 주장을 뒷받침하는 근거와 검증 자료</text>

    <g transform="translate(34 120)">
      <rect class="elem" width="362" height="78" rx="16"/>
      <g transform="translate(20 18)">
        <rect class="iconTeal" width="46" height="40" rx="5"/>
        <path class="iconTeal" d="M0 14h46M15 0v40M31 0v40"/>
      </g>
      <text class="elemName" x="86" y="31">표</text>
      <text class="elemDesc" x="86" y="56">수치와 집계 결과 정리</text>
      <rect class="relBox" x="274" y="20" width="66" height="26" rx="9"/>
      <text class="rel" x="307" y="38" text-anchor="middle">05 결과</text>
    </g>
    <g transform="translate(34 212)">
      <rect class="elem" width="362" height="78" rx="16"/>
      <g transform="translate(20 18)">
        <path class="iconBlue" d="M2 40h56M2 40V4"/>
        <rect class="fillBlue" x="13" y="20" width="8" height="20" rx="2"/>
        <rect class="fillBlue" x="29" y="10" width="8" height="30" rx="2"/>
        <rect class="fillBlue" x="45" y="26" width="8" height="14" rx="2"/>
      </g>
      <text class="elemName" x="86" y="31">그래프</text>
      <text class="elemDesc" x="86" y="56">차이와 흐름을 시각화</text>
      <rect class="relBox" x="274" y="20" width="66" height="26" rx="9"/>
      <text class="rel" x="307" y="38" text-anchor="middle">05 결과</text>
    </g>
    <g transform="translate(34 304)">
      <rect class="elem" width="362" height="78" rx="16"/>
      <g transform="translate(20 18)">
        <rect class="iconOrange" x="2" y="4" width="42" height="32" rx="5"/>
        <path class="iconOrange" d="M13 29l9-9 8 5 10-14"/>
        <circle class="iconOrange" cx="45" cy="42" r="13"/>
        <path class="iconOrange" d="M55 52l12 12"/>
      </g>
      <text class="elemName" x="86" y="31">해석</text>
      <text class="elemDesc" x="86" y="56">관찰 결과와 의미 설명</text>
      <rect class="relBox" x="274" y="20" width="66" height="26" rx="9"/>
      <text class="rel" x="307" y="38" text-anchor="middle">06 해석</text>
    </g>
    <g transform="translate(34 396)">
      <rect class="elem" width="362" height="78" rx="16"/>
      <g transform="translate(20 18)">
        <rect class="iconGreen" x="8" y="2" width="48" height="58" rx="7"/>
        <path class="iconGreen" d="M20 18l6 6 12-14M20 35l6 6 12-14M20 52l6 6 12-14"/>
      </g>
      <text class="elemName" x="86" y="31">체크리스트</text>
      <text class="elemDesc" x="86" y="56">오류와 누락 여부 검토</text>
      <rect class="relBox" x="254" y="20" width="86" height="26" rx="9"/>
      <text class="rel" x="297" y="38" text-anchor="middle">전체 검토</text>
    </g>
  </g>

  <rect class="footerBox" x="245" y="800" width="1110" height="76" rx="20"/>
  <text class="flow" x="800" y="833" text-anchor="middle">목적 → 데이터 → 처리 → 질문 → 결과 → 해석 → 한계 → 다음 단계</text>
  <text class="footer" x="800" y="862" text-anchor="middle">좋은 보고서는 분석 목적, 근거, 결과, 해석과 한계를 하나의 이야기로 연결합니다.</text>
</svg>
