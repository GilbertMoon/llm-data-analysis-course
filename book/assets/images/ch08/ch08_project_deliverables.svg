<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">중간 실습 프로젝트 제출물 구성</title>
  <desc id="desc">Notebook, CSV 분석 결과, 그래프 이미지, Markdown 보고서와 LLM 활용 내역 및 체크리스트를 포함한 검증 자료가 하나의 최종 제출 패키지로 구성되는 프로젝트 산출물 안내</desc>
  <defs>
    <linearGradient id="topLine" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="softShadow" x="-14%" y="-14%" width="128%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#94a3b8"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .top{fill:url(#topLine)}
      text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}
      .mono{font-family:'D2Coding','JetBrains Mono','Consolas',monospace}
      .title{font-size:48px;font-weight:850;fill:#0f172a}
      .subtitle{font-size:24px;font-weight:600;fill:#334155}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#softShadow)}
      .center{fill:#fff;stroke:#a78bfa;stroke-width:2.5;filter:url(#softShadow)}
      .num{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.6}
      .numText{font-size:17px;font-weight:900;fill:#1d4ed8}
      .type{font-size:14px;font-weight:900;fill:#1d4ed8}
      .typeBox{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.4}
      .cardTitle{font-size:25px;font-weight:900;fill:#0f172a}
      .role{font-size:17px;font-weight:750;fill:#475569}
      .file{font-size:15px;font-weight:750;fill:#334155}
      .check{font-size:15px;font-weight:850;fill:#1d4ed8}
      .line{fill:none;stroke:#94a3b8;stroke-width:3.5;stroke-linecap:round;marker-end:url(#arrow)}
      .centerTitle{font-size:28px;font-weight:900;fill:#0f172a}
      .centerDesc{font-size:19px;font-weight:750;fill:#475569}
      .centerList{font-size:16px;font-weight:850;fill:#4f46e5}
      .iconBlue{stroke:#2563eb;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
      .iconTeal{stroke:#0f9f7f;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
      .iconOrange{stroke:#f59e0b;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
      .iconPurple{stroke:#4f46e5;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
      .iconGreen{stroke:#16a34a;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
      .fillBlue{fill:#2563eb}.fillTeal{fill:#0f9f7f}.fillOrange{fill:#f59e0b}.fillPurple{fill:#4f46e5}.fillGreen{fill:#16a34a}
      .footerBox{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}
      .flow{font-size:22px;font-weight:850;fill:#1d4ed8}
      .footer{font-size:21px;font-weight:750;fill:#0f172a}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect class="top" x="70" y="54" width="1460" height="10" rx="5"/>
  <text class="title" x="800" y="126" text-anchor="middle">중간 실습 프로젝트 제출물 구성</text>
  <text class="subtitle" x="800" y="168" text-anchor="middle">코드, 결과 파일, 그래프, 보고서와 검증 기록을 하나의 패키지로 정리합니다.</text>

  <path class="line" d="M335 395 C455 455 548 470 636 484"/>
  <path class="line" d="M800 405 V468"/>
  <path class="line" d="M1265 395 C1145 455 1052 470 964 484"/>
  <path class="line" d="M565 650 C610 618 636 600 636 572"/>
  <path class="line" d="M1035 650 C990 618 964 600 964 572"/>

  <g transform="translate(70 220)">
    <rect class="card" width="390" height="190" rx="24"/>
    <rect class="num" x="22" y="18" width="46" height="28" rx="10"/>
    <text class="numText" x="45" y="38" text-anchor="middle">01</text>
    <rect class="typeBox" x="306" y="18" width="62" height="28" rx="10"/>
    <text class="type mono" x="337" y="37" text-anchor="middle">IPYNB</text>
    <g transform="translate(28 58)">
      <rect class="iconBlue" x="0" y="0" width="74" height="74" rx="10"/>
      <line class="iconBlue" x1="0" y1="22" x2="74" y2="22"/>
      <path class="iconBlue" d="M16 42h42M16 58h26"/>
      <polygon points="18,10 18,18 27,14" class="fillBlue"/>
    </g>
    <text class="cardTitle" x="122" y="76">Notebook</text>
    <text class="role" x="122" y="103">전체 분석 코드와 실행 결과</text>
    <text class="file mono" x="122" y="130">notebooks/</text>
    <text class="file mono" x="122" y="151">ch08_midterm_project.ipynb</text>
    <text class="check" x="122" y="174">✓ 전체 셀 실행 확인</text>
  </g>

  <g transform="translate(605 220)">
    <rect class="card" width="390" height="190" rx="24"/>
    <rect class="num" x="22" y="18" width="46" height="28" rx="10"/>
    <text class="numText" x="45" y="38" text-anchor="middle">02</text>
    <rect class="typeBox" x="300" y="18" width="68" height="28" rx="10"/>
    <text class="type mono" x="334" y="37" text-anchor="middle">CSV × 4</text>
    <g transform="translate(28 60)">
      <rect class="iconTeal" x="0" y="0" width="76" height="62" rx="8"/>
      <path class="iconTeal" d="M0 20h76M25 0v62M51 0v62"/>
      <rect x="45" y="49" width="52" height="25" rx="9" fill="#ecfdf5" stroke="#0f9f7f" stroke-width="3"/>
      <text class="mono" x="71" y="67" text-anchor="middle" font-size="14" font-weight="900" fill="#047857">CSV</text>
    </g>
    <text class="cardTitle" x="122" y="76">CSV 결과</text>
    <text class="role" x="122" y="103">요약표와 집계 결과</text>
    <text class="file" x="122" y="130">결과 CSV 4개</text>
    <text class="file" x="122" y="151">요약·카테고리·월별·고객 결과</text>
    <text class="check" x="122" y="174">✓ 컬럼과 저장 경로 확인</text>
  </g>

  <g transform="translate(1140 220)">
    <rect class="card" width="390" height="190" rx="24"/>
    <rect class="num" x="22" y="18" width="46" height="28" rx="10"/>
    <text class="numText" x="45" y="38" text-anchor="middle">03</text>
    <rect class="typeBox" x="300" y="18" width="68" height="28" rx="10"/>
    <text class="type mono" x="334" y="37" text-anchor="middle">PNG × 3</text>
    <g transform="translate(28 58)">
      <path class="iconOrange" d="M0 0h62l18 18v70H0z"/>
      <path class="iconOrange" d="M62 0v20h18"/>
      <path class="iconOrange" d="M16 68h48M16 68V34"/>
      <rect class="fillOrange" x="24" y="47" width="8" height="21" rx="2"/>
      <rect class="fillOrange" x="40" y="37" width="8" height="31" rx="2"/>
      <polyline class="iconOrange" points="18,55 35,42 50,48 66,30"/>
    </g>
    <text class="cardTitle" x="122" y="76">그래프 이미지</text>
    <text class="role" x="122" y="103">주요 결과를 시각적으로 표현</text>
    <text class="file" x="122" y="130">그래프 PNG 3개</text>
    <text class="file" x="122" y="151">카테고리 · 월별 · 상위 고객</text>
    <text class="check" x="122" y="174">✓ 제목·축·레이블 확인</text>
  </g>

  <g transform="translate(70 560)">
    <rect class="card" width="430" height="195" rx="24"/>
    <rect class="num" x="22" y="18" width="46" height="28" rx="10"/>
    <text class="numText" x="45" y="38" text-anchor="middle">04</text>
    <rect class="typeBox" x="354" y="18" width="54" height="28" rx="10"/>
    <text class="type mono" x="381" y="37" text-anchor="middle">MD</text>
    <g transform="translate(28 62)">
      <rect class="iconPurple" x="0" y="0" width="72" height="82" rx="10"/>
      <text x="36" y="34" text-anchor="middle" font-size="25" font-weight="900" fill="#4f46e5">#</text>
      <path class="iconPurple" d="M18 48h36M18 62h42"/>
    </g>
    <text class="cardTitle" x="122" y="78">Markdown 보고서</text>
    <text class="role" x="122" y="105">분석 목적, 결과, 해석과 한계 정리</text>
    <text class="file mono" x="122" y="133">reports/</text>
    <text class="file mono" x="122" y="154">ch08_midterm_report.md</text>
    <text class="check" x="122" y="178">✓ 표·그래프·해석 연결 확인</text>
  </g>

  <g transform="translate(1100 560)">
    <rect class="card" width="430" height="195" rx="24"/>
    <rect class="num" x="22" y="18" width="46" height="28" rx="10"/>
    <text class="numText" x="45" y="38" text-anchor="middle">05</text>
    <rect class="typeBox" x="306" y="18" width="102" height="28" rx="10"/>
    <text class="type mono" x="357" y="37" text-anchor="middle">LLM · CHECK</text>
    <g transform="translate(28 62)">
      <path class="iconGreen" d="M4 4h56q10 0 10 10v28q0 10-10 10H36L20 68V52H14Q4 52 4 42V14Q4 4 14 4z"/>
      <rect class="iconGreen" x="82" y="8" width="54" height="70" rx="8"/>
      <path class="iconGreen" d="M94 25l6 6 14-16M94 45l6 6 14-16M94 65l6 6 14-16"/>
    </g>
    <text class="cardTitle" x="182" y="78">검증 자료</text>
    <text class="role" x="182" y="105">과정과 결과의 검토 기록</text>
    <text class="file" x="182" y="133">LLM 활용 내역</text>
    <text class="file" x="182" y="154">체크리스트</text>
    <text class="check" x="182" y="178">✓ 데이터와 실제 결과 대조</text>
  </g>

  <g transform="translate(570 452)">
    <rect class="center" width="460" height="182" rx="28"/>
    <g transform="translate(34 34)">
      <path class="iconPurple" d="M0 22h48l14 16h104v70H0z"/>
      <path class="iconPurple" d="M54 78l18 18 38-48"/>
    </g>
    <text class="centerTitle" x="320" y="58" text-anchor="middle">최종 제출 패키지</text>
    <text class="centerDesc" x="320" y="88" text-anchor="middle">코드·결과·보고서·검증 기록</text>
    <text class="centerList" x="320" y="118" text-anchor="middle">Notebook · CSV · PNG · MD</text>
    <text class="centerList" x="320" y="142" text-anchor="middle">LLM 활용 내역 · 체크리스트</text>
  </g>

  <rect class="footerBox" x="255" y="800" width="1090" height="76" rx="20"/>
  <text class="flow" x="800" y="833" text-anchor="middle">실행 확인 → 파일 확인 → 해석 검토 → 최종 제출</text>
  <text class="footer" x="800" y="862" text-anchor="middle">프로젝트 제출물은 코드와 결과뿐 아니라 재현 및 검증 기록까지 함께 포함해야 합니다.</text>
</svg>
