<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">VS Code에서 Notebook을 열고 실행하는 흐름</title><desc id="desc">프로젝트 폴더를 열고 notebooks 폴더에서 실습 Notebook 파일을 열어 커널을 선택하고 첫 번째 셀을 실행하는 순서를 단계별로 설명하는 그림</desc><rect width="1600" height="920" rx="28" fill="#f8fafc"/><rect x="50" y="40" width="1500" height="100" rx="26" fill="#2563eb"/><text x="90" y="98" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="38" font-weight="900" fill="#fff">VS Code에서 Notebook을 열고 실행하는 흐름</text><text x="90" y="128" font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif" font-size="18" font-weight="600" fill="#dbeafe">Explorer에서 파일을 열고, 커널을 선택한 뒤, 첫 번째 셀을 실행해 정상 동작을 확인합니다.</text><g font-family="Pretendard,Noto Sans KR,Malgun Gothic,sans-serif"><rect x="80" y="190" width="690" height="270" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="130" cy="240" r="26" fill="#2563eb"/><text x="130" y="247" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">1</text><text x="175" y="248" font-size="24" font-weight="900" fill="#0f172a">Notebook 파일 열기</text><text x="110" y="292" font-size="18" font-weight="600" fill="#334155">Explorer에서 notebooks 폴더를 열고</text><text x="110" y="322" font-size="18" font-weight="600" fill="#334155">ch02_environment_setup.ipynb 파일을 클릭합니다.</text><rect x="430" y="255" width="280" height="150" rx="16" fill="#111827"/><text x="455" y="285" font-size="14" font-weight="700" fill="#e5e7eb">EXPLORER</text><rect x="455" y="302" width="220" height="28" rx="8" fill="#dbeafe"/><text x="467" y="321" font-size="15" font-weight="600" fill="#334155">notebooks/</text><rect x="472" y="338" width="205" height="36" rx="10" fill="#1d4ed8"/><text x="485" y="361" font-size="15" font-weight="600" fill="#fff">ch02_environment_setup.ipynb</text><text x="110" y="372" font-size="16" font-weight="600" fill="#64748b">파일이 열리면 상단 탭에 Notebook 이름이 보입니다.</text><rect x="830" y="190" width="690" height="270" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="880" cy="240" r="26" fill="#2563eb"/><text x="880" y="247" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">2</text><text x="925" y="248" font-size="24" font-weight="900" fill="#0f172a">커널 선택</text><text x="860" y="292" font-size="18" font-weight="600" fill="#334155">첫 실행 시 Select Kernel 창이 뜨면</text><text x="860" y="322" font-size="18" font-weight="600" fill="#334155">Python Environments... → .venv를 선택합니다.</text><rect x="1150" y="248" width="300" height="150" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="1178" y="284" font-size="16" font-weight="700" fill="#0f172a">Select Kernel</text><rect x="1176" y="304" width="246" height="34" rx="8" fill="#dbeafe"/><text x="1188" y="327" font-size="15" font-weight="600" fill="#334155">Python Environments...</text><rect x="1176" y="345" width="246" height="34" rx="8" fill="#eff6ff"/><text x="1188" y="368" font-size="15" font-weight="600" fill="#334155">.venv (Python 3.11.x)</text><text x="860" y="372" font-size="16" font-weight="600" fill="#64748b">터미널의 (.venv)와 Notebook 커널 선택은 별도입니다.</text><rect x="80" y="500" width="690" height="270" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="130" cy="550" r="26" fill="#2563eb"/><text x="130" y="557" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">3</text><text x="175" y="558" font-size="24" font-weight="900" fill="#0f172a">첫 번째 셀 실행</text><text x="110" y="598" font-size="18" font-weight="600" fill="#334155">첫 코드 셀은 import와 기본 경로 설정입니다.</text><rect x="102" y="618" width="640" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="122" y="648" font-family="Consolas,D2Coding,monospace" font-size="16" font-weight="700" fill="#0f172a">from pathlib import Path</text><text x="122" y="676" font-family="Consolas,D2Coding,monospace" font-size="16" font-weight="700" fill="#0f172a">import pandas as pd</text><text x="122" y="704" font-family="Consolas,D2Coding,monospace" font-size="16" font-weight="700" fill="#0f172a">DATA_DIR = Path('../data/raw')</text><text x="110" y="760" font-size="16" font-weight="600" fill="#64748b">셀 왼쪽의 실행 버튼(▶) 또는 Shift+Enter로 실행합니다.</text><rect x="830" y="500" width="690" height="270" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="880" cy="550" r="26" fill="#2563eb"/><text x="880" y="557" text-anchor="middle" font-size="20" font-weight="900" fill="#fff">4</text><text x="925" y="558" font-size="24" font-weight="900" fill="#0f172a">정상 실행 확인</text><text x="860" y="598" font-size="18" font-weight="600" fill="#334155">초록 체크 표시가 보이면 정상 실행입니다.</text><text x="860" y="626" font-size="18" font-weight="600" fill="#334155">처음에는 Matplotlib font cache 메시지가</text><text x="860" y="654" font-size="18" font-weight="600" fill="#334155">잠깐 보일 수 있는데 오류가 아닙니다.</text><rect x="1150" y="606" width="310" height="96" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="1175" y="638" font-size="15" font-weight="600" fill="#334155">✓ 30.8s</text><text x="1175" y="666" font-size="15" font-weight="600" fill="#334155">Matplotlib is building the font cache;</text><text x="1175" y="690" font-size="15" font-weight="600" fill="#334155">this may take a moment.</text><rect x="240" y="815" width="1120" height="56" rx="18" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/><text x="800" y="850" text-anchor="middle" font-size="18" font-weight="800" fill="#155e75">핵심: Notebook 열기 → .venv 커널 선택 → 첫 셀 실행 → 초록 체크 확인</text></g></svg>