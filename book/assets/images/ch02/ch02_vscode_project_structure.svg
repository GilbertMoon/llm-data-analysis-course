<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px 'Malgun Gothic','맑은 고딕','Arial','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Malgun Gothic','맑은 고딕','Arial','Noto Sans KR',sans-serif; fill: #334155; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 20; ry: 20; }
      .folder { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.5; rx: 10; ry: 10; }
      .file { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; rx: 8; ry: 8; }
      .name { font: 700 21px 'Malgun Gothic','맑은 고딕','Arial','Noto Sans KR',sans-serif; fill: #0f172a; }
      .text { font: 500 17px 'Malgun Gothic','맑은 고딕','Arial','Noto Sans KR',sans-serif; fill: #334155; }
      .mono { font: 500 16px 'Malgun Gothic','맑은 고딕','Consolas','Courier New',monospace; fill: #1e293b; }
      .line { stroke: #94a3b8; stroke-width: 2; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760" />
  <text x="600" y="56" text-anchor="middle" class="title">VS Code 프로젝트 폴더 구조 예시</text>
  <text x="600" y="88" text-anchor="middle" class="subtitle">데이터, 코드, 결과물의 위치를 미리 정해 두면 실습과 프로젝트 관리가 쉬워진다.</text>

  <rect x="70" y="126" width="470" height="560" class="panel" />
  <text x="104" y="164" class="name">my-llm-data-analysis-course/</text>
  <line x1="110" y1="182" x2="110" y2="628" class="line" />

  <rect x="132" y="194" width="150" height="34" class="folder" />
  <text x="148" y="217" class="mono">data/</text>
  <text x="300" y="217" class="text">원본 · 외부 데이터 저장</text>
  <line x1="150" y1="228" x2="150" y2="286" class="line" />
  <rect x="172" y="246" width="170" height="32" class="folder" />
  <text x="188" y="267" class="mono">raw/</text>
  <text x="360" y="267" class="text">샘플 CSV 파일</text>

  <rect x="132" y="302" width="150" height="34" class="folder" />
  <text x="148" y="325" class="mono">notebooks/</text>
  <text x="300" y="325" class="text">주차별 Notebook 실습</text>

  <rect x="132" y="356" width="150" height="34" class="folder" />
  <text x="148" y="379" class="mono">scripts/</text>
  <text x="300" y="379" class="text">반복 실행 코드</text>

  <rect x="132" y="410" width="150" height="34" class="folder" />
  <text x="148" y="433" class="mono">reports/</text>
  <text x="300" y="433" class="text">분석 결과와 보고서</text>

  <rect x="132" y="464" width="150" height="34" class="folder" />
  <text x="148" y="487" class="mono">book/</text>
  <text x="300" y="487" class="text">ebook 원고와 관련 자료</text>

  <rect x="132" y="530" width="170" height="30" class="file" />
  <text x="148" y="550" class="mono">.env.example</text>
  <text x="320" y="550" class="text">환경변수 예시</text>

  <rect x="132" y="570" width="170" height="30" class="file" />
  <text x="148" y="590" class="mono">.gitignore</text>
  <text x="320" y="590" class="text">업로드 제외 목록</text>

  <rect x="132" y="610" width="170" height="30" class="file" />
  <text x="148" y="630" class="mono">README.md</text>
  <text x="320" y="630" class="text">프로젝트 설명</text>

  <rect x="132" y="650" width="170" height="30" class="file" />
  <text x="148" y="670" class="mono">requirements.txt</text>
  <text x="320" y="670" class="text">패키지 목록</text>

  <rect x="610" y="126" width="520" height="560" class="panel" />
  <text x="650" y="168" class="name">이 구조를 쓰면 좋은 이유</text>

  <rect x="646" y="204" width="460" height="74" class="folder" />
  <text x="670" y="234" class="name">1. 파일 위치가 명확해진다</text>
  <text x="670" y="260" class="text">데이터, 코드, 보고서가 섞이지 않아 경로 오류를 줄일 수 있다.</text>

  <rect x="646" y="304" width="460" height="74" class="folder" />
  <text x="670" y="334" class="name">2. 재현이 쉬워진다</text>
  <text x="670" y="360" class="text">같은 구조로 프로젝트를 다시 실행하기 쉽다.</text>

  <rect x="646" y="404" width="460" height="74" class="folder" />
  <text x="670" y="434" class="name">3. GitHub 관리가 쉬워진다</text>
  <text x="670" y="460" class="text">변경 이력과 결과물을 구분해서 정리할 수 있다.</text>

  <rect x="646" y="504" width="460" height="112" class="folder" />
  <text x="670" y="534" class="name">4. 이후 장으로 자연스럽게 이어진다</text>
  <text x="670" y="560" class="text">CSV, Notebook, scripts, reports,</text>
  <text x="670" y="584" class="text">자동화 구조를 계속 활용한다.</text>
  <text x="670" y="608" class="text">처음 정리한 폴더 구조가 전체 분석 흐름의 뼈대가 된다.</text>
</svg>
