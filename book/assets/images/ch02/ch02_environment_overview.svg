<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">VS Code 중심 실습 환경 전체 구성도</title>
  <desc id="desc">VS Code를 중심으로 Python, 가상환경, Notebook, GitHub, 샘플 데이터, 보고서가 연결되는 전체 실습 환경을 보여주는 도식</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px 'Arial', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Arial', 'Noto Sans KR', sans-serif; fill: #334155; }
      .boxTitle { font: 700 24px 'Arial', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .boxText { font: 500 18px 'Arial', 'Noto Sans KR', sans-serif; fill: #334155; }
      .centerText { font: 700 28px 'Arial', 'Noto Sans KR', sans-serif; fill: #ffffff; }
      .centerSub { font: 500 18px 'Arial', 'Noto Sans KR', sans-serif; fill: #dbeafe; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; ry: 18; }
      .centerCard { fill: #2563eb; stroke: #1d4ed8; stroke-width: 3; rx: 26; ry: 26; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" width="1200" height="720" />
  <text x="600" y="58" text-anchor="middle" class="title">VS Code 중심 실습 환경 전체 구성도</text>
  <text x="600" y="90" text-anchor="middle" class="subtitle">데이터 분석 프로젝트에서 여러 도구가 어떻게 하나의 작업 흐름으로 연결되는지 보여준다.</text>

  <rect x="400" y="240" width="400" height="160" class="centerCard" />
  <text x="600" y="305" text-anchor="middle" class="centerText">VS Code</text>
  <text x="600" y="340" text-anchor="middle" class="centerSub">코드 작성 · 터미널 실행 · 파일 관리 · Git 확인</text>

  <rect x="110" y="120" width="260" height="110" class="card" />
  <text x="240" y="160" text-anchor="middle" class="boxTitle">Python</text>
  <text x="240" y="192" text-anchor="middle" class="boxText">데이터 읽기, 전처리,</text>
  <text x="240" y="216" text-anchor="middle" class="boxText">시각화, 머신러닝 실행</text>

  <rect x="830" y="120" width="260" height="110" class="card" />
  <text x="960" y="160" text-anchor="middle" class="boxTitle">GitHub</text>
  <text x="960" y="192" text-anchor="middle" class="boxText">원본 자료 확인,</text>
  <text x="960" y="216" text-anchor="middle" class="boxText">개인 저장소 관리</text>

  <rect x="90" y="460" width="280" height="120" class="card" />
  <text x="230" y="503" text-anchor="middle" class="boxTitle">가상환경 (.venv)</text>
  <text x="230" y="536" text-anchor="middle" class="boxText">프로젝트별 패키지 분리</text>
  <text x="230" y="560" text-anchor="middle" class="boxText">requirements.txt와 함께 관리</text>

  <rect x="460" y="500" width="280" height="120" class="card" />
  <text x="600" y="543" text-anchor="middle" class="boxTitle">Notebook (.ipynb)</text>
  <text x="600" y="576" text-anchor="middle" class="boxText">코드와 결과를 함께 확인</text>
  <text x="600" y="600" text-anchor="middle" class="boxText">VS Code 안에서 간단히 실행</text>

  <rect x="830" y="460" width="280" height="120" class="card" />
  <text x="970" y="503" text-anchor="middle" class="boxTitle">데이터 · 보고서</text>
  <text x="970" y="536" text-anchor="middle" class="boxText">data / reports / scripts</text>
  <text x="970" y="560" text-anchor="middle" class="boxText">실습 파일과 결과물 저장</text>

  <path d="M 400 275 C 350 250, 330 230, 320 220" class="arrow" />
  <path d="M 800 275 C 850 250, 870 230, 880 220" class="arrow" />
  <path d="M 470 395 C 390 430, 340 450, 290 470" class="arrow" />
  <path d="M 600 400 L 600 495" class="arrow" />
  <path d="M 730 395 C 810 430, 860 450, 910 470" class="arrow" />
</svg>