<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">VS Code에서 Notebook을 실행하는 화면 예시</title>
  <desc id="desc">VS Code 안에서 Jupyter Notebook 파일을 열고 코드 셀과 출력 결과를 확인하는 예시 화면</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px 'Malgun Gothic','맑은 고딕','Arial','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Malgun Gothic','맑은 고딕','Arial','Noto Sans KR',sans-serif; fill: #334155; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 20; ry: 20; }
      .topbar { fill: #e2e8f0; }
      .sidebar { fill: #f1f5f9; }
      .editor { fill: #ffffff; }
      .cellCode { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; rx: 14; ry: 14; }
      .cellOut { fill: #f8fafc; stroke: #dbeafe; stroke-width: 1.5; rx: 14; ry: 14; }
      .label { font: 700 22px 'Malgun Gothic','맑은 고딕','Arial','Noto Sans KR',sans-serif; fill: #0f172a; }
      .text { font: 500 17px 'Malgun Gothic','맑은 고딕','Consolas','Courier New',monospace; fill: #1e293b; }
      .small { font: 500 16px 'Malgun Gothic','맑은 고딕','Arial','Noto Sans KR',sans-serif; fill: #475569; }
      .chip { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; rx: 10; ry: 10; }
      .chipText { font: 600 15px 'Malgun Gothic','맑은 고딕','Arial','Noto Sans KR',sans-serif; fill: #1d4ed8; }
      .icon { fill: #94a3b8; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760" />
  <text x="600" y="56" text-anchor="middle" class="title">VS Code에서 Notebook을 실행하는 화면 예시</text>
  <text x="600" y="88" text-anchor="middle" class="subtitle">Notebook은 별도 웹 환경보다 VS Code 안에서 가볍게 열어 실행하는 방식으로 사용한다.</text>

  <rect x="80" y="120" width="1040" height="560" class="frame" />
  <rect x="80" y="120" width="1040" height="46" class="topbar" rx="20" ry="20" />
  <rect x="80" y="155" width="76" height="525" class="sidebar" />
  <rect x="156" y="166" width="964" height="514" class="editor" />

  <circle cx="112" cy="143" r="6" fill="#f87171" />
  <circle cx="132" cy="143" r="6" fill="#fbbf24" />
  <circle cx="152" cy="143" r="6" fill="#34d399" />

  <text x="220" y="147" class="small">notebooks / ch02_environment_setup.ipynb</text>
  <rect x="910" y="131" width="165" height="24" class="chip" />
  <text x="992" y="148" text-anchor="middle" class="chipText">Kernel: .venv</text>

  <circle cx="117" cy="198" r="8" class="icon" />
  <circle cx="117" cy="238" r="8" class="icon" />
  <circle cx="117" cy="278" r="8" class="icon" />
  <circle cx="117" cy="318" r="8" class="icon" />
  <circle cx="117" cy="358" r="8" class="icon" />

  <text x="188" y="206" class="label">Notebook 셀 1: CSV 파일 읽기</text>
  <rect x="178" y="220" width="880" height="140" class="cellCode" />
  <text x="200" y="255" class="text">import pandas as pd</text>
  <text x="200" y="287" class="text">customers = pd.read_csv("data/raw/customers.csv")</text>
  <text x="200" y="319" class="text">display(customers.head())</text>
  <text x="200" y="351" class="text">print(customers.shape)</text>

  <text x="188" y="405" class="label">출력 결과</text>
  <rect x="178" y="418" width="880" height="110" class="cellOut" />
  <text x="200" y="452" class="text">customer_id   name        city      age</text>
  <text x="200" y="482" class="text">1             Kim         Seoul     29</text>
  <text x="200" y="510" class="text">2             Lee         Busan     35</text>

  <text x="188" y="575" class="label">Notebook 메모</text>
  <rect x="178" y="588" width="880" height="60" class="cellOut" />
  <text x="200" y="625" class="small">출력 결과를 보고 데이터의 컬럼 구조와 행 개수를 짧게 메모해 두면 이후 EDA와 보고서 작성에 도움이 된다.</text>
</svg>