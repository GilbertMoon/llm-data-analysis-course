<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">결측치 중복 이상값 전처리 개념도</title>
  <desc id="desc">전처리에서 자주 만나는 세 가지 핵심 문제와 확인 포인트</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Malgun Gothic','맑은 고딕','Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif}
      .title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#ede9fe}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)} .main{font-size:30px;font-weight:800;fill:#0f172a}.desc{font-size:17px;font-weight:650;fill:#475569}.pt{font-size:18px;font-weight:700;fill:#1e293b}
      .headTag{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.tagText{font-size:16px;font-weight:900;fill:#2563eb}
      .foot{fill:#fff7ed;stroke:#fdba74;stroke-width:2}.ft{font-size:20px;font-weight:800;fill:#9a3412}
    </style>
  </defs>
  <rect class="bg" width="1600" height="560" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">결측치 · 중복 · 이상값 전처리 개념</text>
  <text class="sub" x="86" y="118">무조건 삭제하기보다 값의 의미와 분석 목적을 먼저 확인합니다</text>

  <g transform="translate(95 185)">
    <rect class="card" width="430" height="265" rx="24"/>
    <rect class="headTag" x="30" y="24" width="82" height="28" rx="14"/><text class="tagText" x="71" y="43" text-anchor="middle">문제 1</text>
    <text class="main" x="30" y="88">결측치</text>
    <text class="desc" x="30" y="122">비어 있는 값은 모두 같은 의미가 아닙니다.</text>
    <text class="pt" x="30" y="164">• 삭제</text>
    <text class="pt" x="30" y="196">• 평균·중앙값·최빈값 대체</text>
    <text class="pt" x="30" y="228">• Unknown 같은 별도 범주 처리</text>
    <text class="pt" x="30" y="260">• 질문: 왜 비어 있는가?</text>
  </g>

  <g transform="translate(585 185)">
    <rect class="card" width="430" height="265" rx="24"/>
    <rect class="headTag" x="30" y="24" width="82" height="28" rx="14"/><text class="tagText" x="71" y="43" text-anchor="middle">문제 2</text>
    <text class="main" x="30" y="88">중복</text>
    <text class="desc" x="30" y="122">중복은 항상 오류가 아닐 수 있습니다.</text>
    <text class="pt" x="30" y="164">• 전체 행 중복 확인</text>
    <text class="pt" x="30" y="196">• 고유 ID 중복 확인</text>
    <text class="pt" x="30" y="228">• 자연스러운 반복인지 판단</text>
    <text class="pt" x="30" y="260">• 질문: 어떤 컬럼이 고유해야 하는가?</text>
  </g>

  <g transform="translate(1075 185)">
    <rect class="card" width="430" height="265" rx="24"/>
    <rect class="headTag" x="30" y="24" width="82" height="28" rx="14"/><text class="tagText" x="71" y="43" text-anchor="middle">문제 3</text>
    <text class="main" x="30" y="88">이상값</text>
    <text class="desc" x="30" y="122">범위를 벗어난 값도 실제 의미가 있을 수 있습니다.</text>
    <text class="pt" x="30" y="164">• 0원 상품, 음수 수량 확인</text>
    <text class="pt" x="30" y="196">• 입력 오류인지 업무 의미인지 판단</text>
    <text class="pt" x="30" y="228">• 처리 기준을 기록으로 남기기</text>
    <text class="pt" x="30" y="260">• 질문: 삭제 전에 확인했는가?</text>
  </g>

  <rect class="foot" x="360" y="485" width="880" height="42" rx="14"/>
  <text class="ft" x="800" y="513" text-anchor="middle">핵심 원칙: 자동 처리보다 의미 확인이 먼저다</text>
</svg>