<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">데이터 전처리 실습 흐름도</title>
  <desc id="desc">실습에서 데이터를 불러온 뒤 결측치, 중복, 문자열, 타입, 이상값, 저장까지 순서대로 진행하는 흐름</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#ea580c"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#fffaf5}.h{fill:url(#head)} text{font-family:'Malgun Gothic','맑은 고딕','Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif}
      .title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#ffedd5}
      .node{fill:#fff;stroke:#fed7aa;stroke-width:2;filter:url(#shadow)} .main{font-size:23px;font-weight:800;fill:#0f172a}.desc{font-size:16px;font-weight:650;fill:#64748b}
      .num{fill:#fff7ed;stroke:#fdba74;stroke-width:1.5}.nt{font-size:17px;font-weight:900;fill:#c2410c}.arr{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="600" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">데이터 전처리 실습 흐름</text>
  <text class="sub" x="86" y="118">Notebook에서 따라 하는 전처리 순서와 핵심 점검 포인트</text>

  <g transform="translate(80 190)"><rect class="node" width="220" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">1</text><text class="main" x="62" y="42">데이터 불러오기</text><text class="desc" x="24" y="72">raw CSV 읽기</text></g>
  <path class="arr" d="M300 238H360"/>
  <g transform="translate(375 190)"><rect class="node" width="220" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">2</text><text class="main" x="62" y="42">작업 복사본 생성</text><text class="desc" x="24" y="72">copy() 사용</text></g>
  <path class="arr" d="M595 238H655"/>
  <g transform="translate(670 190)"><rect class="node" width="220" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">3</text><text class="main" x="62" y="42">결측치 확인</text><text class="desc" x="24" y="72">isna() 활용</text></g>
  <path class="arr" d="M890 238H950"/>
  <g transform="translate(965 190)"><rect class="node" width="220" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">4</text><text class="main" x="62" y="42">중복 확인</text><text class="desc" x="24" y="72">duplicated() 확인</text></g>
  <path class="arr" d="M1185 238H1245"/>
  <g transform="translate(1260 190)"><rect class="node" width="220" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">5</text><text class="main" x="62" y="42">문자열 정리</text><text class="desc" x="24" y="72">공백·표기 통일</text></g>

  <path class="arr" d="M1370 285 C1370 345 1240 350 1205 350"/>
  <g transform="translate(1125 380)"><rect class="node" width="220" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">6</text><text class="main" x="62" y="42">타입 변환</text><text class="desc" x="24" y="72">날짜·숫자 변환</text></g>
  <path class="arr" d="M1125 428H1065"/>
  <g transform="translate(845 380)"><rect class="node" width="220" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">7</text><text class="main" x="62" y="42">이상값 처리</text><text class="desc" x="24" y="72">0 이하 값 점검</text></g>
  <path class="arr" d="M845 428H785"/>
  <g transform="translate(565 380)"><rect class="node" width="220" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">8</text><text class="main" x="62" y="42">파생 컬럼 생성</text><text class="desc" x="24" y="72">line_total 계산</text></g>
  <path class="arr" d="M565 428H505"/>
  <g transform="translate(285 380)"><rect class="node" width="220" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">9</text><text class="main" x="62" y="42">무결성 재확인</text><text class="desc" x="24" y="72">키 관계 점검</text></g>
  <path class="arr" d="M285 428H225"/>
  <g transform="translate(80 380)"><rect class="node" width="145" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">10</text><text class="main" x="58" y="42">저장</text><text class="desc" x="24" y="72">processed CSV</text></g>
</svg>