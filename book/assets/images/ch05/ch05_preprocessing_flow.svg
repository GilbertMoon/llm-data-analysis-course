<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">데이터 전처리 전체 흐름도</title>
  <desc id="desc">원본 데이터 보존부터 결측치, 중복, 타입 변환, 이상값 처리, 저장까지의 전체 전처리 흐름</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)}
      text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
      .title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#dbeafe}
      .node{fill:#fff;stroke:#bfdbfe;stroke-width:2;filter:url(#shadow)}
      .num{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.nt{font-size:17px;font-weight:900;fill:#2563eb}
      .main{font-size:24px;font-weight:800;fill:#0f172a}.desc{font-size:16px;font-weight:600;fill:#64748b}
      .arr{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#arrow)}
      .note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1600" height="620" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">데이터 전처리 전체 흐름</text>
  <text class="sub" x="86" y="118">분석 결과를 신뢰할 수 있도록 데이터를 점검하고 정리하는 과정</text>

  <g transform="translate(90 185)"><rect class="node" width="255" height="105" rx="22"/><circle class="num" cx="36" cy="36" r="18"/><text class="nt" x="36" y="42" text-anchor="middle">1</text><text class="main" x="68" y="44">원본 보존</text><text class="desc" x="26" y="78">raw / processed 분리</text></g>
  <path class="arr" d="M355 238H430"/>
  <g transform="translate(445 185)"><rect class="node" width="255" height="105" rx="22"/><circle class="num" cx="36" cy="36" r="18"/><text class="nt" x="36" y="42" text-anchor="middle">2</text><text class="main" x="68" y="44">결측치 확인</text><text class="desc" x="26" y="78">개수와 비율 점검</text></g>
  <path class="arr" d="M710 238H785"/>
  <g transform="translate(800 185)"><rect class="node" width="255" height="105" rx="22"/><circle class="num" cx="36" cy="36" r="18"/><text class="nt" x="36" y="42" text-anchor="middle">3</text><text class="main" x="68" y="44">중복 확인</text><text class="desc" x="26" y="78">전체 행과 ID 중복</text></g>
  <path class="arr" d="M1065 238H1140"/>
  <g transform="translate(1155 185)"><rect class="node" width="255" height="105" rx="22"/><circle class="num" cx="36" cy="36" r="18"/><text class="nt" x="36" y="42" text-anchor="middle">4</text><text class="main" x="68" y="44">문자열 정리</text><text class="desc" x="26" y="78">공백, 표기, 상태값 통일</text></g>

  <path class="arr" d="M1280 290 C1280 350 1190 360 1155 360"/>
  <g transform="translate(1155 380)"><rect class="node" width="255" height="105" rx="22"/><circle class="num" cx="36" cy="36" r="18"/><text class="nt" x="36" y="42" text-anchor="middle">5</text><text class="main" x="68" y="44">타입 변환</text><text class="desc" x="26" y="78">날짜형·숫자형 변환</text></g>
  <path class="arr" d="M1145 433H1070"/>
  <g transform="translate(800 380)"><rect class="node" width="255" height="105" rx="22"/><circle class="num" cx="36" cy="36" r="18"/><text class="nt" x="36" y="42" text-anchor="middle">6</text><text class="main" x="68" y="44">이상값 확인</text><text class="desc" x="26" y="78">0 이하 가격·수량 점검</text></g>
  <path class="arr" d="M790 433H715"/>
  <g transform="translate(445 380)"><rect class="node" width="255" height="105" rx="22"/><circle class="num" cx="36" cy="36" r="18"/><text class="nt" x="36" y="42" text-anchor="middle">7</text><text class="main" x="68" y="44">파생 컬럼 생성</text><text class="desc" x="26" y="78">line_total 등 추가</text></g>
  <path class="arr" d="M435 433H360"/>
  <g transform="translate(90 380)"><rect class="node" width="255" height="105" rx="22"/><circle class="num" cx="36" cy="36" r="18"/><text class="nt" x="36" y="42" text-anchor="middle">8</text><text class="main" x="68" y="44">관계 재확인</text><text class="desc" x="26" y="78">키 무결성 점검</text></g>

  <path class="arr" d="M220 485 C220 540 410 540 555 540"/>
  <g transform="translate(585 515)"><rect class="note" width="430" height="52" rx="18"/><text class="noteText" x="215" y="34" text-anchor="middle">최종: processed 폴더에 저장하고 처리 기준을 기록</text></g>
</svg>