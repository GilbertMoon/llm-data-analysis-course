<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
  <title id="title">raw 데이터와 processed 데이터 분리 구조</title>
  <desc id="desc">원본 데이터와 전처리 데이터를 분리해 저장하는 폴더 구조와 장점</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
      .title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#ccfbf1}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)} .headBox{fill:#eff6ff;stroke:#bfdbfe}
      .name{font-size:28px;font-weight:800;fill:#0f172a}.label{font-size:17px;font-weight:800;fill:#2563eb}.item{font-size:20px;font-weight:650;fill:#334155}
      .good{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.g{font-size:18px;font-weight:750;fill:#166534}
      .sep{stroke:#93c5fd;stroke-width:3;stroke-dasharray:10 8}
    </style>
  </defs>
  <rect class="bg" width="1500" height="560" rx="32"/>
  <rect class="h" x="50" y="36" width="1400" height="92" rx="26"/>
  <text class="title" x="86" y="92">raw / processed 데이터 분리 구조</text>
  <text class="sub" x="86" y="118">원본은 보존하고, 분석에 사용할 데이터는 별도 폴더에 저장합니다</text>

  <g transform="translate(110 180)">
    <rect class="card" width="430" height="280" rx="24"/><rect class="headBox" width="430" height="68" rx="24"/>
    <text class="name" x="28" y="43">data/raw</text><text class="label" x="28" y="92">원본 데이터 보관</text>
    <text class="item" x="28" y="132">• customers.csv</text>
    <text class="item" x="28" y="170">• products.csv</text>
    <text class="item" x="28" y="208">• orders.csv</text>
    <text class="item" x="28" y="246">• order_items.csv</text>
    <text class="item" x="28" y="284">• 수정하지 않고 그대로 유지</text>
  </g>

  <line class="sep" x1="750" y1="175" x2="750" y2="465"/>

  <g transform="translate(860 180)">
    <rect class="card" width="530" height="280" rx="24"/><rect class="headBox" width="530" height="68" rx="24"/>
    <text class="name" x="28" y="43">data/processed</text><text class="label" x="28" y="92">전처리 완료 데이터 저장</text>
    <text class="item" x="28" y="132">• customers_clean.csv</text>
    <text class="item" x="28" y="170">• products_clean.csv</text>
    <text class="item" x="28" y="208">• orders_clean.csv</text>
    <text class="item" x="28" y="246">• order_items_clean.csv</text>
    <text class="item" x="28" y="284">• 분석과 시각화에 바로 사용</text>
  </g>

  <g transform="translate(215 485)"><rect class="good" width="1070" height="48" rx="16"/><text class="g" x="535" y="31" text-anchor="middle">장점: 원본 복구 가능 · 전후 비교 가능 · 재현성 향상 · 보고서 설명 용이</text></g>
</svg>