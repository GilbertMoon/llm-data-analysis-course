<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700" role="img" aria-labelledby="title desc">
  <title id="title">기말 종합 프로젝트 전체 흐름도</title>
  <desc id="desc">데이터 불러오기부터 구조 점검, 전처리, EDA, 시각화, LLM 검증, 보고서, 자동화, 최종 제출까지 이어지는 End-to-End 데이터 분석 프로젝트 흐름</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:40px;font-weight:900;fill:#fff}.sub{font-size:19px;font-weight:650;fill:#e0e7ff}.node{fill:#fff;stroke:#bfdbfe;stroke-width:2;filter:url(#shadow)}.num{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.nt{font-size:15px;font-weight:900;fill:#2563eb}.main{font-size:18px;font-weight:850;fill:#0f172a}.desc{font-size:13px;font-weight:650;fill:#64748b}.arr{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#arrow)}.note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:21px;font-weight:850;fill:#166534}.em{fill:#f5f3ff;stroke:#c4b5fd;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1800" height="700" rx="36"/>
  <rect class="h" x="55" y="38" width="1690" height="96" rx="28"/>
  <text class="title" x="92" y="96">기말 종합 프로젝트 전체 흐름</text>
  <text class="sub" x="92" y="124">데이터 분석 전 과정을 하나의 실무형 산출물로 완성합니다</text>
  <rect class="em" x="640" y="155" width="520" height="52" rx="20"/>
  <text x="900" y="189" text-anchor="middle" font-size="24" font-weight="900" fill="#6d28d9">End-to-End 데이터 분석 프로젝트</text>

  <g transform="translate(55 245)"><rect class="node" width="205" height="88" rx="20"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="35" text-anchor="middle">1</text><text class="main" x="56" y="36">데이터 불러오기</text><text class="desc" x="22" y="66">CSV 입력</text></g><path class="arr" d="M270 289H315"/>
  <g transform="translate(330 245)"><rect class="node" width="205" height="88" rx="20"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="35" text-anchor="middle">2</text><text class="main" x="56" y="36">구조 점검</text><text class="desc" x="22" y="66">컬럼·결측치</text></g><path class="arr" d="M545 289H590"/>
  <g transform="translate(605 245)"><rect class="node" width="205" height="88" rx="20"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="35" text-anchor="middle">3</text><text class="main" x="56" y="36">전처리</text><text class="desc" x="22" y="66">정리된 데이터</text></g><path class="arr" d="M820 289H865"/>
  <g transform="translate(880 245)"><rect class="node" width="205" height="88" rx="20"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="35" text-anchor="middle">4</text><text class="main" x="56" y="36">EDA</text><text class="desc" x="22" y="66">핵심 지표</text></g><path class="arr" d="M1095 289H1140"/>
  <g transform="translate(1155 245)"><rect class="node" width="205" height="88" rx="20"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="35" text-anchor="middle">5</text><text class="main" x="56" y="36">시각화</text><text class="desc" x="22" y="66">그래프 저장</text></g><path class="arr" d="M1370 289H1415"/>
  <g transform="translate(1430 245)"><rect class="node" width="230" height="88" rx="20"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="35" text-anchor="middle">6</text><text class="main" x="56" y="36">LLM 생성·검증</text><text class="desc" x="22" y="66">초안과 검토 기록</text></g>

  <path class="arr" d="M1545 333 C1545 400 1430 410 1375 420"/>
  <g transform="translate(1255 455)"><rect class="node" width="230" height="88" rx="20"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="35" text-anchor="middle">7</text><text class="main" x="56" y="36">인사이트 도출</text><text class="desc" x="22" y="66">관찰·주의·다음 질문</text></g><path class="arr" d="M1245 499H1195"/>
  <g transform="translate(955 455)"><rect class="node" width="225" height="88" rx="20"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="35" text-anchor="middle">8</text><text class="main" x="56" y="36">보고서 작성</text><text class="desc" x="22" y="66">최종 Markdown</text></g><path class="arr" d="M945 499H895"/>
  <g transform="translate(655 455)"><rect class="node" width="225" height="88" rx="20"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="35" text-anchor="middle">9</text><text class="main" x="56" y="36">Make 자동화</text><text class="desc" x="22" y="66">전달·로그</text></g><path class="arr" d="M645 499H595"/>
  <g transform="translate(355 455)"><rect class="node" width="225" height="88" rx="20"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="35" text-anchor="middle">10</text><text class="main" x="56" y="36">Airflow 설계</text><text class="desc" x="22" y="66">반복 실행 구조</text></g><path class="arr" d="M345 499H295"/>
  <g transform="translate(80 455)"><rect class="node" width="200" height="88" rx="20"/><circle class="num" cx="30" cy="30" r="16"/><text class="nt" x="30" y="35" text-anchor="middle">11</text><text class="main" x="56" y="36">최종 제출</text><text class="desc" x="22" y="66">보고서·발표</text></g>

  <rect class="note" x="360" y="610" width="1080" height="42" rx="14"/>
  <text class="noteText" x="900" y="638" text-anchor="middle">기말 프로젝트는 데이터 분석 전 과정을 하나의 실무형 산출물로 완성하는 과정입니다</text>
</svg>