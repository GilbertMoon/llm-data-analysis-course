<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760" role="img" aria-labelledby="title desc">
  <title id="title">기말 프로젝트 주요 분석 대시보드 예시</title>
  <desc id="desc">카테고리별 매출, 월별 매출, 구매 금액 상위 고객, 가격과 판매 수량 관계, 주문 상태별 주문 수를 한 화면에 요약한 대시보드</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:38px;font-weight:900;fill:#fff}.sub{font-size:18px;font-weight:650;fill:#dbeafe}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.pTitle{font-size:21px;font-weight:900;fill:#0f172a}.axis{stroke:#94a3b8;stroke-width:2}.bar{fill:#93c5fd}.bar2{fill:#a7f3d0}.line{fill:none;stroke:#2563eb;stroke-width:4}.dot{fill:#2563eb}.scatter{fill:#7c3aed;opacity:.75}.card{fill:#eff6ff;stroke:#bfdbfe;stroke-width:2}.metric{font-size:26px;font-weight:900;fill:#1d4ed8}.label{font-size:16px;font-weight:700;fill:#64748b}.note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1700" height="760" rx="34"/>
  <rect class="h" x="55" y="38" width="1590" height="92" rx="28"/>
  <text class="title" x="92" y="94">기말 프로젝트 주요 분석 대시보드 예시</text>
  <text class="sub" x="92" y="120">표와 그래프는 분석 질문에 대한 답을 직관적으로 보여주는 핵심 산출물입니다</text>

  <g transform="translate(70 165)"><rect class="panel" width="500" height="235" rx="24"/><text class="pTitle" x="28" y="42">카테고리별 매출</text><line class="axis" x1="55" y1="190" x2="445" y2="190"/><line class="axis" x1="55" y1="70" x2="55" y2="190"/><rect class="bar" x="85" y="95" width="50" height="95" rx="8"/><rect class="bar" x="160" y="115" width="50" height="75" rx="8"/><rect class="bar" x="235" y="82" width="50" height="108" rx="8"/><rect class="bar" x="310" y="130" width="50" height="60" rx="8"/><rect class="bar" x="385" y="105" width="50" height="85" rx="8"/></g>
  <g transform="translate(600 165)"><rect class="panel" width="500" height="235" rx="24"/><text class="pTitle" x="28" y="42">월별 매출 추이</text><line class="axis" x1="55" y1="190" x2="445" y2="190"/><line class="axis" x1="55" y1="70" x2="55" y2="190"/><polyline class="line" points="70,165 140,145 210,155 280,105 350,90 430,120"/><circle class="dot" cx="70" cy="165" r="6"/><circle class="dot" cx="140" cy="145" r="6"/><circle class="dot" cx="210" cy="155" r="6"/><circle class="dot" cx="280" cy="105" r="6"/><circle class="dot" cx="350" cy="90" r="6"/><circle class="dot" cx="430" cy="120" r="6"/></g>
  <g transform="translate(1130 165)"><rect class="panel" width="500" height="235" rx="24"/><text class="pTitle" x="28" y="42">구매 금액 상위 고객</text><line class="axis" x1="110" y1="190" x2="445" y2="190"/><line class="axis" x1="110" y1="70" x2="110" y2="190"/><rect class="bar2" x="110" y="82" width="260" height="22" rx="8"/><rect class="bar2" x="110" y="118" width="210" height="22" rx="8"/><rect class="bar2" x="110" y="154" width="300" height="22" rx="8"/><text class="label" x="28" y="99">C001</text><text class="label" x="28" y="135">C014</text><text class="label" x="28" y="171">C022</text></g>

  <g transform="translate(70 430)"><rect class="panel" width="675" height="235" rx="24"/><text class="pTitle" x="28" y="42">상품 가격과 판매 수량 관계</text><line class="axis" x1="65" y1="190" x2="610" y2="190"/><line class="axis" x1="65" y1="70" x2="65" y2="190"/><circle class="scatter" cx="120" cy="150" r="8"/><circle class="scatter" cx="180" cy="115" r="8"/><circle class="scatter" cx="245" cy="135" r="8"/><circle class="scatter" cx="315" cy="95" r="8"/><circle class="scatter" cx="390" cy="125" r="8"/><circle class="scatter" cx="470" cy="85" r="8"/><circle class="scatter" cx="550" cy="155" r="8"/></g>
  <g transform="translate(775 430)"><rect class="panel" width="855" height="235" rx="24"/><text class="pTitle" x="28" y="42">주문 상태별 주문 수</text><rect class="card" x="55" y="78" width="210" height="105" rx="22"/><text class="metric" x="160" y="124" text-anchor="middle">1,240</text><text class="label" x="160" y="154" text-anchor="middle">완료 주문</text><rect class="card" x="325" y="78" width="210" height="105" rx="22"/><text class="metric" x="430" y="124" text-anchor="middle">86</text><text class="label" x="430" y="154" text-anchor="middle">취소 주문</text><rect class="card" x="595" y="78" width="210" height="105" rx="22"/><text class="metric" x="700" y="124" text-anchor="middle">6.5%</text><text class="label" x="700" y="154" text-anchor="middle">취소 비율</text></g>

  <rect class="note" x="390" y="700" width="920" height="38" rx="14"/>
  <text class="noteText" x="850" y="726" text-anchor="middle">대시보드는 결과를 보여주지만, 해석은 데이터 근거와 함께 작성해야 합니다</text>
</svg>