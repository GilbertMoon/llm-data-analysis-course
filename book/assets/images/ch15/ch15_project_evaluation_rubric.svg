<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">기말 프로젝트 평가 기준 구조</title>
  <desc id="desc">프로젝트 구조와 제출물, 데이터 이해와 전처리, pandas 분석, 시각화, 해석과 인사이트, LLM 활용과 검증, 보고서 완성도, 자동화 설계로 구성된 평가 기준</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Malgun Gothic','맑은 고딕','Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif}.title{font-size:38px;font-weight:900;fill:#fff}.sub{font-size:18px;font-weight:650;fill:#e2e8f0}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.num{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.nt{font-size:16px;font-weight:900;fill:#2563eb}.main{font-size:20px;font-weight:900;fill:#0f172a}.desc{font-size:15px;font-weight:650;fill:#64748b}.center{fill:#f5f3ff;stroke:#c4b5fd;stroke-width:3;filter:url(#shadow)}.note{fill:#fff7ed;stroke:#fdba74;stroke-width:2}.noteText{font-size:20px;font-weight:850;fill:#9a3412}
    </style>
  </defs>
  <rect class="bg" width="1600" height="700" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">기말 프로젝트 평가 기준 구조</text>
  <text class="sub" x="86" y="118">평가는 코드 길이가 아니라 분석 흐름과 산출물의 완성도를 기준으로 합니다</text>

  <rect class="center" x="610" y="270" width="380" height="130" rx="32"/>
  <text x="800" y="318" text-anchor="middle" font-size="26" font-weight="900" fill="#6d28d9">분석 흐름 완성도</text>
  <text x="800" y="354" text-anchor="middle" font-size="18" font-weight="700" fill="#475569">질문 · 데이터 · 코드 · 해석 · 검증</text>

  <g transform="translate(110 170)"><rect class="card" width="315" height="110" rx="22"/><circle class="num" cx="32" cy="32" r="17"/><text class="nt" x="32" y="38" text-anchor="middle">1</text><text class="main" x="62" y="38">프로젝트 구조</text><text class="desc" x="24" y="76">제출물과 폴더 구성</text></g>
  <g transform="translate(465 150)"><rect class="card" width="315" height="110" rx="22"/><circle class="num" cx="32" cy="32" r="17"/><text class="nt" x="32" y="38" text-anchor="middle">2</text><text class="main" x="62" y="38">데이터 이해</text><text class="desc" x="24" y="76">구조 점검과 전처리</text></g>
  <g transform="translate(820 150)"><rect class="card" width="315" height="110" rx="22"/><circle class="num" cx="32" cy="32" r="17"/><text class="nt" x="32" y="38" text-anchor="middle">3</text><text class="main" x="62" y="38">pandas 분석</text><text class="desc" x="24" y="76">집계와 핵심 지표</text></g>
  <g transform="translate(1175 170)"><rect class="card" width="315" height="110" rx="22"/><circle class="num" cx="32" cy="32" r="17"/><text class="nt" x="32" y="38" text-anchor="middle">4</text><text class="main" x="62" y="38">시각화</text><text class="desc" x="24" y="76">질문을 설명하는 그래프</text></g>
  <g transform="translate(110 420)"><rect class="card" width="315" height="110" rx="22"/><circle class="num" cx="32" cy="32" r="17"/><text class="nt" x="32" y="38" text-anchor="middle">5</text><text class="main" x="62" y="38">해석과 인사이트</text><text class="desc" x="24" y="76">관찰과 한계 구분</text></g>
  <g transform="translate(465 450)"><rect class="card" width="315" height="110" rx="22"/><circle class="num" cx="32" cy="32" r="17"/><text class="nt" x="32" y="38" text-anchor="middle">6</text><text class="main" x="62" y="38">LLM 활용 검증</text><text class="desc" x="24" y="76">사용 목적과 검토 기록</text></g>
  <g transform="translate(820 450)"><rect class="card" width="315" height="110" rx="22"/><circle class="num" cx="32" cy="32" r="17"/><text class="nt" x="32" y="38" text-anchor="middle">7</text><text class="main" x="62" y="38">보고서 완성도</text><text class="desc" x="24" y="76">결과, 해석, 한계 정리</text></g>
  <g transform="translate(1175 420)"><rect class="card" width="315" height="110" rx="22"/><circle class="num" cx="32" cy="32" r="17"/><text class="nt" x="32" y="38" text-anchor="middle">8</text><text class="main" x="62" y="38">자동화 설계</text><text class="desc" x="24" y="76">반복 실행과 검증 구조</text></g>

  <rect class="note" x="345" y="625" width="910" height="42" rx="14"/>
  <text class="noteText" x="800" y="653" text-anchor="middle">코드 실행 여부보다 분석 질문에서 최종 산출물까지의 연결성이 중요합니다</text>
</svg>