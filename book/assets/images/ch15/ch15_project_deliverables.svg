<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"
     role="img" aria-labelledby="title desc">
  <title id="title">기말 프로젝트 제출물 구성</title>
  <desc id="desc">Notebook, 데이터 개요, 전처리 데이터, EDA 결과, 시각화, 머신러닝 결과, 외부 데이터 결과, LLM 활용 기록, 최종 보고서, 자동화 설계로 구성된 최종 제출 패키지</desc>

  <defs>
