      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: 'Malgun Gothic','맑은 고딕',"NanumSquare","Noto Sans KR",sans-serif; }
      .mono { font-family: 'Malgun Gothic','맑은 고딕',"D2Coding","Cascadia Mono","Consolas",monospace; }
      .title { font-size: 46px; font-weight: 800; fill: #0f2d4d; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #475569; }
      .package { font-size: 24px; font-weight: 800; fill: #1e3a8a; }
      .packageSub { font-size: 17px; font-weight: 600; fill: #475569; }
      .num { font-size: 14px; font-weight: 800; fill: #2563eb; }
      .cardTitle { font-size: 21px; font-weight: 800; fill: #0f172a; }
      .cardDesc { font-size: 15px; font-weight: 500; fill: #334155; }
      .file { font-size: 13px; font-weight: 700; fill: #475569; }
      .group { font-size: 16px; font-weight: 800; }
      .checkTitle { font-size: 20px; font-weight: 800; fill: #0f2d4d; }
      .check { font-size: 16px; font-weight: 600; fill: #334155; }
      .footer { font-size: 20px; font-weight: 750; fill: #1e3a8a; }
      .card { fill: #ffffff; stroke-width: 2; filter: url(#shadow); }
      .divider { stroke: #e2e8f0; stroke-width: 1.4; }
    </style>
