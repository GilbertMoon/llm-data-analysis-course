<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="700" viewBox="0 0 1700 700" role="img" aria-labelledby="title desc">
  <title id="title">기말 프로젝트 제출물 구성</title>
  <desc id="desc">Notebook, 전처리 데이터, 분석 결과 CSV, 그래프 이미지, 최종 보고서, LLM 활용 기록, 자동화 설계, 제출 체크리스트로 구성된 최종 제출 패키지</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:38px;font-weight:900;fill:#fff}.sub{font-size:18px;font-weight:650;fill:#ccfbf1}.center{fill:#fff;stroke:#93c5fd;stroke-width:3;filter:url(#shadow)}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.tagBox{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.tag{font-size:15px;font-weight:900;fill:#2563eb}.main{font-size:21px;font-weight:900;fill:#0f172a}.file{font-family:'D2Coding','Consolas',monospace;font-size:15px;font-weight:650;fill:#475569}.note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1700" height="700" rx="34"/>
  <rect class="h" x="55" y="38" width="1590" height="94" rx="28"/>
  <text class="title" x="92" y="94">기말 프로젝트 제출물 구성</text>
  <text class="sub" x="92" y="122">코드, 결과, 그래프, 보고서, 검증 기록이 함께 제출되어야 합니다</text>

  <rect class="center" x="640" y="275" width="420" height="120" rx="32"/>
  <text class="main" x="850" y="325" text-anchor="middle" font-size="26">최종 제출 패키지</text>
  <text class="file" x="850" y="360" text-anchor="middle">reports/ · notebooks/ · data/processed/</text>

  <g transform="translate(85 170)"><rect class="card" width="350" height="120" rx="22"/><rect class="tagBox" x="24" y="20" width="78" height="26" rx="13"/><text class="tag" x="63" y="38" text-anchor="middle">1</text><text class="main" x="24" y="76">Notebook</text><text class="file" x="24" y="102">ch15_final_project.ipynb</text></g>
  <g transform="translate(475 165)"><rect class="card" width="350" height="120" rx="22"/><rect class="tagBox" x="24" y="20" width="78" height="26" rx="13"/><text class="tag" x="63" y="38" text-anchor="middle">2</text><text class="main" x="24" y="76">전처리 데이터</text><text class="file" x="24" y="102">*_clean.csv</text></g>
  <g transform="translate(875 165)"><rect class="card" width="350" height="120" rx="22"/><rect class="tagBox" x="24" y="20" width="78" height="26" rx="13"/><text class="tag" x="63" y="38" text-anchor="middle">3</text><text class="main" x="24" y="76">분석 결과 CSV</text><text class="file" x="24" y="102">category, monthly, customer</text></g>
  <g transform="translate(1265 170)"><rect class="card" width="350" height="120" rx="22"/><rect class="tagBox" x="24" y="20" width="78" height="26" rx="13"/><text class="tag" x="63" y="38" text-anchor="middle">4</text><text class="main" x="24" y="76">그래프 이미지</text><text class="file" x="24" y="102">ch15_*.png</text></g>

  <g transform="translate(85 450)"><rect class="card" width="350" height="120" rx="22"/><rect class="tagBox" x="24" y="20" width="78" height="26" rx="13"/><text class="tag" x="63" y="38" text-anchor="middle">5</text><text class="main" x="24" y="76">최종 보고서</text><text class="file" x="24" y="102">ch15_final_report.md</text></g>
  <g transform="translate(475 455)"><rect class="card" width="350" height="120" rx="22"/><rect class="tagBox" x="24" y="20" width="78" height="26" rx="13"/><text class="tag" x="63" y="38" text-anchor="middle">6</text><text class="main" x="24" y="76">LLM 활용 기록</text><text class="file" x="24" y="102">ch15_llm_usage_log.md</text></g>
  <g transform="translate(875 455)"><rect class="card" width="350" height="120" rx="22"/><rect class="tagBox" x="24" y="20" width="78" height="26" rx="13"/><text class="tag" x="63" y="38" text-anchor="middle">7</text><text class="main" x="24" y="76">자동화 설계</text><text class="file" x="24" y="102">ch15_automation_plan.md</text></g>
  <g transform="translate(1265 450)"><rect class="card" width="350" height="120" rx="22"/><rect class="tagBox" x="24" y="20" width="78" height="26" rx="13"/><text class="tag" x="63" y="38" text-anchor="middle">8</text><text class="main" x="24" y="76">제출 체크리스트</text><text class="file" x="24" y="102">submission_checklist.csv</text></g>

  <rect class="note" x="365" y="625" width="970" height="40" rx="14"/>
  <text class="noteText" x="850" y="652" text-anchor="middle">좋은 프로젝트는 코드 실행 결과와 해석 검증 기록이 함께 남아야 합니다</text>
</svg>