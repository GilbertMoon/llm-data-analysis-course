<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 34px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.sub{font:500 18px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18;ry:18}.h{font:700 24px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.t{font:500 17px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}.u{fill:#dbeafe}.b{fill:#dcfce7}.m{fill:#fef3c7}.footer{font:500 18px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#1e40af}</style></defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="600" y="58" text-anchor="middle" class="title">단변량 · 이변량 · 다변량 EDA 비교</text>
  <text x="600" y="90" text-anchor="middle" class="sub">변수의 개수와 분석 목적에 따라 탐색 방식이 달라진다.</text>
  <rect x="70" y="150" width="320" height="420" class="card u"/><text x="230" y="205" text-anchor="middle" class="h">단변량 EDA</text><text x="230" y="245" text-anchor="middle" class="t">하나의 변수 확인</text><text x="230" y="305" text-anchor="middle" class="t">예: 고객 나이 분포</text><text x="230" y="335" text-anchor="middle" class="t">예: 카테고리별 상품 수</text><rect x="135" y="395" width="40" height="90" fill="#93c5fd"/><rect x="190" y="365" width="40" height="120" fill="#60a5fa"/><rect x="245" y="420" width="40" height="65" fill="#3b82f6"/>
  <rect x="440" y="150" width="320" height="420" class="card b"/><text x="600" y="205" text-anchor="middle" class="h">이변량 EDA</text><text x="600" y="245" text-anchor="middle" class="t">두 변수의 관계 확인</text><text x="600" y="305" text-anchor="middle" class="t">예: 카테고리별 매출</text><text x="600" y="335" text-anchor="middle" class="t">예: 월별 주문 수</text><rect x="510" y="400" width="40" height="85" fill="#86efac"/><rect x="555" y="370" width="40" height="115" fill="#4ade80"/><rect x="610" y="415" width="40" height="70" fill="#22c55e"/><rect x="655" y="350" width="40" height="135" fill="#16a34a"/>
  <rect x="810" y="150" width="320" height="420" class="card m"/><text x="970" y="205" text-anchor="middle" class="h">다변량 EDA</text><text x="970" y="245" text-anchor="middle" class="t">여러 변수의 관계 확인</text><text x="970" y="305" text-anchor="middle" class="t">예: 월별 · 카테고리별 매출</text><text x="970" y="335" text-anchor="middle" class="t">예: 지역별 · 연령대별 구매 금액</text><rect x="885" y="390" width="55" height="35" fill="#fde68a"/><rect x="945" y="390" width="55" height="35" fill="#fcd34d"/><rect x="1005" y="390" width="55" height="35" fill="#fbbf24"/><rect x="885" y="430" width="55" height="35" fill="#fcd34d"/><rect x="945" y="430" width="55" height="35" fill="#fbbf24"/><rect x="1005" y="430" width="55" height="35" fill="#f59e0b"/>
  <text x="600" y="640" text-anchor="middle" class="footer">EDA는 변수의 개수와 분석 목적에 따라 탐색 방식이 달라집니다.</text>
</svg>