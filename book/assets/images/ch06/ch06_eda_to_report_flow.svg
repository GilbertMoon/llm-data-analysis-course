<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 34px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.sub{font:500 18px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}.card{fill:#ffffff;stroke:#cbd5e1;stroke-width:2;rx:18;ry:18}.memo{fill:#f5f3ff;stroke:#c4b5fd;stroke-width:2;rx:18;ry:18}.report{fill:#ecfeff;stroke:#67e8f9;stroke-width:2;rx:18;ry:18}.head{font:700 24px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.txt{font:500 17px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}.hint{font:700 15px Consolas,'Courier New',monospace;fill:#1d4ed8}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}.footer{font:500 18px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#1e40af}
    </style>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1200" height="600"/>
  <text x="600" y="58" text-anchor="middle" class="title">EDA 결과를 보고서로 연결하는 흐름</text>
  <text x="600" y="90" text-anchor="middle" class="sub">표를 정리하고, 관찰과 추가 질문을 기록해 요약 보고서로 연결한다.</text>
  <rect x="90" y="170" width="250" height="230" class="card"/>
  <text x="215" y="218" text-anchor="middle" class="head">결과표</text>
  <text x="215" y="262" text-anchor="middle" class="txt">• 카테고리 매출</text>
  <text x="215" y="292" text-anchor="middle" class="txt">• 월별 매출</text>
  <text x="215" y="322" text-anchor="middle" class="txt">• 고객별 구매 금액</text>
  <text x="215" y="356" text-anchor="middle" class="hint">CSV · chart</text>
  <rect x="475" y="150" width="250" height="270" class="memo"/>
  <text x="600" y="198" text-anchor="middle" class="head">해석 메모</text>
  <text x="600" y="248" text-anchor="middle" class="txt">• 관찰</text>
  <text x="600" y="283" text-anchor="middle" class="txt">• 가설</text>
  <text x="600" y="318" text-anchor="middle" class="txt">• 추가 질문</text>
  <text x="600" y="353" text-anchor="middle" class="txt">• 주의사항</text>
  <rect x="860" y="170" width="250" height="230" class="report"/>
  <text x="985" y="218" text-anchor="middle" class="head">요약 보고서</text>
  <text x="985" y="262" text-anchor="middle" class="txt">• 분석 목적</text>
  <text x="985" y="292" text-anchor="middle" class="txt">• 핵심 결과</text>
  <text x="985" y="322" text-anchor="middle" class="txt">• 해석과 다음 질문</text>
  <text x="985" y="356" text-anchor="middle" class="txt">• 주의사항</text>
  <path d="M340 285H465" class="line"/>
  <path d="M725 285H850" class="line"/>
  <text x="600" y="500" text-anchor="middle" class="footer">EDA 결과는 최종 결론이 아니라 다음 분석을 위한 관찰과 질문입니다.</text>
</svg>
