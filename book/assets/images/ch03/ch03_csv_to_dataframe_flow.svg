<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">CSV 파일을 pandas DataFrame으로 불러오는 흐름</title>
  <desc id="desc">CSV 파일을 확인하고 pandas read_csv로 불러온 뒤 DataFrame 구조를 점검하는 과정</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)}.box{fill:#fff;stroke:#bfdbfe;stroke-width:2;filter:url(#shadow)}
      text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif}.t{font-size:38px;font-weight:800;fill:#fff}.s{font-size:18px;font-weight:600;fill:#dbeafe}
      .bt{font-size:27px;font-weight:800;fill:#0f172a}.bd{font-size:18px;font-weight:600;fill:#64748b}.code{font-size:20px;font-weight:800;fill:#1d4ed8}.arr{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .pill{fill:#eff6ff;stroke:#93c5fd}.pt{font-size:17px;font-weight:800;fill:#2563eb}
    </style>
  </defs>
  <rect class="bg" width="1600" height="520" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="88" rx="26"/>
  <text class="t" x="86" y="91">CSV 파일 → pandas DataFrame 불러오기 흐름</text>
  <text class="s" x="86" y="116">파일 경로 확인부터 DataFrame 점검까지, 데이터 분석의 첫 출발점</text>

  <g transform="translate(75 185)">
    <rect class="box" width="250" height="150" rx="24"/>
    <rect class="pill" x="28" y="28" width="70" height="30" rx="15"/><text class="pt" x="63" y="50" text-anchor="middle">STEP 1</text>
    <text class="bt" x="28" y="88">CSV 파일</text><text class="bd" x="28" y="124">customers.csv</text><text class="bd" x="28" y="150">orders.csv ...</text>
  </g>
  <path class="arr" d="M345 260H455"/>
  <g transform="translate(475 185)">
    <rect class="box" width="250" height="150" rx="24"/>
    <rect class="pill" x="28" y="28" width="70" height="30" rx="15"/><text class="pt" x="63" y="50" text-anchor="middle">STEP 2</text>
    <text class="bt" x="28" y="88">경로 확인</text><text class="code" x="28" y="124">Path("data/raw")</text><text class="bd" x="28" y="150">파일 존재 여부 확인</text>
  </g>
  <path class="arr" d="M745 260H855"/>
  <g transform="translate(875 185)">
    <rect class="box" width="250" height="150" rx="24"/>
    <rect class="pill" x="28" y="28" width="70" height="30" rx="15"/><text class="pt" x="63" y="50" text-anchor="middle">STEP 3</text>
    <text class="bt" x="28" y="88">CSV 읽기</text><text class="code" x="28" y="124">pd.read_csv()</text><text class="bd" x="28" y="150">표 형태로 변환</text>
  </g>
  <path class="arr" d="M1145 260H1255"/>
  <g transform="translate(1275 185)">
    <rect class="box" width="250" height="150" rx="24"/>
    <rect class="pill" x="28" y="28" width="70" height="30" rx="15"/><text class="pt" x="63" y="50" text-anchor="middle">STEP 4</text>
    <text class="bt" x="28" y="88">DataFrame 점검</text><text class="bd" x="28" y="124">shape · columns</text><text class="bd" x="28" y="150">head() · info()</text>
  </g>
  <rect x="220" y="395" width="1160" height="58" rx="20" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="800" y="432" text-anchor="middle" font-size="22" font-weight="800" fill="#166534">핵심: 파일을 불러온 뒤 바로 분석하지 말고, 구조와 타입을 먼저 확인한다</text>
</svg>
