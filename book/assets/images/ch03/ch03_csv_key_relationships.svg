<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">4개 CSV 파일 간 키 관계도</title>
  <desc id="desc">customers, orders, order_items, products CSV 파일의 customer_id, order_id, product_id 연결 관계</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)}text{font-family:'Malgun Gothic','맑은 고딕','Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif}.title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#ccfbf1}
      .tbl{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.th{fill:#eff6ff}.name{font-size:27px;font-weight:800;fill:#0f172a}.role{font-size:17px;font-weight:800;fill:#2563eb}.field{font-size:18px;font-weight:650;fill:#334155}.pk{fill:#fef3c7;stroke:#f59e0b}.fk{fill:#dcfce7;stroke:#22c55e}.tag{font-size:14px;font-weight:900}.pt{fill:#92400e}.ft{fill:#166534}.rel{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#arrow)}.rl{font-size:17px;font-weight:900;fill:#1d4ed8}.note{fill:#fff;stroke:#bfdbfe;stroke-width:2}.nt{font-size:18px;font-weight:800;fill:#475569}
    </style>
  </defs>
  <rect class="bg" width="1600" height="560" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="88" rx="26"/>
  <text class="title" x="86" y="91">4개 CSV 파일 간 키 관계</text>
  <text class="sub" x="86" y="116">공통 ID 컬럼을 기준으로 고객·주문·주문상세·상품 데이터를 연결합니다</text>

  <g transform="translate(90 185)">
    <rect class="tbl" width="320" height="210" rx="24"/><rect class="th" width="320" height="62" rx="24"/>
    <text class="name" x="24" y="40">customers.csv</text><text class="role" x="24" y="88">고객 정보</text>
    <rect class="pk" x="24" y="112" width="52" height="26" rx="13"/><text class="tag pt" x="50" y="131" text-anchor="middle">PK</text><text class="field" x="88" y="132">customer_id</text>
    <text class="field" x="24" y="166">name, age, city</text>
  </g>

  <g transform="translate(505 185)">
    <rect class="tbl" width="330" height="210" rx="24"/><rect class="th" width="330" height="62" rx="24"/>
    <text class="name" x="24" y="40">orders.csv</text><text class="role" x="24" y="88">주문 정보</text>
    <rect class="pk" x="24" y="112" width="52" height="26" rx="13"/><text class="tag pt" x="50" y="131" text-anchor="middle">PK</text><text class="field" x="88" y="132">order_id</text>
    <rect class="fk" x="24" y="148" width="52" height="26" rx="13"/><text class="tag ft" x="50" y="167" text-anchor="middle">FK</text><text class="field" x="88" y="168">customer_id</text>
  </g>

  <g transform="translate(930 165)">
    <rect class="tbl" width="350" height="250" rx="24"/><rect class="th" width="350" height="62" rx="24"/>
    <text class="name" x="24" y="40">order_items.csv</text><text class="role" x="24" y="88">주문 상세 정보</text>
    <rect class="pk" x="24" y="112" width="52" height="26" rx="13"/><text class="tag pt" x="50" y="131" text-anchor="middle">PK</text><text class="field" x="88" y="132">order_item_id</text>
    <rect class="fk" x="24" y="148" width="52" height="26" rx="13"/><text class="tag ft" x="50" y="167" text-anchor="middle">FK</text><text class="field" x="88" y="168">order_id</text>
    <rect class="fk" x="24" y="184" width="52" height="26" rx="13"/><text class="tag ft" x="50" y="203" text-anchor="middle">FK</text><text class="field" x="88" y="204">product_id</text>
  </g>

  <g transform="translate(530 445)">
    <rect class="tbl" width="455" height="80" rx="22"/><text class="name" x="24" y="34">products.csv</text><text class="role" x="24" y="60">상품 정보</text>
    <rect class="pk" x="225" y="24" width="52" height="26" rx="13"/><text class="tag pt" x="251" y="43" text-anchor="middle">PK</text><text class="field" x="290" y="44">product_id</text>
  </g>

  <path class="rel" d="M410 290H505"/><text class="rl" x="457" y="258" text-anchor="middle">customer_id</text><text class="rl" x="457" y="323" text-anchor="middle">1:N</text>
  <path class="rel" d="M835 290H930"/><text class="rl" x="882" y="258" text-anchor="middle">order_id</text><text class="rl" x="882" y="323" text-anchor="middle">1:N</text>
  <path class="rel" d="M985 485 C1085 485 1120 430 1120 415"/><text class="rl" x="1060" y="452" text-anchor="middle">product_id</text><text class="rl" x="1160" y="438" text-anchor="middle">1:N</text>

  <g transform="translate(1310 210)">
    <rect class="note" width="205" height="165" rx="22"/>
    <text class="nt" x="102" y="42" text-anchor="middle">무결성 점검</text>
    <text class="nt" x="102" y="80" text-anchor="middle">isin() 사용</text>
    <text class="nt" x="102" y="116" text-anchor="middle">없는 ID 확인</text>
    <text class="nt" x="102" y="150" text-anchor="middle">결과 0이면 정상</text>
  </g>
</svg>
