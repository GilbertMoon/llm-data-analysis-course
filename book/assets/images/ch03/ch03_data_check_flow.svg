<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">데이터 구조 점검 흐름도</title>
  <desc id="desc">파일 목록, 크기, 컬럼, 타입, 결측치, 중복, 키 컬럼을 순서대로 점검하는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)}text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif}.title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#dbeafe}
      .node{fill:#fff;stroke:#bfdbfe;stroke-width:2;filter:url(#shadow)}.num{fill:#eff6ff;stroke:#93c5fd}.nt{font-size:17px;font-weight:900;fill:#2563eb}.main{font-size:24px;font-weight:800;fill:#0f172a}.desc{font-size:16px;font-weight:600;fill:#64748b}.arr{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#arrow)}
      .warn{fill:#fff7ed;stroke:#fdba74;stroke-width:2}.wt{font-size:19px;font-weight:800;fill:#9a3412}
    </style>
  </defs>
  <rect class="bg" width="1600" height="560" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="88" rx="26"/>
  <text class="title" x="86" y="91">데이터 구조 점검 흐름</text>
  <text class="sub" x="86" y="116">분석 전에 데이터가 사용 가능한 상태인지 순서대로 확인합니다</text>

  <g transform="translate(90 175)">
    <rect class="node" width="270" height="100" rx="22"/><circle class="num" cx="38" cy="35" r="19"/><text class="nt" x="38" y="41" text-anchor="middle">1</text><text class="main" x="70" y="43">파일 목록</text><text class="desc" x="28" y="76">필요한 CSV가 모두 있는가?</text>
  </g>
  <path class="arr" d="M375 225H455"/>
  <g transform="translate(470 175)">
    <rect class="node" width="270" height="100" rx="22"/><circle class="num" cx="38" cy="35" r="19"/><text class="nt" x="38" y="41" text-anchor="middle">2</text><text class="main" x="70" y="43">행과 열 개수</text><text class="desc" x="28" y="76">shape로 규모 확인</text>
  </g>
  <path class="arr" d="M755 225H835"/>
  <g transform="translate(850 175)">
    <rect class="node" width="270" height="100" rx="22"/><circle class="num" cx="38" cy="35" r="19"/><text class="nt" x="38" y="41" text-anchor="middle">3</text><text class="main" x="70" y="43">컬럼명</text><text class="desc" x="28" y="76">실제 이름과 의미 확인</text>
  </g>
  <path class="arr" d="M1135 225H1215"/>
  <g transform="translate(1230 175)">
    <rect class="node" width="270" height="100" rx="22"/><circle class="num" cx="38" cy="35" r="19"/><text class="nt" x="38" y="41" text-anchor="middle">4</text><text class="main" x="70" y="43">데이터 타입</text><text class="desc" x="28" y="76">문자·숫자·날짜 구분</text>
  </g>

  <path class="arr" d="M1365 275 C1365 330 1285 335 1230 335"/>
  <g transform="translate(1230 350)">
    <rect class="node" width="270" height="100" rx="22"/><circle class="num" cx="38" cy="35" r="19"/><text class="nt" x="38" y="41" text-anchor="middle">5</text><text class="main" x="70" y="43">결측치</text><text class="desc" x="28" y="76">isna().sum()으로 확인</text>
  </g>
  <path class="arr" d="M1215 400H1135"/>
  <g transform="translate(850 350)">
    <rect class="node" width="270" height="100" rx="22"/><circle class="num" cx="38" cy="35" r="19"/><text class="nt" x="38" y="41" text-anchor="middle">6</text><text class="main" x="70" y="43">중복 데이터</text><text class="desc" x="28" y="76">duplicated()로 확인</text>
  </g>
  <path class="arr" d="M835 400H755"/>
  <g transform="translate(470 350)">
    <rect class="node" width="270" height="100" rx="22"/><circle class="num" cx="38" cy="35" r="19"/><text class="nt" x="38" y="41" text-anchor="middle">7</text><text class="main" x="70" y="43">기본 통계</text><text class="desc" x="28" y="76">describe()로 범위 확인</text>
  </g>
  <path class="arr" d="M455 400H375"/>
  <g transform="translate(90 350)">
    <rect class="node" width="270" height="100" rx="22"/><circle class="num" cx="38" cy="35" r="19"/><text class="nt" x="38" y="41" text-anchor="middle">8</text><text class="main" x="70" y="43">키 컬럼</text><text class="desc" x="28" y="76">파일 연결 기준 확인</text>
  </g>

  <rect class="warn" x="520" y="480" width="560" height="46" rx="18"/>
  <text class="wt" x="800" y="510" text-anchor="middle">LLM 코드도 실제 컬럼명·타입·결측치 확인 후 사용</text>
</svg>
