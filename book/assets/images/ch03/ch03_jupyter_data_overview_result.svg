<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Jupyter Notebook 데이터 구조 점검 결과 화면 예시</title>
  <desc id="desc">check_data_overview 함수 실행 결과가 Jupyter Notebook 출력 영역에 표시되는 예시</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)}text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif}.title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#ffedd5}
      .nb{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.bar{fill:#f1f5f9;stroke:#e2e8f0}.dot1{fill:#ef4444}.dot2{fill:#f59e0b}.dot3{fill:#22c55e}.cell{fill:#0f172a;stroke:#334155}.out{fill:#f8fafc;stroke:#cbd5e1}.code{font-family:'D2Coding','Consolas',monospace;font-size:19px;font-weight:600;fill:#e2e8f0}.stdout{font-family:'D2Coding','Consolas',monospace;font-size:18px;font-weight:600;fill:#334155}.label{font-size:19px;font-weight:800;fill:#475569}.badge{fill:#eff6ff;stroke:#93c5fd}.bt{font-size:16px;font-weight:900;fill:#2563eb}.note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.nt{font-size:20px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1600" height="560" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="88" rx="26"/>
  <text class="title" x="86" y="91">Jupyter Notebook 데이터 구조 점검 결과</text>
  <text class="sub" x="86" y="116">코드, 실행 결과, 해석 메모를 함께 남기면 분석 과정을 다시 확인하기 쉽습니다</text>

  <g transform="translate(135 160)">
    <rect class="nb" width="1330" height="330" rx="26"/>
    <rect class="bar" width="1330" height="52" rx="26"/>
    <circle class="dot1" cx="36" cy="26" r="9"/><circle class="dot2" cx="66" cy="26" r="9"/><circle class="dot3" cx="96" cy="26" r="9"/>
    <text class="label" x="132" y="33">notebooks/ch03_data_overview.ipynb</text>

    <rect class="badge" x="42" y="82" width="78" height="30" rx="15"/><text class="bt" x="81" y="103" text-anchor="middle">Code</text>
    <rect class="cell" x="42" y="122" width="560" height="170" rx="16"/>
    <text class="code" x="68" y="158">def check_data_overview(name, df):</text>
    <text class="code" x="88" y="188">print(f"===== {name} =====")</text>
    <text class="code" x="88" y="218">print("shape:", df.shape)</text>
    <text class="code" x="88" y="248">print("columns:", list(df.columns))</text>
    <text class="code" x="88" y="278">print("missing:", df.isna().sum())</text>

    <rect class="badge" x="660" y="82" width="86" height="30" rx="15"/><text class="bt" x="703" y="103" text-anchor="middle">Output</text>
    <rect class="out" x="660" y="122" width="620" height="170" rx="16"/>
    <text class="stdout" x="690" y="155">===== customers =====</text>
    <text class="stdout" x="690" y="184">shape: (150, 6)</text>
    <text class="stdout" x="690" y="213">columns: ['customer_id', 'name', 'gender', 'age', ...]</text>
    <text class="stdout" x="690" y="242">missing values: age 3, others 0</text>
    <text class="stdout" x="690" y="271">duplicated rows: 0</text>
  </g>

  <rect class="note" x="390" y="510" width="820" height="38" rx="16"/>
  <text class="nt" x="800" y="536" text-anchor="middle">반복 점검 함수로 여러 데이터셋을 같은 기준으로 확인합니다</text>
</svg>
