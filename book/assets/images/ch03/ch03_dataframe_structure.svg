<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">pandas DataFrame 구조 예시</title>
  <desc id="desc">행, 열, 인덱스, 값으로 구성된 pandas DataFrame의 기본 구조</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)}text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif}.title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#e0e7ff}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.headcell{fill:#eff6ff;stroke:#bfdbfe}.index{fill:#f1f5f9;stroke:#cbd5e1}.cell{fill:#fff;stroke:#e2e8f0}.hlrow{fill:#ecfdf5;stroke:#86efac}.hlcol{fill:#fff7ed;stroke:#fdba74}
      .th{font-size:21px;font-weight:800;fill:#0f172a}.td{font-size:18px;font-weight:600;fill:#334155}.label{font-size:22px;font-weight:800;fill:#1d4ed8}.small{font-size:17px;font-weight:600;fill:#64748b}
      .call{fill:#ffffff;stroke:#93c5fd;stroke-width:2}.arrow{fill:none;stroke:#2563eb;stroke-width:3;stroke-dasharray:8 8}
    </style>
  </defs>
  <rect class="bg" width="1600" height="560" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="88" rx="26"/>
  <text class="title" x="86" y="91">pandas DataFrame 구조</text>
  <text class="sub" x="86" y="116">DataFrame은 행(row), 열(column), 인덱스(index), 값(value)으로 구성된 표 형태 데이터입니다</text>

  <g transform="translate(260 170)">
    <rect class="panel" width="900" height="300" rx="24"/>
    <rect class="index" x="30" y="45" width="120" height="55" rx="8"/><text class="th" x="90" y="80" text-anchor="middle">index</text>
    <rect class="headcell" x="150" y="45" width="170" height="55" rx="8"/><text class="th" x="235" y="80" text-anchor="middle">customer_id</text>
    <rect class="headcell" x="320" y="45" width="170" height="55" rx="8"/><text class="th" x="405" y="80" text-anchor="middle">gender</text>
    <rect class="headcell" x="490" y="45" width="170" height="55" rx="8"/><text class="th" x="575" y="80" text-anchor="middle">age</text>
    <rect class="headcell" x="660" y="45" width="210" height="55" rx="8"/><text class="th" x="765" y="80" text-anchor="middle">city</text>

    <rect class="hlrow" x="30" y="100" width="840" height="55" rx="8"/>
    <rect class="index" x="30" y="100" width="120" height="55" rx="8"/><text class="td" x="90" y="135" text-anchor="middle">0</text>
    <rect class="cell" x="150" y="100" width="170" height="55"/><text class="td" x="235" y="135" text-anchor="middle">C001</text>
    <rect class="cell" x="320" y="100" width="170" height="55"/><text class="td" x="405" y="135" text-anchor="middle">F</text>
    <rect class="cell" x="490" y="100" width="170" height="55"/><text class="td" x="575" y="135" text-anchor="middle">34</text>
    <rect class="cell" x="660" y="100" width="210" height="55"/><text class="td" x="765" y="135" text-anchor="middle">Seoul</text>

    <rect class="index" x="30" y="155" width="120" height="55" rx="8"/><text class="td" x="90" y="190" text-anchor="middle">1</text>
    <rect class="cell" x="150" y="155" width="170" height="55"/><text class="td" x="235" y="190" text-anchor="middle">C002</text>
    <rect class="cell" x="320" y="155" width="170" height="55"/><text class="td" x="405" y="190" text-anchor="middle">M</text>
    <rect class="hlcol" x="490" y="155" width="170" height="55"/><text class="td" x="575" y="190" text-anchor="middle">28</text>
    <rect class="cell" x="660" y="155" width="210" height="55"/><text class="td" x="765" y="190" text-anchor="middle">Busan</text>

    <rect class="index" x="30" y="210" width="120" height="55" rx="8"/><text class="td" x="90" y="245" text-anchor="middle">2</text>
    <rect class="cell" x="150" y="210" width="170" height="55"/><text class="td" x="235" y="245" text-anchor="middle">C003</text>
    <rect class="cell" x="320" y="210" width="170" height="55"/><text class="td" x="405" y="245" text-anchor="middle">F</text>
    <rect class="hlcol" x="490" y="210" width="170" height="55"/><text class="td" x="575" y="245" text-anchor="middle">41</text>
    <rect class="cell" x="660" y="210" width="210" height="55"/><text class="td" x="765" y="245" text-anchor="middle">Incheon</text>
  </g>

  <g transform="translate(1205 190)">
    <rect class="call" width="250" height="210" rx="24"/>
    <text class="label" x="125" y="50" text-anchor="middle">구성 요소</text>
    <text class="small" x="32" y="90">• 행(row): 한 고객 기록</text>
    <text class="small" x="32" y="124">• 열(column): 고객 속성</text>
    <text class="small" x="32" y="158">• 인덱스: 행 번호</text>
    <text class="small" x="32" y="192">• 값(value): 셀의 실제 값</text>
  </g>
  <path class="arrow" d="M1070 285 C1120 285 1145 285 1190 285"/>
</svg>
