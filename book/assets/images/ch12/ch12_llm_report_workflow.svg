<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">LLM 기반 보고서 작성과 검증 흐름도</title>
  <desc id="desc">집계 결과 요약, LLM 요약 문장 생성, 원인 단정 표현 확인, 데이터 근거 확인, 안전한 문장 수정, 보고서 반영 흐름</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Malgun Gothic','맑은 고딕','Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif}.title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#ede9fe}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.data{stroke:#93c5fd}.llm{stroke:#c4b5fd}.check{stroke:#86efac}.warn{fill:#fff7ed;stroke:#fdba74;stroke-width:2}.main{font-size:25px;font-weight:900;fill:#0f172a}.item{font-size:18px;font-weight:650;fill:#475569}.arr{fill:none;stroke:#7c3aed;stroke-width:5;marker-end:url(#arrow)}.warnText{font-size:18px;font-weight:800;fill:#9a3412}.okText{font-size:18px;font-weight:800;fill:#166534}.note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1600" height="650" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">LLM 기반 보고서 작성과 검증 흐름</text>
  <text class="sub" x="86" y="118">LLM 문장은 자연스러워 보여도 데이터 근거와 비교해 검증해야 합니다</text>

  <g transform="translate(90 185)">
    <rect class="card data" width="360" height="250" rx="24"/>
    <text class="main" x="28" y="50">집계 결과표</text>
    <text class="item" x="28" y="96">category | total_sales</text>
    <text class="item" x="28" y="132">전자기기 | 12,500,000</text>
    <text class="item" x="28" y="168">생활용품 | 7,800,000</text>
    <text class="item" x="28" y="204">패션 | 6,200,000</text>
  </g>
  <path class="arr" d="M470 310H555"/>
  <g transform="translate(575 185)">
    <rect class="card llm" width="440" height="250" rx="24"/>
    <text class="main" x="28" y="50">LLM 문장 초안</text>
    <text class="item" x="28" y="98">전자기기 매출이 가장 높습니다.</text>
    <text class="item" x="28" y="136">이는 광고 효과 때문일 수 있습니다.</text>
    <rect class="warn" x="28" y="170" width="360" height="44" rx="14"/>
    <text class="warnText" x="208" y="198" text-anchor="middle">주의: 데이터에 없는 원인 단정</text>
  </g>
  <path class="arr" d="M1035 310H1120"/>
  <g transform="translate(1140 185)">
    <rect class="card check" width="370" height="250" rx="24"/>
    <text class="main" x="28" y="50">검증된 보고서 문장</text>
    <text class="item" x="28" y="98">전자기기 매출 비중이</text>
    <text class="item" x="28" y="132">가장 높게 나타났습니다.</text>
    <text class="item" x="28" y="166">원인은 추가 데이터로</text>
    <text class="item" x="28" y="200">확인해야 합니다.</text>
    <text class="okText" x="28" y="232">✓ 관찰과 가설 구분</text>
  </g>

  <g transform="translate(525 475)">
    <rect class="card check" width="550" height="80" rx="22"/>
    <text class="okText" x="36" y="34">검증 체크포인트</text>
    <text class="item" x="36" y="62">원인 단정 표현 확인 · 데이터 근거 확인 · 안전한 문장으로 수정</text>
  </g>

  <rect class="note" x="350" y="590" width="900" height="38" rx="14"/>
  <text class="noteText" x="800" y="616" text-anchor="middle">LLM은 문장을 다듬지만, 해석의 책임은 분석자에게 있습니다</text>
</svg>