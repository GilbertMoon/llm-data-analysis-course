<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="660" viewBox="0 0 1700 660" role="img" aria-labelledby="title desc">
  <title id="title">분석 보고서 자동 작성 전체 흐름도</title>
  <desc id="desc">분석 결과 CSV, 그래프 이미지, 인사이트 카드가 자동 보고서로 조립되고 LLM 보완과 사람 검증을 거쳐 최종 저장되는 흐름</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:40px;font-weight:800;fill:#fff}.sub{font-size:19px;font-weight:600;fill:#dbeafe}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.auto{stroke:#bfdbfe}.llm{stroke:#c4b5fd}.human{stroke:#86efac}.num{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.nt{font-size:16px;font-weight:900;fill:#2563eb}.main{font-size:20px;font-weight:850;fill:#0f172a}.desc{font-size:14px;font-weight:650;fill:#64748b}.arr{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#arrow)}.note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:21px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1700" height="660" rx="34"/>
  <rect class="h" x="55" y="38" width="1590" height="96" rx="28"/>
  <text class="title" x="92" y="96">분석 보고서 자동 작성 전체 흐름</text>
  <text class="sub" x="92" y="124">반복 작업은 자동화하고, 최종 판단은 사람이 검증합니다</text>

  <g transform="translate(70 185)"><rect class="node auto" width="230" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">1</text><text class="main" x="62" y="42">분석 결과 CSV</text><text class="desc" x="24" y="74">집계표와 요약표</text></g>
  <path class="arr" d="M310 235H355"/>
  <g transform="translate(370 185)"><rect class="node auto" width="230" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">2</text><text class="main" x="62" y="42">그래프 PNG</text><text class="desc" x="24" y="74">보고서용 이미지</text></g>
  <path class="arr" d="M610 235H655"/>
  <g transform="translate(670 185)"><rect class="node auto" width="230" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">3</text><text class="main" x="62" y="42">인사이트 카드</text><text class="desc" x="24" y="74">관찰·주의·다음 질문</text></g>
  <path class="arr" d="M910 235H955"/>
  <g transform="translate(970 185)"><rect class="node auto" width="230" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">4</text><text class="main" x="62" y="42">Markdown 템플릿</text><text class="desc" x="24" y="74">보고서 구조 설계</text></g>
  <path class="arr" d="M1210 235H1255"/>
  <g transform="translate(1270 185)"><rect class="node auto" width="250" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">5</text><text class="main" x="62" y="42">Python 자동 조립</text><text class="desc" x="24" y="74">표와 이미지 삽입</text></g>

  <path class="arr" d="M1395 285 C1395 350 1290 360 1240 370"/>
  <g transform="translate(1125 420)"><rect class="node llm" width="250" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">6</text><text class="main" x="62" y="42">LLM 문장 보완</text><text class="desc" x="24" y="74">초안 문장 정리</text></g>
  <path class="arr" d="M1115 470H1060"/>
  <g transform="translate(795 420)"><rect class="node human" width="250" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">7</text><text class="main" x="62" y="42">사람 검증</text><text class="desc" x="24" y="74">근거와 원인 단정 확인</text></g>
  <path class="arr" d="M785 470H730"/>
  <g transform="translate(465 420)"><rect class="node human" width="250" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">8</text><text class="main" x="62" y="42">최종 보고서 저장</text><text class="desc" x="24" y="74">ch12_auto_report.md</text></g>

  <rect class="note" x="360" y="585" width="980" height="42" rx="14"/>
  <text class="noteText" x="850" y="613" text-anchor="middle">보고서 자동 작성은 반복 작업을 줄이고 검토에 집중하기 위한 과정입니다</text>
</svg>