<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">분석 보고서 템플릿 구조</title>
  <desc id="desc">자동 생성할 분석 보고서의 제목, 목적, 데이터 개요, 주요 결과, 인사이트, 한계점, 다음 단계, 검증 체크리스트 구조</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#e2e8f0}
      .doc{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.sec{fill:#f8fafc;stroke:#dbeafe;stroke-width:2}.num{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.nt{font-size:14px;font-weight:900;fill:#2563eb}.st{font-size:18px;font-weight:800;fill:#0f172a}.desc{font-size:14px;font-weight:650;fill:#64748b}.side{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.sideText{font-size:18px;font-weight:800;fill:#166534}.note{fill:#fff7ed;stroke:#fdba74;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#9a3412}
    </style>
  </defs>
  <rect class="bg" width="1600" height="700" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">분석 보고서 템플릿 구조</text>
  <text class="sub" x="86" y="118">좋은 자동 보고서는 구조가 먼저 설계되어야 합니다</text>

  <g transform="translate(120 155)">
    <rect class="doc" width="930" height="470" rx="28"/>
    <text x="42" y="52" font-size="28" font-weight="900" fill="#0f172a">Markdown 분석 보고서 템플릿</text>
    <g transform="translate(42 82)"><rect class="sec" width="400" height="50" rx="14"/><circle class="num" cx="28" cy="25" r="15"/><text class="nt" x="28" y="30" text-anchor="middle">1</text><text class="st" x="54" y="31">제목과 작성일</text></g>
    <g transform="translate(488 82)"><rect class="sec" width="400" height="50" rx="14"/><circle class="num" cx="28" cy="25" r="15"/><text class="nt" x="28" y="30" text-anchor="middle">2</text><text class="st" x="54" y="31">분석 목적</text></g>
    <g transform="translate(42 148)"><rect class="sec" width="400" height="50" rx="14"/><circle class="num" cx="28" cy="25" r="15"/><text class="nt" x="28" y="30" text-anchor="middle">3</text><text class="st" x="54" y="31">데이터 개요</text></g>
    <g transform="translate(488 148)"><rect class="sec" width="400" height="50" rx="14"/><circle class="num" cx="28" cy="25" r="15"/><text class="nt" x="28" y="30" text-anchor="middle">4</text><text class="st" x="54" y="31">주요 결과 요약</text></g>
    <g transform="translate(42 214)"><rect class="sec" width="400" height="50" rx="14"/><circle class="num" cx="28" cy="25" r="15"/><text class="nt" x="28" y="30" text-anchor="middle">5</text><text class="st" x="54" y="31">카테고리별 매출 분석</text></g>
    <g transform="translate(488 214)"><rect class="sec" width="400" height="50" rx="14"/><circle class="num" cx="28" cy="25" r="15"/><text class="nt" x="28" y="30" text-anchor="middle">6</text><text class="st" x="54" y="31">월별 매출 분석</text></g>
    <g transform="translate(42 280)"><rect class="sec" width="400" height="50" rx="14"/><circle class="num" cx="28" cy="25" r="15"/><text class="nt" x="28" y="30" text-anchor="middle">7</text><text class="st" x="54" y="31">고객별 구매 금액 분석</text></g>
    <g transform="translate(488 280)"><rect class="sec" width="400" height="50" rx="14"/><circle class="num" cx="28" cy="25" r="15"/><text class="nt" x="28" y="30" text-anchor="middle">8</text><text class="st" x="54" y="31">인사이트 카드</text></g>
    <g transform="translate(42 346)"><rect class="sec" width="400" height="50" rx="14"/><circle class="num" cx="28" cy="25" r="15"/><text class="nt" x="28" y="30" text-anchor="middle">9</text><text class="st" x="54" y="31">한계점</text></g>
    <g transform="translate(488 346)"><rect class="sec" width="400" height="50" rx="14"/><circle class="num" cx="28" cy="25" r="15"/><text class="nt" x="28" y="30" text-anchor="middle">10</text><text class="st" x="54" y="31">다음 단계</text></g>
    <g transform="translate(42 412)"><rect class="sec" width="846" height="42" rx="14"/><circle class="num" cx="28" cy="21" r="15"/><text class="nt" x="28" y="26" text-anchor="middle">11</text><text class="st" x="54" y="27">검증 체크리스트</text></g>
  </g>

  <g transform="translate(1120 240)">
    <rect class="side" width="360" height="245" rx="24"/>
    <text class="sideText" x="40" y="58">구성 요소</text>
    <text class="sideText" x="40" y="104">• 표</text>
    <text class="sideText" x="40" y="144">• 그래프</text>
    <text class="sideText" x="40" y="184">• 인사이트</text>
    <text class="sideText" x="40" y="224">• 체크리스트</text>
  </g>
  <rect class="note" x="350" y="645" width="900" height="36" rx="14"/>
  <text class="noteText" x="800" y="669" text-anchor="middle">템플릿이 안정적이면 보고서 자동 생성 결과도 일정해집니다</text>
</svg>