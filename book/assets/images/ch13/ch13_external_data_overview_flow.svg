<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">외부 데이터 수집 전체 흐름도</title>
  <desc id="desc">분석 질문 정의부터 데이터 출처 탐색, 수집 방법과 사용 조건 확인, 외부 데이터 수집, 구조와 품질 검증, 원본과 메타데이터 저장, 내부 데이터 연결까지 이어지는 안전하고 재현 가능한 외부 데이터 수집 흐름</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}
      .top-line{stroke:#2563eb;stroke-width:8;stroke-linecap:round}
      .title{font:700 48px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .subtitle{font:500 24px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}
      .band{font:700 20px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}
      .design{fill:#eff6ff;stroke:#60a5fa}
      .collect{fill:#ecfdf5;stroke:#34d399}
      .store{fill:#f5f3ff;stroke:#a78bfa}
      .policy{fill:#fff7ed;stroke:#fb923c}
      .num{font:700 16px Arial,'Noto Sans KR','Malgun Gothic',sans-serif}
      .head{font:700 24px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .txt{font:500 17px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}
      .small{font:500 15px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569}
      .code{font:700 16px Consolas,'Courier New',monospace;fill:#2563eb}
      .badge{font:700 14px Arial,'Noto Sans KR','Malgun Gothic',sans-serif}
      .badge-blue{fill:#dbeafe;stroke:#60a5fa}
      .badge-green{fill:#dcfce7;stroke:#22c55e}
      .badge-purple{fill:#ede9fe;stroke:#8b5cf6}
      .badge-orange{fill:#ffedd5;stroke:#fb923c}
      .principle{fill:#fff;stroke:#93c5fd;stroke-width:2.5}
      .footer-box{fill:#ecfeff;stroke:#22d3ee;stroke-width:2.5}
      .principle-head{font:700 24px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .principle-text{font:700 18px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#1e3a8a}
      .footer{font:700 22px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f3b5f}
      .arrow{stroke:#64748b;stroke-width:3.5;fill:none}
      .icon-blue{stroke:#2563eb;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .icon-green{stroke:#059669;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .icon-purple{stroke:#7c3aed;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .icon-orange{stroke:#ea580c;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .icon-gray{stroke:#475569;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <line class="top-line" x1="64" y1="54" x2="1536" y2="54"/>

  <text x="96" y="118" class="title">외부 데이터 수집 전체 흐름도</text>
  <text x="98" y="156" class="subtitle">분석 질문에서 출발해 외부 데이터를 안전하게 수집하고 내부 데이터와 연결합니다.</text>

  <text x="94" y="214" class="band">1단계 · 수집 설계</text>
  <text x="94" y="482" class="band">2단계 · 수집과 검증</text>
  <text x="870" y="482" class="band">3단계 · 저장과 연결</text>

  <path class="arrow" marker-end="url(#arrow)" d="M410 318 H456"/>
  <path class="arrow" marker-end="url(#arrow)" d="M766 318 H812"/>
  <path class="arrow" marker-end="url(#arrow)" d="M1122 318 H1168"/>
  <path class="arrow" marker-end="url(#arrow)" d="M1335 405 C1335 444 282 444 282 502"/>
  <path class="arrow" marker-end="url(#arrow)" d="M410 586 H456"/>
  <path class="arrow" marker-end="url(#arrow)" d="M766 586 H812"/>
  <path class="arrow" marker-end="url(#arrow)" d="M1122 586 H1168"/>

  <g transform="translate(90 232)">
    <rect width="320" height="172" rx="22" class="card design"/>
    <rect x="22" y="20" width="48" height="28" rx="14" class="badge-blue"/>
    <text x="46" y="39" text-anchor="middle" class="num" fill="#1d4ed8">01</text>
    <g transform="translate(24 62)">
      <rect x="0" y="0" width="58" height="58" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="29" cy="29" r="17" class="icon-blue"/>
      <path class="icon-blue" d="M29 16 V29 L40 36"/>
    </g>
    <text x="104" y="74" class="head">분석 질문 정의</text>
    <text x="104" y="108" class="txt">무엇을 알고 싶은가</text>
    <text x="104" y="138" class="small">필요한 외부 정보부터 결정</text>
  </g>

  <g transform="translate(446 232)">
    <rect width="320" height="172" rx="22" class="card design"/>
    <rect x="22" y="20" width="48" height="28" rx="14" class="badge-blue"/>
    <text x="46" y="39" text-anchor="middle" class="num" fill="#1d4ed8">02</text>
    <g transform="translate(24 62)">
      <rect x="0" y="0" width="58" height="58" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="26" cy="26" r="13" class="icon-blue"/>
      <path class="icon-blue" d="M36 36 L49 49"/>
      <path class="icon-blue" d="M16 52 H46"/>
    </g>
    <text x="104" y="74" class="head">데이터 출처 탐색</text>
    <text x="104" y="108" class="txt">제공 기관과 설명 확인</text>
    <text x="104" y="138" class="small">업데이트 주기와 형식 점검</text>
  </g>

  <g transform="translate(802 232)">
    <rect width="320" height="172" rx="22" class="card design"/>
    <rect x="22" y="20" width="48" height="28" rx="14" class="badge-blue"/>
    <text x="46" y="39" text-anchor="middle" class="num" fill="#1d4ed8">03</text>
    <g transform="translate(24 62)">
      <rect x="0" y="0" width="58" height="58" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
      <path class="icon-blue" d="M17 17 H41 V43 H17 Z"/>
      <path class="icon-blue" d="M17 27 H41 M27 17 V43"/>
    </g>
    <text x="104" y="70" class="head">수집 방법 선택</text>
    <text x="104" y="102" class="txt">공식 파일·API 우선</text>
    <rect x="104" y="120" width="44" height="24" rx="12" class="badge-blue"/>
    <text x="126" y="137" text-anchor="middle" class="badge" fill="#1d4ed8">파일</text>
    <rect x="156" y="120" width="42" height="24" rx="12" class="badge-blue"/>
    <text x="177" y="137" text-anchor="middle" class="badge" fill="#1d4ed8">API</text>
    <rect x="206" y="120" width="76" height="24" rx="12" class="badge-orange"/>
    <text x="244" y="137" text-anchor="middle" class="badge" fill="#b45309">제한 크롤링</text>
  </g>

  <g transform="translate(1158 232)">
    <rect width="320" height="172" rx="22" class="card policy"/>
    <rect x="22" y="20" width="48" height="28" rx="14" class="badge-orange"/>
    <text x="46" y="39" text-anchor="middle" class="num" fill="#b45309">04</text>
    <g transform="translate(24 62)">
      <rect x="0" y="0" width="58" height="58" rx="14" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
      <path class="icon-orange" d="M18 28 H40 V48 H18 Z"/>
      <path class="icon-orange" d="M22 28 V21 C22 12 36 12 36 21 V28"/>
    </g>
    <text x="104" y="70" class="head">사용 조건 확인</text>
    <text x="104" y="102" class="txt">인증·라이선스·접근 정책</text>
    <text x="104" y="130" class="small">API Key는 <tspan class="code">.env</tspan>에 보관</text>
    <text x="104" y="154" class="small">robots.txt · 개인정보 확인</text>
  </g>

  <g transform="translate(90 500)">
    <rect width="320" height="172" rx="22" class="card collect"/>
    <rect x="22" y="20" width="48" height="28" rx="14" class="badge-green"/>
    <text x="46" y="39" text-anchor="middle" class="num" fill="#047857">05</text>
    <g transform="translate(24 62)">
      <rect x="0" y="0" width="58" height="58" rx="14" fill="#dcfce7" stroke="#34d399" stroke-width="2"/>
      <path class="icon-green" d="M29 14 V42 M18 32 L29 43 L40 32"/>
      <path class="icon-green" d="M16 48 H42"/>
    </g>
    <text x="104" y="74" class="head">데이터 수집</text>
    <text x="104" y="108" class="txt">다운로드 또는 요청 실행</text>
    <text x="104" y="138" class="small">응답·파일을 캐시로 보관</text>
  </g>

  <g transform="translate(446 500)">
    <rect width="320" height="172" rx="22" class="card collect"/>
    <rect x="22" y="20" width="48" height="28" rx="14" class="badge-green"/>
    <text x="46" y="39" text-anchor="middle" class="num" fill="#047857">06</text>
    <g transform="translate(24 62)">
      <rect x="0" y="0" width="58" height="58" rx="14" fill="#dcfce7" stroke="#34d399" stroke-width="2"/>
      <path class="icon-green" d="M15 18 H43 M15 31 H43 M15 44 H31"/>
      <path class="icon-green" d="M38 43 L44 49 L52 36"/>
    </g>
    <text x="104" y="70" class="head">구조·품질 검증</text>
    <text x="104" y="102" class="txt">형식·컬럼·행 확인</text>
    <text x="104" y="130" class="small">결측 · 중복 · 기간 점검</text>
    <text x="104" y="154" class="small">응답 상태와 업데이트 시점</text>
  </g>

  <g transform="translate(802 500)">
    <rect width="320" height="172" rx="22" class="card store"/>
    <rect x="22" y="20" width="48" height="28" rx="14" class="badge-purple"/>
    <text x="46" y="39" text-anchor="middle" class="num" fill="#6d28d9">07</text>
    <g transform="translate(24 62)">
      <rect x="0" y="0" width="58" height="58" rx="14" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
      <path class="icon-purple" d="M14 24 H26 L31 18 H45 V46 H14 Z"/>
      <path class="icon-purple" d="M19 36 H40"/>
    </g>
    <text x="104" y="70" class="head">원본·메타데이터 저장</text>
    <text x="104" y="104" class="code">data/external/</text>
    <text x="104" y="132" class="small">출처 · 수집일 · 사용 조건</text>
    <text x="104" y="154" class="small">요청 URL과 파라미터 기록</text>
  </g>

  <g transform="translate(1158 500)">
    <rect width="320" height="172" rx="22" class="card store"/>
    <rect x="22" y="20" width="48" height="28" rx="14" class="badge-purple"/>
    <text x="46" y="39" text-anchor="middle" class="num" fill="#6d28d9">08</text>
    <g transform="translate(24 62)">
      <rect x="0" y="0" width="58" height="58" rx="14" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
      <path class="icon-purple" d="M12 21 H27 M12 37 H27 M33 21 H48 M33 37 H48"/>
      <path class="icon-purple" d="M27 29 H33"/>
    </g>
    <text x="104" y="70" class="head">내부 데이터 연결</text>
    <text x="104" y="102" class="txt">날짜·지역·키워드·공통 키</text>
    <text x="104" y="130" class="small">단위와 기준 시점 맞추기</text>
    <text x="104" y="154" class="small">연결 후 행 수 확인</text>
  </g>

  <rect x="190" y="704" width="1220" height="70" rx="20" class="principle"/>
  <text x="238" y="748" class="principle-head">핵심 원칙</text>
  <text x="390" y="748" class="principle-text">출처 · 수집일 · 사용 조건 · 요청 정보 · 연결 기준을 함께 기록합니다.</text>

  <rect x="220" y="804" width="1160" height="56" rx="20" class="footer-box"/>
  <text x="800" y="840" text-anchor="middle" class="footer">외부 데이터는 많이 모으는 것이 아니라, 분석 질문에 맞게 안전하고 재현 가능하게 연결하는 것이 중요합니다.</text>
</svg>
