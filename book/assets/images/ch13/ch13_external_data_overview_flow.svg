<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 34px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.sub{font:500 18px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18;ry:18}.accent{fill:#dbeafe;stroke:#93c5fd;stroke-width:2;rx:18;ry:18}.head{font:700 21px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.txt{font:500 15px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.footer{font:500 18px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#1e40af}
    </style>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="600" y="58" text-anchor="middle" class="title">외부 데이터 수집 전체 흐름도</text>
  <text x="600" y="90" text-anchor="middle" class="sub">분석 질문에서 출발해 외부 데이터를 수집하고 내부 데이터와 연결한다.</text>
  <rect x="55" y="230" width="140" height="100" class="box"/><text x="125" y="270" text-anchor="middle" class="head">질문 정의</text><text x="125" y="298" text-anchor="middle" class="txt">무엇이 필요한가</text>
  <rect x="235" y="230" width="140" height="100" class="box"/><text x="305" y="270" text-anchor="middle" class="head">데이터 탐색</text><text x="305" y="298" text-anchor="middle" class="txt">출처 확인</text>
  <rect x="415" y="230" width="140" height="100" class="box"/><text x="485" y="270" text-anchor="middle" class="head">수집 방식</text><text x="485" y="298" text-anchor="middle" class="txt">파일 · API</text>
  <rect x="595" y="230" width="140" height="100" class="box"/><text x="665" y="270" text-anchor="middle" class="head">구조 확인</text><text x="665" y="298" text-anchor="middle" class="txt">컬럼 · 행 수</text>
  <rect x="775" y="230" width="140" height="100" class="box"/><text x="845" y="270" text-anchor="middle" class="head">저장</text><text x="845" y="298" text-anchor="middle" class="txt">data/external</text>
  <rect x="955" y="230" width="170" height="100" class="accent"/><text x="1040" y="270" text-anchor="middle" class="head">분석 연결</text><text x="1040" y="298" text-anchor="middle" class="txt">날짜 · 지역 · 키워드</text>
  <path class="arrow" d="M195 280H230"/><path class="arrow" d="M375 280H410"/><path class="arrow" d="M555 280H590"/><path class="arrow" d="M735 280H770"/><path class="arrow" d="M915 280H950"/>
  <rect x="360" y="430" width="480" height="110" class="accent"/>
  <text x="600" y="475" text-anchor="middle" class="head">핵심 원칙</text>
  <text x="600" y="508" text-anchor="middle" class="txt">출처, 수집일, 사용 조건, 연결 기준을 함께 기록한다.</text>
  <text x="600" y="640" text-anchor="middle" class="footer">외부 데이터는 분석 질문을 확장하는 자료입니다.</text>
</svg>