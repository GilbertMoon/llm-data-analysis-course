<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 34px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.sub{font:500 18px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18;ry:18}.internal{fill:#dbeafe;stroke:#93c5fd;stroke-width:2;rx:18;ry:18}.external{fill:#dcfce7;stroke:#86efac;stroke-width:2;rx:18;ry:18}.result{fill:#fef3c7;stroke:#fcd34d;stroke-width:2;rx:18;ry:18}.head{font:700 24px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.txt{font:500 17px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}.mono{font:600 16px Consolas,'Courier New',monospace;fill:#1e293b}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.footer{font:500 18px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#1e40af}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="600" y="58" text-anchor="middle" class="title">외부 데이터와 내부 데이터 연결</text>
  <text x="600" y="90" text-anchor="middle" class="sub">날짜, 지역, 키워드 같은 공통 기준이 있어야 분석에 연결할 수 있다.</text>
  <rect x="120" y="180" width="300" height="170" class="internal"/>
  <text x="270" y="235" text-anchor="middle" class="head">내부 데이터</text>
  <text x="270" y="280" text-anchor="middle" class="txt">주문 · 고객 · 상품</text>
  <text x="270" y="315" text-anchor="middle" class="mono">order_date · city</text>
  <rect x="120" y="430" width="300" height="170" class="external"/>
  <text x="270" y="485" text-anchor="middle" class="head">외부 데이터</text>
  <text x="270" y="530" text-anchor="middle" class="txt">공휴일 · 날씨 · 검색</text>
  <text x="270" y="565" text-anchor="middle" class="mono">date · region · keyword</text>
  <rect x="520" y="305" width="260" height="170" class="box"/>
  <text x="650" y="360" text-anchor="middle" class="head">연결 기준</text>
  <text x="650" y="405" text-anchor="middle" class="txt">날짜 · 지역 · 키워드</text>
  <rect x="880" y="305" width="240" height="170" class="result"/>
  <text x="1000" y="360" text-anchor="middle" class="head">확장 분석</text>
  <text x="1000" y="405" text-anchor="middle" class="txt">매출 흐름 비교</text>
  <text x="1000" y="435" text-anchor="middle" class="txt">외부 맥락 확인</text>
  <path class="arrow" d="M420 265C470 300 500 335 515 365"/>
  <path class="arrow" d="M420 515C470 480 500 445 515 415"/>
  <path class="arrow" d="M780 390H875"/>
  <text x="600" y="650" text-anchor="middle" class="footer">연결 후에는 행 수와 결측치 변화를 반드시 확인합니다.</text>
</svg>