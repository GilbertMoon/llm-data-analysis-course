<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">외부 데이터와 내부 데이터 연결</title>
  <desc id="desc">내부 주문 데이터와 외부 공휴일, 날씨, 검색 데이터를 날짜, 지역, 상품 카테고리와 키워드 기준으로 정렬한 뒤 공통 키로 병합하고, 연결 후 행 수와 결측치 변화를 점검해 확장 분석에 활용하는 흐름</desc>

  <defs>
    <style>
      .bg{fill:#f8fafc}
      .top{fill:#2563eb}
      .title{font:700 46px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#0f172a}
      .sub{font:500 22px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#475569}
      .section{font:700 15px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic',sans-serif;fill:#64748b}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2.2}
      .card-blue{stroke:#93c5fd}
      .card-green{stroke:#86efac}
      .card-violet{stroke:#c4b5fd}
      .card-amber{stroke:#fcd34d}
      .num-bg{fill:#dbeafe}
      .num{font:700 16px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d4ed8}
      .card-title{font:700 25px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#0f172a}
      .card-copy{font:500 17px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#334155}
      .small{font:500 16px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#475569}
      .tiny{font:600 14px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic',sans-serif;fill:#64748b}
      .mono{font:600 15px 'D2Coding','JetBrains Mono',Consolas,'Courier New',monospace;fill:#1e293b}
      .mono-blue{font:600 15px 'D2Coding','JetBrains Mono',Consolas,'Courier New',monospace;fill:#1d4ed8}
      .badge{stroke-width:1.4}
      .badge-blue{fill:#eff6ff;stroke:#bfdbfe}
      .badge-green{fill:#ecfdf5;stroke:#a7f3d0}
      .badge-violet{fill:#f5f3ff;stroke:#ddd6fe}
      .badge-amber{fill:#fffbeb;stroke:#fde68a}
      .badge-text-blue{font:700 14px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d4ed8}
      .badge-text-green{font:700 14px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic',sans-serif;fill:#047857}
      .badge-text-violet{font:700 14px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic',sans-serif;fill:#6d28d9}
      .badge-text-amber{font:700 14px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic',sans-serif;fill:#b45309}
      .divider{stroke:#e2e8f0;stroke-width:1.5}
      .arrow{stroke:#64748b;stroke-width:3.2;fill:none;marker-end:url(#arrow)}
      .arrow-blue{stroke:#2563eb;stroke-width:3.2;fill:none;marker-end:url(#arrowBlue)}
      .icon-blue{stroke:#2563eb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .icon-green{stroke:#059669;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .icon-violet{stroke:#7c3aed;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .icon-amber{stroke:#d97706;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .icon-fill-blue{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}
      .icon-fill-green{fill:#ecfdf5;stroke:#86efac;stroke-width:2}
      .icon-fill-violet{fill:#f5f3ff;stroke:#c4b5fd;stroke-width:2}
      .icon-fill-amber{fill:#fffbeb;stroke:#fcd34d;stroke-width:2}
      .check-title{font:700 22px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .check-copy{font:600 16px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}
      .footer{font:600 20px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1e3a8a}
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0,11 4.5,0 9" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0,11 4.5,0 9" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect class="top" x="28" y="20" width="1544" height="14" rx="7"/>
  <text x="80" y="92" class="title">외부 데이터와 내부 데이터 연결</text>
  <text x="80" y="132" class="sub">공통 기준의 형식·단위·시점을 맞춘 뒤 연결하고, 병합 결과의 행 수와 결측치를 검증합니다.</text>
  <text x="80" y="183" class="section">데이터 연결 흐름</text>

  <path class="arrow" d="M500 405 H538"/>
  <path class="arrow" d="M868 405 H908"/>
  <path class="arrow" d="M1190 405 H1230"/>

  <g transform="translate(70,215)">
    <rect width="430" height="390" rx="24" class="card card-blue"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="num-bg"/>
    <text x="42" y="38" text-anchor="middle" class="num">01</text>
    <rect x="324" y="18" width="86" height="28" rx="14" class="badge badge-blue"/>
    <text x="367" y="38" text-anchor="middle" class="badge-text-blue">데이터 준비</text>
    <text x="28" y="84" class="card-title">내부·외부 데이터 준비</text>
    <text x="28" y="116" class="card-copy">연결에 사용할 컬럼과 데이터 범위를 먼저 확인</text>

    <rect x="24" y="144" width="382" height="98" rx="16" class="icon-fill-blue"/>
    <g transform="translate(42,164)">
      <rect x="0" y="0" width="52" height="56" rx="7" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
      <line x1="10" y1="16" x2="42" y2="16" class="icon-blue"/>
      <line x1="10" y1="29" x2="42" y2="29" class="icon-blue"/>
      <line x1="10" y1="42" x2="34" y2="42" class="icon-blue"/>
    </g>
    <text x="118" y="177" class="card-title" style="font-size:21px">내부 데이터</text>
    <text x="118" y="205" class="small">주문 · 고객 · 상품</text>
    <text x="118" y="229" class="mono-blue">order_date · city · category</text>

    <rect x="24" y="258" width="382" height="98" rx="16" class="icon-fill-green"/>
    <g transform="translate(42,278)">
      <circle cx="26" cy="28" r="24" fill="#fff" stroke="#059669" stroke-width="2.5"/>
      <path d="M26 8V48M6 28H46M10 17C21 24 31 24 42 17M10 39C21 32 31 32 42 39" class="icon-green"/>
    </g>
    <text x="118" y="291" class="card-title" style="font-size:21px">외부 데이터</text>
    <text x="118" y="319" class="small">공휴일 · 날씨 · 검색 · 지역 통계</text>
    <text x="118" y="343" class="mono">date · region · keyword</text>
  </g>

  <g transform="translate(540,215)">
    <rect width="328" height="390" rx="24" class="card card-green"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="num-bg"/>
    <text x="42" y="38" text-anchor="middle" class="num">02</text>
    <rect x="220" y="18" width="88" height="28" rx="14" class="badge badge-green"/>
    <text x="264" y="38" text-anchor="middle" class="badge-text-green">기준 정렬</text>
    <g transform="translate(24,68)">
      <rect width="76" height="70" rx="10" class="icon-fill-green"/>
      <line x1="15" y1="20" x2="61" y2="20" class="icon-green"/>
      <line x1="15" y1="35" x2="49" y2="35" class="icon-green"/>
      <line x1="15" y1="50" x2="58" y2="50" class="icon-green"/>
      <path d="M84 20H110M84 50H110" class="icon-green"/>
      <path d="M103 13L110 20L103 27M103 43L110 50L103 57" class="icon-green"/>
    </g>
    <text x="132" y="95" class="card-title">연결 기준 정렬</text>
    <text x="132" y="124" class="card-copy">양쪽 데이터의 표현 기준 통일</text>
    <line x1="20" y1="158" x2="308" y2="158" class="divider"/>

    <text x="24" y="192" class="badge-text-green">날짜</text>
    <text x="92" y="192" class="small">형식과 일·월 단위 맞춤</text>
    <text x="24" y="231" class="badge-text-green">지역</text>
    <text x="92" y="231" class="small">city ↔ region 표기 통일</text>
    <text x="24" y="270" class="badge-text-green">분류</text>
    <text x="92" y="270" class="small">카테고리·키워드 기준 확인</text>
    <text x="24" y="309" class="badge-text-green">시점</text>
    <text x="92" y="309" class="small">수집 기간과 기준일 일치</text>

    <rect x="20" y="340" width="288" height="28" rx="14" class="badge badge-green"/>
    <text x="164" y="359" text-anchor="middle" class="badge-text-green">단위 · 기간 · 기준 시점 확인</text>
  </g>

  <g transform="translate(910,215)">
    <rect width="280" height="390" rx="24" class="card card-violet"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="num-bg"/>
    <text x="42" y="38" text-anchor="middle" class="num">03</text>
    <rect x="186" y="18" width="74" height="28" rx="14" class="badge badge-violet"/>
    <text x="223" y="38" text-anchor="middle" class="badge-text-violet">병합</text>
    <g transform="translate(28,67)">
      <rect x="0" y="0" width="66" height="62" rx="9" class="icon-fill-violet"/>
      <rect x="22" y="20" width="66" height="62" rx="9" fill="#fff" stroke="#c4b5fd" stroke-width="2"/>
      <line x1="12" y1="18" x2="54" y2="18" class="icon-violet"/>
      <line x1="34" y1="38" x2="76" y2="38" class="icon-violet"/>
      <path d="M96 30H118" class="icon-violet"/>
      <path d="M111 23L118 30L111 37" class="icon-violet"/>
    </g>
    <text x="154" y="95" class="card-title">데이터 연결</text>
    <text x="154" y="124" class="card-copy">공통 키로 병합</text>
    <line x1="20" y1="158" x2="260" y2="158" class="divider"/>
    <text x="24" y="198" class="mono">merge(..., how="left")</text>
    <text x="24" y="240" class="small">– 내부 데이터 기준 유지</text>
    <text x="24" y="278" class="small">– 연결 키 중복 여부 확인</text>
    <text x="24" y="316" class="small">– 한 행의 분석 단위 보존</text>
    <rect x="20" y="340" width="240" height="28" rx="14" class="badge badge-violet"/>
    <text x="140" y="359" text-anchor="middle" class="badge-text-violet">공통 키 · 병합 방식 기록</text>
  </g>

  <g transform="translate(1230,215)">
    <rect width="300" height="390" rx="24" class="card card-amber"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="num-bg"/>
    <text x="42" y="38" text-anchor="middle" class="num">04</text>
    <rect x="202" y="18" width="78" height="28" rx="14" class="badge badge-amber"/>
    <text x="241" y="38" text-anchor="middle" class="badge-text-amber">확장 분석</text>
    <g transform="translate(28,66)">
      <rect width="94" height="72" rx="10" class="icon-fill-amber"/>
      <line x1="14" y1="57" x2="82" y2="57" class="icon-amber"/>
      <line x1="14" y1="57" x2="14" y2="14" class="icon-amber"/>
      <polyline points="20,48 34,36 48,40 62,24 78,30" class="icon-amber"/>
      <circle cx="34" cy="36" r="3.5" fill="#d97706"/>
      <circle cx="62" cy="24" r="3.5" fill="#d97706"/>
    </g>
    <text x="142" y="94" class="card-title">확장 분석</text>
    <text x="142" y="123" class="card-copy">외부 맥락으로 결과 해석</text>
    <line x1="20" y1="158" x2="280" y2="158" class="divider"/>
    <text x="24" y="198" class="small">– 공휴일·날씨별 매출 비교</text>
    <text x="24" y="238" class="small">– 지역 특성과 고객 행동 연결</text>
    <text x="24" y="278" class="small">– 검색 관심도와 상품 흐름 비교</text>
    <text x="24" y="318" class="small">– 외부 요인의 맥락 확인</text>
    <rect x="20" y="340" width="260" height="28" rx="14" class="badge badge-amber"/>
    <text x="150" y="359" text-anchor="middle" class="badge-text-amber">관계 해석 시 인과 단정 금지</text>
  </g>

  <g transform="translate(150,650)">
    <rect width="1300" height="105" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="34" y="39" class="check-title">연결 후 반드시 확인</text>
    <text x="34" y="72" class="small">병합 전후 결과가 예상한 데이터 구조를 유지하는지 검증합니다.</text>

    <rect x="350" y="25" width="150" height="54" rx="16" class="badge badge-blue"/>
    <text x="425" y="48" text-anchor="middle" class="check-copy">행 수 변화</text>
    <text x="425" y="69" text-anchor="middle" class="tiny">증가·감소 원인</text>

    <rect x="520" y="25" width="150" height="54" rx="16" class="badge badge-green"/>
    <text x="595" y="48" text-anchor="middle" class="check-copy">결측치 증가</text>
    <text x="595" y="69" text-anchor="middle" class="tiny">미연결 행 확인</text>

    <rect x="690" y="25" width="150" height="54" rx="16" class="badge badge-violet"/>
    <text x="765" y="48" text-anchor="middle" class="check-copy">중복 행</text>
    <text x="765" y="69" text-anchor="middle" class="tiny">키 유일성 확인</text>

    <rect x="860" y="25" width="150" height="54" rx="16" class="badge badge-amber"/>
    <text x="935" y="48" text-anchor="middle" class="check-copy">기간 일치</text>
    <text x="935" y="69" text-anchor="middle" class="tiny">수집 시점 확인</text>

    <rect x="1030" y="25" width="235" height="54" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="1147.5" y="48" text-anchor="middle" class="check-copy">데이터 단위 보존</text>
    <text x="1147.5" y="69" text-anchor="middle" class="tiny">일·월·지역 수준 확인</text>
  </g>

  <g transform="translate(250,790)">
    <rect width="1100" height="62" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="550" y="39" text-anchor="middle" class="footer">연결 기준과 데이터 단위를 먼저 맞춘 뒤, 행 수와 결측치 변화를 확인합니다.</text>
  </g>
</svg>