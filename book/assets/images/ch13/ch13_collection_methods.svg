<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">외부 데이터 수집 방법 비교</title>
  <desc id="desc">공식 파일 다운로드, API 호출과 제한적 크롤링의 적합한 상황, 장점, 필수 확인사항, 한계와 결과 형식을 비교하고, 공식 제공 방식을 우선하는 외부 데이터 수집 원칙을 설명하는 개념도</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}
      .top-line{stroke:#2563eb;stroke-width:8;stroke-linecap:round}
      .title{font:700 48px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#0f172a}
      .subtitle{font:500 24px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#334155}
      .priority{fill:#fff;stroke:#93c5fd;stroke-width:2.5}
      .priority-text{font:700 20px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#1e3a8a}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2.5}
      .file-card{fill:#eff6ff;stroke:#60a5fa}
      .api-card{fill:#ecfdf5;stroke:#34d399}
      .crawl-card{fill:#fff7ed;stroke:#fb923c}
      .num{font:700 16px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif}
      .method{font:700 30px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#0f172a}
      .summary{font:700 19px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#334155}
      .label{font:700 18px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#0f172a}
      .txt{font:500 17px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#334155}
      .small{font:500 15px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#475569}
      .code{font:700 16px 'Malgun Gothic','맑은 고딕',Consolas,'Courier New',monospace;fill:#2563eb}
      .badge{font:700 15px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif}
      .badge-blue{fill:#dbeafe;stroke:#60a5fa}
      .badge-green{fill:#dcfce7;stroke:#22c55e}
      .badge-orange{fill:#ffedd5;stroke:#fb923c}
      .guide{fill:#fff;stroke:#bfdbfe;stroke-width:2}
      .guide-text{font:700 19px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#1e3a8a}
      .principle{fill:#fff;stroke:#93c5fd;stroke-width:2}
      .principle-text{font:700 18px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#1e40af}
      .footer-box{fill:#ecfeff;stroke:#22d3ee;stroke-width:2.5}
      .footer{font:700 22px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#0f3b5f}
      .icon-blue{stroke:#2563eb;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .icon-green{stroke:#059669;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .icon-orange{stroke:#ea580c;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .sep{stroke:#cbd5e1;stroke-width:1.5}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <line class="top-line" x1="64" y1="54" x2="1536" y2="54"/>

  <text x="96" y="118" class="title">외부 데이터 수집 방법 비교</text>
  <text x="98" y="156" class="subtitle">목적, 반복 주기와 제공 조건에 따라 적절한 수집 방법을 선택합니다.</text>

  <rect x="250" y="176" width="1100" height="48" rx="20" class="priority"/>
  <text x="800" y="207" text-anchor="middle" class="priority-text">권장 우선순위: 공식 파일 확인 → 공식 API 확인 → 둘 다 없을 때 제한적 크롤링 검토</text>

  <g transform="translate(82 248)">
    <rect width="460" height="440" rx="22" class="card file-card"/>
    <rect x="24" y="22" width="52" height="30" rx="15" class="badge-blue"/>
    <text x="50" y="43" text-anchor="middle" class="num" fill="#1d4ed8">01</text>
    <rect x="88" y="22" width="86" height="30" rx="15" class="badge-blue"/>
    <text x="131" y="43" text-anchor="middle" class="badge" fill="#1d4ed8">우선 권장</text>
    <g transform="translate(28 76)">
      <rect x="0" y="0" width="70" height="70" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
      <path class="icon-blue" d="M22 16 H48 V54 H22 Z"/>
      <path class="icon-blue" d="M28 28 H42 M28 38 H42"/>
      <path class="icon-blue" d="M35 56 V44 M26 48 L35 57 L44 48"/>
    </g>
    <text x="122" y="92" class="method">파일 다운로드</text>
    <text x="122" y="126" class="summary">공식 기관의 정적 파일을 직접 사용</text>
    <line x1="28" y1="154" x2="432" y2="154" class="sep"/>
    <text x="32" y="188" class="label">적합한 상황</text>
    <text x="172" y="188" class="txt">일회성 분석 · 정기 공개 통계</text>
    <text x="32" y="232" class="label">장점</text>
    <text x="172" y="232" class="txt">단순하고 안정적 · 원본 보관 쉬움</text>
    <text x="32" y="276" class="label">필수 확인</text>
    <text x="172" y="276" class="txt">출처 · 갱신일 · 인코딩 · 컬럼</text>
    <text x="32" y="320" class="label">한계</text>
    <text x="172" y="320" class="txt">최신 데이터는 다시 내려받아야 함</text>
    <text x="32" y="364" class="label">결과 형식</text>
    <rect x="172" y="344" width="52" height="26" rx="13" class="badge-blue"/>
    <text x="198" y="363" text-anchor="middle" class="badge" fill="#1d4ed8">CSV</text>
    <rect x="232" y="344" width="64" height="26" rx="13" class="badge-blue"/>
    <text x="264" y="363" text-anchor="middle" class="badge" fill="#1d4ed8">XLSX</text>
    <rect x="304" y="344" width="62" height="26" rx="13" class="badge-blue"/>
    <text x="335" y="363" text-anchor="middle" class="badge" fill="#1d4ed8">JSON</text>
    <text x="32" y="410" class="small">반복 수집: 수동 갱신 중심</text>
  </g>

  <g transform="translate(570 248)">
    <rect width="460" height="440" rx="22" class="card api-card"/>
    <rect x="24" y="22" width="52" height="30" rx="15" class="badge-green"/>
    <text x="50" y="43" text-anchor="middle" class="num" fill="#047857">02</text>
    <rect x="88" y="22" width="98" height="30" rx="15" class="badge-green"/>
    <text x="137" y="43" text-anchor="middle" class="badge" fill="#047857">자동화 적합</text>
    <g transform="translate(28 76)">
      <rect x="0" y="0" width="70" height="70" rx="16" fill="#dcfce7" stroke="#34d399" stroke-width="2"/>
      <path class="icon-green" d="M18 26 H34 M36 18 L52 35 L36 52"/>
      <path class="icon-green" d="M18 44 H34"/>
      <path class="icon-green" d="M26 18 L18 26 L26 34"/>
    </g>
    <text x="122" y="92" class="method">API 호출</text>
    <text x="122" y="126" class="summary">요청 URL과 파라미터로 데이터 수집</text>
    <line x1="28" y1="154" x2="432" y2="154" class="sep"/>
    <text x="32" y="188" class="label">적합한 상황</text>
    <text x="172" y="188" class="txt">반복·자동 수집 · 조건별 최신 데이터</text>
    <text x="32" y="232" class="label">장점</text>
    <text x="172" y="232" class="txt">파라미터 지정 · 자동화에 적합</text>
    <text x="32" y="276" class="label">필수 확인</text>
    <text x="172" y="276" class="txt">API 문서 · 인증 · 제한 · 오류 처리</text>
    <text x="32" y="320" class="label">한계</text>
    <text x="172" y="320" class="txt">Key 관리와 호출 제한 확인 필요</text>
    <text x="32" y="364" class="label">결과 형식</text>
    <rect x="172" y="344" width="62" height="26" rx="13" class="badge-green"/>
    <text x="203" y="363" text-anchor="middle" class="badge" fill="#047857">JSON</text>
    <rect x="242" y="344" width="56" height="26" rx="13" class="badge-green"/>
    <text x="270" y="363" text-anchor="middle" class="badge" fill="#047857">XML</text>
    <rect x="306" y="344" width="50" height="26" rx="13" class="badge-green"/>
    <text x="331" y="363" text-anchor="middle" class="badge" fill="#047857">CSV</text>
    <text x="32" y="410" class="small">API Key → <tspan class="code">.env</tspan> · PAGE · CACHE</text>
  </g>

  <g transform="translate(1058 248)">
    <rect width="460" height="440" rx="22" class="card crawl-card"/>
    <rect x="24" y="22" width="52" height="30" rx="15" class="badge-orange"/>
    <text x="50" y="43" text-anchor="middle" class="num" fill="#b45309">03</text>
    <rect x="88" y="22" width="108" height="30" rx="15" class="badge-orange"/>
    <text x="142" y="43" text-anchor="middle" class="badge" fill="#b45309">제한적 검토</text>
    <g transform="translate(28 76)">
      <rect x="0" y="0" width="70" height="70" rx="16" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
      <path class="icon-orange" d="M17 20 H53 V52 H17 Z"/>
      <path class="icon-orange" d="M17 30 H53"/>
      <path class="icon-orange" d="M26 41 H44"/>
    </g>
    <text x="122" y="92" class="method">크롤링</text>
    <text x="122" y="126" class="summary">공개 HTML에서 필요한 정보만 추출</text>
    <line x1="28" y1="154" x2="432" y2="154" class="sep"/>
    <text x="32" y="188" class="label">적합한 상황</text>
    <text x="172" y="188" class="txt">파일·API가 없고 정책상 허용될 때</text>
    <text x="32" y="232" class="label">장점</text>
    <text x="172" y="232" class="txt">공개 페이지의 표·제목·링크 활용</text>
    <text x="32" y="276" class="label">필수 확인</text>
    <text x="172" y="276" class="txt">이용약관 · robots.txt · 저작권</text>
    <text x="172" y="300" class="txt">개인정보 · 요청 빈도 · 페이지 구조</text>
    <text x="32" y="336" class="label">한계</text>
    <text x="172" y="336" class="txt">구조 변경과 유지보수 부담</text>
    <text x="32" y="380" class="label">결과 형식</text>
    <rect x="172" y="360" width="64" height="26" rx="13" class="badge-orange"/>
    <text x="204" y="379" text-anchor="middle" class="badge" fill="#b45309">HTML</text>
    <rect x="244" y="360" width="52" height="26" rx="13" class="badge-orange"/>
    <text x="270" y="379" text-anchor="middle" class="badge" fill="#b45309">표</text>
    <rect x="304" y="360" width="62" height="26" rx="13" class="badge-orange"/>
    <text x="335" y="379" text-anchor="middle" class="badge" fill="#b45309">링크</text>
    <text x="32" y="410" class="small">반복 수집: 정책·유지보수 고려</text>
  </g>

  <rect x="170" y="710" width="1260" height="48" rx="18" class="guide"/>
  <text x="800" y="741" text-anchor="middle" class="guide-text">선택 가이드: 공식 파일 확인 → 공식 API 확인 → 둘 다 없을 때 크롤링 검토</text>

  <rect x="190" y="774" width="1220" height="42" rx="18" class="principle"/>
  <text x="800" y="802" text-anchor="middle" class="principle-text">공통 기록: 출처 · 수집일 · 사용 조건 · 요청 정보 · 저장 위치(<tspan class="code">data/external/</tspan>)</text>

  <rect x="220" y="832" width="1160" height="48" rx="20" class="footer-box"/>
  <text x="800" y="863" text-anchor="middle" class="footer">공식 다운로드 파일이나 공식 API가 있다면 우선 사용하고, 크롤링은 정책을 확인한 뒤 제한적으로 사용합니다.</text>
</svg>
