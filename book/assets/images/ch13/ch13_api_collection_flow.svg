    <text x="110" y="84" class="card-title">응답 검증</text>
    <text x="110" y="112" class="card-copy">성공 여부와 응답 형식 확인</text>
    <line x1="20" y1="136" x2="300" y2="136" class="divider"/>
    <text x="20" y="162" class="code">status_code · Content-Type</text>
    <text x="20" y="188" class="small-copy">2xx 성공 / 4xx·5xx 오류 메시지 확인</text>
    <path class="arrow-error" d="M298 182 H325"/>
    <text x="228" y="205" class="error-label">오류 → 조건·로그 확인</text>
  </g>

  <g transform="translate(450,505)">
    <rect width="320" height="210" rx="22" class="card card-violet"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="number-badge"/>
    <text x="42" y="38" text-anchor="middle" class="number">06</text>
    <rect x="244" y="18" width="56" height="28" rx="14" class="badge-violet"/>
    <text x="272" y="38" text-anchor="middle" class="badge-text-violet">PARSE</text>
    <g transform="translate(20,58)">
      <rect x="0" y="0" width="72" height="64" rx="8" class="icon-fill-violet"/>
      <text x="36" y="28" text-anchor="middle" class="code" fill="#7c3aed">{ }</text>
      <text x="36" y="50" text-anchor="middle" class="small-copy" fill="#7c3aed">XML</text>
      <path d="M78 32 H99" class="icon-stroke-violet" marker-end="url(#arrow)"/>
    </g>
    <text x="130" y="84" class="card-title">응답 파싱</text>
    <text x="130" y="112" class="card-copy">JSON·XML에서 데이터 추출</text>
    <line x1="20" y1="136" x2="300" y2="136" class="divider"/>
    <text x="20" y="162" class="code">response.json()</text>
    <text x="20" y="188" class="small-copy">records · items · data 위치 확인</text>
  </g>

  <g transform="translate(820,505)">
    <rect width="320" height="210" rx="22" class="card card-green"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="number-badge"/>
    <text x="42" y="38" text-anchor="middle" class="number">07</text>
    <rect x="240" y="18" width="60" height="28" rx="14" class="badge-green"/>
    <text x="270" y="38" text-anchor="middle" class="badge-text-green">TABLE</text>
    <g transform="translate(22,60)">
      <rect x="0" y="0" width="78" height="60" rx="6" class="icon-fill-green"/>
      <line x1="0" y1="19" x2="78" y2="19" class="icon-stroke-green"/>
      <line x1="26" y1="0" x2="26" y2="60" class="icon-stroke-green"/>
      <line x1="52" y1="0" x2="52" y2="60" class="icon-stroke-green"/>
      <line x1="0" y1="39" x2="78" y2="39" class="icon-stroke-green"/>
