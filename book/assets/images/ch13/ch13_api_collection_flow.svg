  <rect class="bg" width="1600" height="900"/>
  <rect class="top-line" x="24" y="20" width="1552" height="14" rx="2"/>

  <text x="80" y="92" class="title">API 수집 흐름</text>
  <text x="80" y="132" class="subtitle">API 문서를 확인하고 안전하게 요청한 뒤 응답을 검증해 분석 가능한 표로 저장합니다.</text>

  <text x="80" y="182" class="section-label" fill="#1d4ed8">1단계 · 요청 준비</text>
  <text x="1190" y="182" class="section-label" fill="#047857">2단계 · API 호출</text>
  <text x="80" y="472" class="section-label" fill="#047857">2단계 · 응답 검증</text>
  <text x="450" y="472" class="section-label" fill="#7c3aed">3단계 · 변환과 저장</text>

  <path class="arrow" d="M400 320 H444"/>
  <path class="arrow" d="M770 320 H814"/>
  <path class="arrow" d="M1140 320 H1184"/>
  <path class="arrow" d="M770 610 H814"/>
  <path class="arrow" d="M1140 610 H1184"/>

  <path class="arrow" d="M1350 425 V455 H240 V498"/>
  <rect x="700" y="440" width="200" height="34" rx="17" class="badge-blue"/>
  <text x="800" y="462" text-anchor="middle" class="badge-text-blue">응답 수신</text>

  <g transform="translate(80,215)">
    <rect width="320" height="210" rx="22" class="card card-blue"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="number-badge"/>
    <text x="42" y="38" text-anchor="middle" class="number">01</text>
    <rect x="222" y="18" width="78" height="28" rx="14" class="badge-blue"/>
    <text x="261" y="38" text-anchor="middle" class="badge-text-blue">공식 문서</text>
    <g transform="translate(26,60)">
      <rect x="0" y="0" width="54" height="60" rx="6" class="icon-fill-blue"/>
      <line x1="12" y1="17" x2="40" y2="17" class="icon-stroke-blue"/>
      <line x1="12" y1="30" x2="40" y2="30" class="icon-stroke-blue"/>
      <line x1="12" y1="43" x2="31" y2="43" class="icon-stroke-blue"/>
      <circle cx="50" cy="48" r="13" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
      <line x1="59" y1="57" x2="69" y2="67" class="icon-stroke-blue"/>
    </g>
    <text x="110" y="84" class="card-title">API 문서 확인</text>
    <text x="110" y="112" class="card-copy">요청 주소와 사용 방법 확인</text>
    <line x1="20" y1="136" x2="300" y2="136" class="divider"/>
    <text x="20" y="162" class="small-copy">Endpoint · Method · Parameters</text>
    <text x="20" y="188" class="small-copy">응답 형식 · 인증 방식 · 요청 제한</text>
  </g>

  <g transform="translate(450,215)">
    <rect width="320" height="210" rx="22" class="card card-green"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="number-badge"/>
    <text x="42" y="38" text-anchor="middle" class="number">02</text>
    <rect x="246" y="18" width="54" height="28" rx="14" class="badge-green"/>
    <text x="273" y="38" text-anchor="middle" class="badge-text-green">인증</text>
    <g transform="translate(24,58)">
      <rect x="6" y="26" width="54" height="42" rx="8" class="icon-fill-green"/>
      <path d="M18 27 V18 C18 7 48 7 48 18 V27" class="icon-stroke-green"/>
      <circle cx="33" cy="45" r="5" fill="#059669"/>
      <line x1="33" y1="50" x2="33" y2="59" class="icon-stroke-green"/>
      <circle cx="64" cy="17" r="9" fill="#ffffff" stroke="#059669" stroke-width="3"/>
      <line x1="73" y1="17" x2="87" y2="17" class="icon-stroke-green"/>
      <line x1="80" y1="17" x2="80" y2="25" class="icon-stroke-green"/>
    </g>
    <text x="110" y="84" class="card-title">인증 준비</text>
    <text x="110" y="112" class="card-copy">API Key를 안전하게 불러오기</text>
    <line x1="20" y1="136" x2="300" y2="136" class="divider"/>
    <text x="20" y="162" class="small-copy">API Key 발급 → <tspan class="code-blue">.env</tspan>에서 로드</text>
    <text x="20" y="188" class="small-copy">코드에 직접 작성하지 않음</text>
  </g>

  <g transform="translate(820,215)">
    <rect width="320" height="210" rx="22" class="card card-violet"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="number-badge"/>
    <text x="42" y="38" text-anchor="middle" class="number">03</text>
    <rect x="230" y="18" width="70" height="28" rx="14" class="badge-violet"/>
    <text x="265" y="38" text-anchor="middle" class="badge-text-violet">REQUEST</text>
    <g transform="translate(24,58)">
      <rect x="0" y="0" width="72" height="60" rx="8" class="icon-fill-violet"/>
      <line x1="12" y1="17" x2="60" y2="17" class="icon-stroke-violet"/>
      <line x1="12" y1="31" x2="48" y2="31" class="icon-stroke-violet"/>
      <line x1="12" y1="45" x2="56" y2="45" class="icon-stroke-violet"/>
      <circle cx="15" cy="17" r="3" fill="#7c3aed"/>
      <circle cx="15" cy="31" r="3" fill="#7c3aed"/>
      <circle cx="15" cy="45" r="3" fill="#7c3aed"/>
