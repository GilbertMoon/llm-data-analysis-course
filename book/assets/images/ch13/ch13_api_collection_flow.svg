    <line x1="20" y1="136" x2="300" y2="136" class="divider"/>
    <text x="20" y="162" class="code">url · headers · params</text>
    <text x="20" y="188" class="small-copy">주소 · 인증 정보 · 검색 조건</text>
  </g>

  <g transform="translate(1190,215)">
    <rect width="320" height="210" rx="22" class="card card-blue"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="number-badge"/>
    <text x="42" y="38" text-anchor="middle" class="number">04</text>
    <rect x="250" y="18" width="50" height="28" rx="14" class="badge-blue"/>
    <text x="275" y="38" text-anchor="middle" class="badge-text-blue">CALL</text>
    <g transform="translate(22,60)">
      <rect x="0" y="13" width="42" height="42" rx="6" class="icon-fill-blue"/>
      <rect x="62" y="0" width="42" height="68" rx="6" class="icon-fill-blue"/>
      <path d="M46 23 H58" class="icon-stroke-blue" marker-end="url(#arrow)"/>
      <path d="M58 48 H46" class="icon-stroke-blue" marker-end="url(#arrow)"/>
      <line x1="71" y1="18" x2="94" y2="18" class="icon-stroke-blue"/>
      <line x1="71" y1="31" x2="94" y2="31" class="icon-stroke-blue"/>
      <line x1="71" y1="44" x2="94" y2="44" class="icon-stroke-blue"/>
    </g>
