      .badge-orange { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5; }
      .badge-text-blue { font: 700 14px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; fill: #1d4ed8; }
      .badge-text-green { font: 700 14px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; fill: #047857; }
      .badge-text-violet { font: 700 14px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; fill: #6d28d9; }
      .badge-text-orange { font: 700 14px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; fill: #c2410c; }
      .card-title { font: 700 23px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; fill: #0f172a; }
      .card-copy { font: 500 16px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; fill: #334155; }
      .small-copy { font: 500 14.5px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; fill: #475569; }
      .code { font: 600 15px 'Malgun Gothic','맑은 고딕','Noto Sans Mono CJK KR','D2Coding','JetBrains Mono','Consolas',monospace; fill: #0f172a; }
      .code-blue { font: 600 15px 'Malgun Gothic','맑은 고딕','Noto Sans Mono CJK KR','D2Coding','JetBrains Mono','Consolas',monospace; fill: #1d4ed8; }
      .icon-stroke-blue { stroke: #2563eb; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon-stroke-green { stroke: #059669; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon-stroke-violet { stroke: #7c3aed; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon-stroke-orange { stroke: #ea580c; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill-blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
      .icon-fill-green { fill: #d1fae5; stroke: #059669; stroke-width: 2.5; }
      .icon-fill-violet { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2.5; }
      .icon-fill-orange { fill: #ffedd5; stroke: #ea580c; stroke-width: 2.5; }
      .arrow { stroke: #64748b; stroke-width: 3.2; fill: none; marker-end: url(#arrow); }
      .arrow-success { stroke: #059669; stroke-width: 2.8; fill: none; marker-end: url(#arrow-success); }
      .arrow-error { stroke: #ea580c; stroke-width: 2.5; fill: none; marker-end: url(#arrow-error); stroke-dasharray: 7 6; }
      .flow-label { font: 700 15px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; fill: #475569; }
      .success-label { font: 700 14px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; fill: #047857; }
      .error-label { font: 700 14px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; fill: #c2410c; }
      .info-panel { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; }
      .info-title { font: 700 21px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; fill: #0f2d4d; }
      .info-text { font: 500 16px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; fill: #334155; }
      .footer-panel { fill: #ecfeff; stroke: #a5f3fc; stroke-width: 2; }
      .footer { font: 600 19px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; fill: #164e63; }
      .divider { stroke: #e2e8f0; stroke-width: 1.5; }
    </style>

    <marker id="arrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0,11 4.5,0 9" fill="#64748b"/>
    </marker>
    <marker id="arrow-success" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0,11 4.5,0 9" fill="#059669"/>
    </marker>
    <marker id="arrow-error" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0,11 4.5,0 9" fill="#ea580c"/>
    </marker>
