    <text x="130" y="112" class="card-copy">서버에 요청하고 응답 수신</text>
    <line x1="20" y1="136" x2="300" y2="136" class="divider"/>
    <text x="20" y="162" class="code">requests.get(...)</text>
    <text x="20" y="188" class="small-copy"><tspan class="code-blue">timeout=...</tspan> · 페이지·호출 제한 확인</text>
  </g>

  <g transform="translate(80,505)">
    <rect width="320" height="210" rx="22" class="card card-green"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="number-badge"/>
    <text x="42" y="38" text-anchor="middle" class="number">05</text>
    <rect x="242" y="18" width="58" height="28" rx="14" class="badge-green"/>
    <text x="271" y="38" text-anchor="middle" class="badge-text-green">CHECK</text>
    <g transform="translate(22,58)">
      <rect x="0" y="0" width="66" height="64" rx="8" class="icon-fill-green"/>
      <circle cx="49" cy="47" r="16" fill="#ffffff" stroke="#059669" stroke-width="3"/>
      <path d="M41 47 L47 53 L58 40" class="icon-stroke-green"/>
      <line x1="12" y1="17" x2="49" y2="17" class="icon-stroke-green"/>
      <line x1="12" y1="30" x2="40" y2="30" class="icon-stroke-green"/>
