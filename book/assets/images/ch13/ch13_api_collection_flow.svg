  <text x="165" y="808" class="info-text">요청 전: 공식 문서·인증·요청 제한</text>
  <text x="630" y="808" class="info-text">응답 후: 상태 코드·형식·데이터 구조</text>
  <text x="1088" y="808" class="info-text">저장 시: 출처·수집일·요청 조건·캐시</text>

  <rect x="190" y="842" width="1220" height="42" rx="21" class="footer-panel"/>
  <text x="800" y="869" text-anchor="middle" class="footer">API 결과는 수집 시점과 요청 조건에 따라 달라질 수 있으므로 출처와 요청 정보를 함께 기록해야 합니다.</text>
