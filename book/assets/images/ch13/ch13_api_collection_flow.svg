<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">API 수집 흐름</title>
  <desc id="desc">API 문서와 인증 방식을 확인하고 요청 URL, 헤더와 파라미터를 구성한 뒤, API를 호출해 응답 상태를 검증하고 JSON 또는 XML을 파싱하여 DataFrame으로 변환하고 CSV로 저장하는 외부 데이터 수집 흐름</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .top-line { fill: #2563eb; }
      .title { font: 700 46px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 22px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; fill: #475569; }
      .section-label { font: 700 17px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR','Apple SD Gothic Neo',sans-serif; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2.2; }
      .card-blue { stroke: #93c5fd; }
      .card-green { stroke: #86efac; }
      .card-violet { stroke: #c4b5fd; }
      .card-orange { stroke: #fdba74; }
