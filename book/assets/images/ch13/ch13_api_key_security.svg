<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">API Key 안전 관리</title>
  <desc id="desc">API Key를 코드에 직접 작성하거나 출력하지 않고, 환경 파일에 저장한 뒤 환경변수로 불러오며, gitignore와 공유 전 점검으로 민감정보 노출을 방지하는 흐름</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .top-line { fill: #2563eb; }
      .title { font: 700 46px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 22px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke-width: 2.2; }
      .card-red { stroke: #fca5a5; }
      .card-green { stroke: #86efac; }
      .card-blue { stroke: #93c5fd; }
      .card-violet { stroke: #c4b5fd; }
      .number-badge { fill: #dbeafe; }
      .number { font: 700 16px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; fill: #1d4ed8; }
      .card-title { font: 700 26px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; fill: #0f172a; }
      .card-copy { font: 500 17px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; fill: #334155; }
      .small-copy { font: 500 16px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; fill: #475569; }
      .label { font: 700 15px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; }
      .code { font: 600 16px 'D2Coding','JetBrains Mono',Consolas,'Courier New',monospace; fill: #1e293b; }
      .code-blue { font: 600 16px 'D2Coding','JetBrains Mono',Consolas,'Courier New',monospace; fill: #1d4ed8; }
      .code-green { font: 600 16px 'D2Coding','JetBrains Mono',Consolas,'Courier New',monospace; fill: #047857; }
      .divider { stroke: #e2e8f0; stroke-width: 1.5; }
      .arrow { stroke: #64748b; stroke-width: 3.2; fill: none; marker-end: url(#arrow); }
      .icon-stroke-red { stroke: #dc2626; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon-stroke-green { stroke: #059669; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon-stroke-blue { stroke: #2563eb; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon-stroke-violet { stroke: #7c3aed; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill-red { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2; }
      .icon-fill-green { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; }
      .icon-fill-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; }
      .icon-fill-violet { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 2; }
      .badge-red { fill: #fef2f2; stroke: #fecaca; stroke-width: 1.4; }
      .badge-green { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 1.4; }
      .badge-blue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.4; }
      .badge-violet { fill: #f5f3ff; stroke: #ddd6fe; stroke-width: 1.4; }
      .badge-red-text { font: 700 14px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic',sans-serif; fill: #b91c1c; }
      .badge-green-text { font: 700 14px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic',sans-serif; fill: #047857; }
      .badge-blue-text { font: 700 14px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic',sans-serif; fill: #1d4ed8; }
      .badge-violet-text { font: 700 14px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic',sans-serif; fill: #6d28d9; }
      .summary-title { font: 700 22px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; fill: #0f172a; }
      .summary-copy { font: 500 17px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; fill: #334155; }
      .footer { font: 600 20px 'UnDotum','NanumSquare','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif; fill: #1e3a8a; }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0,11 4.5,0 9" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect class="top-line" x="28" y="20" width="1544" height="14" rx="7"/>

  <text x="80" y="92" class="title">API Key 안전 관리</text>
  <text x="80" y="132" class="subtitle">민감한 인증값은 코드와 저장소에서 분리하고, 값 자체가 아닌 로드 여부만 확인합니다.</text>

  <text x="80" y="183" class="label" fill="#64748b">안전 관리 흐름</text>
  <path class="arrow" d="M405 390 H448"/>
  <path class="arrow" d="M775 390 H818"/>
  <path class="arrow" d="M1145 390 H1188"/>

  <g transform="translate(80,215)">
    <rect width="325" height="350" rx="24" class="card card-red"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="number-badge"/>
    <text x="42" y="38" text-anchor="middle" class="number">01</text>
    <rect x="231" y="18" width="74" height="28" rx="14" class="badge-red"/>
    <text x="268" y="38" text-anchor="middle" class="badge-red-text">금지</text>
    <g transform="translate(28,64)">
      <rect x="0" y="0" width="78" height="68" rx="9" class="icon-fill-red"/>
      <line x1="13" y1="18" x2="64" y2="18" class="icon-stroke-red"/>
      <line x1="13" y1="34" x2="52" y2="34" class="icon-stroke-red"/>
      <line x1="13" y1="50" x2="58" y2="50" class="icon-stroke-red"/>
      <circle cx="72" cy="63" r="18" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
      <line x1="60" y1="51" x2="84" y2="75" class="icon-stroke-red"/>
      <line x1="84" y1="51" x2="60" y2="75" class="icon-stroke-red"/>
    </g>
    <text x="126" y="92" class="card-title">피해야 할 방식</text>
    <text x="126" y="122" class="card-copy">Key가 코드나 기록에 남는 행동</text>
    <line x1="20" y1="154" x2="305" y2="154" class="divider"/>
    <text x="24" y="187" class="small-copy">– 코드에 실제 Key 직접 입력</text>
    <text x="24" y="221" class="small-copy">– 화면·로그에 Key 값 출력</text>
    <text x="24" y="255" class="small-copy">– <tspan class="code">.env</tspan>를 GitHub에 업로드</text>
    <text x="24" y="289" class="small-copy">– 채팅·문서에 인증값 복사</text>
    <rect x="20" y="309" width="285" height="26" rx="13" class="badge-red"/>
    <text x="162.5" y="327" text-anchor="middle" class="badge-red-text">실제 Key 문자열을 남기지 않음</text>
  </g>

  <g transform="translate(450,215)">
    <rect width="325" height="350" rx="24" class="card card-green"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="number-badge"/>
    <text x="42" y="38" text-anchor="middle" class="number">02</text>
    <rect x="221" y="18" width="84" height="28" rx="14" class="badge-green"/>
    <text x="263" y="38" text-anchor="middle" class="badge-green-text">안전 저장</text>
    <g transform="translate(28,62)">
      <rect x="8" y="0" width="72" height="72" rx="9" class="icon-fill-green"/>
      <path d="M20 0 V18 H38" class="icon-stroke-green"/>
      <text x="44" y="45" text-anchor="middle" class="code-green">.env</text>
      <rect x="60" y="43" width="46" height="34" rx="8" fill="#ffffff" stroke="#059669" stroke-width="3"/>
      <path d="M71 44 V36 C71 25 95 25 95 36 V44" class="icon-stroke-green"/>
      <circle cx="83" cy="58" r="4" fill="#059669"/>
      <line x1="83" y1="62" x2="83" y2="69" class="icon-stroke-green"/>
    </g>
    <text x="132" y="92" class="card-title">환경 파일에 저장</text>
    <text x="132" y="122" class="card-copy">코드와 인증값을 분리</text>
    <line x1="20" y1="154" x2="305" y2="154" class="divider"/>
    <text x="24" y="187" class="code">PUBLIC_DATA_API_KEY=...</text>
    <text x="24" y="221" class="small-copy">– 로컬 <tspan class="code">.env</tspan> 파일에서만 관리</text>
    <text x="24" y="255" class="small-copy">– Key 이름은 일관되게 정의</text>
    <text x="24" y="289" class="small-copy">– 실제 값은 공유 자료에서 제외</text>
    <rect x="20" y="309" width="285" height="26" rx="13" class="badge-green"/>
    <text x="162.5" y="327" text-anchor="middle" class="badge-green-text">민감값과 소스코드 분리</text>
  </g>

  <g transform="translate(820,215)">
    <rect width="325" height="350" rx="24" class="card card-blue"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="number-badge"/>
    <text x="42" y="38" text-anchor="middle" class="number">03</text>
    <rect x="227" y="18" width="78" height="28" rx="14" class="badge-blue"/>
    <text x="266" y="38" text-anchor="middle" class="badge-blue-text">환경변수</text>
    <g transform="translate(28,62)">
      <rect x="0" y="0" width="98" height="72" rx="9" class="icon-fill-blue"/>
      <line x1="13" y1="18" x2="84" y2="18" class="icon-stroke-blue"/>
      <path d="M18 36 L29 45 L18 54" class="icon-stroke-blue"/>
      <line x1="38" y1="54" x2="74" y2="54" class="icon-stroke-blue"/>
      <circle cx="94" cy="62" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
      <path d="M87 62 L92 67 L101 56" class="icon-stroke-blue"/>
    </g>
    <text x="140" y="92" class="card-title">환경변수로 로드</text>
    <text x="140" y="122" class="card-copy">필요할 때 안전하게 읽기</text>
    <line x1="20" y1="154" x2="305" y2="154" class="divider"/>
    <text x="24" y="185" class="code-blue">load_dotenv()</text>
    <text x="24" y="219" class="code">key = os.getenv("...")</text>
    <text x="24" y="253" class="small-copy">– Key 값 대신 로드 여부 확인</text>
    <text x="24" y="287" class="code">print(key is not None)</text>
    <rect x="20" y="309" width="285" height="26" rx="13" class="badge-blue"/>
    <text x="162.5" y="327" text-anchor="middle" class="badge-blue-text">값 출력 금지 · 존재 여부만 확인</text>
  </g>

  <g transform="translate(1190,215)">
    <rect width="325" height="350" rx="24" class="card card-violet"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="number-badge"/>
    <text x="42" y="38" text-anchor="middle" class="number">04</text>
    <rect x="221" y="18" width="84" height="28" rx="14" class="badge-violet"/>
    <text x="263" y="38" text-anchor="middle" class="badge-violet-text">업로드 전</text>
    <g transform="translate(28,62)">
      <rect x="6" y="0" width="70" height="72" rx="9" class="icon-fill-violet"/>
      <line x1="20" y1="18" x2="62" y2="18" class="icon-stroke-violet"/>
      <path d="M18 35 L25 42 L37 29" class="icon-stroke-violet"/>
      <line x1="44" y1="36" x2="63" y2="36" class="icon-stroke-violet"/>
      <path d="M18 55 L25 62 L37 49" class="icon-stroke-violet"/>
      <line x1="44" y1="56" x2="63" y2="56" class="icon-stroke-violet"/>
      <path d="M84 28 L102 36 V50 C102 62 94 70 84 74 C74 70 66 62 66 50 V36 Z" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <path d="M76 50 L82 56 L93 44" class="icon-stroke-violet"/>
    </g>
    <text x="142" y="92" class="card-title">저장소 포함 여부 점검</text>
    <text x="142" y="122" class="card-copy">공유 전에 민감 파일 재확인</text>
    <line x1="20" y1="154" x2="305" y2="154" class="divider"/>
    <text x="24" y="187" class="code">.gitignore → .env</text>
    <text x="24" y="221" class="small-copy">– <tspan class="code">git status</tspan>로 추적 여부 확인</text>
    <text x="24" y="255" class="small-copy">– Notebook 출력과 로그 재확인</text>
    <text x="24" y="289" class="small-copy">– 공유 전 민감 문자열 최종 점검</text>
    <rect x="20" y="309" width="285" height="26" rx="13" class="badge-violet"/>
    <text x="162.5" y="327" text-anchor="middle" class="badge-violet-text">.env는 Git 추적에서 제외</text>
  </g>

  <g transform="translate(190,625)">
    <rect width="1220" height="92" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="610" y="34" text-anchor="middle" class="summary-title">안전한 흐름</text>
    <text x="610" y="66" text-anchor="middle" class="summary-copy">.env 저장 → 환경변수 로드 → 존재 여부 확인 → .gitignore와 공유 전 점검</text>
  </g>

  <g transform="translate(260,748)">
    <rect width="1080" height="72" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="540" y="44" text-anchor="middle" class="footer">API Key 값 자체를 출력하지 말고, 정상적으로 로드되었는지만 확인합니다.</text>
  </g>
</svg>