<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">API Key 안전 관리</title>
  <desc id="desc">API Key를 코드에 직접 작성하거나 출력하지 않고 환경 파일에 저장한 뒤 환경변수로 불러오며 저장소 포함 여부를 점검하는 안전 관리 흐름</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.top{fill:#2563eb}.title{font:700 46px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR',sans-serif;fill:#0f172a}.sub{font:500 22px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR',sans-serif;fill:#475569}.label{font:700 15px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR',sans-serif;fill:#64748b}.card{fill:#fff;stroke-width:2.2}.red{stroke:#fca5a5}.green{stroke:#86efac}.blue{stroke:#93c5fd}.violet{stroke:#c4b5fd}.numBg{fill:#dbeafe}.num{font:700 16px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR',sans-serif;fill:#1d4ed8}.ct{font:700 25px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR',sans-serif;fill:#0f172a}.cc{font:500 17px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR',sans-serif;fill:#334155}.sm{font:500 16px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR',sans-serif;fill:#475569}.code{font:600 16px 'Malgun Gothic','맑은 고딕','D2Coding',Consolas,monospace;fill:#1e293b}.codeB{font:600 16px 'Malgun Gothic','맑은 고딕','D2Coding',Consolas,monospace;fill:#1d4ed8}.codeG{font:600 16px 'Malgun Gothic','맑은 고딕','D2Coding',Consolas,monospace;fill:#047857}.div{stroke:#e2e8f0;stroke-width:1.5}.arrow{stroke:#64748b;stroke-width:3.2;fill:none;marker-end:url(#a)}.sumT{font:700 22px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR',sans-serif;fill:#0f172a}.sumC{font:500 17px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR',sans-serif;fill:#334155}.foot{font:600 20px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR',sans-serif;fill:#1e3a8a}.btxt{font:700 14px 'Malgun Gothic','맑은 고딕','UnDotum','NanumSquare','Noto Sans KR',sans-serif}.rfill{fill:#fef2f2;stroke:#fca5a5;stroke-width:2}.gfill{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.bfill{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.vfill{fill:#f5f3ff;stroke:#c4b5fd;stroke-width:2}.rs{stroke:#dc2626;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.gs{stroke:#059669;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.bs{stroke:#2563eb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.vs{stroke:#7c3aed;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="a" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><polygon points="0 0,11 4.5,0 9" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <rect class="top" x="28" y="20" width="1544" height="14" rx="7"/>
  <text x="80" y="92" class="title">API Key 안전 관리</text>
  <text x="80" y="132" class="sub">민감한 인증값은 코드와 저장소에서 분리하고, 값 자체가 아닌 로드 여부만 확인합니다.</text>
  <text x="80" y="183" class="label">안전 관리 흐름</text>
  <path class="arrow" d="M405 390H448"/><path class="arrow" d="M775 390H818"/><path class="arrow" d="M1145 390H1188"/>
  <g transform="translate(80,215)">
    <rect width="325" height="350" rx="24" class="card red"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="numBg"/><text x="42" y="38" text-anchor="middle" class="num">01</text>
    <rect x="231" y="18" width="74" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="268" y="38" text-anchor="middle" class="btxt" fill="#b91c1c">금지</text>
    <g transform="translate(28,64)"><rect width="78" height="68" rx="9" class="rfill"/><line x1="13" y1="18" x2="64" y2="18" class="rs"/><line x1="13" y1="34" x2="52" y2="34" class="rs"/><line x1="13" y1="50" x2="58" y2="50" class="rs"/><circle cx="72" cy="63" r="18" fill="#fff" stroke="#dc2626" stroke-width="3"/><line x1="60" y1="51" x2="84" y2="75" class="rs"/><line x1="84" y1="51" x2="60" y2="75" class="rs"/></g>
    <text x="126" y="92" class="ct">피해야 할 방식</text><text x="126" y="122" class="cc">Key가 코드나 기록에 남는 행동</text>
    <line x1="20" y1="154" x2="305" y2="154" class="div"/>
    <text x="24" y="187" class="sm">– 코드에 실제 Key 직접 입력</text><text x="24" y="221" class="sm">– 화면·로그에 Key 값 출력</text><text x="24" y="255" class="sm">– <tspan class="code">.env</tspan>를 GitHub에 업로드</text><text x="24" y="289" class="sm">– 채팅·문서에 인증값 복사</text>
    <rect x="20" y="309" width="285" height="26" rx="13" fill="#fef2f2" stroke="#fecaca"/><text x="162.5" y="327" text-anchor="middle" class="btxt" fill="#b91c1c">실제 Key 문자열을 남기지 않음</text>
  </g>
  <g transform="translate(450,215)">
    <rect width="325" height="350" rx="24" class="card green"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="numBg"/><text x="42" y="38" text-anchor="middle" class="num">02</text>
    <rect x="221" y="18" width="84" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/><text x="263" y="38" text-anchor="middle" class="btxt" fill="#047857">안전 저장</text>
    <g transform="translate(28,62)"><rect x="8" width="72" height="72" rx="9" class="gfill"/><path d="M20 0V18H38" class="gs"/><text x="44" y="45" text-anchor="middle" class="codeG">.env</text><rect x="60" y="43" width="46" height="34" rx="8" fill="#fff" stroke="#059669" stroke-width="3"/><path d="M71 44V36C71 25 95 25 95 36V44" class="gs"/><circle cx="83" cy="58" r="4" fill="#059669"/><line x1="83" y1="62" x2="83" y2="69" class="gs"/></g>
    <text x="132" y="92" class="ct">환경 파일에 저장</text><text x="132" y="122" class="cc">코드와 인증값을 분리</text>
    <line x1="20" y1="154" x2="305" y2="154" class="div"/>
    <text x="24" y="187" class="code">PUBLIC_DATA_API_KEY=...</text><text x="24" y="221" class="sm">– 로컬 <tspan class="code">.env</tspan> 파일에서만 관리</text><text x="24" y="255" class="sm">– Key 이름은 일관되게 정의</text><text x="24" y="289" class="sm">– 실제 값은 공유 자료에서 제외</text>
    <rect x="20" y="309" width="285" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0"/><text x="162.5" y="327" text-anchor="middle" class="btxt" fill="#047857">민감값과 소스코드 분리</text>
  </g>
  <g transform="translate(820,215)">
    <rect width="325" height="350" rx="24" class="card blue"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="numBg"/><text x="42" y="38" text-anchor="middle" class="num">03</text>
    <rect x="227" y="18" width="78" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><text x="266" y="38" text-anchor="middle" class="btxt" fill="#1d4ed8">환경변수</text>
    <g transform="translate(28,62)"><rect width="98" height="72" rx="9" class="bfill"/><line x1="13" y1="18" x2="84" y2="18" class="bs"/><path d="M18 36L29 45L18 54" class="bs"/><line x1="38" y1="54" x2="74" y2="54" class="bs"/><circle cx="94" cy="62" r="15" fill="#fff" stroke="#2563eb" stroke-width="3"/><path d="M87 62L92 67L101 56" class="bs"/></g>
    <text x="140" y="92" class="ct">환경변수로 로드</text><text x="140" y="122" class="cc">필요할 때 안전하게 읽기</text>
    <line x1="20" y1="154" x2="305" y2="154" class="div"/>
    <text x="24" y="185" class="codeB">load_dotenv()</text><text x="24" y="219" class="code">key = os.getenv("...")</text><text x="24" y="253" class="sm">– Key 값 대신 로드 여부 확인</text><text x="24" y="287" class="code">print(key is not None)</text>
    <rect x="20" y="309" width="285" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/><text x="162.5" y="327" text-anchor="middle" class="btxt" fill="#1d4ed8">값 출력 금지 · 존재 여부만 확인</text>
  </g>
  <g transform="translate(1190,215)">
    <rect width="325" height="350" rx="24" class="card violet"/>
    <rect x="20" y="18" width="44" height="28" rx="14" class="numBg"/><text x="42" y="38" text-anchor="middle" class="num">04</text>
    <rect x="221" y="18" width="84" height="28" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/><text x="263" y="38" text-anchor="middle" class="btxt" fill="#6d28d9">업로드 전</text>
    <g transform="translate(28,62)"><rect x="6" width="70" height="72" rx="9" class="vfill"/><line x1="20" y1="18" x2="62" y2="18" class="vs"/><path d="M18 35L25 42L37 29" class="vs"/><line x1="44" y1="36" x2="63" y2="36" class="vs"/><path d="M18 55L25 62L37 49" class="vs"/><line x1="44" y1="56" x2="63" y2="56" class="vs"/><path d="M84 28L102 36V50C102 62 94 70 84 74C74 70 66 62 66 50V36Z" fill="#fff" stroke="#7c3aed" stroke-width="3"/><path d="M76 50L82 56L93 44" class="vs"/></g>
    <text x="142" y="92" class="ct">저장소 점검</text><text x="142" y="122" class="cc">민감 파일 포함 여부 확인</text>
    <line x1="20" y1="154" x2="305" y2="154" class="div"/>
    <text x="24" y="187" class="code">.gitignore → .env</text><text x="24" y="221" class="sm">– <tspan class="code">git status</tspan>로 추적 여부 확인</text><text x="24" y="255" class="sm">– Notebook 출력과 로그 재확인</text><text x="24" y="289" class="sm">– 공유 전 민감 문자열 최종 점검</text>
    <rect x="20" y="309" width="285" height="26" rx="13" fill="#f5f3ff" stroke="#ddd6fe"/><text x="162.5" y="327" text-anchor="middle" class="btxt" fill="#6d28d9">.env는 Git 추적에서 제외</text>
  </g>
  <g transform="translate(190,625)"><rect width="1220" height="92" rx="22" fill="#fff" stroke="#bfdbfe" stroke-width="2"/><text x="610" y="34" text-anchor="middle" class="sumT">안전한 흐름</text><text x="610" y="66" text-anchor="middle" class="sumC">.env 저장 → 환경변수 로드 → 존재 여부 확인 → .gitignore와 공유 전 점검</text></g>
  <g transform="translate(260,748)"><rect width="1080" height="72" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/><text x="540" y="44" text-anchor="middle" class="foot">API Key 값 자체를 출력하지 말고, 정상적으로 로드되었는지만 확인합니다.</text></g>
</svg>