<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 34px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.sub{font:500 18px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18;ry:18}.target{fill:#fee2e2;stroke:#fca5a5;stroke-width:2;rx:18;ry:18}.feature{fill:#dbeafe;stroke:#93c5fd;stroke-width:2;rx:18;ry:18}.head{font:700 24px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.txt{font:500 17px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}.mono{font:600 16px Consolas,'Courier New',monospace;fill:#1e293b}.line{stroke:#64748b;stroke-width:3}.footer{font:500 18px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#1e40af}</style></defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="600" y="58" text-anchor="middle" class="title">입력값과 예측 대상 분리</text>
  <text x="600" y="90" text-anchor="middle" class="sub">회귀 모델은 입력값으로 숫자형 예측 대상을 추정한다.</text>
  <rect x="80" y="150" width="320" height="420" class="panel"/>
  <text x="240" y="200" text-anchor="middle" class="head">모델링 데이터</text>
  <text x="240" y="250" text-anchor="middle" class="mono">item_count</text>
  <text x="240" y="285" text-anchor="middle" class="mono">total_quantity</text>
  <text x="240" y="320" text-anchor="middle" class="mono">avg_unit_price</text>
  <text x="240" y="355" text-anchor="middle" class="mono">payment_method</text>
  <text x="240" y="390" text-anchor="middle" class="mono">age · city</text>
  <text x="240" y="455" text-anchor="middle" class="mono">order_total</text>
  <rect x="500" y="170" width="260" height="160" class="feature"/>
  <text x="630" y="220" text-anchor="middle" class="head">입력값</text>
  <text x="630" y="260" text-anchor="middle" class="txt">모델이 참고하는 정보</text>
  <text x="630" y="295" text-anchor="middle" class="mono">X</text>
  <rect x="500" y="410" width="260" height="160" class="target"/>
  <text x="630" y="460" text-anchor="middle" class="head">예측 대상</text>
  <text x="630" y="500" text-anchor="middle" class="txt">모델이 맞혀야 하는 값</text>
  <text x="630" y="535" text-anchor="middle" class="mono">y = order_total</text>
  <rect x="850" y="280" width="260" height="160" class="panel"/>
  <text x="980" y="330" text-anchor="middle" class="head">주의</text>
  <text x="980" y="370" text-anchor="middle" class="txt">정답 컬럼을 입력값에</text>
  <text x="980" y="398" text-anchor="middle" class="txt">넣으면 데이터 누수</text>
  <line x1="400" y1="310" x2="500" y2="250" class="line"/>
  <line x1="400" y1="450" x2="500" y2="490" class="line"/>
  <line x1="760" y1="490" x2="850" y2="360" class="line"/>
  <text x="600" y="640" text-anchor="middle" class="footer">예측 대상은 입력값에서 제외해야 합니다.</text>
</svg>