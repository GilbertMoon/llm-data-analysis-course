<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">학습 데이터와 테스트 데이터 평가 흐름</title>
  <desc id="desc">전체 입력값과 예측 대상을 학습 세트와 테스트 세트로 분리하고, X_train과 y_train으로 모델을 학습한 뒤, X_test의 예측값 y_pred와 실제값 y_test를 비교해 MAE, RMSE와 R²를 계산하는 회귀 모델 평가 흐름</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}
      .top-line{stroke:#2563eb;stroke-width:8;stroke-linecap:round}
      .title{font:700 48px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .subtitle{font:500 24px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}
      .section{font:700 20px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2.5;rx:22;ry:22}
      .data{fill:#f1f5f9;stroke:#94a3b8}
      .split{fill:#fff;stroke:#60a5fa}
      .train{fill:#eff6ff;stroke:#60a5fa}
      .test{fill:#f0fdf4;stroke:#34d399}
      .model{fill:#f5f3ff;stroke:#a78bfa}
      .predict{fill:#ecfeff;stroke:#22d3ee}
      .metric{fill:#fff7ed;stroke:#fb923c}
      .warn-box{fill:#fff7ed;stroke:#fb923c;stroke-width:2;rx:18;ry:18}
      .footer-box{fill:#ecfeff;stroke:#22d3ee;stroke-width:2.5;rx:20;ry:20}
      .badge{font:700 16px Arial,'Noto Sans KR','Malgun Gothic',sans-serif}
      .badge-blue{fill:#dbeafe;stroke:#60a5fa}
      .badge-green{fill:#dcfce7;stroke:#22c55e}
      .head{font:700 27px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .subhead{font:700 20px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#1e40af}
      .txt{font:500 18px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}
      .small{font:500 16px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569}
      .code{font:700 20px Consolas,'Courier New',monospace;fill:#2563eb}
      .code-dark{font:700 18px Consolas,'Courier New',monospace;fill:#0f172a}
      .code-small{font:700 16px Consolas,'Courier New',monospace;fill:#0f172a}
      .warn{font:700 18px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#b45309}
      .footer{font:700 22px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f3b5f}
      .formula{font:700 18px Consolas,'Courier New',monospace;fill:#2563eb}
      .train-line{stroke:#2563eb;stroke-width:4;fill:none}
      .test-line{stroke:#16a34a;stroke-width:4;fill:none}
      .eval-line{stroke:#f97316;stroke-width:4;fill:none}
      .neutral-line{stroke:#64748b;stroke-width:4;fill:none}
      .icon-blue{stroke:#2563eb;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .icon-green{stroke:#059669;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .icon-purple{stroke:#7c3aed;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .icon-orange{stroke:#ea580c;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .icon-gray{stroke:#475569;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#f97316"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <line class="top-line" x1="64" y1="54" x2="1536" y2="54"/>

  <text x="96" y="118" class="title">학습 데이터와 테스트 데이터</text>
  <text x="98" y="156" class="subtitle">학습용 데이터로 모델을 만들고, 독립된 테스트 데이터로 성능을 평가합니다.</text>

  <text x="104" y="214" class="section">1. 전체 데이터 준비</text>
  <text x="494" y="214" class="section">2. 학습·테스트 분리</text>
  <text x="900" y="214" class="section">3. 학습과 예측</text>
  <text x="1204" y="214" class="section">4. 실제값과 비교</text>

  <path class="neutral-line" marker-end="url(#arrow-gray)" d="M366 332 H452"/>
  <path class="train-line" marker-end="url(#arrow-blue)" d="M672 306 C730 306 764 292 818 292"/>
  <path class="test-line" marker-end="url(#arrow-green)" d="M672 390 C730 390 764 530 818 530"/>
  <path class="train-line" marker-end="url(#arrow-blue)" d="M1062 296 C1088 296 1098 304 1118 316"/>
  <path class="test-line" marker-end="url(#arrow-green)" d="M1062 530 H1118"/>
  <path class="neutral-line" marker-end="url(#arrow-gray)" d="M987 366 V430"/>
  <path class="eval-line" marker-end="url(#arrow-orange)" d="M1342 402 V480"/>

  <rect x="90" y="242" width="276" height="214" class="card data"/>
  <g transform="translate(122 278)">
    <rect x="0" y="0" width="82" height="82" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <path class="icon-gray" d="M18 24 H64 M18 42 H64 M18 60 H64"/>
    <path class="icon-gray" d="M40 18 V66"/>
  </g>
  <text x="224" y="292" class="head">전체 데이터</text>
  <text x="224" y="326" class="code">X</text>
  <text x="270" y="326" class="txt">입력 특성</text>
  <text x="224" y="362" class="code">y</text>
  <text x="270" y="362" class="txt">예측 대상</text>
  <text x="122" y="414" class="small">X와 y를 같은 기준으로 함께 나눕니다.</text>

  <rect x="452" y="242" width="220" height="214" class="card split"/>
  <text x="562" y="292" class="head" text-anchor="middle">학습·테스트 분리</text>
  <text x="562" y="330" class="code-dark" text-anchor="middle">train_test_split()</text>
  <text x="562" y="366" class="txt" text-anchor="middle">test_size=0.2</text>
  <text x="562" y="396" class="txt" text-anchor="middle">random_state=42</text>
  <text x="562" y="428" class="small" text-anchor="middle">같은 분할 결과 재현</text>

  <rect x="818" y="238" width="244" height="164" class="card train"/>
  <rect x="942" y="256" width="94" height="30" rx="15" class="badge-blue"/>
  <text x="989" y="277" text-anchor="middle" class="badge" fill="#1d4ed8">학습 · 80%</text>
  <text x="850" y="286" class="head">학습 세트</text>
  <text x="850" y="322" class="code">X_train</text>
  <text x="940" y="322" class="small">학습 입력 특성</text>
  <text x="850" y="356" class="code">y_train</text>
  <text x="940" y="356" class="small">학습 정답값</text>
  <text x="850" y="386" class="small">패턴을 배우는 데이터</text>

  <rect x="818" y="492" width="244" height="164" class="card test"/>
  <rect x="942" y="510" width="94" height="30" rx="15" class="badge-green"/>
  <text x="989" y="531" text-anchor="middle" class="badge" fill="#047857">테스트 · 20%</text>
  <text x="850" y="540" class="head">테스트 세트</text>
  <text x="850" y="576" class="code">X_test</text>
  <text x="940" y="576" class="small">예측 입력 특성</text>
  <text x="850" y="610" class="code">y_test</text>
  <text x="940" y="610" class="small">비교할 실제값</text>
  <text x="850" y="640" class="small">학습 중 보지 않은 데이터</text>

  <rect x="1118" y="238" width="330" height="164" class="card model"/>
  <g transform="translate(1142 270)">
    <rect x="0" y="0" width="66" height="66" rx="16" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <path class="icon-purple" d="M20 33 H46 M33 20 V46"/>
    <circle cx="33" cy="33" r="20"/>
  </g>
  <text x="1228" y="286" class="head">모델 학습</text>
  <text x="1228" y="320" class="code-small">fit(</text>
  <text x="1272" y="320" class="code-small">X_train, y_train</text>
  <text x="1228" y="344" class="code-small">)</text>
  <text x="1228" y="372" class="txt">학습 데이터의 패턴 학습</text>
  <text x="1228" y="394" class="small">테스트 데이터는 학습 제외</text>

  <rect x="1118" y="492" width="330" height="164" class="card predict"/>
  <g transform="translate(1142 524)">
    <rect x="0" y="0" width="66" height="66" rx="16" fill="#cffafe" stroke="#22d3ee" stroke-width="2"/>
    <path class="icon-blue" d="M17 46 H50"/>
    <path class="icon-blue" d="M18 38 L30 26 L42 32 L50 18"/>
  </g>
  <text x="1228" y="540" class="head">테스트 데이터 예측</text>
  <text x="1228" y="578" class="code-dark">predict(X_test)</text>
  <text x="1228" y="610" class="code">y_pred</text>
  <text x="1228" y="640" class="small">테스트 입력값의 결과 예측</text>

  <rect x="1188" y="684" width="310" height="118" class="card metric"/>
  <g transform="translate(1212 710)">
    <rect x="0" y="0" width="58" height="58" rx="14" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
    <path class="icon-orange" d="M16 34 L26 44 L44 20"/>
  </g>
  <text x="1294" y="718" class="head">성능 평가</text>
  <text x="1294" y="748" class="code-small">metric(y_test,</text>
  <text x="1294" y="770" class="code-small">       y_pred)</text>
  <text x="1294" y="792" class="txt">MAE · RMSE · R²</text>

  <path class="eval-line" marker-end="url(#arrow-orange)" d="M1264 656 C1264 668 1270 674 1280 684"/>
  <path class="eval-line" marker-end="url(#arrow-orange)" d="M1062 610 C1118 610 1150 700 1188 734"/>

  <rect x="90" y="520" width="590" height="136" class="warn-box"/>
  <text x="124" y="558" class="warn">테스트 데이터 독립성</text>
  <text x="124" y="590" class="txt">테스트 세트는 모델 학습에서 분리합니다.</text>
  <text x="124" y="622" class="txt">학습에 사용하면 새로운 데이터 성능을 공정하게 평가하기 어렵습니다.</text>

  <rect x="90" y="688" width="950" height="58" class="card"/>
  <text x="124" y="724" class="formula">분리 → fit(X_train, y_train) → predict(X_test) → metric(y_test, y_pred)</text>

  <rect x="230" y="800" width="1140" height="56" class="footer-box"/>
  <text x="800" y="836" text-anchor="middle" class="footer">테스트 데이터는 모델 학습에서 분리해야 새로운 데이터에 대한 성능을 공정하게 평가할 수 있습니다.</text>
</svg>
