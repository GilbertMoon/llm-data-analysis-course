<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 34px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.sub{font:500 18px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#334155}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18;ry:18}.accent{fill:#dbeafe;stroke:#93c5fd;stroke-width:2;rx:18;ry:18}.head{font:700 21px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.txt{font:500 15px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#334155}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.footer{font:500 18px 'Malgun Gothic','맑은 고딕',Arial,'Noto Sans KR',sans-serif;fill:#1e40af}
    </style>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="600" y="58" text-anchor="middle" class="title">회귀 분석 전체 흐름도</text>
  <text x="600" y="90" text-anchor="middle" class="sub">숫자 예측 문제는 예측 대상 정의에서 평가와 해석까지 이어진다.</text>
  <rect x="50" y="230" width="130" height="100" class="box"/><text x="115" y="270" text-anchor="middle" class="head">데이터 준비</text><text x="115" y="298" text-anchor="middle" class="txt">주문 데이터</text>
  <rect x="215" y="230" width="130" height="100" class="box"/><text x="280" y="270" text-anchor="middle" class="head">대상 정의</text><text x="280" y="298" text-anchor="middle" class="txt">order_total</text>
  <rect x="380" y="230" width="130" height="100" class="box"/><text x="445" y="270" text-anchor="middle" class="head">입력 선택</text><text x="445" y="298" text-anchor="middle" class="txt">feature</text>
  <rect x="545" y="230" width="130" height="100" class="box"/><text x="610" y="270" text-anchor="middle" class="head">데이터 분리</text><text x="610" y="298" text-anchor="middle" class="txt">train / test</text>
  <rect x="710" y="230" width="130" height="100" class="box"/><text x="775" y="270" text-anchor="middle" class="head">모델 학습</text><text x="775" y="298" text-anchor="middle" class="txt">회귀 모델</text>
  <rect x="875" y="230" width="130" height="100" class="box"/><text x="940" y="270" text-anchor="middle" class="head">평가</text><text x="940" y="298" text-anchor="middle" class="txt">MAE · RMSE</text>
  <rect x="1040" y="230" width="130" height="100" class="accent"/><text x="1105" y="270" text-anchor="middle" class="head">해석</text><text x="1105" y="298" text-anchor="middle" class="txt">한계 확인</text>
  <path class="arrow" d="M180 280H210"/><path class="arrow" d="M345 280H375"/><path class="arrow" d="M510 280H540"/><path class="arrow" d="M675 280H705"/><path class="arrow" d="M840 280H870"/><path class="arrow" d="M1005 280H1035"/>
  <rect x="380" y="430" width="440" height="110" class="accent"/>
  <text x="600" y="475" text-anchor="middle" class="head">핵심 원칙</text>
  <text x="600" y="508" text-anchor="middle" class="txt">예측 대상과 입력값을 분리하고, 테스트 데이터로 성능을 확인한다.</text>
  <text x="600" y="640" text-anchor="middle" class="footer">회귀 분석은 숫자를 예측하고, 오차를 해석하는 과정입니다.</text>
</svg>