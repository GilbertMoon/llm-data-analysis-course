<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">회귀 모델과 평가 지표 비교</title>
  <desc id="desc">선형 회귀와 랜덤 포레스트 회귀의 장점과 주의점을 비교하고, 동일한 테스트 데이터에서 MAE, RMSE와 R²를 사용해 오차와 설명력을 평가하는 방법을 설명하는 개념도</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}
      .top-line{stroke:#2563eb;stroke-width:8;stroke-linecap:round}
      .title{font:700 48px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .subtitle{font:500 24px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}
      .label-top{font:700 20px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2.5;rx:22;ry:22}
      .model-blue{fill:#eff6ff;stroke:#60a5fa}
      .model-green{fill:#f0fdf4;stroke:#34d399}
      .metric-blue{fill:#eff6ff;stroke:#60a5fa}
      .metric-orange{fill:#fff7ed;stroke:#fb923c}
      .metric-purple{fill:#f5f3ff;stroke:#a78bfa}
      .flow{fill:#fff;stroke:#94a3b8;stroke-width:2.5;rx:20;ry:20}
      .footer-box{fill:#ecfeff;stroke:#22d3ee;stroke-width:2.5;rx:20;ry:20}
      .badge-blue{fill:#dbeafe;stroke:#60a5fa}
      .badge-green{fill:#dcfce7;stroke:#22c55e}
      .badge-text{font:700 17px Arial,'Noto Sans KR','Malgun Gothic',sans-serif}
      .model-name{font:700 32px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .ko-name{font:700 21px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#1e40af}
      .class-name{font:700 18px Consolas,'Courier New',monospace;fill:#334155}
      .label{font:700 18px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .txt{font:500 18px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#334155}
      .small{font:500 16px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569}
      .flow-title{font:700 25px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .flow-code{font:700 19px Consolas,'Courier New',monospace;fill:#2563eb}
      .metric-name{font:700 36px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .metric-full{font:700 16px Consolas,'Courier New',monospace;fill:#475569}
      .direction{font:700 20px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#1d4ed8}
      .warn{font:700 17px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#b45309}
      .footer-head{font:700 24px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .footer{font:700 22px Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f3b5f}
      .line{stroke:#64748b;stroke-width:4;fill:none}
      .soft-line{stroke:#94a3b8;stroke-width:3.5;fill:none}
      .icon-blue{stroke:#2563eb;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .icon-green{stroke:#059669;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .icon-orange{stroke:#ea580c;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .icon-purple{stroke:#7c3aed;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <line class="top-line" x1="64" y1="54" x2="1536" y2="54"/>

  <text x="96" y="118" class="title">회귀 모델과 평가 지표 비교</text>
  <text x="98" y="156" class="subtitle">같은 테스트 데이터에서 모델의 오차, 설명력과 해석 가능성을 함께 비교합니다.</text>

  <text x="110" y="215" class="label-top">1. 비교할 모델</text>
  <text x="672" y="215" class="label-top">2. 같은 조건</text>
  <text x="110" y="600" class="label-top">3. 평가 지표 해석</text>

  <rect x="90" y="240" width="580" height="245" class="card model-blue"/>
  <g transform="translate(124 278)">
    <rect x="0" y="0" width="82" height="82" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <path class="icon-blue" d="M18 58 L32 42 L44 50 L64 24"/>
    <path class="icon-blue" d="M18 66 H66"/>
  </g>
  <text x="232" y="292" class="model-name">Linear Regression</text>
  <text x="233" y="324" class="ko-name">선형 회귀</text>
  <text x="233" y="354" class="class-name">LinearRegression</text>
  <rect x="500" y="266" width="112" height="34" rx="17" class="badge-blue"/>
  <text x="556" y="289" text-anchor="middle" class="badge-text" fill="#1d4ed8">기준 모델</text>
  <text x="126" y="398" class="label">장점</text>
  <text x="186" y="398" class="txt">단순하고 빠름 · 해석이 쉬움</text>
  <text x="126" y="430" class="label">주의</text>
  <text x="186" y="430" class="txt">비선형 패턴에 한계 · 이상값 영향 가능</text>
  <text x="126" y="462" class="label">역할</text>
  <text x="186" y="462" class="txt">처음 비교할 기준선으로 사용</text>

  <rect x="930" y="240" width="580" height="245" class="card model-green"/>
  <g transform="translate(964 278)">
    <rect x="0" y="0" width="82" height="82" rx="18" fill="#dcfce7" stroke="#34d399" stroke-width="2"/>
    <path class="icon-green" d="M18 62 V28 M41 62 V18 M64 62 V38"/>
    <path class="icon-green" d="M18 28 L41 18 L64 38"/>
    <circle cx="18" cy="28" r="5" fill="#dcfce7" stroke="#059669" stroke-width="4"/>
    <circle cx="41" cy="18" r="5" fill="#dcfce7" stroke="#059669" stroke-width="4"/>
    <circle cx="64" cy="38" r="5" fill="#dcfce7" stroke="#059669" stroke-width="4"/>
  </g>
  <text x="1072" y="292" class="model-name">Random Forest</text>
  <text x="1073" y="324" class="ko-name" fill="#047857">랜덤 포레스트 회귀</text>
  <text x="1073" y="354" class="class-name">RandomForestRegressor</text>
  <rect x="1342" y="266" width="118" height="34" rx="17" class="badge-green"/>
  <text x="1401" y="289" text-anchor="middle" class="badge-text" fill="#047857">복합 모델</text>
  <text x="966" y="398" class="label">장점</text>
  <text x="1026" y="398" class="txt">복잡한 패턴 반영 · 비선형 관계에 유리</text>
  <text x="966" y="430" class="label">주의</text>
  <text x="1026" y="430" class="txt">과적합 확인 필요 · 해석이 상대적으로 어려움</text>
  <text x="966" y="462" class="label">역할</text>
  <text x="1026" y="462" class="txt">성능 개선 후보로 비교</text>

  <circle cx="800" cy="330" r="54" fill="#fff" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="800" y="322" text-anchor="middle" class="footer-head">VS</text>
  <text x="800" y="352" text-anchor="middle" class="small">동일 문제</text>

  <path class="soft-line" marker-end="url(#arrow-soft)" d="M670 362 C720 362 745 350 758 338"/>
  <path class="soft-line" marker-end="url(#arrow-soft)" d="M930 362 C880 362 855 350 842 338"/>
  <path class="line" marker-end="url(#arrow)" d="M800 384 V498"/>

  <rect x="610" y="498" width="380" height="92" class="flow"/>
  <text x="800" y="532" text-anchor="middle" class="flow-title">같은 테스트 데이터로 평가</text>
  <text x="800" y="560" text-anchor="middle" class="txt">두 모델의 예측 결과를 같은 기준으로 비교</text>
  <text x="800" y="584" text-anchor="middle" class="flow-code">X_test · y_test</text>

  <path class="line" marker-end="url(#arrow)" d="M800 590 V618"/>
  <path class="soft-line" marker-end="url(#arrow-soft)" d="M800 606 C560 606 380 606 330 626"/>
  <path class="soft-line" marker-end="url(#arrow-soft)" d="M800 606 C800 612 800 618 800 626"/>
  <path class="soft-line" marker-end="url(#arrow-soft)" d="M800 606 C1040 606 1220 606 1270 626"/>

  <rect x="90" y="626" width="430" height="146" class="card metric-blue"/>
  <g transform="translate(124 656)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <path class="icon-blue" d="M18 42 L30 30 L42 42 L56 24"/>
    <path class="icon-blue" d="M18 54 H56"/>
  </g>
  <text x="220" y="658" class="metric-name">MAE</text>
  <text x="220" y="684" class="metric-full">Mean Absolute Error</text>
  <text x="220" y="712" class="txt">평균적인 예측 오차</text>
  <text x="220" y="740" class="direction">↓ 낮을수록 좋음</text>
  <text x="220" y="764" class="small">예측 대상과 같은 단위</text>

  <rect x="585" y="626" width="430" height="146" class="card metric-orange"/>
  <g transform="translate(619 656)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
    <path class="icon-orange" d="M16 54 H58"/>
    <path class="icon-orange" d="M18 48 L30 38 L42 44 L56 18"/>
    <path class="icon-orange" d="M56 18 V34"/>
  </g>
  <text x="715" y="658" class="metric-name">RMSE</text>
  <text x="715" y="684" class="metric-full">Root Mean Squared Error</text>
  <text x="715" y="712" class="txt">큰 예측 오차에 민감</text>
  <text x="715" y="740" class="direction">↓ 낮을수록 좋음</text>
  <text x="715" y="764" class="small">큰 오차를 더 강하게 반영</text>

  <rect x="1080" y="626" width="430" height="146" class="card metric-purple"/>
  <g transform="translate(1114 656)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <path class="icon-purple" d="M16 46 C24 18 39 18 48 32"/>
    <path class="icon-purple" d="M44 22 L50 34 L38 34"/>
  </g>
  <text x="1210" y="658" class="metric-name">R²</text>
  <text x="1210" y="684" class="metric-full">Coefficient of Determination</text>
  <text x="1210" y="712" class="txt">실제 값의 변동 설명력</text>
  <text x="1210" y="740" class="direction">높을수록 좋음</text>
  <text x="1210" y="764" class="warn">데이터에 따라 음수도 가능</text>

  <rect x="290" y="792" width="1020" height="62" class="footer-box"/>
  <text x="800" y="830" text-anchor="middle" class="footer">좋은 모델은 낮은 오차뿐 아니라 일반화 성능, 해석 가능성과 문제 목적을 함께 고려해 선택합니다.</text>
</svg>
