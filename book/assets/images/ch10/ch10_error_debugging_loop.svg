<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">LLM 코드 오류 수정 루프</title>
  <desc id="desc">LLM 생성 코드에서 오류가 발생했을 때 오류 메시지와 데이터 구조를 바탕으로 반복 수정하는 흐름</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#ea580c"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <style>
      .bg{fill:#fffaf5}.h{fill:url(#head)} text{font-family:'Malgun Gothic','맑은 고딕','Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif}.title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#ffedd5}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.warn{stroke:#fdba74}.llm{stroke:#c4b5fd}.ok{stroke:#86efac}.main{font-size:21px;font-weight:850;fill:#0f172a}.desc{font-size:15px;font-weight:650;fill:#64748b}.num{fill:#fff7ed;stroke:#fdba74;stroke-width:1.5}.nt{font-size:15px;font-weight:900;fill:#c2410c}.arr{fill:none;stroke:#7c3aed;stroke-width:4;marker-end:url(#arrow)}.err{fill:#fff7ed;stroke:#fdba74;stroke-width:2}.errText{font-family:'Malgun Gothic','맑은 고딕','D2Coding','Consolas',monospace;font-size:20px;font-weight:700;fill:#9a3412}.note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1600" height="700" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">LLM 코드 오류 수정 루프</text>
  <text class="sub" x="86" y="118">오류 수정은 코드, 오류 메시지, 데이터 구조를 함께 제공할 때 더 정확해집니다</text>

  <g transform="translate(670 160)"><rect class="node" width="260" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">1</text><text class="main" x="62" y="42">코드 실행</text><text class="desc" x="24" y="72">LLM 초안 실행</text></g>
  <path class="arr" d="M930 208 C1050 220 1115 285 1120 365"/>
  <g transform="translate(1050 365)"><rect class="node warn" width="260" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">2</text><text class="main" x="62" y="42">오류 발생</text><text class="desc" x="24" y="72">오류 메시지 확인</text></g>
  <path class="arr" d="M1050 412 C930 540 720 540 610 450"/>
  <g transform="translate(470 395)"><rect class="node llm" width="290" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">3</text><text class="main" x="62" y="42">LLM에 재질문</text><text class="desc" x="24" y="72">데이터 구조와 오류 함께 제공</text></g>
  <path class="arr" d="M500 395 C390 285 500 190 670 205"/>

  <g transform="translate(640 300)"><rect class="err" width="320" height="70" rx="20"/><text class="errText" x="160" y="43" text-anchor="middle">KeyError: 'category'</text></g>

  <g transform="translate(210 350)"><rect class="node llm" width="240" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">4</text><text class="main" x="62" y="42">수정 코드 받기</text><text class="desc" x="24" y="72">컬럼명과 병합 기준 수정</text></g>
  <path class="arr" d="M450 397H470"/>
  <g transform="translate(210 190)"><rect class="node ok" width="240" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">5</text><text class="main" x="62" y="42">다시 실행</text><text class="desc" x="24" y="72">수정 결과 확인</text></g>
  <path class="arr" d="M450 238H670"/>
  <g transform="translate(1050 190)"><rect class="node ok" width="260" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">6</text><text class="main" x="62" y="42">결과 검증</text><text class="desc" x="24" y="72">행 수, 결측치, 총합 확인</text></g>
  <path class="arr" d="M930 208H1050"/>
  <g transform="translate(670 520)"><rect class="node ok" width="260" height="95" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">7</text><text class="main" x="62" y="42">검증 완료</text><text class="desc" x="24" y="72">보고서에 기록</text></g>
  <path class="arr" d="M1120 460 C1060 560 965 580 930 568"/>

  <rect class="note" x="395" y="645" width="810" height="36" rx="14"/>
  <text class="noteText" x="800" y="670" text-anchor="middle">반복 수정의 목표는 오류 제거가 아니라 분석 논리 검증입니다</text>
</svg>