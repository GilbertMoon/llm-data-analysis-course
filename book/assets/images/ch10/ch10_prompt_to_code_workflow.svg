<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">프롬프트에서 코드 초안과 검증 항목으로 이어지는 흐름</title>
  <desc id="desc">좋은 코드 생성 프롬프트가 LLM 코드 초안과 검증 체크리스트로 이어지는 과정</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#dcfce7}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.prompt{stroke:#86efac}.code{stroke:#c4b5fd}.check{stroke:#93c5fd}.headBox{fill:#eff6ff;stroke:#bfdbfe}.main{font-size:27px;font-weight:900;fill:#0f172a}.item{font-size:20px;font-weight:650;fill:#334155}.mono{font-family:'D2Coding','Consolas',monospace;font-size:19px;font-weight:650;fill:#334155}.arr{fill:none;stroke:#2563eb;stroke-width:5;marker-end:url(#arrow)}.note{fill:#fff7ed;stroke:#fdba74;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#9a3412}
    </style>
  </defs>
  <rect class="bg" width="1600" height="620" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">프롬프트 → 코드 초안 → 검증 항목</text>
  <text class="sub" x="86" y="118">좋은 프롬프트는 코드뿐 아니라 검증 항목까지 함께 요청해야 합니다</text>

  <g transform="translate(95 180)">
    <rect class="card prompt" width="390" height="300" rx="24"/>
    <rect class="headBox" width="390" height="68" rx="24"/>
    <text class="main" x="28" y="44">코드 생성 프롬프트</text>
    <text class="item" x="32" y="110">• 분석 목적</text>
    <text class="item" x="32" y="152">• 데이터 구조</text>
    <text class="item" x="32" y="194">• 요청 작업</text>
    <text class="item" x="32" y="236">• 검증 조건</text>
  </g>
  <path class="arr" d="M505 330H585"/>
  <g transform="translate(605 180)">
    <rect class="card code" width="390" height="300" rx="24"/>
    <rect class="headBox" width="390" height="68" rx="24"/>
    <text class="main" x="28" y="44">LLM 코드 초안</text>
    <text class="mono" x="32" y="110">merge()</text>
    <text class="mono" x="32" y="152">groupby()</text>
    <text class="mono" x="32" y="194">sort_values()</text>
    <text class="mono" x="32" y="236">to_datetime()</text>
  </g>
  <path class="arr" d="M1015 330H1095"/>
  <g transform="translate(1115 180)">
    <rect class="card check" width="390" height="300" rx="24"/>
    <rect class="headBox" width="390" height="68" rx="24"/>
    <text class="main" x="28" y="44">검증 항목</text>
    <text class="item" x="32" y="110">• 컬럼명 확인</text>
    <text class="item" x="32" y="145">• 병합 기준 확인</text>
    <text class="item" x="32" y="180">• 행 수 확인</text>
    <text class="item" x="32" y="215">• 결측치 확인</text>
    <text class="item" x="32" y="250">• 총합 비교</text>
  </g>

  <rect class="note" x="365" y="535" width="870" height="42" rx="14"/>
  <text class="noteText" x="800" y="563" text-anchor="middle">코드 요청에는 입력 데이터, 출력 기대값, 검증 기준을 함께 포함합니다</text>
</svg>