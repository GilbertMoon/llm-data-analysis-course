<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="660" viewBox="0 0 1700 660" role="img" aria-labelledby="title desc">
  <title id="title">LLM 코드 생성과 검증 전체 흐름도</title>
  <desc id="desc">데이터 구조 요약에서 LLM 코드 초안 생성, 실행 전후 검증, 오류 수정, 보고서 작성까지 이어지는 흐름</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:40px;font-weight:800;fill:#fff}.sub{font-size:19px;font-weight:600;fill:#e0e7ff}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.llm{stroke:#c4b5fd}.human{stroke:#86efac}.warn{stroke:#fdba74}.num{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.nt{font-size:16px;font-weight:900;fill:#2563eb}.main{font-size:20px;font-weight:850;fill:#0f172a}.desc{font-size:14px;font-weight:650;fill:#64748b}.arr{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#arrow)}.center{fill:#fff7ed;stroke:#fdba74;stroke-width:2}.centerText{font-size:24px;font-weight:900;fill:#9a3412}.note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1700" height="660" rx="34"/>
  <rect class="h" x="55" y="38" width="1590" height="96" rx="28"/>
  <text class="title" x="92" y="96">LLM 코드 생성과 검증 전체 흐름</text>
  <text class="sub" x="92" y="124">LLM이 만든 코드는 실행 전후 검증을 거쳐야 프로젝트에 반영할 수 있습니다</text>

  <g transform="translate(70 185)"><rect class="node human" width="240" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">1</text><text class="main" x="62" y="42">데이터 구조 요약</text><text class="desc" x="24" y="74">컬럼, 타입, 목적 정리</text></g>
  <path class="arr" d="M320 235H375"/>
  <g transform="translate(390 185)"><rect class="node human" width="240" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">2</text><text class="main" x="62" y="42">프롬프트 작성</text><text class="desc" x="24" y="74">요청 작업과 검증 조건</text></g>
  <path class="arr" d="M640 235H695"/>
  <g transform="translate(710 185)"><rect class="node llm" width="240" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">3</text><text class="main" x="62" y="42">LLM 코드 초안</text><text class="desc" x="24" y="74">pandas 코드 생성</text></g>
  <path class="arr" d="M960 235H1015"/>
  <g transform="translate(1030 185)"><rect class="node human" width="240" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">4</text><text class="main" x="62" y="42">실행 전 검증</text><text class="desc" x="24" y="74">컬럼명, 병합 기준 확인</text></g>
  <path class="arr" d="M1280 235H1335"/>
  <g transform="translate(1350 185)"><rect class="node warn" width="240" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">5</text><text class="main" x="62" y="42">코드 실행</text><text class="desc" x="24" y="74">오류와 결과 확인</text></g>

  <rect class="center" x="630" y="330" width="440" height="62" rx="22"/>
  <text class="centerText" x="850" y="370" text-anchor="middle">LLM 초안 ≠ 최종 코드</text>

  <path class="arr" d="M1470 285 C1470 360 1360 378 1300 388"/>
  <g transform="translate(1190 430)"><rect class="node human" width="240" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">6</text><text class="main" x="62" y="42">결과 검증</text><text class="desc" x="24" y="74">행 수, 결측치, 총합 비교</text></g>
  <path class="arr" d="M1180 480H1125"/>
  <g transform="translate(870 430)"><rect class="node warn" width="240" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">7</text><text class="main" x="62" y="42">오류 수정</text><text class="desc" x="24" y="74">원인 확인 후 재요청</text></g>
  <path class="arr" d="M860 480H805"/>
  <g transform="translate(550 430)"><rect class="node human" width="240" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">8</text><text class="main" x="62" y="42">검증 코드 반영</text><text class="desc" x="24" y="74">프로젝트 코드에 적용</text></g>
  <path class="arr" d="M540 480H485"/>
  <g transform="translate(230 430)"><rect class="node human" width="240" height="100" rx="22"/><circle class="num" cx="34" cy="34" r="17"/><text class="nt" x="34" y="40" text-anchor="middle">9</text><text class="main" x="62" y="42">검증 보고서</text><text class="desc" x="24" y="74">프롬프트와 검증 기록</text></g>

  <rect class="note" x="390" y="585" width="920" height="42" rx="14"/>
  <text class="noteText" x="850" y="613" text-anchor="middle">코드 생성 과정은 프롬프트, 코드, 검증 결과를 함께 남겨야 합니다</text>
</svg>