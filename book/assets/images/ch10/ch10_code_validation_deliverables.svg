<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title desc">
  <title id="title">LLM 코드 검증 산출물 구성</title>
  <desc id="desc">데이터 구조 요약, 코드 생성 프롬프트 로그, 코드 리뷰 체크리스트, 검증 결과, 검증 요약 보고서로 구성된 산출물</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#f8fafc}.h{fill:url(#head)} text{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}.title{font-size:38px;font-weight:800;fill:#fff}.sub{font-size:18px;font-weight:600;fill:#ccfbf1}
      .center{fill:#fff;stroke:#93c5fd;stroke-width:3;filter:url(#shadow)}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2;filter:url(#shadow)}.tagBox{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.tag{font-size:16px;font-weight:900;fill:#2563eb}.main{font-size:24px;font-weight:900;fill:#0f172a}.file{font-family:'D2Coding','Consolas',monospace;font-size:16px;font-weight:650;fill:#475569}.note{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.noteText{font-size:20px;font-weight:800;fill:#166534}
    </style>
  </defs>
  <rect class="bg" width="1600" height="660" rx="32"/>
  <rect class="h" x="50" y="36" width="1500" height="92" rx="26"/>
  <text class="title" x="86" y="92">LLM 코드 검증 산출물 구성</text>
  <text class="sub" x="86" y="118">프롬프트, 코드, 검증 결과를 함께 기록해야 재현 가능한 작업이 됩니다</text>

  <rect class="center" x="610" y="265" width="380" height="120" rx="30"/>
  <text class="main" x="800" y="315" text-anchor="middle">코드 검증 산출물</text>
  <text class="file" x="800" y="350" text-anchor="middle">reports/ 폴더에 정리</text>

  <g transform="translate(110 170)"><rect class="card" width="410" height="150" rx="24"/><rect class="tagBox" x="28" y="24" width="92" height="28" rx="14"/><text class="tag" x="74" y="43" text-anchor="middle">파일 1</text><text class="main" x="28" y="82">데이터 구조 요약</text><text class="file" x="28" y="116">ch10_schema_summary_for_code_generation.csv</text></g>
  <g transform="translate(1080 170)"><rect class="card" width="410" height="150" rx="24"/><rect class="tagBox" x="28" y="24" width="92" height="28" rx="14"/><text class="tag" x="74" y="43" text-anchor="middle">파일 2</text><text class="main" x="28" y="82">프롬프트 로그</text><text class="file" x="28" y="116">ch10_code_generation_prompts.md</text></g>
  <g transform="translate(110 395)"><rect class="card" width="410" height="150" rx="24"/><rect class="tagBox" x="28" y="24" width="92" height="28" rx="14"/><text class="tag" x="74" y="43" text-anchor="middle">파일 3</text><text class="main" x="28" y="82">코드 리뷰 체크리스트</text><text class="file" x="28" y="116">ch10_code_review_checklist.csv</text></g>
  <g transform="translate(595 425)"><rect class="card" width="410" height="135" rx="24"/><rect class="tagBox" x="28" y="24" width="92" height="28" rx="14"/><text class="tag" x="74" y="43" text-anchor="middle">파일 4</text><text class="main" x="28" y="82">코드 검증 결과</text><text class="file" x="28" y="112">ch10_code_validation_summary.csv</text></g>
  <g transform="translate(1080 395)"><rect class="card" width="410" height="150" rx="24"/><rect class="tagBox" x="28" y="24" width="92" height="28" rx="14"/><text class="tag" x="74" y="43" text-anchor="middle">파일 5</text><text class="main" x="28" y="82">검증 요약 보고서</text><text class="file" x="28" y="116">ch10_code_validation_summary.md</text></g>

  <rect class="note" x="335" y="595" width="930" height="42" rx="14"/>
  <text class="noteText" x="800" y="623" text-anchor="middle">LLM 코드 생성 과정은 결과보다 검증 기록이 더 중요할 수 있습니다</text>
</svg>